<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Solid Shapes - Clothes Lesson</title>
<style>
  :root{
    --ink:#25242a;
    --bg:#fff8f2;
    --card:#ffffff;
    --red:#f34458;
    --orange:#ff9d1a;
    --yellow:#ffe68a;
    --blue:#dff6ff;
    --cyan:#0798b0;
    --green:#20aa52;
    --success:#218c53;
    --danger:#c62828;
    --gold:#ffd24a;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#f4e8d9 1px,transparent 1px),linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
    background-size:26px 26px;
  }
  img{max-width:100%;height:auto;display:block;}
  .app{position:relative;width:min(980px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px;}
  .home-btn{
    position:absolute;right:12px;top:8px;z-index:30;
    min-width:70px;height:52px;border:none;border-radius:999px;background:#fff;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
    color:var(--red);font-weight:1000;font-size:1.65rem;box-shadow:0 7px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.12);
    transform-origin:top center;animation:homeSwing 2.4s ease-in-out infinite;
  }
  @keyframes homeSwing{0%,100%{transform:translateY(14%) rotate(-5deg);}50%{transform:translateY(14%) rotate(7deg);}}
  .page-title{margin:0 76px 8px 0;text-align:center;font-size:clamp(1.65rem,5vw,3rem);font-weight:1000;color:var(--orange);-webkit-text-stroke:1.5px #fff;text-shadow:0 4px 0 #fff,0 6px 0 rgba(0,0,0,.10);}
  .poster-card{
    position:relative;width:min(904px,100%);margin:0 auto;border-radius:18px;overflow:visible;
    background:transparent;box-shadow:0 8px 20px rgba(0,0,0,.10);touch-action:none;
  }
  .poster-image{width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .focus-zone{
    position:absolute;pointer-events:none;z-index:8;border-radius:999px;opacity:0;transform:scale(.96);
    transition:opacity .18s ease,transform .18s ease;
  }
  .focus-zone.show{opacity:1;transform:scale(1);outline:4px solid rgba(255,255,255,.96);box-shadow:0 0 0 6px rgba(255,210,74,.35),0 0 22px rgba(255,105,180,.42);}
  .focus-zone.sparkle{opacity:1;transform:scale(1.035);background:rgba(255,238,120,.18);outline:5px solid rgba(255,214,0,.90);box-shadow:0 0 16px rgba(255,214,0,.92),0 0 30px rgba(255,105,180,.70);animation:sparklePulse .9s ease-in-out infinite;}
  @keyframes sparklePulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.22);}}
  .focus-question{left:15.5%;top:17.5%;width:70%;height:10%;}
  .focus-boy-bubble{left:7.2%;top:36.2%;width:22.5%;height:9.8%;}
  .focus-sweater{left:33.2%;top:35.8%;width:20%;height:24%;}
  .focus-seller-bubble{left:71.8%;top:34.4%;width:22%;height:8.2%;}
  .focus-bottom-sentence{left:22%;top:86.6%;width:55%;height:7%;}
  .lesson-panel{
    width:min(904px,100%);margin:12px auto 0;border:3px solid rgba(255,157,26,.35);border-radius:18px;
    background:linear-gradient(180deg,#fff,#fff9ec);padding:12px;display:grid;gap:10px;
  }
  .progress-wrap{display:grid;justify-items:center;gap:6px;}
  .progress-text{font-size:clamp(.95rem,2vw,1.08rem);font-weight:1000;color:#6c4bbf;text-align:center;}
  .progress-bar{width:min(520px,92%);height:17px;background:#e7efff;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#f34458,#ffd24a,#7dffb3);transition:width .18s ease-out;}
  .conversation-panel{display:grid;gap:10px;}
  .convo-line{display:none;align-items:flex-start;gap:8px;}
  .convo-line.show{display:flex;}
  .convo-line.left{justify-content:flex-start;}
  .convo-line.right{justify-content:flex-end;}
  .convo-line.center{justify-content:center;}
  .bubble-stack{display:flex;flex-direction:column;gap:6px;max-width:min(100%,620px);}
  .convo-line.right .bubble-stack{align-items:flex-end;}
  .convo-line.center .bubble-stack{align-items:center;}
  .bubble{
    position:relative;padding:12px 16px;border-radius:20px;font-size:clamp(1rem,2.4vw,1.34rem);font-weight:1000;line-height:1.25;
    box-shadow:0 8px 16px rgba(0,0,0,.12);background:#fff;text-align:center;
  }
  .bubble.question{border:3px solid #ff9d1a;background:#fff7dc;}
  .bubble.boy{border:3px solid #f06b77;background:#fff;}
  .bubble.seller{border:3px solid #9bdcef;background:#fff;}
  .bubble.sentence{border:3px solid #f34458;background:#fff9ec;}
  .bubble.sparkle{background:linear-gradient(120deg,#fff2a8,#ffd1f0,#c7f1ff);box-shadow:0 0 12px rgba(255,214,0,.75),0 0 20px rgba(255,105,180,.55);animation:sparklePulse .95s ease-in-out infinite;}
  .repeat-result{min-height:1.2em;font-size:clamp(1rem,2.4vw,1.35rem);line-height:1.2;font-weight:1000;color:var(--success);}
  .try-message{min-height:1.2em;font-size:clamp(.95rem,2.3vw,1.15rem);line-height:1.2;font-weight:1000;}
  .star-row{min-height:1.15em;display:flex;gap:6px;color:var(--gold);font-size:clamp(1.35rem,3.4vw,2rem);line-height:1;text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;width:100%;}
  .btn,.mic-icon-btn{min-height:46px;min-width:46px;border:none;border-radius:999px;cursor:pointer;font-weight:1000;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .12s ease,filter .12s ease;}
  .btn:hover,.mic-icon-btn:hover{transform:translateY(-1px);filter:brightness(1.04);}
  .btn:active,.mic-icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .btn{padding:10px 16px;font-size:.95rem;}
  .btn.prev{background:#f8f0c7;color:#9c7b2f;}
  .btn.next{background:var(--yellow);color:#8b5a00;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.read{background:var(--orange);color:#fff;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .btn.teacher{display:none;background:#e7fbff;color:#06768a;border:2px solid #89ddea;}
  .btn.teacher.show{display:inline-flex;align-items:center;}
  .mic-icon-btn{position:relative;background:radial-gradient(circle at 35% 24%,#fff,#dff1ff);padding:4px;width:68px;height:68px;display:inline-flex;align-items:center;justify-content:center;}
  .mic-icon-btn img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));}
  .mic-icon-btn.is-busy{opacity:.72;pointer-events:none;transform:scale(.97);}
  .finger-cue{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:1.8rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));animation:fingerBob 1s ease-in-out infinite;display:none;pointer-events:none;}
  .finger-cue.show{display:block;}
  @keyframes fingerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}
  .status-wrap{display:grid;gap:6px;}
  .conversation-status,.listen-status{min-height:1.25em;text-align:center;font-weight:1000;}
  .conversation-status{color:#6c4bbf;font-size:clamp(.95rem,2.5vw,1.1rem);}
  .listen-status{color:#555;font-size:.92rem;}
  .footer-note{text-align:center;color:#666;font-size:.92rem;font-weight:800;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.75s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media (max-width:560px){body{padding:6px;}.app{border-radius:14px;padding:8px;}.page-title{font-size:1.45rem;margin-right:64px;}.home-btn{min-width:58px;height:46px;font-size:1.35rem;}.lesson-panel{padding:10px;}.controls{gap:8px;}.btn{font-size:.84rem;padding:9px 12px;}.mic-icon-btn{width:60px;height:60px;}.mic-icon-btn img{width:48px;height:48px;}}
</style>
</head>

<script>
(function(){
  "use strict";

  const CONFIG = window.__PAGE_CONFIG__ || {};
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const teacherBtn = document.getElementById("teacherBtn");
  const micBtn = document.getElementById("micIconBtn");
  const micFinger = document.getElementById("micFinger");
  const chimeAudio = document.getElementById("chimeAudio");
  const conversationStatus = document.getElementById("conversationStatus");
  const listenStatus = document.getElementById("listenStatus");
  const progressPercent = document.getElementById("progressPercent");
  const progressFill = document.getElementById("progressFill");

  if(homeBtn && CONFIG.homeHref) homeBtn.href = CONFIG.homeHref;

  const micLines = CONFIG.micLines || [];
  const lineEls = Array.from(document.querySelectorAll(".convo-line"));
  const bubbleEls = lineEls.map(line => line.querySelector(".bubble"));
  const resultEls = lineEls.map(line => line.querySelector(".repeat-result"));
  const tryMessageEls = lineEls.map(line => line.querySelector(".try-message"));
  const starEls = lineEls.map(line => line.querySelector(".star-row"));
  const focusEls = Array.from(document.querySelectorAll(".focus-zone"));

  let voices = [];
  let recognition = null;
  let recognizing = false;
  let recognitionToken = 0;
  let speechUnlocked = false;

  const state = {
    current: 0,
    phase: "hear",
    stars: micLines.map(() => 0),
    attempts: micLines.map(() => 0)
  };

  function loadVoices(){
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if("speechSynthesis" in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function chooseAmericanFemaleVoice(){
    loadVoices();
    const enUS = voices.filter(v => /en[-_]US/i.test(v.lang || "") || /United States/i.test(v.name || ""));
    const preferred = /(zira|jenny|aria|ava|samantha|victoria|female|google us english|microsoft)/i;
    return enUS.find(v => preferred.test(v.name || "")) || enUS[0] || voices.find(v => /^en/i.test(v.lang || "")) || null;
  }

  function setStatus(text, color){
    conversationStatus.textContent = text || "";
    conversationStatus.style.color = color || "#6c4bbf";
  }

  function setListen(text, color){
    listenStatus.textContent = text || "";
    listenStatus.style.color = color || "#555";
  }

  function speak(text, opts){
    opts = opts || {};
    if(!("speechSynthesis" in window) || !text) return Promise.resolve();
    return new Promise(resolve => {
      try{ window.speechSynthesis.cancel(); }catch(_){ }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = opts.rate || 0.86;
      utterance.pitch = opts.pitch || 1.12;
      utterance.volume = opts.volume || 1;
      const voice = chooseAmericanFemaleVoice();
      if(voice) utterance.voice = voice;
      utterance.onend = resolve;
      utterance.onerror = resolve;
      try{ window.speechSynthesis.speak(utterance); }
      catch(_){ resolve(); }
    });
  }

  function unlockAudio(){
    if(speechUnlocked) return;
    speechUnlocked = true;
    try{
      chimeAudio.volume = 0.72;
      const p = chimeAudio.play();
      if(p && p.then) p.then(() => { chimeAudio.pause(); chimeAudio.currentTime = 0; }).catch(() => {});
    }catch(_){ }
  }

  function playChime(){
    try{
      chimeAudio.pause();
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 0.78;
      const p = chimeAudio.play();
      if(p && p.catch) p.catch(() => {});
    }catch(_){ }
  }

  function confetti(){
    const colors = ["#f34458","#ff9d1a","#ffd24a","#20aa52","#0798b0","#9b5cff"];
    for(let i=0;i<42;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random() * .35) + "s";
      piece.style.transform = "rotate(" + (Math.random()*180) + "deg)";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2200);
    }
  }

  function clearHighlights(){
    bubbleEls.forEach(b => b && b.classList.remove("sparkle"));
    focusEls.forEach(f => f && f.classList.remove("show","sparkle"));
  }

  function showLine(index){
    const line = lineEls[index];
    if(line) line.classList.add("show");
  }

  function highlightLine(index, sparkle){
    clearHighlights();
    const bubble = bubbleEls[index];
    if(bubble) bubble.classList.toggle("sparkle", !!sparkle);
    focusEls.forEach(f => {
      if(Number(f.dataset.focus) === index){
        f.classList.add("show");
        f.classList.toggle("sparkle", !!sparkle);
      }
    });
  }

  function setResult(index, text, color){
    const el = resultEls[index];
    if(!el) return;
    el.textContent = text || "";
    el.style.color = color || "";
  }

  function setTryMessage(index, text, color){
    const el = tryMessageEls[index];
    if(!el) return;
    el.textContent = text || "";
    el.style.color = color || "";
  }

  function setStars(index, count){
    const el = starEls[index];
    if(!el) return;
    el.textContent = count > 0 ? "⭐".repeat(count) : "";
  }

  function saveProgress(pct, complete){
    try{
      localStorage.setItem(CONFIG.pageId + ":progress", JSON.stringify({progress:pct, complete:!!complete, updatedAt:new Date().toISOString()}));
    }catch(_){ }
  }

  function updateProgress(){
    const earned = state.stars.filter(n => n > 0).length;
    const pct = Math.round((earned / micLines.length) * 100);
    progressPercent.textContent = pct + "%";
    progressFill.style.width = pct + "%";
    saveProgress(pct, pct >= 100);
  }

  const stopWords = new Set(["a","an","the","is","are","am","to","of","for","on","in","at","my","your","his","her","our","their","do","does","did","i","you","he","she","it","we","they","its","it's"]);
  function normalize(str){ return String(str || "").toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim(); }
  function wordsOf(str){ return normalize(str).split(" ").filter(Boolean); }
  function scoreSpeech(expected, said){
    const expectedWords = wordsOf(expected);
    const saidWords = new Set(wordsOf(said));
    const keyWords = expectedWords.filter(w => !stopWords.has(w));
    const basis = keyWords.length ? keyWords : expectedWords;
    if(!basis.length) return 0;
    let hits = 0;
    basis.forEach(w => {
      if(saidWords.has(w)) hits++;
      else if(w === "sweater" && (saidWords.has("sweaters") || saidWords.has("sweatshirt") || saidWords.has("jumper"))) hits++;
      else if(w === "clothes" && (saidWords.has("cloths") || saidWords.has("clothing") || saidWords.has("cloth"))) hits++;
      else if(w === "here" && (saidWords.has("hear") || saidWords.has("hair"))) hits++;
      else if(w === "need" && (saidWords.has("needs") || saidWords.has("needed"))) hits++;
    });
    return hits / basis.length;
  }

  function makeRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;
    const rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.continuous = false;
    return rec;
  }

  function setBusy(on){
    micBtn.classList.toggle("is-busy", !!on);
  }

  function startListeningFor(index){
    const expected = micLines[index];
    if(!expected) return;
    recognition = makeRecognition();
    if(!recognition){
      teacherBtn.classList.add("show");
      setListen("Speech recognition is not available here. Let the child repeat aloud, then tap Teacher heard it.", "#06768a");
      setStatus("Say it aloud: " + expected);
      return;
    }
    recognizing = true;
    const token = ++recognitionToken;
    setListen("🎙️ Listening now. Please say: “" + expected + "”", "#6c4bbf");
    setStatus("Speak now. I am listening.");
    teacherBtn.classList.remove("show");
    setBusy(true);

    recognition.onresult = evt => {
      if(token !== recognitionToken) return;
      recognizing = false;
      setBusy(false);
      let said = "";
      try{ said = Array.from(evt.results[0]).map(r => r.transcript).join(" "); }catch(_){ said = ""; }
      const score = scoreSpeech(expected, said);
      if(score >= .5){
        markLineCorrect(index, said);
      } else {
        state.attempts[index] += 1;
        setResult(index, "", "");
        setTryMessage(index, "Sorry, try again! I heard: “" + (said || "nothing yet") + "”", "#c62828");
        setListen("Tap the microphone and try again.", "#c62828");
        setStatus("Sorry, try again. You can do it!");
        speak("Sorry, try again. You can do it!");
        state.phase = "repeat";
      }
    };
    recognition.onerror = () => {
      if(token !== recognitionToken) return;
      recognizing = false;
      setBusy(false);
      setListen("I could not hear clearly. Tap the microphone and try again.", "#c62828");
      setStatus("Sorry, try again!");
      speak("Sorry, try again!");
      state.phase = "repeat";
    };
    recognition.onend = () => { recognizing = false; setBusy(false); };
    try{ recognition.start(); }
    catch(_){
      recognizing = false;
      setBusy(false);
      setListen("Microphone could not start. Please allow microphone permission and try again.", "#c62828");
    }
  }

  function nextUnfinishedIndex(){
    const idx = state.stars.findIndex(n => n === 0);
    return idx >= 0 ? idx : micLines.length;
  }

  function markLineCorrect(index, said){
    state.stars[index] = 1;
    setStars(index, 1);
    setResult(index, micLines[index], "#218c53");
    setTryMessage(index, said ? "Great! I heard: “" + said + "”" : "Great speaking!", "#218c53");
    setListen("Wonderful!", "#218c53");
    playChime();
    updateProgress();
    const allDone = state.stars.every(n => n > 0);
    const praise = CONFIG.completionRemarks[Math.floor(Math.random() * CONFIG.completionRemarks.length)] || "Great job!";
    setTimeout(() => speak(praise), 300);
    if(allDone){
      setStatus("Lesson complete! You read all the Solid Shapes sentences.", "#218c53");
      confetti();
      setTimeout(() => speak("Hooray! You finished the lesson. I need clothes. Excellent work!"), 1200);
      state.phase = "done";
      micFinger.classList.remove("show");
      return;
    }
    state.current = nextUnfinishedIndex();
    state.phase = "hear";
    setStatus("Tap the microphone for the next air bubble.");
    micFinger.classList.add("show");
  }

  async function hearCurrentLine(){
    const index = state.current;
    const text = micLines[index];
    if(!text) return;
    showLine(index);
    highlightLine(index, true);
    setTryMessage(index, "", "");
    setListen("Listen first. Then tap the microphone again and repeat.", "#6c4bbf");
    setStatus("Listen: “" + text + "”");
    micFinger.classList.remove("show");
    setBusy(true);
    await speak(text);
    setBusy(false);
    state.phase = "repeat";
    micFinger.classList.add("show");
    setStatus("Now tap the microphone and repeat: “" + text + "”");
  }

  function handleMicClick(){
    unlockAudio();
    if(recognizing) return;
    if(state.phase === "done"){
      cheer();
      return;
    }
    if(state.current >= micLines.length){
      state.phase = "done";
      cheer();
      return;
    }
    if(state.phase === "hear"){
      hearCurrentLine();
    } else {
      highlightLine(state.current, true);
      startListeningFor(state.current);
    }
  }

  function readPoster(){
    unlockAudio();
    lineEls.forEach((_, i) => showLine(i));
    clearHighlights();
    focusEls.forEach(f => f.classList.add("show"));
    setListen("Reading the poster with an American female voice.", "#6c4bbf");
    setStatus("Listen to the poster, then use the microphone to repeat each line.");
    speak(CONFIG.posterSpeech || micLines.join(" "));
  }

  function cheer(){
    unlockAudio();
    playChime();
    confetti();
    const text = "Great job! Clap clap clap! You are learning so well!";
    setStatus(text, "#218c53");
    setTimeout(() => speak(text), 250);
  }

  function resetLesson(){
    try{ if(recognition) recognition.abort(); }catch(_){ }
    try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(_){ }
    recognizing = false;
    state.current = 0;
    state.phase = "hear";
    state.stars = micLines.map(() => 0);
    state.attempts = micLines.map(() => 0);
    lineEls.forEach(l => l.classList.remove("show"));
    resultEls.forEach(el => el.textContent = "");
    tryMessageEls.forEach(el => el.textContent = "");
    starEls.forEach(el => el.textContent = "");
    clearHighlights();
    updateProgress();
    setListen("", "");
    setStatus("Tap the microphone to begin the air-bubble conversation.");
    teacherBtn.classList.remove("show");
    micFinger.classList.add("show");
    setBusy(false);
  }

  teacherBtn.addEventListener("click", () => {
    unlockAudio();
    markLineCorrect(state.current, "Teacher checked");
  });
  micBtn.addEventListener("click", handleMicClick);
  readBtn.addEventListener("click", readPoster);
  cheerBtn.addEventListener("click", cheer);
  clearBtn.addEventListener("click", resetLesson);
  prevBtn.addEventListener("click", () => { window.location.href = CONFIG.prevHref || "#"; });
  nextBtn.addEventListener("click", () => { window.location.href = CONFIG.nextHref || "#"; });

  document.addEventListener("click", unlockAudio, {once:true});

  function autoIntro(){
    setStatus("Auto voice is starting. Tap Read poster if your browser blocks sound.");
    setTimeout(() => {
      speak(CONFIG.introSpeech).then(() => {
        setStatus("Tap the microphone to begin. First, listen. Next, repeat.");
      });
    }, 750);
  }

  resetLesson();
  autoIntro();
})();
</script>
</body>
</html>
