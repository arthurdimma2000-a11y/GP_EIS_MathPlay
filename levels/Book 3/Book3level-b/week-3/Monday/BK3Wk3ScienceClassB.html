<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bk3wk3scienceclassb</title>
  <style>
    :root{
      --bg1:#fff6da; --bg2:#ffe18a; --bg3:#ffc84d;
      --text:#5b3200; --accent:#ff8a00; --accent2:#ffb300;
      --dark:#2f2f2f; --shadow:0 14px 34px rgba(0,0,0,.20); --radius:26px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;width:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top left,#fff8ea 0%,transparent 35%),radial-gradient(circle at bottom right,#ffd76a 0%,transparent 30%),linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--text)}
    body{padding:20px;display:flex;justify-content:center;align-items:flex-start}
    .page{width:100%;max-width:1180px;position:relative}
    .floating-shape{position:absolute;width:80px;height:80px;background:rgba(255,255,255,.28);clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);animation:floaty 5s ease-in-out infinite;pointer-events:none}
    .shape1{top:10px;left:10px}.shape2{top:50px;right:30px;width:60px;height:60px;animation-delay:.8s}.shape3{bottom:40px;left:40px;width:55px;height:55px;animation-delay:1.4s}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .header{text-align:center;margin-bottom:18px;background:rgba(255,255,255,.58);backdrop-filter:blur(6px);border-radius:24px;padding:18px 14px;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.55)}
    .header h1{font-size:clamp(1.7rem,3vw,2.6rem);color:#8c4300;margin-bottom:8px;font-weight:900}
    .header p{font-size:clamp(.95rem,1.8vw,1.08rem);font-weight:700;color:#7a4900;display:none}
    .video-card{position:relative;width:min(100%,920px);margin:0 auto;border-radius:var(--radius);overflow:hidden;background:#000;box-shadow:var(--shadow);border:4px solid rgba(255,255,255,.65);aspect-ratio:16 / 9;display:flex;align-items:center;justify-content:center}
    video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
    .top-bar,.bottom-bar{position:absolute;left:0;width:100%;z-index:5;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;pointer-events:none}
    .top-bar{top:0;background:linear-gradient(to bottom,rgba(0,0,0,.70),rgba(0,0,0,0))}
    .bottom-bar{bottom:0;background:linear-gradient(to top,rgba(0,0,0,.76),rgba(0,0,0,0))}
    .nav-btn{pointer-events:auto;border:none;cursor:pointer;border-radius:999px;padding:12px 18px;min-width:104px;font-size:.95rem;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 8px 18px rgba(0,0,0,.28);transition:transform .18s ease}
    .nav-btn:hover{transform:translateY(-2px) scale(1.03)}
    .nav-btn.dark{background:linear-gradient(180deg,#515151,#2b2b2b)}
    .nav-btn.green{background:linear-gradient(180deg,#2ecc71,#16924d)}
    .nav-btn.red{background:linear-gradient(180deg,#ff7b61,#e74c3c)}
    .lesson-note{display:none}
    #pageContent{opacity:0;visibility:hidden;transition:opacity .28s ease}
    body.intro-complete #pageContent{opacity:1;visibility:visible}
    #lbIntroVideoOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.82);z-index:9999}
    #lbIntroVideoOverlay[hidden]{display:none!important}
    .intro-panel{width:min(920px,100%);background:rgba(15,15,15,.96);border-radius:24px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.14)}
    .intro-title{color:#fff4d6;font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:900;text-align:center;margin-bottom:12px}
    #lbIntroVideo{width:100%;aspect-ratio:16 / 9;height:auto;max-height:min(72vh,700px);border-radius:18px;object-fit:contain;background:#000}
    .intro-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px}
    .intro-btn{border:none;cursor:pointer;border-radius:999px;padding:12px 18px;min-width:140px;font-size:.96rem;font-weight:800;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.28)}
    .intro-btn.sound{background:linear-gradient(180deg,#38bdf8,#0284c7)}
    .intro-btn.skip{background:linear-gradient(180deg,#fb923c,#ea580c)}
    .intro-help{margin-top:10px;text-align:center;color:#fef3c7;font-size:.9rem;font-weight:700}
    @media (max-width:768px){
      body{padding:10px}
      .intro-panel{padding:12px}
      .top-bar,.bottom-bar{padding:10px 8px;gap:8px}
      .nav-btn{min-width:92px;padding:10px 14px;font-size:.9rem}
    }
  </style>
</head>
<body>
  <div id="lbIntroVideoOverlay">
    <div class="intro-panel">
      <div class="intro-title">Bk3wk3scienceclassb Intro</div>
      <video id="lbIntroVideo" playsinline autoplay preload="metadata">
        <source src="https://res.cloudinary.com/dtknykrkf/video/upload/v1783246015/Bk3wk3scienceclassb_rejpxu.mp4" type="video/mp4">
      </video>
      <div class="intro-actions">
        <button type="button" class="intro-btn skip" id="skipIntroBtn">Skip Intro</button>
      </div>
      <div class="intro-help">Skip Intro will go straight to Bk2LB14.html.</div>
    </div>
  </div>

  <div id="pageContent">
    <div class="page">
      <div class="floating-shape shape1"></div><div class="floating-shape shape2"></div><div class="floating-shape shape3"></div>
      <div class="header">
        <h1>🎵 Bk3wk3scienceclassb</h1>
        <p>B3LAQuiz1.html → Bk3wk3scienceclassb.html → Bk2LA8.html</p>
      </div>

      <div class="video-card">
        <div class="top-bar">
          <button class="nav-btn" onclick="goHome()">🏠 Home</button>
          <button class="nav-btn dark" onclick="goBackPage()">⬅ Back</button>
          <button class="nav-btn" onclick="replayVideo()">🔁 Replay</button>
        </div>

        <video id="lessonVideo" controls playsinline preload="none">
          <source src="" type="video/mp4">
        </video>

        <div class="bottom-bar">
          <button class="nav-btn green" onclick="togglePlayPause()">▶ / ⏸ Play</button>
          <button class="nav-btn red" onclick="toggleFullscreen()">⛶ Fullscreen</button>
          <button class="nav-btn dark" onclick="goNextPage()">Next ➜</button>
        </div>
      </div>

      <div class="lesson-note">Back goes to Bk2LBQuiz2.html. Next goes to Bk2LB14.html. Skip Intro jumps immediately to Bk2LB14.html.</div>
    </div>
  </div>

  <script>
    const HOME_PAGE = "../../../../../index.html";
    const PREVIOUS_PAGE = "../../week-2/Friday/Bk2LBQuiz2.html";
    const NEXT_PAGE = "../Tuesday/Bk2LB14.html";

    const video = document.getElementById("lessonVideo");
    const introOverlay = document.getElementById("lbIntroVideoOverlay");
    const introVideo = document.getElementById("lbIntroVideo");
    const skipIntroBtn = document.getElementById("skipIntroBtn");
    let introFinished = false;
    let lessonStarted = false;
    let lessonCompleted = false;
    let manualReplayRequested = false;

    video.muted = true;
    video.volume = 0;
    video.autoplay = false;
    video.loop = false;
    let isNavigating = false;

    const LESSON_VIDEO_URL = "https://res.cloudinary.com/dtknykrkf/video/upload/v1783246015/Bk3wk3scienceclassb_rejpxu.mp4";

    function clearVideoSource(videoEl){
      if(!videoEl) return;
      const source = videoEl.querySelector("source");
      if(source) source.src = "";
      videoEl.removeAttribute("src");
      videoEl.load();
    }

    function ensureLessonVideoLoaded(){
      if(!video) return;
      const source = video.querySelector("source");
      const activeSrc = source && source.src ? source.src : (video.currentSrc || "");
      if(!activeSrc || !activeSrc.includes(LESSON_VIDEO_URL)){
        if(source){
          source.src = LESSON_VIDEO_URL;
          video.load();
        } else {
          video.src = LESSON_VIDEO_URL;
        }
      }
    }

    clearVideoSource(video);

    function playOnly(videoEl){
      if(!videoEl) return;
      [introVideo, video].forEach((mediaEl) => {
        if(!mediaEl || mediaEl === videoEl) return;
        try{
          mediaEl.pause();
          mediaEl.muted = true;
          mediaEl.volume = 0;
        }catch(_){}
      });
      try{
        videoEl.muted = false;
        videoEl.volume = 1;
      }catch(_){}
      const playPromise = videoEl.play();
      if(playPromise && playPromise.catch) playPromise.catch(()=>{});
    }

    function pauseVideo(el){
      if(el){
        try{ el.pause(); }catch(e){}
      }
    }

    function stopAndUnloadMedia(){
      pauseVideo(video);
      pauseVideo(introVideo);
      try{
        if(video){
          video.muted = true;
          video.volume = 0;
        }
      }catch(_){}
      try{
        if(introVideo){
          introVideo.muted = true;
          introVideo.volume = 0;
        }
      }catch(_){}
    }

    function navigateTo(url){
      if(isNavigating || !url) return;
      isNavigating = true;
      stopAndUnloadMedia();
      window.location.replace(url);
    }

    function forceLoudLessonAudio(){
      try{
        video.defaultMuted = false;
        video.muted = false;
        video.volume = 1;
      }catch(_){}
    }

    function reinforceLessonAudio(){
      forceLoudLessonAudio();
      if(lessonStarted && !video.paused){
        const retry = video.play();
        if(retry && typeof retry.catch === "function"){
          retry.catch(() => {});
        }
      }
    }

    function bindAudioUnlock(){
      const unlock = () => {
        reinforceLessonAudio();
      };
      ["pointerdown","touchstart","keydown","click"].forEach(eventName => {
        document.addEventListener(eventName,unlock,{passive:true});
      });
    }

    function lockLessonAtEnd(){
      lessonStarted = true;
      lessonCompleted = true;
      manualReplayRequested = false;
      video.loop = false;
      pauseVideo(video);
      try{
        if(Number.isFinite(video.duration) && video.duration > 0){
          video.currentTime = video.duration;
        }
      }catch(_){}
    }

    function revealPageContent(){
      if(introFinished) return;
      introFinished = true;
      document.body.classList.add("intro-complete");
      introOverlay.hidden = true;
      pauseVideo(introVideo);
    }

    function syncLessonPositionFromIntro(){
      if(!introVideo || !video) return;
      const introTime = Number(introVideo.currentTime || 0);
      if(introTime > 0.1){
        try{
          video.currentTime = introTime;
        }catch(_){}
      }
    }

    function startLessonPlayback(){
      if(lessonCompleted && !manualReplayRequested){
        lockLessonAtEnd();
        return;
      }
      if(introVideo){
        pauseVideo(introVideo);
        introVideo.muted = true;
        introVideo.volume = 0;
      }
      ensureLessonVideoLoaded();
      if(!lessonStarted){
        syncLessonPositionFromIntro();
      }
      forceLoudLessonAudio();
      playOnly(video);
      lessonStarted = true;
      manualReplayRequested = false;
    }

    function restoreLessonAudio(){
      startLessonPlayback();
    }

    function goHome(){
      navigateTo(HOME_PAGE);
    }

    function goBackPage(){
      navigateTo(PREVIOUS_PAGE);
    }

    function goNextPage(){
      navigateTo(NEXT_PAGE);
    }

    function skipIntroAndGoNext(){
      navigateTo(NEXT_PAGE);
    }

    function replayVideo(){
      ensureLessonVideoLoaded();
      lessonCompleted = false;
      manualReplayRequested = true;
      lessonStarted = true;
      video.currentTime = 0;
      startLessonPlayback();
    }

    function togglePlayPause(){
      ensureLessonVideoLoaded();
      if(video.paused){
        startLessonPlayback();
      } else {
        video.pause();
      }
    }

    function toggleFullscreen(){
      const card = document.querySelector(".video-card");
      if(!document.fullscreenElement){
        if(card.requestFullscreen) card.requestFullscreen();
      } else {
        if(document.exitFullscreen) document.exitFullscreen();
      }
    }

    const originalRevealPageContent = revealPageContent;

    revealPageContent = function(){
      if(introFinished) return;
      originalRevealPageContent();

      if(introVideo){
        try{
          introVideo.muted = true;
          introVideo.volume = 0;
          introVideo.currentTime = 0;
          clearVideoSource(introVideo);
        }catch(e){}
      }

      startLessonPlayback();
    };

    const originalRestoreLessonAudio = restoreLessonAudio;

    restoreLessonAudio = function(){
      ensureLessonVideoLoaded();
      originalRestoreLessonAudio();
    };

    introVideo.addEventListener("ended", () => {
      revealPageContent();
      restoreLessonAudio();
    });

    introVideo.addEventListener("error", () => {
      revealPageContent();
      restoreLessonAudio();
    });

    video.addEventListener("ended", lockLessonAtEnd);
    video.addEventListener("play", () => {
      if(lessonCompleted && !manualReplayRequested){
        lockLessonAtEnd();
        return;
      }
      reinforceLessonAudio();
    });
    video.addEventListener("playing", () => {
      if(lessonCompleted && !manualReplayRequested){
        lockLessonAtEnd();
        return;
      }
      reinforceLessonAudio();
    });
    video.addEventListener("canplay", () => {
      if(lessonStarted && (!lessonCompleted || manualReplayRequested)) reinforceLessonAudio();
    });
    video.addEventListener("loadeddata", () => {
      if(lessonStarted && (!lessonCompleted || manualReplayRequested)) reinforceLessonAudio();
    });
    video.addEventListener("loadedmetadata", () => {
      if(lessonCompleted && !manualReplayRequested){
        lockLessonAtEnd();
      }
    });

    bindAudioUnlock();

    function startDirectLessonMode(){
      if(introVideo){
        try{
          pauseVideo(introVideo);
          introVideo.muted = true;
          introVideo.volume = 0;
          introVideo.currentTime = 0;
          clearVideoSource(introVideo);
        }catch(_){}
      }
      revealPageContent();
    }

    skipIntroBtn.addEventListener("click", skipIntroAndGoNext);

    document.addEventListener("keydown", (e) => {
      if(e.key === "ArrowLeft") goBackPage();
      else if(e.key === "ArrowRight") goNextPage();
      else if(e.key.toLowerCase() === "h") goHome();
      else if(e.key.toLowerCase() === "r") replayVideo();
      else if(e.key.toLowerCase() === "f") toggleFullscreen();
      else if(e.key === " "){
        e.preventDefault();
        togglePlayPause();
      }
    });

    window.addEventListener("load", startDirectLessonMode, { once:true });
  </script>
</body>
</html>
