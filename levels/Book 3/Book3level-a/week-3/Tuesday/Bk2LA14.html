<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Cubes - 3D Shapes Lesson</title>
<style>
  :root{
    --ink:#26232b;
    --bg:#fff8f2;
    --card:#ffffff;
    --green:#38af48;
    --deep-green:#22a63e;
    --red:#f34458;
    --pink:#f06793;
    --purple:#8b7dd8;
    --yellow:#f6da7b;
    --blue:#4aa3ff;
    --success:#218c53;
    --danger:#c62828;
    --gold:#ffd24a;
    --shadow:0 12px 28px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#f4e8d9 1px,transparent 1px),linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
    background-size:26px 26px;
  }
  .app{position:relative;width:min(990px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px;}
  .page-title{
    margin:0 72px 8px 0;
    text-align:center;
    font-size:clamp(1.55rem,4vw,2.7rem);
    font-weight:1000;
    color:var(--deep-green);
    text-shadow:0 2px 0 #fff;
  }
  .home-btn{
    position:absolute;
    right:12px;
    top:8px;
    min-width:64px;
    min-height:54px;
    border:0;
    border-radius:999px;
    background:#d9ffdf;
    color:#166c38;
    font-weight:1000;
    box-shadow:0 5px 0 rgba(0,0,0,.13);
    cursor:pointer;
    z-index:30;
  }
  .poster-card{
    position:relative;
    width:min(904px,100%);
    margin:0 auto;
    border-radius:20px;
    overflow:hidden;
    background:#b7dcb1;
    box-shadow:0 8px 20px rgba(0,0,0,.10);
    touch-action:none;
  }
  .poster-image{
    width:100%;
    height:auto;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .focus-zone{
    position:absolute;
    pointer-events:none;
    z-index:8;
    border-radius:999px;
    opacity:0;
    transform:scale(.96);
    transition:opacity .18s ease,transform .18s ease;
  }
  .focus-zone.show{
    opacity:1;
    transform:scale(1);
    outline:4px solid rgba(255,255,255,.95);
    box-shadow:0 0 0 6px rgba(255,215,0,.28),0 0 18px rgba(255,105,180,.42);
  }
  .focus-zone.sparkle{
    opacity:1;
    transform:scale(1.03);
    background:rgba(255,238,120,.20);
    outline:5px solid rgba(255,214,0,.88);
    box-shadow:0 0 14px rgba(255,214,0,.95),0 0 26px rgba(255,105,180,.65);
    animation:sparklePulse .9s ease-in-out infinite;
  }
  @keyframes sparklePulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.22);}}

  .focus-bubble-1{left:25.6%;top:25.8%;width:24.4%;height:8.8%;}
  .focus-bubble-2{left:54.8%;top:32.0%;width:22.2%;height:10.4%;}
  .focus-cake{left:24.8%;top:44.6%;width:49.8%;height:35.8%;border-radius:24px;}
  .focus-sentence{left:17.3%;top:83.2%;width:67.4%;height:9.0%;border-radius:24px;}

  .lesson-panel{
    width:min(904px,100%);
    margin:12px auto 0;
    border:3px solid rgba(56,175,72,.28);
    border-radius:18px;
    background:linear-gradient(180deg,#fff,#fbfff7);
    padding:12px;
    display:grid;
    gap:10px;
  }
  .progress-wrap{display:grid;justify-items:center;gap:6px;}
  .progress-text{font-size:clamp(.95rem,2vw,1.08rem);font-weight:900;color:#2a7b38;text-align:center;}
  .progress-bar{
    width:min(560px,94%);
    height:15px;
    background:#e8f3e7;
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.16);
  }
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#4aa3ff,#7dffb3);transition:width .12s ease-out;}

  .conversation-panel{display:grid;gap:10px;}
  .convo-line{display:none;align-items:flex-start;gap:8px;}
  .convo-line.show{display:flex;}
  .convo-line.right{justify-content:flex-end;}
  .convo-line.center{justify-content:center;}
  .bubble-stack{display:flex;flex-direction:column;gap:6px;max-width:min(100%,560px);}
  .convo-line.right .bubble-stack{align-items:flex-end;}
  .convo-line.center .bubble-stack{align-items:center;}
  .bubble{
    position:relative;
    padding:12px 16px;
    border-radius:18px;
    font-size:clamp(1rem,2.4vw,1.32rem);
    font-weight:900;
    line-height:1.25;
    box-shadow:0 8px 16px rgba(0,0,0,.12);
    background:#fff;
  }
  .bubble.child{border:3px solid var(--pink);}
  .bubble.chef{border:3px solid var(--purple);}
  .bubble.sentence{border:3px solid var(--green);}
  .bubble.sparkle{
    background:linear-gradient(120deg,#fff2a8,#ffd1f0,#c7f1ff);
    box-shadow:0 0 12px rgba(255,214,0,.75),0 0 20px rgba(255,105,180,.55);
    animation:sparklePulse .95s ease-in-out infinite;
  }
  .repeat-result{min-height:1.2em;font-size:clamp(1rem,2.4vw,1.35rem);line-height:1.2;font-weight:1000;color:var(--success);}
  .try-message{min-height:1.2em;font-size:clamp(.95rem,2.3vw,1.15rem);line-height:1.2;font-weight:1000;color:var(--danger);}
  .star-row{
    min-height:1.15em;
    display:flex;
    gap:6px;
    color:var(--gold);
    font-size:clamp(1.35rem,3.4vw,2rem);
    line-height:1;
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
  }
  .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;width:100%;}
  .btn,.mic-icon-btn{
    min-height:46px;
    min-width:46px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    font-weight:900;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
    transition:transform .12s ease,filter .12s ease;
  }
  .btn:hover,.mic-icon-btn:hover{transform:translateY(-1px);filter:brightness(1.03);}
  .btn:active,.mic-icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .btn{padding:10px 16px;font-size:.95rem;}
  .btn.prev{background:#f8f0c7;color:#9c7b2f;}
  .btn.next{background:var(--yellow);color:#8b5a00;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.read{background:var(--green);color:#fff;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .btn.teacher{display:none;background:#e7fbff;color:#06768a;border:2px solid #89ddea;}
  .btn.teacher.show{display:inline-flex;align-items:center;}
  .mic-icon-btn{
    position:relative;
    background:radial-gradient(circle at 30% 30%,#ffffff,#dff1ff);
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;
    height:64px;
  }
  .mic-icon-btn img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));}
  .mic-icon-btn.is-busy{opacity:.7;pointer-events:none;transform:scale(.97);}
  .finger-cue{
    position:absolute;
    left:50%;
    top:-30px;
    transform:translateX(-50%);
    font-size:1.85rem;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));
    animation:fingerBob 1s ease-in-out infinite;
    display:none;
    pointer-events:none;
  }
  .finger-cue.show{display:block;}
  @keyframes fingerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}
  .status-wrap{display:grid;gap:6px;}
  .conversation-status,.lesson-status{text-align:center;font-weight:1000;min-height:1.25em;}
  .conversation-status{color:#6c4bbf;font-size:clamp(.95rem,2.5vw,1.1rem);}
  .lesson-status{color:#455b74;font-size:.95rem;}
  .footer-note{text-align:center;color:#666;font-size:.92rem;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.7s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}

  #introVideoWrap,.intro-video-wrap,#lbIntroVideoOverlay,.intro-overlay,.video-intro,.intro-video,video[data-intro],video.gp-intro-video,video.intro-video{
    display:none!important;
    visibility:hidden!important;
    opacity:0!important;
    pointer-events:none!important;
  }

  @media (max-width:560px){
    body{padding:6px;}
    .app{border-radius:14px;padding:8px;}
    .page-title{font-size:1.35rem;margin-right:58px;}
    .home-btn{min-width:54px;min-height:46px;font-size:.85rem;}
    .lesson-panel{padding:10px;}
    .controls{gap:8px;}
    .btn{font-size:.86rem;padding:9px 12px;}
    .mic-icon-btn{width:58px;height:58px;}
  }
</style>
</head>

      line:document.querySelector('[data-line-index="1"]'),
      bubble:document.querySelector('[data-line-index="1"] .bubble'),
      result:document.querySelector('[data-line-index="1"] .repeat-result'),
      tryMsg:document.querySelector('[data-line-index="1"] .try-message'),
      stars:document.querySelector('[data-line-index="1"] .star-row'),
      focus:document.getElementById("focus1"),
      extraFocus:document.getElementById("focus2")
    },
    {
      text:"The cake is a cube.",
      line:document.querySelector('[data-line-index="2"]'),
      bubble:document.querySelector('[data-line-index="2"] .bubble'),
      result:document.querySelector('[data-line-index="2"] .repeat-result'),
      tryMsg:document.querySelector('[data-line-index="2"] .try-message'),
      stars:document.querySelector('[data-line-index="2"] .star-row'),
      focus:document.getElementById("focus3"),
      extraFocus:document.getElementById("focus2")
    }
  ];

  const chimeAudio = document.getElementById("chimeAudio");
  const progressPercent = document.getElementById("progressPercent");
  const progressFill = document.getElementById("progressFill");
  const micBtn = document.getElementById("micIconBtn");
  const micFinger = document.getElementById("micFinger");
  const readBtn = document.getElementById("readBtn");
  const restartBtn = document.getElementById("restartBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const teacherPassBtn = document.getElementById("teacherPassBtn");
  const conversationStatus = document.getElementById("conversationStatus");
  const lessonStatus = document.getElementById("lessonStatus");
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let convoIndex = 0;
  let convoPhase = "speak";
  let listening = false;
  let audioCtx = null;
  let completed = 0;

  function unlockAudio(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){
      audioCtx = null;
    }
  }

  function tone(freq,dur=.12,type="sine",gain=.045){
    unlockAudio();
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(() => synthChime());
    }catch(_){
      synthChime();
    }
  }

  function synthChime(){
    [659,880,1175].forEach((f,i)=>setTimeout(()=>tone(f,.18,"sine",.055),i*115));
  }

  function clap(){
    unlockAudio();
    if(!audioCtx) return;
    for(let i=0;i<4;i++){
      const buffer = audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*.08),audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1)*Math.pow(1-j/data.length,2.1);
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      gain.gain.value = .095;
      src.buffer = buffer;
      src.connect(gain).connect(audioCtx.destination);
      src.start(audioCtx.currentTime + i*.11);
    }
  }

  function confetti(){
    const colors = ["#38af48","#f34458","#ffd24a","#4aa3ff","#ff8a32","#b86bff"];
    for(let i=0;i<44;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*.28) + "s";
      document.body.appendChild(piece);
      setTimeout(()=>piece.remove(),2200);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text,onEnd){
    if(!text || !("speechSynthesis" in window)){
      if(typeof onEnd === "function") setTimeout(onEnd,250);
      return;
    }
    try{ window.speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = .88;
    u.pitch = 1.16;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    u.onend = () => { if(typeof onEnd === "function") onEnd(); };
    u.onerror = () => { if(typeof onEnd === "function") onEnd(); };
    window.speechSynthesis.speak(u);
  }

  function normalize(str){
    return String(str || "")
      .toLowerCase()
      .replace(/[’']/g,"")
      .replace(/[^a-z0-9 ]+/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function wordScore(spoken,target){
    const sw = normalize(spoken).split(" ").filter(Boolean);
    const tw = normalize(target).split(" ").filter(Boolean);
    if(!sw.length || !tw.length) return 0;
    let hits = 0;
    const used = new Set();
    tw.forEach(t => {
      const i = sw.findIndex((s,idx)=>!used.has(idx) && (s === t || s.includes(t) || t.includes(s)));
      if(i >= 0){ hits++; used.add(i); }
    });
    return hits / tw.length;
  }

  function clearPosterFocus(){
    document.querySelectorAll(".focus-zone").forEach(z => z.classList.remove("show","sparkle"));
  }

  function showCurrentLine(item){
    conversations.forEach((c,i)=>{
      c.line.classList.toggle("show", i <= convoIndex);
      c.bubble.classList.remove("sparkle");
      if(c.focus) c.focus.classList.remove("show","sparkle");
      if(c.extraFocus) c.extraFocus.classList.remove("show","sparkle");
    });
    item.line.classList.add("show");
    item.bubble.classList.add("sparkle");
    if(item.focus) item.focus.classList.add("sparkle");
    if(item.extraFocus) item.extraFocus.classList.add("show");
  }

  function sparkleCurrent(item){
    item.bubble.classList.add("sparkle");
    if(item.focus) item.focus.classList.add("sparkle");
    if(item.extraFocus) item.extraFocus.classList.add("show");
  }

  function clearBubbleSparkle(item){
    item.bubble.classList.remove("sparkle");
    if(item.focus) item.focus.classList.remove("show","sparkle");
    if(item.extraFocus) item.extraFocus.classList.remove("show","sparkle");
  }

  function updateProgress(){
    const percent = Math.round((completed / conversations.length) * 100);
    progressPercent.textContent = percent + "%";
    progressFill.style.width = percent + "%";
    saveProgress(percent);
  }

  function completeLine(item, spoken){
    item.result.textContent = "You said: “" + spoken + "”";
    item.tryMsg.textContent = "";
    item.stars.textContent = "⭐";
    clearBubbleSparkle(item);
    completed = Math.max(completed, convoIndex + 1);
    updateProgress();
    playChime();

    convoPhase = "next";
    micBtn.classList.remove("is-busy");
    micFinger.classList.add("show");
    conversationStatus.textContent = "Great speaking! Tap the mic for the next part.";

    if(convoIndex >= conversations.length - 1){
      conversationStatus.textContent = "Excellent speaking! You completed the cube conversation.";
      lessonStatus.textContent = "A cube is a 3D shape. The cake is a cube.";
      clap();
      confetti();
      speak("Excellent! You completed the cube lesson. A cube is a three D shape.");
    }else{
      speak("Great job! Tap the microphone for the next air bubble.");
    }
  }

  function listenForRepeat(item){
    if(!SpeechRecognition){
      teacherPassBtn.classList.add("show");
      item.tryMsg.textContent = "Speech recognition is not available. Use Chrome or tap Teacher Pass.";
      micBtn.classList.remove("is-busy");
      micFinger.classList.add("show");
      conversationStatus.textContent = "Teacher Pass is available for classroom use.";
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;
    listening = true;
    conversationStatus.textContent = "Listening now. Say: “" + item.text + "”";
    recognition.onresult = (event) => {
      const spoken = event.results && event.results[0] && event.results[0][0] ? event.results[0][0].transcript : "";
      const score = wordScore(spoken,item.text);
      if(score >= .5){
        completeLine(item, spoken || item.text);
      }else{
        item.tryMsg.textContent = "Sorry, try again! I heard: “" + (spoken || "nothing") + "”";
        speak("Sorry, try again!", () => {
          micBtn.classList.remove("is-busy");
          micFinger.classList.add("show");
          listening = false;
          convoPhase = "repeat";
        });
      }
    };
    recognition.onerror = () => {
      item.tryMsg.textContent = "Sorry, I could not hear you. Try again.";
      speak("Sorry, try again!", () => {
        micBtn.classList.remove("is-busy");
        micFinger.classList.add("show");
        listening = false;
        convoPhase = "repeat";
      });
    };
    recognition.onend = () => { listening = false; };
    try{ recognition.start(); }catch(_){
      item.tryMsg.textContent = "Tap the mic and allow microphone permission.";
      micBtn.classList.remove("is-busy");
      micFinger.classList.add("show");
      listening = false;
    }
  }

  function micStep(){
    unlockAudio();
    if(listening) return;

    if(convoIndex >= conversations.length){
      conversationStatus.textContent = "Great speaking! You finished the air bubbles.";
      speak("Great speaking! You finished the air bubbles.");
      return;
    }

    const item = conversations[convoIndex];
    micBtn.classList.add("is-busy");
    micFinger.classList.remove("show");

    if(convoPhase === "speak"){
      showCurrentLine(item);
      conversationStatus.textContent = "Listen first.";
      speak(item.text, () => {
        convoPhase = "repeat";
        micBtn.classList.remove("is-busy");
        micFinger.classList.add("show");
        conversationStatus.textContent = "Tap the mic again. Then repeat after me.";
      });
      return;
    }

    if(convoPhase === "repeat"){
      sparkleCurrent(item);
      speak("Repeat after me.", () => listenForRepeat(item));
      return;
    }

    if(convoPhase === "next"){
      clearBubbleSparkle(item);
      clearPosterFocus();
      convoIndex++;
      convoPhase = "speak";
      micBtn.classList.remove("is-busy");
      micFinger.classList.add("show");
      conversationStatus.textContent = convoIndex >= conversations.length ? "Great speaking! You finished the air bubbles." : "Tap the mic for the next air bubble.";
    }
  }

  function readInstructions(){
    unlockAudio();
    conversationStatus.textContent = "Listen to the poster instructions.";
    lessonStatus.textContent = "Tap the microphone, listen, then repeat the air bubbles.";
    clearPosterFocus();
    document.getElementById("focus2").classList.add("show");
    document.getElementById("focus3").classList.add("show");
    speak("Welcome to cubes. Can I help you? Yes, please. Eat this cube cake. The cake is a cube. Tap the microphone to hear each air bubble. Then repeat after me.");
  }

  function restart(){
    try{ window.speechSynthesis.cancel(); }catch(_){}
    convoIndex = 0;
    convoPhase = "speak";
    listening = false;
    completed = 0;
    teacherPassBtn.classList.remove("show");
    clearPosterFocus();
    conversations.forEach((item,i)=>{
      item.line.classList.toggle("show", i === 0);
      item.bubble.classList.remove("sparkle");
      item.result.textContent = "";
      item.tryMsg.textContent = "";
      item.stars.textContent = "";
    });
    progressPercent.textContent = "0%";
    progressFill.style.width = "0%";
    conversationStatus.textContent = "Tap the microphone to hear the first air bubble.";
    lessonStatus.textContent = "Learn: A cube is a 3D shape. The cake is a cube.";
    micBtn.classList.remove("is-busy");
    micFinger.classList.add("show");
    saveProgress(0);
  }

  function cheer(){
    unlockAudio();
    playChime();
    clap();
    confetti();
    speak("You can do it! Great job learning about cubes!");
    conversationStatus.textContent = "You can do it! Great job!";
  }

  function teacherPass(){
    if(convoIndex >= conversations.length) return;
    const item = conversations[convoIndex];
    completeLine(item, item.text);
  }

  function saveProgress(score){
    try{
      const payload = {
        pageId:PAGE_ID,
        file:PAGE_ID + ".html",
        level:"B",
        week:2,
        type:"lesson",
        activityType:"speaking",
        score:Math.round(score),
        speaking:Math.round(score),
        completed:score >= 100,
        stars:score >= 95 ? 3 : score >= 65 ? 2 : score >= 35 ? 1 : 0,
        savedAt:new Date().toISOString(),
        ts:Date.now()
      };
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
  }

  micBtn.addEventListener("click", micStep);
  readBtn.addEventListener("click", readInstructions);
  restartBtn.addEventListener("click", () => { restart(); speak("Restarted. Tap the microphone to begin again."); });
  cheerBtn.addEventListener("click", cheer);
  teacherPassBtn.addEventListener("click", teacherPass);
  prevBtn.addEventListener("click", () => { window.location.replace(PREVIOUS_PAGE); });
  nextBtn.addEventListener("click", () => { window.location.replace(NEXT_PAGE); });
  homeBtn.addEventListener("click", () => { window.location.replace(HOME_PAGE); });

  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged = () => {};
  }

  window.addEventListener("beforeunload", () => {
    try{ window.speechSynthesis.cancel(); }catch(_){}
  });

  window.addEventListener("load", () => {
    restart();
    setTimeout(() => {
      speak("Welcome to cubes. Look at the poster. The cake is a cube. Tap the microphone to practice the air bubbles.");
    },650);
  }, {once:true});
})();
</script>
</body>
