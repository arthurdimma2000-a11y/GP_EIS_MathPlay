<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surfaces - 3D Shapes Speaking Lesson</title>

<style>
:root {
  --ink:#25242a;
  --cream:#fff8f2;
  --white:#ffffff;
  --orange:#ff9818;
  --orange-dark:#d87500;
  --red:#ef3f4f;
  --pink:#ff6787;
  --purple:#8f87da;
  --green:#25a95b;
  --yellow:#ffe89a;
  --blue:#dff1ff;
  --gold:#ffd24a;
  --danger:#c62828;
  --shadow:0 14px 32px rgba(0,0,0,.13);
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  color:var(--ink);
  background:var(--cream);
}

body {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:10px;
  background-image:
    linear-gradient(#f4e8d9 1px,transparent 1px),
    linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
  background-size:26px 26px;
}

button,a { -webkit-tap-highlight-color:transparent; }
button { font:inherit; }
img { display:block; max-width:100%; }

.app {
  position:relative;
  width:min(980px,100%);
  padding:12px;
  border-radius:22px;
  background:#fff;
  box-shadow:var(--shadow);
}

.home-btn {
  position:absolute;
  top:8px;
  right:12px;
  z-index:30;
  width:64px;
  height:52px;
  border-radius:999px;
  display:grid;
  place-items:center;
  text-decoration:none;
  background:#fff;
  color:var(--orange-dark);
  font-size:1.65rem;
  font-weight:1000;
  box-shadow:0 7px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.12);
  animation:homeSwing 2.4s ease-in-out infinite;
}

@keyframes homeSwing {
  0%,100% { transform:translateY(14%) rotate(-5deg); }
  50% { transform:translateY(14%) rotate(7deg); }
}

.page-title {
  margin:0 76px 8px 0;
  text-align:center;
  color:var(--orange);
  font-size:clamp(1.65rem,4.5vw,3rem);
  font-weight:1000;
  text-shadow:0 2px 0 #fff;
}

.poster-card {
  position:relative;
  width:min(904px,100%);
  margin:0 auto;
  overflow:hidden;
  border-radius:18px;
  background:#fff0a9;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
  touch-action:manipulation;
}

.poster-image {
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

.focus-zone {
  position:absolute;
  z-index:8;
  opacity:0;
  pointer-events:none;
  border-radius:999px;
  transform:scale(.96);
  transition:opacity .18s ease,transform .18s ease;
}

.focus-zone.show {
  opacity:1;
  transform:scale(1);
  outline:4px solid rgba(255,255,255,.98);
  box-shadow:
    0 0 0 6px rgba(255,215,0,.32),
    0 0 22px rgba(255,152,24,.72);
}

.focus-zone.sparkle {
  opacity:1;
  transform:scale(1.035);
  background:rgba(255,238,120,.16);
  outline:5px solid rgba(255,214,0,.9);
  box-shadow:
    0 0 14px rgba(255,214,0,.95),
    0 0 28px rgba(255,152,24,.72);
  animation:sparklePulse .9s ease-in-out infinite;
}

@keyframes sparklePulse {
  0%,100% { filter:brightness(1); }
  50% { filter:brightness(1.22); }
}

/* Focus areas aligned to the unchanged poster */
.focus-title   { left:22%; top:0.6%; width:55%; height:7%; border-radius:28px; }
.focus-bride   { left:22.5%; top:24%; width:18%; height:8%; }
.focus-party   { left:49.3%; top:27%; width:28%; height:9%; }
.focus-ball    { left:29.4%; top:43.7%; width:23%; height:9%; }
.focus-cheese  { left:53.1%; top:57%; width:25%; height:7%; }
.focus-cake    { left:27.3%; top:76%; width:24%; height:7%; }

.lesson-panel {
  width:min(904px,100%);
  margin:12px auto 0;
  padding:12px;
  display:grid;
  gap:11px;
  border:3px solid rgba(255,152,24,.28);
  border-radius:18px;
  background:linear-gradient(180deg,#fff,#fff9f0);
}

.progress-wrap {
  display:grid;
  justify-items:center;
  gap:6px;
}

.progress-text {
  text-align:center;
  color:#6c4bbf;
  font-size:clamp(.95rem,2vw,1.08rem);
  font-weight:1000;
}

.progress-bar {
  width:min(560px,94%);
  height:17px;
  overflow:hidden;
  border-radius:999px;
  background:#e7efff;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.16);
}

.progress-fill {
  width:0;
  height:100%;
  background:linear-gradient(90deg,#ff9818,#ffd24a,#7dffb3);
  transition:width .22s ease;
}

.conversation-panel {
  display:grid;
  gap:10px;
}

.convo-line {
  display:none;
  align-items:flex-start;
  gap:8px;
}

.convo-line.show { display:flex; }
.convo-line.right { justify-content:flex-end; }
.convo-line.center { justify-content:center; }

.bubble-stack {
  max-width:min(100%,680px);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.convo-line.right .bubble-stack { align-items:flex-end; }
.convo-line.center .bubble-stack { align-items:center; }

.bubble {
  position:relative;
  padding:12px 18px;
  border-radius:22px;
  background:#fff;
  text-align:center;
  font-size:clamp(1rem,2.4vw,1.35rem);
  font-weight:1000;
  line-height:1.25;
  box-shadow:0 8px 16px rgba(0,0,0,.12);
}

.bubble.poster { border:3px solid var(--orange); }
.bubble.bride  { border:3px solid #ff583d; }
.bubble.party  { border:3px solid #9189dc; }
.bubble.ball   { border:3px solid #ff6787; }
.bubble.cheese { border:3px solid #ff9a2a; }
.bubble.cake   { border:3px solid #f05a95; }

.bubble.sparkle {
  background:linear-gradient(120deg,#fff2a8,#ffd1f0,#c7f1ff);
  box-shadow:0 0 12px rgba(255,214,0,.75),0 0 20px rgba(255,152,24,.55);
  animation:sparklePulse .95s ease-in-out infinite;
}

.repeat-result {
  min-height:1.2em;
  color:var(--green);
  font-size:clamp(1rem,2.4vw,1.35rem);
  font-weight:1000;
  line-height:1.2;
}

.star-row {
  min-height:1.15em;
  display:flex;
  gap:6px;
  color:var(--gold);
  font-size:clamp(1.35rem,3.4vw,2rem);
  line-height:1;
  text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
}

.controls {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.btn,.mic-icon-btn {
  min-height:46px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:1000;
  box-shadow:0 5px 0 rgba(0,0,0,.16);
  transition:transform .12s ease,filter .12s ease;
}

.btn:hover,.mic-icon-btn:hover {
  transform:translateY(-1px);
  filter:brightness(1.04);
}

.btn:active,.mic-icon-btn:active {
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,.12);
}

.btn {
  padding:10px 16px;
  font-size:.95rem;
}

.btn.prev  { background:#f8f0c7; color:#8e6c26; }
.btn.read  { background:var(--orange); color:#fff; }
.btn.clear { background:#dfeaff; color:#1f3b6b; }
.btn.cheer { background:#c9f2d6; color:#166c38; }
.btn.next  { background:var(--yellow); color:#8b5a00; }

.mic-icon-btn {
  position:relative;
  width:68px;
  height:68px;
  display:grid;
  place-items:center;
  padding:0;
  background:radial-gradient(circle at 35% 24%,#fff,#dff1ff);
  font-size:2.4rem;
}

.mic-icon-btn.is-busy {
  opacity:.72;
  pointer-events:none;
  transform:scale(.97);
}

.mic-icon-btn.listening {
  animation:micPulse .7s ease-in-out infinite;
}

@keyframes micPulse {
  0%,100% { box-shadow:0 5px 0 rgba(0,0,0,.16),0 0 0 0 rgba(239,63,79,.35); }
  50% { box-shadow:0 5px 0 rgba(0,0,0,.16),0 0 0 13px rgba(239,63,79,0); }
}

.finger-cue {
  position:absolute;
  left:50%;
  top:-31px;
  display:none;
  transform:translateX(-50%);
  font-size:1.9rem;
  pointer-events:none;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));
  animation:fingerBob 1s ease-in-out infinite;
}

.finger-cue.show { display:block; }

@keyframes fingerBob {
  0%,100% { transform:translateX(-50%) translateY(0); }
  50% { transform:translateX(-50%) translateY(6px); }
}

.status-wrap {
  display:grid;
  gap:6px;
}

.conversation-status,.listen-status {
  min-height:1.25em;
  text-align:center;
  font-weight:1000;
}

.conversation-status {
  color:#6c4bbf;
  font-size:clamp(.95rem,2.5vw,1.12rem);
}

.listen-status {
  color:#555;
  font-size:.93rem;
}

.footer-note {
  text-align:center;
  color:#666;
  font-size:.9rem;
  font-weight:800;
}

.confetti-piece {
  position:fixed;
  top:-20px;
  z-index:9999;
  width:10px;
  height:16px;
  border-radius:3px;
  pointer-events:none;
  animation:fall 1.75s linear forwards;
}

@keyframes fall {
  to {
    transform:translateY(105vh) rotate(540deg);
    opacity:.1;
  }
}

@media (max-width:560px) {
  body { padding:6px; }
  .app { padding:8px; border-radius:14px; }
  .page-title { margin-right:64px; font-size:1.45rem; }
  .home-btn { width:58px; height:46px; font-size:1.35rem; }
  .lesson-panel { padding:10px; }
  .controls { gap:8px; }
  .btn { padding:9px 12px; font-size:.83rem; }
  .mic-icon-btn { width:60px; height:60px; font-size:2.1rem; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  const CONFIG = window.__PAGE_CONFIG__ || {};
  const micLines = Array.isArray(CONFIG.micLines) ? CONFIG.micLines : [];

  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const micBtn = document.getElementById("micIconBtn");
  const micFinger = document.getElementById("micFinger");
  const chimeAudio = document.getElementById("chimeAudio");
  const conversationStatus = document.getElementById("conversationStatus");
  const listenStatus = document.getElementById("listenStatus");
  const progressPercent = document.getElementById("progressPercent");
  const progressFill = document.getElementById("progressFill");
  const linePoster = document.getElementById("linePoster");
  const resultPoster = document.getElementById("resultPoster");
  const starsPoster = document.getElementById("starsPoster");

  let audioContext = null;
  let recognition = null;
  let busy = false;
  let micIndex = 0;
  let micPhase = "listen";
  let readDone = false;
  let introFinished = false;

  const state = {
    completed: new Array(micLines.length).fill(false),
    attempts: new Array(micLines.length).fill(0),
    done: false
  };

  function setStatus(text) {
    conversationStatus.textContent = text || "";
  }

  function setListen(text) {
    listenStatus.textContent = text || "";
  }

  function setMicFinger(show) {
    micFinger.classList.toggle("show", Boolean(show));
  }

  function stopSpeaking() {
    try {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    } catch (_) {}
  }

  function pickAmericanFemaleVoice() {
    if (!("speechSynthesis" in window)) return null;

    const voices = window.speechSynthesis.getVoices() || [];
    const usEnglish = voices.filter(v => /^en-US/i.test(v.lang || ""));
    const otherEnglish = voices.filter(v => /^en/i.test(v.lang || ""));

    const preferredNames = [
      "Jenny",
      "Aria",
      "Samantha",
      "Zira",
      "Ava",
      "Emma",
      "Michelle",
      "Joanna",
      "Kimberly",
      "Salli",
      "Google US English",
      "Microsoft Zira"
    ];

    for (const name of preferredNames) {
      const found =
        usEnglish.find(v => (v.name || "").toLowerCase().includes(name.toLowerCase())) ||
        otherEnglish.find(v => (v.name || "").toLowerCase().includes(name.toLowerCase()));

      if (found) return found;
    }

    return usEnglish[0] || otherEnglish[0] || voices[0] || null;
  }

  function speak(text, done) {
    stopSpeaking();

    if (!("speechSynthesis" in window)) {
      if (typeof done === "function") done();
      return;
    }

    try {
      const utterance = new SpeechSynthesisUtterance(String(text || ""));
      utterance.lang = "en-US";
      utterance.rate = 0.92;
      utterance.pitch = 1.08;
      utterance.volume = 1;

      const voice = pickAmericanFemaleVoice();
      if (voice) utterance.voice = voice;

      utterance.onend = () => {
        if (typeof done === "function") done();
      };

      utterance.onerror = () => {
        if (typeof done === "function") done();
      };

      window.speechSynthesis.speak(utterance);
    } catch (_) {
      if (typeof done === "function") done();
    }
  }

  function getAudioContext() {
    if (audioContext) {
      if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
      return audioContext;
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;

    try {
      audioContext = new AudioCtx();
      return audioContext;
    } catch (_) {
      return null;
    }
  }

  function playTick() {
    const ac = getAudioContext();
    if (!ac) return;

    try {
      const oscillator = ac.createOscillator();
      const gain = ac.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(420, ac.currentTime);
      gain.gain.setValueAtTime(0.0001, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.14, ac.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.12);
      oscillator.connect(gain);
      gain.connect(ac.destination);
      oscillator.start();
      oscillator.stop(ac.currentTime + 0.13);
    } catch (_) {}
  }

  function playChime() {
    try {
      const sound = chimeAudio.cloneNode(true);
      sound.volume = 0.85;
      sound.currentTime = 0;
      sound.play().catch(() => playTick());
    } catch (_) {
      playTick();
    }
  }

  function playApplause() {
    const ac = getAudioContext();
    if (!ac) return;

    try {
      for (let i = 0; i < 13; i++) {
        const start = ac.currentTime + i * 0.045;
        const buffer = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.07), ac.sampleRate);
        const data = buffer.getChannelData(0);

        for (let j = 0; j < data.length; j++) {
          data[j] = (Math.random() * 2 - 1) * (1 - j / data.length);
        }

        const source = ac.createBufferSource();
        const filter = ac.createBandpassFilter();
        const gain = ac.createGain();

        source.buffer = buffer;
        filter.frequency.value = 1150 + Math.random() * 1100;
        filter.Q.value = 0.6;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.055, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.07);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);
        source.start(start);
      }
    } catch (_) {}
  }

  function confetti() {
    const colors = ["#ff9818","#ef3f4f","#25a95b","#ffd24a","#6c4bbf","#0798b0"];

    for (let i = 0; i < 55; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * 0.35 + "s";
      piece.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2300);
    }
  }

  function cheer() {
    const remarks = CONFIG.completionRemarks || ["Great job!"];
    const message = remarks[Math.floor(Math.random() * remarks.length)] || "Great job!";
    playChime();
    playApplause();
    confetti();
    setStatus(message);
    speak(message);
  }

  function showFocus(name, sparkle) {
    document.querySelectorAll(".focus-zone").forEach(zone => {
      const active = zone.dataset.focus === name;
      zone.classList.toggle("show", active);
      zone.classList.toggle("sparkle", active && Boolean(sparkle));
    });
  }

  function clearFocus() {
    document.querySelectorAll(".focus-zone").forEach(zone => {
      zone.classList.remove("show", "sparkle");
    });
  }

  function normalize(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[’']/g, "")
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function scoreSpeech(expected, heard) {
    const expectedWords = normalize(expected).split(" ").filter(Boolean);
    const heardWords = normalize(heard).split(" ").filter(Boolean);

    if (!expectedWords.length || !heardWords.length) return 0;

    let hits = 0;
    const used = new Array(heardWords.length).fill(false);

    expectedWords.forEach(word => {
      const index = heardWords.findIndex((heardWord, i) => !used[i] && heardWord === word);
      if (index >= 0) {
        used[index] = true;
        hits++;
      }
    });

    return Math.round((hits / expectedWords.length) * 100);
  }

  function createRecognizer() {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) return null;

    const recognizer = new Recognition();
    recognizer.lang = "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 3;
    recognizer.continuous = false;
    return recognizer;
  }

  function setResult(index, text, color) {
    const line = micLines[index];
    const result = document.getElementById(line.resultId);

    if (result) {
      result.textContent = text || "";
      result.style.color = color || "";
    }
  }

  function setStars(index, count) {
    const line = micLines[index];
    const stars = document.getElementById(line.starsId);
    if (!stars) return;

    const safe = Math.max(0, Math.min(3, count));
    stars.textContent = "★".repeat(safe) + "☆".repeat(3 - safe);
  }

  function getLineElement(index) {
    return document.getElementById(micLines[index].lineId);
  }

  function showLine(index) {
    const line = micLines[index];
    const element = getLineElement(index);

    if (element) element.classList.add("show");

    document.querySelectorAll(".bubble").forEach(bubble => {
      bubble.classList.remove("sparkle");
    });

    const bubble = element ? element.querySelector(".bubble") : null;
    if (bubble) bubble.classList.add("sparkle");

    showFocus(line.focus, true);
  }

  function updateProgress() {
    const speechUnits = state.completed.filter(Boolean).length;
    const posterUnit = readDone ? 1 : 0;
    const totalUnits = micLines.length + 1;
    const percentage = Math.round(((speechUnits + posterUnit) / totalUnits) * 100);

    progressPercent.textContent = percentage + "%";
    progressFill.style.width = percentage + "%";
    saveProgress(percentage);

    if (percentage >= 100 && !state.done) {
      state.done = true;
      playChime();
      playApplause();
      confetti();
      setStatus("Lesson complete! You finished every air bubble.");
      setListen("Excellent listening and speaking.");
      speak("Fantastic! You finished every air bubble. You are a surfaces superstar!");
    }
  }

  function saveProgress(score) {
    const payload = {
      pageId: CONFIG.pageId || "Surfaces_3D_Shapes_Speaking_Lesson",
      file: CONFIG.fileName || "SurfacesLesson.html",
      level: CONFIG.level || "B",
      week: CONFIG.week || 3,
      activityType: "lesson",
      type: "lesson",
      score: Math.max(0, Math.min(100, Math.round(score || 0))),
      completed: score >= 100,
      stars: score >= 90 ? 3 : score >= 65 ? 2 : score >= 30 ? 1 : 0,
      skills: {
        reading: 1,
        speaking: 1,
        listening: 1,
        vocabulary: 1,
        threeDShapes: 1,
        surfaces: 1
      },
      savedAt: new Date().toISOString(),
      ts: Date.now()
    };

    try {
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
    } catch (_) {}
  }

  function revealPosterLine() {
    linePoster.classList.add("show");
    resultPoster.textContent = "Listen to the poster.";
    starsPoster.textContent = "★☆☆";
    showFocus("title", true);
  }

  function readPoster() {
    if (busy) return;

    getAudioContext();
    revealPosterLine();
    setMicFinger(false);
    setStatus("Reading the Surfaces poster.");
    setListen("Listen carefully to every air bubble.");

    speak(CONFIG.posterSpeech, () => {
      readDone = true;
      resultPoster.textContent = "Great listening!";
      starsPoster.textContent = "★★★";
      playChime();
      updateProgress();
      setStatus("Now tap the microphone to practise each air bubble.");
      setListen("Tap once to listen. Tap again to speak.");
      setMicFinger(true);
    });
  }

  function handleMicClick() {
    if (busy || !micLines.length) return;

    getAudioContext();
    setMicFinger(false);

    if (micIndex >= micLines.length) {
      cheer();
      return;
    }

    const line = micLines[micIndex];

    if (micPhase === "listen") {
      showLine(micIndex);
      setStatus("Listen carefully.");
      setListen("Bubble " + (micIndex + 1) + ": " + line.text);

      speak(line.text, () => {
        micPhase = "repeat";
        setStatus("Tap the microphone again and repeat after me.");
        setListen("Say: " + line.text);
        setMicFinger(true);
      });

      return;
    }

    listenForRepeat(micIndex);
  }

  function listenForRepeat(index) {
    const line = micLines[index];

    busy = true;
    micBtn.classList.add("is-busy", "listening");
    setMicFinger(false);
    setStatus("Listening... speak now.");
    setListen("Repeat: " + line.text);

    recognition = createRecognizer();

    if (!recognition) {
      setTimeout(() => {
        busy = false;
        micBtn.classList.remove("is-busy", "listening");
        markSuccess(index, "Nice speaking practice!");
      }, 1000);
      return;
    }

    let finished = false;

    const finish = (success, heardText) => {
      if (finished) return;
      finished = true;
      busy = false;
      micBtn.classList.remove("is-busy", "listening");

      try { recognition.stop(); } catch (_) {}

      if (success) {
        markSuccess(
          index,
          heardText ? "I heard: “" + heardText + "”" : "Great speaking!"
        );
      } else {
        state.attempts[index] += 1;
        setResult(index, "Sorry, try again!", "#c62828");
        setStars(index, 0);
        playTick();
        setStatus("Try again. Listen, then repeat.");
        setListen("Say: " + line.text);

        speak("Sorry, try again. Say: " + line.text, () => {
          micPhase = "repeat";
          setMicFinger(true);
        });
      }
    };

    recognition.onresult = event => {
      let best = "";

      for (let i = 0; i < event.results.length; i++) {
        for (let j = 0; j < event.results[i].length; j++) {
          const candidate = event.results[i][j].transcript || "";
          if (candidate.length > best.length) best = candidate;
        }
      }

      const percentage = scoreSpeech(line.text, best);
      finish(percentage >= 50, best);
    };

    recognition.onerror = () => finish(false, "");
    recognition.onend = () => {
      if (!finished) finish(false, "");
    };

    try {
      recognition.start();
    } catch (_) {
      finish(false, "");
    }
  }

  function markSuccess(index, message) {
    const line = micLines[index];

    state.completed[index] = true;
    setResult(index, message || "Great speaking!", "#218c53");
    setStars(index, 3);
    showFocus(line.focus, true);

    playChime();
    playApplause();
    confetti();

    setStatus("Wonderful! Let’s go to the next air bubble.");

    speak("Wonderful! " + line.text, () => {
      micIndex += 1;
      micPhase = "listen";
      updateProgress();

      if (micIndex < micLines.length) {
        setStatus("Tap the microphone for the next air bubble.");
        setListen("The next bubble is ready.");
        setMicFinger(true);
      } else {
        setStatus("All air bubbles are finished.");
        setListen("Excellent work!");
        setMicFinger(false);
        updateProgress();
      }
    });
  }

  function clearLesson() {
    stopSpeaking();

    try {
      if (recognition) recognition.stop();
    } catch (_) {}

    busy = false;
    micIndex = 0;
    micPhase = "listen";
    readDone = false;
    state.done = false;
    state.completed = new Array(micLines.length).fill(false);
    state.attempts = new Array(micLines.length).fill(0);

    micBtn.classList.remove("is-busy", "listening");

    document.querySelectorAll(".convo-line").forEach(line => {
      line.classList.remove("show");
    });

    document.querySelectorAll(".repeat-result").forEach(result => {
      result.textContent = "";
      result.style.color = "";
    });

    document.querySelectorAll(".star-row").forEach(stars => {
      stars.textContent = "";
    });

    document.querySelectorAll(".bubble").forEach(bubble => {
      bubble.classList.remove("sparkle");
    });

    clearFocus();
    setStatus("Listen to the instructions.");
    setListen("Tap “Read poster” or tap the microphone.");
    setMicFinger(false);
    updateProgress();
  }

  function startIntro() {
    if (introFinished) return;
    introFinished = true;

    setStatus("Listen to the instructions.");
    speak(CONFIG.introSpeech, () => {
      setStatus("Tap Read poster, or tap the microphone to hear the first air bubble.");
      setListen("Tap the microphone twice for each sentence: listen, then speak.");
      setMicFinger(true);
    });
  }

  homeBtn.href = CONFIG.homeHref || homeBtn.href;

  prevBtn.addEventListener("click", () => {
    window.location.href = CONFIG.prevHref || "#";
  });

  nextBtn.addEventListener("click", () => {
    window.location.href = CONFIG.nextHref || "#";
  });

  readBtn.addEventListener("click", readPoster);
  clearBtn.addEventListener("click", clearLesson);
  cheerBtn.addEventListener("click", cheer);
  micBtn.addEventListener("click", handleMicClick);

  document.getElementById("posterCard").addEventListener("click", () => {
    if (!readDone) readPoster();
  });

  document.addEventListener("pointerdown", () => {
    getAudioContext();

    try {
      chimeAudio.load();
    } catch (_) {}

    /*
      Some browsers block automatic speech until the first tap.
      This starts the same instruction after the first interaction
      when automatic playback was blocked.
    */
    if (!introFinished) startIntro();
  }, { once:true });

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = pickAmericanFemaleVoice;
  }

  window.addEventListener("beforeunload", () => {
    stopSpeaking();
    try {
      if (recognition) recognition.stop();
    } catch (_) {}
  });

  window.addEventListener("load", () => {
    clearLesson();

    setTimeout(() => {
      startIntro();
    }, 650);
  }, { once:true });
})();
</script>
</body>
