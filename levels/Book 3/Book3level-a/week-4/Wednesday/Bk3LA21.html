<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surfaces Week 4 - Trace the Number of Faces</title>
<style>
:root{
  --bg:#fff8f1;--card:#fff;--ink:#2c2826;--orange:#f99a16;--orange-dark:#c96c00;
  --gold:#ffd24a;--green:#25a65a;--purple:#7650c5;--blue:#55a9ff;--line:#eadfd8;
  --shadow:0 16px 34px rgba(0,0,0,.13);
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink)}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px
}
.app{width:min(990px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 16px}
.poster-wrap{
  position:relative;width:min(920px,100%);margin:0 auto;border-radius:18px;overflow:hidden;
  background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.09);touch-action:none
}
.poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.guide-layer,.trace-layer{position:absolute;inset:0;width:100%;height:100%;background:transparent}
.guide-layer{z-index:5;pointer-events:none}
.trace-layer{z-index:6;cursor:crosshair;touch-action:none}
.panel{
  width:min(920px,100%);margin:12px auto 0;padding:12px;border-radius:18px;
  border:3px solid rgba(249,154,22,.24);background:linear-gradient(180deg,#fff,#fff9f5);
  box-shadow:0 8px 18px rgba(0,0,0,.07)
}
.panel-title{text-align:center;font-size:clamp(1rem,2.7vw,1.35rem);font-weight:1000;color:var(--orange-dark);margin-bottom:8px}
.progress-row{display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:19px;border-radius:999px;overflow:hidden;background:#eaf2ff;box-shadow:inset 0 2px 5px rgba(0,0,0,.14)}
.progress-fill{width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffad35,#ffe66d,#7be7a1);transition:width .16s ease}
.progress-text{min-width:66px;text-align:right;font-weight:1000;color:var(--orange-dark)}
.mini-grid{margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{
  border:2px solid #ffd8b3;border-radius:14px;padding:8px;text-align:center;background:#fff;
  color:#754810;font-weight:1000
}
.mini.done{background:#effff4;border-color:#78dca0;color:#176f3f}
.status-box{
  margin-top:10px;min-height:62px;display:grid;place-items:center;gap:4px;padding:10px 12px;
  border:2px dashed rgba(249,154,22,.45);border-radius:16px;background:#fff9e9
}
.status{text-align:center;font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.35;font-weight:1000;color:#714912}
.stars{min-height:1.2em;text-align:center;color:var(--gold);font-size:clamp(1.3rem,3vw,1.9rem);text-shadow:0 2px 0 #9c7000}
.buttons{width:min(920px,100%);margin:14px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{
  appearance:none;border:none;cursor:pointer;text-decoration:none;min-height:48px;padding:10px 18px;
  border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 rgba(0,0,0,.14);font-size:1rem;font-weight:1000;
  transition:transform .12s ease,filter .12s ease,box-shadow .12s ease
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03)} .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.home{background:#fff;color:var(--orange-dark)} .prev{background:#e8f2ff;color:#285a91}
.read{background:#ffb84c;color:#fff} .start{background:#bdf1cc;color:#125f36}
.clear{background:#eee1ff;color:#6335a1} .cheer{background:#ffd9df;color:#a82f47} .next{background:#ffe28c;color:#855900}
.note{width:min(920px,100%);margin:12px auto 0;text-align:center;color:#666;font-weight:800;line-height:1.4}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;pointer-events:none;z-index:9999;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1}}
@media(max-width:650px){
 body{padding:6px}.app{padding:6px 6px 12px;border-radius:16px}.panel{padding:10px}.btn{font-size:.86rem;padding:9px 12px}
 .mini-grid{grid-template-columns:1fr}
}
</style>
</head>

    <a class="btn home" href="../../../../../index.html">🏠 Home</a>
    <button class="btn prev" id="prevBtn" type="button">← Previous</button>
    <button class="btn read" id="readBtn" type="button">🔊 Read Poster</button>
    <button class="btn start" id="startBtn" type="button">✍ Start Tracing</button>
    <button class="btn clear" id="clearBtn" type="button">↻ Clear</button>
    <button class="btn cheer" id="cheerBtn" type="button">⭐ Cheer</button>
    <button class="btn next" id="nextBtn" type="button">Next →</button>
  </nav>

  <div class="note">
    Trace directly over each dotted number. The bar increases only when your line follows the correct number shape.
  </div>

  <audio id="chimeAudio" preload="auto">
    <source src="chime.mp3" type="audio/mpeg">
  </audio>
</main>

<script>
(() => {
"use strict";

const CONFIG={
  pageId:"Bk3LC21_Surfaces_Week4",
  file:"Bk3LC21.html",
  level:"C",
  week:4,
  prevHref:"../Tuesday/Bk3LA20.html",
  nextHref:"Bk3LA25.html"
};

const posterImg=document.getElementById("posterImg");
const guide=document.getElementById("guideLayer");
const trace=document.getElementById("traceLayer");
const gctx=guide.getContext("2d");
const tctx=trace.getContext("2d");
const fill=document.getElementById("progressFill");
const progressText=document.getElementById("progressText");
const statusEl=document.getElementById("status");
const starsEl=document.getElementById("stars");
const chime=document.getElementById("chimeAudio");

let drawing=false,lastPoint=null,audioCtx=null,lastTick=0,celebrated=false;
const completed={zero:false,five:false,six:false};

/* Coordinates use the original 892 × 1236 poster. */
const targets=[
 {id:"zero",label:"0",cx:529,cy:453,w:48,h:72,type:"zero",samples:[]},
 {id:"five",label:"5",cx:576,cy:770,w:47,h:70,type:"five",samples:[]},
 {id:"six",label:"6",cx:529,cy:1083,w:47,h:70,type:"six",samples:[]}
];

function lineSamples(points,step=4){
 const out=[];
 for(let i=0;i<points.length-1;i++){
  const a=points[i],b=points[i+1],d=Math.hypot(b.x-a.x,b.y-a.y);
  const n=Math.max(1,Math.ceil(d/step));
  for(let j=0;j<=n;j++){const q=j/n;out.push({x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q,hit:false})}
 }
 return out;
}
function ellipseSamples(cx,cy,rx,ry,start=0,end=Math.PI*2,n=90){
 const out=[];for(let i=0;i<=n;i++){const a=start+(end-start)*i/n;out.push({x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,hit:false})}return out;
}
function buildSamples(){
 targets.forEach(t=>{
  if(t.type==="zero") t.samples=ellipseSamples(t.cx,t.cy,t.w*.34,t.h*.43,0,Math.PI*2,110);
  if(t.type==="five"){
   const p=[
    {x:t.cx+t.w*.30,y:t.cy-t.h*.42},{x:t.cx-t.w*.28,y:t.cy-t.h*.42},
    {x:t.cx-t.w*.30,y:t.cy-t.h*.05},{x:t.cx+t.w*.08,y:t.cy-t.h*.05},
    {x:t.cx+t.w*.30,y:t.cy+t.h*.05},{x:t.cx+t.w*.30,y:t.cy+t.h*.27},
    {x:t.cx+t.w*.12,y:t.cy+t.h*.43},{x:t.cx-t.w*.20,y:t.cy+t.h*.40}
   ];t.samples=lineSamples(p,3.5);
  }
  if(t.type==="six"){
   const arc=ellipseSamples(t.cx,t.cy+t.h*.12,t.w*.31,t.h*.28,-Math.PI*.25,Math.PI*1.95,95);
   const stem=lineSamples([
    {x:t.cx+t.w*.22,y:t.cy-t.h*.40},{x:t.cx-t.w*.12,y:t.cy-t.h*.22},
    {x:t.cx-t.w*.28,y:t.cy+t.h*.03}
   ],3.5);
   t.samples=[...stem,...arc];
  }
 });
}
buildSamples();

function canvasPoint(e){
 const r=trace.getBoundingClientRect();
 return {x:(e.clientX-r.left)*(trace.width/r.width),y:(e.clientY-r.top)*(trace.height/r.height)};
}
function scaleX(){return trace.width/892} function scaleY(){return trace.height/1236}
function setupCanvas(){
 const rect=posterImg.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
 [guide,trace].forEach(c=>{c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);c.style.width=rect.width+"px";c.style.height=rect.height+"px"});
 drawGuides();update();
}
function drawGuides(){
 gctx.clearRect(0,0,guide.width,guide.height);
 const sx=scaleX(),sy=scaleY();
 gctx.save();gctx.setLineDash([5*sx,5*sx]);gctx.lineWidth=Math.max(2,2.2*sx);gctx.strokeStyle="rgba(25,25,25,.42)";
 targets.forEach(t=>{
  gctx.beginPath();
  t.samples.forEach((s,i)=>{const x=s.x*sx,y=s.y*sy;if(i===0)gctx.moveTo(x,y);else gctx.lineTo(x,y)});
  gctx.stroke();
 });
 gctx.restore();
}
function distancePointSegment(p,a,b){
 const vx=b.x-a.x,vy=b.y-a.y,wx=p.x-a.x,wy=p.y-a.y;
 const c1=vx*wx+vy*wy;if(c1<=0)return Math.hypot(p.x-a.x,p.y-a.y);
 const c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(p.x-b.x,p.y-b.y);
 const q=c1/c2;return Math.hypot(p.x-(a.x+q*vx),p.y-(a.y+q*vy));
}
function markHits(a,b){
 const sx=scaleX(),sy=scaleY(),tol=Math.max(14,18*sx);
 targets.forEach(t=>t.samples.forEach(s=>{
  if(!s.hit && distancePointSegment({x:s.x*sx,y:s.y*sy},a,b)<=tol)s.hit=true;
 }));
 update();
}
function pct(t){return Math.round(t.samples.filter(s=>s.hit).length/t.samples.length*100)}
function drawStroke(a,b){
 tctx.save();tctx.strokeStyle="#1f87e5";tctx.lineWidth=Math.max(4,6*scaleX());tctx.lineCap="round";tctx.lineJoin="round";
 tctx.beginPath();tctx.moveTo(a.x,a.y);tctx.lineTo(b.x,b.y);tctx.stroke();tctx.restore();
}
function update(){
 let sum=0;
 targets.forEach(t=>{
  const p=pct(t);sum+=p;
  document.getElementById("pct"+t.label).textContent=p+"%";
  const mini=document.getElementById("mini"+t.label);
  const isDone=p>=85;mini.classList.toggle("done",isDone);
  if(isDone&&!completed[t.id]){completed[t.id]=true;playChime();playApplause();confetti();speak("Great job! You traced number "+t.label+".")}
  if(!isDone)completed[t.id]=false;
 });
 const overall=Math.round(sum/targets.length);
 fill.style.width=overall+"%";progressText.textContent=overall+"%";saveProgress(overall);
 if(Object.values(completed).every(Boolean)&&!celebrated){
  celebrated=true;playChime();playApplause();confetti();starsEl.textContent="★★★";
  setStatus("Excellent! A sphere has 0 faces, a triangular prism has 5 faces, and a cube has 6 faces.");
  speak("Excellent work! A sphere has zero faces. A triangular prism has five faces. A cube has six faces.");
 }
 if(!Object.values(completed).every(Boolean))celebrated=false;
}
function setStatus(x){statusEl.textContent=x}
function getAudio(){
 if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
 if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
 return audioCtx;
}
function playTick(){
 const now=performance.now();if(now-lastTick<65)return;lastTick=now;
 const ac=getAudio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
 o.type="sine";o.frequency.value=760;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.055);
 o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.06);
}
function playChime(){try{const a=chime.cloneNode(true);a.volume=1;a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function playApplause(){
 const ac=getAudio();if(!ac)return;
 for(let i=0;i<16;i++){const start=ac.currentTime+i*.045,buf=ac.createBuffer(1,ac.sampleRate*.07,ac.sampleRate),d=buf.getChannelData(0);
  for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=buf;f.type="bandpass";f.frequency.value=900+Math.random()*1200;
  g.gain.setValueAtTime(.04,start);g.gain.exponentialRampToValueAtTime(.001,start+.07);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(start);s.stop(start+.07);
 }
}
function confetti(){
 const c=["#ffad35","#e7516a","#2cb36b","#55a9ff","#ffd24a","#b455b5"];
 for(let i=0;i<50;i++){const p=document.createElement("div");p.className="confetti";p.style.left=Math.random()*100+"vw";p.style.background=c[Math.floor(Math.random()*c.length)];p.style.animationDelay=Math.random()*.3+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),2200)}
}
function chooseVoice(){
 if(!("speechSynthesis" in window))return null;const vs=speechSynthesis.getVoices(),en=vs.filter(v=>/^en-US/i.test(v.lang||""));
 const names=["Jenny","Aria","Samantha","Zira","Ava","Emma","Michelle","Google US English"];
 for(const n of names){const v=en.find(x=>(x.name||"").toLowerCase().includes(n.toLowerCase()));if(v)return v}
 return en[0]||vs.find(v=>/^en/i.test(v.lang||""))||vs[0]||null;
}
function speak(text,done){
 if(!("speechSynthesis" in window)){if(done)done();return}speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;u.pitch=1.12;u.volume=1;const v=chooseVoice();if(v)u.voice=v;
 if(done){u.onend=done;u.onerror=done}speechSynthesis.speak(u);
}
function saveProgress(score){
 const payload={pageId:CONFIG.pageId,file:CONFIG.file,level:CONFIG.level,week:CONFIG.week,type:"lesson",activityType:"tracing",score,completed:score>=85,
 stars:score>=85?3:score>=55?2:score>0?1:0,skills:{surfaces:1,faces:1,tracing:1,listening:1},savedAt:new Date().toISOString(),ts:Date.now()};
 try{const store=JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS")||"{}");store[payload.pageId]=payload;localStorage.setItem("GP_EIS_ACTIVITY_RESULTS",JSON.stringify(store));localStorage.setItem("GP_EIS_LAST_FILE",payload.file)}catch(e){}
}
function clearAll(){
 speechSynthesis?.cancel();tctx.clearRect(0,0,trace.width,trace.height);targets.forEach(t=>t.samples.forEach(s=>s.hit=false));
 Object.keys(completed).forEach(k=>completed[k]=false);celebrated=false;starsEl.textContent="";setStatus("Cleared. Trace 0, 5 and 6 again.");update();
}
function startDraw(e){e.preventDefault();getAudio();drawing=true;lastPoint=canvasPoint(e);markHits(lastPoint,lastPoint);playTick();try{trace.setPointerCapture(e.pointerId)}catch(x){}}
function moveDraw(e){if(!drawing||!lastPoint)return;e.preventDefault();const p=canvasPoint(e);drawStroke(lastPoint,p);markHits(lastPoint,p);lastPoint=p;playTick()}
function stopDraw(e){drawing=false;lastPoint=null;try{trace.releasePointerCapture(e.pointerId)}catch(x){}}
trace.addEventListener("pointerdown",startDraw);trace.addEventListener("pointermove",moveDraw);trace.addEventListener("pointerup",stopDraw);trace.addEventListener("pointercancel",stopDraw);

document.getElementById("readBtn").onclick=()=>{
 setStatus("Reading the Surfaces poster.");
 speak("Surfaces. Week four. Count and write the number of faces. A sphere has zero faces. A triangular prism has five faces. A cube has six faces.",()=>setStatus("Now trace the dotted numbers 0, 5 and 6."));
};
document.getElementById("startBtn").onclick=()=>{
 setStatus("Trace directly over the dotted 0, then 5, then 6.");
 speak("Start tracing. Trace number zero for the sphere. Trace number five for the triangular prism. Then trace number six for the cube.");
};
document.getElementById("clearBtn").onclick=clearAll;
document.getElementById("cheerBtn").onclick=()=>{playChime();playApplause();confetti();setStatus("Wonderful effort! Keep tracing carefully.");speak("Wonderful effort! Keep tracing carefully.")};
document.getElementById("prevBtn").onclick=()=>location.href=CONFIG.prevHref;
document.getElementById("nextBtn").onclick=()=>location.href=CONFIG.nextHref;
document.addEventListener("pointerdown",()=>{getAudio();try{chime.load()}catch(e){}},{once:true});
window.addEventListener("resize",()=>setTimeout(setupCanvas,120));
window.addEventListener("beforeunload",()=>speechSynthesis?.cancel());
if(posterImg.complete)setupCanvas();else posterImg.addEventListener("load",setupCanvas,{once:true});
setTimeout(()=>speak("Hello superstar! Welcome to Surfaces, Week four. Trace the dotted number zero, five and six. Follow each dotted number carefully. Your tracing progress bar will move as you trace.",()=>setStatus("Trace 0 for the sphere, 5 for the triangular prism, and 6 for the cube.")),650);
})();
</script>
</body>
</html>
