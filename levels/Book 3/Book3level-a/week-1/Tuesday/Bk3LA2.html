<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LA Spheres - 3D Shapes</title>
<style>
  :root{
    --ink:#25242a;
    --bg:#fff8f2;
    --card:#ffffff;
    --pink:#f7b4c2;
    --red:#f34458;
    --cyan:#0798b0;
    --green:#20aa52;
    --orange:#ff8a5b;
    --yellow:#f6da7b;
    --blue:#dfeaff;
    --success:#218c53;
    --danger:#c62828;
    --gold:#ffd24a;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#f4e8d9 1px,transparent 1px),linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
    background-size:26px 26px;
  }
  img{max-width:100%;height:auto;display:block;}
  .app{position:relative;width:min(980px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px;}
  .home-btn{
    position:absolute;right:12px;top:8px;z-index:30;
    min-width:70px;height:52px;border:none;border-radius:999px;background:#fff;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
    color:var(--red);font-weight:1000;font-size:1.65rem;box-shadow:0 7px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.12);
    transform-origin:top center;animation:homeSwing 2.4s ease-in-out infinite;
  }
  @keyframes homeSwing{0%,100%{transform:translateY(14%) rotate(-5deg);}50%{transform:translateY(14%) rotate(7deg);}}
  .page-title{margin:0 76px 8px 0;text-align:center;font-size:clamp(1.65rem,4vw,2.8rem);font-weight:1000;color:var(--red);text-shadow:0 2px 0 #fff;}
  .poster-card{
    position:relative;width:min(904px,100%);margin:0 auto;border-radius:18px;overflow:hidden;
    background:#f7b4c2;box-shadow:0 8px 20px rgba(0,0,0,.10);touch-action:none;
  }
  .poster-image{width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .focus-zone{
    position:absolute;pointer-events:none;z-index:8;border-radius:999px;opacity:0;transform:scale(.96);
    transition:opacity .18s ease,transform .18s ease;
  }
  .focus-zone.show{opacity:1;transform:scale(1);outline:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 6px rgba(255,215,0,.30),0 0 20px rgba(255,105,180,.48);}
  .focus-zone.sparkle{opacity:1;transform:scale(1.035);background:rgba(255,238,120,.20);outline:5px solid rgba(255,214,0,.88);box-shadow:0 0 14px rgba(255,214,0,.95),0 0 28px rgba(255,105,180,.70);animation:sparklePulse .9s ease-in-out infinite;}
  @keyframes sparklePulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.22);}}
  .focus-bubble-1{left:28.8%;top:25.0%;width:24.0%;height:11.0%;}
  .focus-bubble-2{left:48.3%;top:33.0%;width:29.0%;height:11.4%;}
  .focus-sphere{left:28.0%;top:51.5%;width:44.5%;height:31.5%;}
  .focus-sentence{left:27.5%;top:84.4%;width:46.5%;height:8.8%;}
  .lesson-panel{
    width:min(904px,100%);margin:12px auto 0;border:3px solid rgba(243,68,88,.25);border-radius:18px;
    background:linear-gradient(180deg,#fff,#fff7fb);padding:12px;display:grid;gap:10px;
  }
  .progress-wrap{display:grid;justify-items:center;gap:6px;}
  .progress-text{font-size:clamp(.95rem,2vw,1.08rem);font-weight:1000;color:#6c4bbf;text-align:center;}
  .progress-bar{width:min(520px,92%);height:16px;background:#e7efff;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#f34458,#ffd24a,#7dffb3);transition:width .18s ease-out;}
  .conversation-panel{display:grid;gap:10px;}
  .convo-line{display:none;align-items:flex-start;gap:8px;}
  .convo-line.show{display:flex;}
  .convo-line.right{justify-content:flex-end;}
  .convo-line.center{justify-content:center;}
  .bubble-stack{display:flex;flex-direction:column;gap:6px;max-width:min(100%,560px);}
  .convo-line.right .bubble-stack{align-items:flex-end;}
  .convo-line.center .bubble-stack{align-items:center;}
  .bubble{
    position:relative;padding:12px 16px;border-radius:20px;font-size:clamp(1rem,2.3vw,1.32rem);font-weight:1000;line-height:1.25;
    box-shadow:0 8px 16px rgba(0,0,0,.12);background:#fff;text-align:center;
  }
  .bubble.girl{border:3px solid #f06b77;}
  .bubble.boy{border:3px solid #069db4;}
  .bubble.sentence{border:3px solid #f34458;}
  .bubble.sparkle{background:linear-gradient(120deg,#fff2a8,#ffd1f0,#c7f1ff);box-shadow:0 0 12px rgba(255,214,0,.75),0 0 20px rgba(255,105,180,.55);animation:sparklePulse .95s ease-in-out infinite;}
  .repeat-result{min-height:1.2em;font-size:clamp(1rem,2.4vw,1.35rem);line-height:1.2;font-weight:1000;color:var(--success);}
  .try-message{min-height:1.2em;font-size:clamp(.95rem,2.3vw,1.15rem);line-height:1.2;font-weight:1000;}
  .star-row{min-height:1.15em;display:flex;gap:6px;color:var(--gold);font-size:clamp(1.35rem,3.4vw,2rem);line-height:1;text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;width:100%;}
  .btn,.mic-icon-btn{min-height:46px;min-width:46px;border:none;border-radius:999px;cursor:pointer;font-weight:1000;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .12s ease,filter .12s ease;}
  .btn:hover,.mic-icon-btn:hover{transform:translateY(-1px);filter:brightness(1.04);}
  .btn:active,.mic-icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .btn{padding:10px 16px;font-size:.95rem;}
  .btn.prev{background:#f8f0c7;color:#9c7b2f;}
  .btn.next{background:var(--yellow);color:#8b5a00;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.read{background:var(--orange);color:#fff;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .btn.teacher{display:none;background:#e7fbff;color:#06768a;border:2px solid #89ddea;}
  .btn.teacher.show{display:inline-flex;align-items:center;}
  .mic-icon-btn{position:relative;background:radial-gradient(circle at 35% 24%,#fff,#dff1ff);padding:4px;width:64px;height:64px;display:inline-flex;align-items:center;justify-content:center;}
  .mic-icon-btn img{width:54px;height:54px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));}
  .mic-icon-btn.is-busy{opacity:.72;pointer-events:none;transform:scale(.97);}
  .finger-cue{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:1.8rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));animation:fingerBob 1s ease-in-out infinite;display:none;pointer-events:none;}
  .finger-cue.show{display:block;}
  @keyframes fingerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}
  .status-wrap{display:grid;gap:6px;}
  .conversation-status,.listen-status{min-height:1.25em;text-align:center;font-weight:1000;}
  .conversation-status{color:#6c4bbf;font-size:clamp(.95rem,2.5vw,1.1rem);}
  .listen-status{color:#555;font-size:.92rem;}
  .footer-note{text-align:center;color:#666;font-size:.92rem;font-weight:800;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.75s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media (max-width:560px){body{padding:6px;}.app{border-radius:14px;padding:8px;}.page-title{font-size:1.35rem;margin-right:64px;}.home-btn{min-width:58px;height:46px;font-size:1.35rem;}.lesson-panel{padding:10px;}.controls{gap:8px;}.btn{font-size:.84rem;padding:9px 12px;}.mic-icon-btn{width:58px;height:58px;}}
</style>
</head>

<script>
(function(){
  "use strict";

  const CONFIG = window.__PAGE_CONFIG__ || {};
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const teacherBtn = document.getElementById("teacherBtn");
  const micBtn = document.getElementById("micIconBtn");
  const micFinger = document.getElementById("micFinger");
  const chimeAudio = document.getElementById("chimeAudio");
  const conversationStatus = document.getElementById("conversationStatus");
  const listenStatus = document.getElementById("listenStatus");
  const progressPercent = document.getElementById("progressPercent");
  const progressFill = document.getElementById("progressFill");
  const focusSphere = document.getElementById("focusSphere");

  const lineEls = Array.from(document.querySelectorAll(".convo-line"));
  const bubbleEls = lineEls.map(line => line.querySelector(".bubble"));
  const resultEls = lineEls.map(line => line.querySelector(".repeat-result"));
  const tryMessageEls = lineEls.map(line => line.querySelector(".try-message"));
  const starEls = lineEls.map(line => line.querySelector(".star-row"));
  const focusEls = [document.getElementById("focus0"), document.getElementById("focus1"), document.getElementById("focus2")];
  const micLines = Array.isArray(CONFIG.micLines) ? CONFIG.micLines : [];

  let audioCtx = null;
  let recognition = null;
  let recognizing = false;
  let recognitionToken = 0;

  const state = {
    index:0,
    phase:"reveal",
    attempts:new Array(micLines.length).fill(0),
    stars:new Array(micLines.length).fill(0),
    busy:false,
    done:false
  };

  function setStatus(text){ conversationStatus.textContent = text || ""; }
  function setListen(text, color){ listenStatus.textContent = text || ""; listenStatus.style.color = color || ""; }
  function setBusy(value){ state.busy = !!value; micBtn.classList.toggle("is-busy", state.busy); }
  function setMicFinger(show){ micFinger.classList.toggle("show", !!show); }

  function getAudioCtx(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){ audioCtx = null; }
    return audioCtx;
  }

  function tone(freq, dur, type="sine", gain=.045){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(() => {
        tone(880,.12,"sine",.055);
        setTimeout(() => tone(1175,.16,"sine",.05), 120);
      });
    }catch(_){
      tone(880,.12,"sine",.055);
      setTimeout(() => tone(1175,.16,"sine",.05), 120);
    }
  }

  function clap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    for(let i=0;i<3;i++){
      const buffer = ctx.createBuffer(1, ctx.sampleRate * .09, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1) * Math.pow(1 - j/data.length, 2.2);
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      gain.gain.value = .07;
      src.buffer = buffer;
      src.connect(gain).connect(ctx.destination);
      src.start(ctx.currentTime + i*.12);
    }
  }

  function confetti(){
    const colors = ["#ff4d6d","#ffd24a","#31b7ff","#83e79f","#b86bff","#ff9f1c"];
    for(let i=0;i<38;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*.3) + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2300);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|daniel|thomas|alex|mark|paul|brian|steve|kevin|eric|christopher/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text, after){
    if(!text || !("speechSynthesis" in window)){ if(typeof after === "function") setTimeout(after, 150); return; }
    try{ window.speechSynthesis.cancel(); }catch(_){}
    setBusy(true);
    const utter = new SpeechSynthesisUtterance(String(text));
    utter.lang = "en-US";
    utter.rate = .86;
    utter.pitch = 1.18;
    utter.volume = 1;
    const voice = pickVoice();
    if(voice) utter.voice = voice;
    utter.onend = () => { setBusy(false); if(typeof after === "function") after(); };
    utter.onerror = () => { setBusy(false); if(typeof after === "function") after(); };
    window.speechSynthesis.speak(utter);
  }

  function stopSpeaking(){
    try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(_){}
    setBusy(false);
  }

  function clearHighlights(){
    bubbleEls.forEach(b => b && b.classList.remove("sparkle"));
    focusEls.forEach(f => f && f.classList.remove("show","sparkle"));
    if(focusSphere) focusSphere.classList.remove("show","sparkle");
  }

  function showLine(index){
    const line = lineEls[index];
    if(line) line.classList.add("show");
  }

  function highlightLine(index, sparkle){
    clearHighlights();
    const bubble = bubbleEls[index];
    const focus = focusEls[index];
    if(bubble) bubble.classList.toggle("sparkle", !!sparkle);
    if(focus){ focus.classList.add("show"); focus.classList.toggle("sparkle", !!sparkle); }
    if(index === 2 && focusSphere){ focusSphere.classList.add("show"); focusSphere.classList.toggle("sparkle", !!sparkle); }
  }

  function setResult(index, text, color){
    const el = resultEls[index];
    if(!el) return;
    el.textContent = text || "";
    el.style.color = color || "";
  }

  function setTryMessage(index, text, color){
    const el = tryMessageEls[index];
    if(!el) return;
    el.textContent = text || "";
    el.style.color = color || "";
  }

  function setStars(index, count){
    const el = starEls[index];
    if(!el) return;
    el.textContent = count > 0 ? "⭐".repeat(count) : "";
  }

  function updateProgress(){
    const earned = state.stars.filter(n => n > 0).length;
    const pct = Math.round((earned / micLines.length) * 100);
    progressPercent.textContent = pct + "%";
    progressFill.style.width = pct + "%";
    saveProgress(pct, pct >= 100);
  }

  const stopWords = new Set(["a","an","the","is","are","am","to","of","for","on","in","at","my","your","his","her","our","their","do","does","did","i","you","he","she","it","we","they","its","it's"]);
  function normalize(str){ return String(str || "").toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim(); }
  function wordsOf(str){ return normalize(str).split(" ").filter(Boolean); }
  function scoreSpeech(expected, said){
    const expectedWords = wordsOf(expected);
    const saidWords = new Set(wordsOf(said));
    const keyWords = expectedWords.filter(w => !stopWords.has(w));
    const basis = keyWords.length ? keyWords : expectedWords;
    if(!basis.length) return 0;
    let hits = 0;
    basis.forEach(w => {
      if(saidWords.has(w)) hits++;
      else if(w === "choco" && (saidWords.has("chocolate") || saidWords.has("cocoa"))) hits++;
      else if(w === "yum" && saidWords.has("yummy")) hits++;
      else if(w === "sphere" && (saidWords.has("spear") || saidWords.has("fear"))) hits++;
    });
    return hits / basis.length;
  }

  function makeRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;
    const rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.continuous = false;
    return rec;
  }

  function startListeningFor(index){
    const expected = micLines[index];
    if(!expected) return;
    recognition = makeRecognition();
    if(!recognition){
      teacherBtn.classList.add("show");
      setListen("Speech recognition is not available here. Let the child repeat aloud, then tap Teacher heard it.", "#06768a");
      setStatus("Say it aloud: " + expected);
      return;
    }
    recognizing = true;
    const token = ++recognitionToken;
    setListen("🎙️ Listening now. Please say: “" + expected + "”", "#6c4bbf");
    setStatus("Speak now. I am listening.");
    teacherBtn.classList.remove("show");

    recognition.onresult = evt => {
      if(token !== recognitionToken) return;
      recognizing = false;
      let said = "";
      try{ said = Array.from(evt.results[0]).map(r => r.transcript).join(" "); }catch(_){ said = ""; }
      const score = scoreSpeech(expected, said);
      if(score >= .5){
        markLineCorrect(index, said);
      } else {
        state.attempts[index] += 1;
        setResult(index, "", "");
        setTryMessage(index, "Sorry, try again! I heard: “" + (said || "nothing yet") + "”", "#c62828");
        setListen("Tap the microphone and try again.", "#c62828");
        setStatus("Sorry, try again. You can do it!");
        speak("Sorry, try again. You can do it!");
        state.phase = "repeat";
      }
    };
    recognition.onerror = () => {
      if(token !== recognitionToken) return;
      recognizing = false;
      setListen("I could not hear clearly. Tap the microphone and try again.", "#c62828");
      setStatus("Sorry, try again!");
      speak("Sorry, try again!");
      state.phase = "repeat";
    };
    recognition.onend = () => { recognizing = false; };
    try{ recognition.start(); }catch(_){
      recognizing = false;
      setListen("Microphone could not start. Please allow microphone permission and try again.", "#c62828");
    }
  }

  function markLineCorrect(index, said){
    state.stars[index] = 1;
    setStars(index, 1);
    setResult(index, micLines[index], "#218c53");
    setTryMessage(index, said ? "Great! I heard: “" + said + "”" : "Great speaking!", "#218c53");
    setListen("Wonderful!", "#218c53");
    playChime();
    updateProgress();
    const praise = CONFIG.completionRemarks[Math.floor(Math.random() * CONFIG.completionRemarks.length)] || "Great job!";
    speak(praise, () => {
      if(index + 1 < micLines.length){
        state.index = index + 1;
        state.phase = "reveal";
        setTimeout(() => revealCurrentLine(true), 550);
      } else {
        completeLesson();
      }
    });
  }

  function completeLesson(){
    state.done = true;
    state.phase = "done";
    clearHighlights();
    if(focusSphere) focusSphere.classList.add("show","sparkle");
    setMicFinger(false);
    setStatus("Excellent! A sphere is round like a choco ball.");
    setListen("Lesson complete!", "#218c53");
    playChime();
    clap();
    confetti();
    speak("Excellent! A sphere is round like a choco ball. You are a superstar!");
    saveProgress(100, true);
  }

  function revealCurrentLine(auto){
    const index = state.index;
    const text = micLines[index];
    if(!text) return;
    stopSpeaking();
    showLine(index);
    highlightLine(index, false);
    setTryMessage(index, "", "");
    setResult(index, "", "");
    setStatus(auto ? "Listen carefully. Then tap the microphone to repeat." : "Listen carefully.");
    setListen("", "");
    state.phase = "repeat";
    setMicFinger(true);
    speak(text, () => {
      setStatus("Tap the microphone again. Then repeat after me.");
    });
  }

  function promptRepeatAndListen(){
    const index = state.index;
    const text = micLines[index];
    if(!text) return;
    stopSpeaking();
    showLine(index);
    highlightLine(index, true);
    state.phase = "listening";
    setMicFinger(false);
    setStatus("Repeat after me.");
    speak("Repeat after me. " + text, () => {
      startListeningFor(index);
    });
  }

  function handleMicClick(){
    getAudioCtx();
    if(state.busy) return;
    if(recognizing){ try{ recognition && recognition.stop(); }catch(_){} return; }
    if(state.done){
      playChime();
      speak("Great job! You already finished the sphere lesson.");
      return;
    }
    if(state.phase === "reveal") revealCurrentLine(false);
    else promptRepeatAndListen();
  }

  function readPoster(){
    getAudioCtx();
    clearHighlights();
    if(focusSphere) focusSphere.classList.add("show","sparkle");
    setStatus("Listen to the poster.");
    speak(CONFIG.posterSpeech || "Spheres. It is a sphere.", () => {
      setStatus("Tap the microphone to practice the speech bubbles.");
      setMicFinger(true);
    });
  }

  function cheer(){
    getAudioCtx();
    playChime();
    clap();
    confetti();
    setStatus("You can do it! Spheres are round like balls!");
    speak("You can do it! Spheres are round like balls!");
  }

  function clearLesson(){
    stopSpeaking();
    try{ recognition && recognition.stop(); }catch(_){}
    recognizing = false;
    state.index = 0;
    state.phase = "reveal";
    state.done = false;
    state.attempts.fill(0);
    state.stars.fill(0);
    lineEls.forEach(line => line.classList.remove("show"));
    resultEls.forEach(el => { el.textContent = ""; el.style.color = ""; });
    tryMessageEls.forEach(el => { el.textContent = ""; el.style.color = ""; });
    starEls.forEach(el => el.textContent = "");
    teacherBtn.classList.remove("show");
    clearHighlights();
    progressPercent.textContent = "0%";
    progressFill.style.width = "0%";
    setListen("", "");
    setStatus("Tap the microphone to begin.");
    setMicFinger(true);
    saveProgress(0, false);
  }

  function teacherApproved(){
    if(state.phase !== "listening" && state.phase !== "repeat") return;
    markLineCorrect(state.index, "teacher checked");
  }

  function saveProgress(score, completed){
    const payload = {
      pageId: CONFIG.pageId || "Bk2_Spheres_Lesson",
      file: "Bk2_Spheres_Lesson.html",
      level: CONFIG.level || "A",
      type: "speaking",
      activityType: "lesson",
      score: Math.round(score),
      speaking: Math.round(score),
      completed: !!completed,
      stars: score >= 100 ? 3 : score >= 67 ? 2 : score >= 34 ? 1 : 0,
      skills: {reading:1, listening:2, speaking: completed ? 3 : (score > 0 ? 1 : 0)},
      savedAt: new Date().toISOString(),
      ts: Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
  }

  let navBusy = false;
  function fastNavigate(url){
    if(navBusy || !url) return;
    navBusy = true;
    stopSpeaking();
    try{ recognition && recognition.stop(); }catch(_){}
    window.location.href = url;
  }

  homeBtn.href = CONFIG.homeHref || homeBtn.href;
  homeBtn.addEventListener("click", event => {
    event.preventDefault();
    fastNavigate(CONFIG.homeHref || homeBtn.href);
  });
  prevBtn.addEventListener("click", event => {
    event.preventDefault();
    fastNavigate(CONFIG.prevHref || "javascript:history.back()");
  });
  nextBtn.addEventListener("click", event => {
    event.preventDefault();
    fastNavigate(CONFIG.nextHref || "#");
  });
  readBtn.addEventListener("click", readPoster);
  clearBtn.addEventListener("click", clearLesson);
  cheerBtn.addEventListener("click", cheer);
  teacherBtn.addEventListener("click", teacherApproved);
  micBtn.addEventListener("click", handleMicClick);
  document.getElementById("posterCard").addEventListener("click", () => { if(!state.done) readPoster(); });

  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { stopSpeaking(); try{ recognition && recognition.stop(); }catch(_){} });
  window.addEventListener("load", () => {
    clearLesson();
    setTimeout(() => {
      setStatus("Listen to the instructions.");
      speak(CONFIG.introSpeech, () => { setStatus("Tap the microphone to hear the first bubble."); setMicFinger(true); });
    }, 650);
  }, {once:true});
})();
</script>
</body>
</html>
