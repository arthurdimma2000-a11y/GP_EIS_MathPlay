<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Numbers Week 1 - More Sphere-Shaped Chocolate Balls</title>
<style>
  :root{
    --bg:#fff7f1;
    --card:#ffffff;
    --ink:#2d2d2d;
    --red:#f04d5d;
    --pink:#fff7fb;
    --blue:#52b5e8;
    --green:#2f9f5f;
    --gold:#ffd24a;
    --purple:#6c4bbf;
    --shadow:0 14px 30px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);max-width:100%;overflow-x:hidden;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#f3dfd7 1px,transparent 1px),linear-gradient(90deg,#f3dfd7 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{width:min(990px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 14px;position:relative;}
  .top-title{text-align:center;font-size:clamp(1.2rem,3vw,2rem);font-weight:1000;color:var(--red);margin:0 0 10px;text-shadow:0 2px 0 #fff;}
  .poster-wrap{position:relative;width:min(920px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;touch-action:none;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .trace-layer,.sparkle-layer{position:absolute;inset:0;width:100%;height:100%;background:transparent;touch-action:none;}
  .sparkle-layer{z-index:4;pointer-events:none;}
  .trace-layer{z-index:6;cursor:crosshair;}
  .hotspot{position:absolute;z-index:7;border:0;background:rgba(255,255,255,0.001);cursor:pointer;border-radius:24px;}
  .hotspot:focus-visible{outline:4px solid rgba(255,210,50,.85);}
  .girl-hotspot{left:30.0%;top:84.0%;width:13.2%;height:5.4%;}
  .boy-hotspot{left:43.0%;top:84.0%;width:15.0%;height:5.4%;}
  .girl-ball-hotspot{left:14.5%;top:59.5%;width:31.0%;height:24.0%;border-radius:50%;}
  .boy-balls-hotspot{left:54.0%;top:39.0%;width:36.0%;height:45.0%;border-radius:40%;}
  .panel{width:min(920px,100%);margin:12px auto 0;background:linear-gradient(180deg,#fff,#fff7fb);border:3px solid rgba(240,77,93,.22);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.07);}
  .progress-title{text-align:center;font-size:clamp(1rem,2.6vw,1.28rem);font-weight:1000;color:#4b3960;margin-bottom:8px;}
  .progress-bar{height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#31b7ff,#83e79f);transition:width .12s ease-out;}
  .challenge{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px;}
  .choice-card{border:3px solid #e8edf8;background:#fff;border-radius:16px;padding:10px;text-align:center;font-weight:1000;box-shadow:0 6px 12px rgba(0,0,0,.06);cursor:pointer;transition:transform .12s ease,filter .12s ease,border-color .12s ease;}
  .choice-card:hover{transform:translateY(-2px);filter:brightness(1.03);}
  .choice-card.correct{border-color:#2f9f5f;background:#effff4;color:#126c36;}
  .choice-card.wrong{border-color:#f04d5d;background:#fff0f4;color:#a61b2b;animation:shake .32s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .stars{text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{min-height:1.45em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);}
  .buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s ease,filter .1s ease;}
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5d;color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;line-height:1.35;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .challenge{grid-template-columns:1fr;}
    .btn{font-size:.85rem;padding:9px 12px;}
  }
</style>
</head>

  const chimeAudio = document.getElementById("chimeAudio");

  const girlChoice = document.getElementById("girlChoice");
  const boyChoice = document.getElementById("boyChoice");
  const posterGirl = document.getElementById("posterGirl");
  const posterBoy = document.getElementById("posterBoy");
  const posterOneBall = document.getElementById("posterOneBall");
  const posterTwoBalls = document.getElementById("posterTwoBalls");

  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");

  let dpr = 1, sx = 1, sy = 1;
  let drawing = false;
  let lastPoint = null;
  let currentStroke = null;
  let audioCtx = null;
  let lastTick = 0;
  let completed = false;
  let halfCheered = false;
  let answerCorrect = false;

  const strokes = [];
  const samples = [];

  const targetEllipse = {
    // This follows the original orange circle around the word “boy” on the poster.
    cx: 486,
    cy: 1150,
    rx: 76,
    ry: 38
  };

  function setStatus(text){ statusEl.textContent = text || ""; }

  function buildSamples(){
    samples.length = 0;
    for(let i=0;i<180;i++){
      const a = (Math.PI * 2 * i) / 180;
      samples.push({
        x: targetEllipse.cx + Math.cos(a) * targetEllipse.rx,
        y: targetEllipse.cy + Math.sin(a) * targetEllipse.ry,
        hit:false
      });
    }
  }

  function resizeCanvases(){
    const rect = posterWrap.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    [traceLayer, sparkleLayer].forEach(canvas => {
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
    });
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;
    redraw();
  }

  function clearCanvas(c, canvas){
    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,canvas.width,canvas.height);
  }

  function drawSparkleGuide(){
    clearCanvas(sctx, sparkleLayer);
    sctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);

    sctx.save();
    sctx.beginPath();
    sctx.ellipse(targetEllipse.cx, targetEllipse.cy, targetEllipse.rx, targetEllipse.ry, 0, 0, Math.PI*2);
    sctx.lineWidth = completed ? 12 : 8;
    sctx.strokeStyle = completed ? "rgba(47,159,95,.70)" : "rgba(255,210,50,.42)";
    sctx.shadowColor = completed ? "rgba(47,159,95,.65)" : "rgba(255,210,50,.75)";
    sctx.shadowBlur = completed ? 16 : 10;
    sctx.stroke();
    sctx.restore();

    if(completed){
      sctx.save();
      sctx.font = "900 36px Comic Sans MS, Arial";
      sctx.fillStyle = "#2f9f5f";
      sctx.textAlign = "center";
      sctx.textBaseline = "middle";
      sctx.shadowColor = "rgba(255,255,255,.95)";
      sctx.shadowBlur = 8;
      sctx.fillText("✓", targetEllipse.cx + targetEllipse.rx + 28, targetEllipse.cy - 4);
      sctx.restore();
    }

    sctx.setTransform(1,0,0,1,0,0);
  }

  function drawStrokes(){
    clearCanvas(ctx, traceLayer);
    ctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    strokes.forEach(stroke => drawStroke(stroke.points));
    if(currentStroke) drawStroke(currentStroke.points);
    ctx.setTransform(1,0,0,1,0,0);
  }

  function drawStroke(points){
    if(!points || points.length < 2) return;
    ctx.strokeStyle = "rgba(47,159,95,.92)";
    ctx.lineWidth = 16;
    ctx.shadowColor = "rgba(255,255,255,.95)";
    ctx.shadowBlur = 2;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255,.72)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function redraw(){
    drawSparkleGuide();
    drawStrokes();
  }

  function getPoint(evt){
    const rect = traceLayer.getBoundingClientRect();
    const clientX = evt.clientX ?? (evt.touches && evt.touches[0] && evt.touches[0].clientX) ?? 0;
    const clientY = evt.clientY ?? (evt.touches && evt.touches[0] && evt.touches[0].clientY) ?? 0;
    return { x:(clientX - rect.left) / sx, y:(clientY - rect.top) / sy };
  }

  function dist(a,b){
    const dx = a.x-b.x, dy = a.y-b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function nearEllipse(p, extra){
    const nx = (p.x - targetEllipse.cx) / targetEllipse.rx;
    const ny = (p.y - targetEllipse.cy) / targetEllipse.ry;
    const value = Math.sqrt(nx*nx + ny*ny);
    return Math.abs(value - 1) <= extra;
  }

  function markSamples(p){
    let changed = false;
    if(!nearEllipse(p, .65)) return;
    for(const s of samples){
      if(!s.hit && dist(p,s) <= 34){
        s.hit = true;
        changed = true;
      }
    }
    if(changed) updateProgress();
  }

  function updateProgress(){
    const hit = samples.filter(s => s.hit).length;
    const raw = samples.length ? hit / samples.length : 0;
    const percent = Math.min(100, Math.round((raw / .72) * 100));

    overallText.textContent = percent + "%";
    overallFill.style.width = percent + "%";
    starsEl.textContent = percent >= 95 ? "⭐ ⭐ ⭐" : percent >= 65 ? "⭐ ⭐" : percent >= 35 ? "⭐" : "";

    if(percent >= 50 && !halfCheered){
      halfCheered = true;
      playChime();
      speak(shortPraise());
    }

    if(percent >= 100 && !completed){
      completed = true;
      setStatus("Excellent! You circled the correct answer: boy.");
      playChime();
      clap();
      confetti();
      speak("Excellent! You circled boy. The boy has more sphere-shaped chocolate balls.");
      boyChoice.classList.add("correct");
      answerCorrect = true;
      saveProgress(100,true);
      redraw();
    } else {
      if(percent > 0 && percent < 100) setStatus("Good tracing! Keep following the circle around boy.");
      saveProgress(percent, percent >= 100);
    }
  }

  function pointerDown(evt){
    evt.preventDefault();
    unlockAudio();
    const p = getPoint(evt);
    if(!nearEllipse(p, .95)){
      setStatus("Start on the orange circle around the word boy.");
      return;
    }
    drawing = true;
    lastPoint = p;
    currentStroke = {points:[p]};
    markSamples(p);
    traceLayer.setPointerCapture?.(evt.pointerId);
  }

  function pointerMove(evt){
    if(!drawing || !currentStroke) return;
    evt.preventDefault();
    const p = getPoint(evt);
    if(lastPoint && dist(p,lastPoint) < 2) return;
    currentStroke.points.push(p);
    lastPoint = p;
    markSamples(p);
    playTick();
    drawStrokes();
  }

  function pointerUp(evt){
    if(!drawing) return;
    evt.preventDefault();
    drawing = false;
    if(currentStroke && currentStroke.points.length > 1) strokes.push(currentStroke);
    currentStroke = null;
    lastPoint = null;
    drawStrokes();
    updateProgress();
  }

  function chooseAnswer(which){
    unlockAudio();
    girlChoice.classList.remove("correct","wrong");
    boyChoice.classList.remove("correct","wrong");

    if(which === "boy"){
      answerCorrect = true;
      boyChoice.classList.add("correct");
      completed = completed || false;
      setStatus("Correct! The boy has two choco balls. Two is more than one.");
      playChime();
      clap();
      confetti();
      speak("Correct! The boy has two choco balls. Two is more than one.");
      if(Number((overallText.textContent || "0").replace("%","")) < 100){
        // Give a small reward for the correct tap, but still keep the tracing activity active.
        samples.forEach((s,i) => { if(i % 3 === 0) s.hit = true; });
        updateProgress();
      }
    } else {
      answerCorrect = false;
      girlChoice.classList.add("wrong");
      setStatus("Try again. The girl has one choco ball. Who has two?");
      tone(190,.16,"sawtooth",.035);
      speak("Oops, try again. The girl has one choco ball. Look for the child with two choco balls.");
      window.setTimeout(() => girlChoice.classList.remove("wrong"), 700);
    }
  }

  function shortPraise(){
    const list = ["Great job!", "Nice circle tracing!", "Wonderful tracing!", "Keep going, superstar!", "You are doing so well!"];
    return list[Math.floor(Math.random() * list.length)];
  }

  function unlockAudio(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){
      audioCtx = null;
    }
  }

  function tone(freq, dur, type="sine", gain=.045){
    unlockAudio();
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function playTick(){
    const now = Date.now();
    if(now - lastTick < 55) return;
    lastTick = now;
    tone(620, .035, "triangle", .018);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(() => {
        tone(880,.12,"sine",.055);
        setTimeout(() => tone(1175,.16,"sine",.05), 120);
      });
    }catch(_){
      tone(880,.12,"sine",.055);
      setTimeout(() => tone(1175,.16,"sine",.05), 120);
    }
  }

  function clap(){
    unlockAudio();
    if(!audioCtx) return;
    for(let i=0;i<3;i++){
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * .09, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1) * Math.pow(1 - j/data.length, 2.2);
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      gain.gain.value = .07;
      src.buffer = buffer;
      src.connect(gain).connect(audioCtx.destination);
      src.start(audioCtx.currentTime + i*.12);
    }
  }

  function confetti(){
    const colors = ["#ff4d6d","#ffd24a","#31b7ff","#83e79f","#b86bff","#ff9f1c"];
    for(let i=0;i<42;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*.3) + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2200);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text, after){
    if(!text || !("speechSynthesis" in window)){
      if(typeof after === "function") after();
      return;
    }
    try{ window.speechSynthesis.cancel(); }catch(_ ){}
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = .88;
    u.pitch = 1.16;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    if(typeof after === "function") u.onend = after;
    window.speechSynthesis.speak(u);
  }

  function stopSpeaking(){
    try{ window.speechSynthesis.cancel(); }catch(_ ){}
  }

  function readInstructions(){
    unlockAudio();
    setStatus("Circle the correct answer: who has more sphere-shaped chocolate balls?");
    speak("Welcome! Look at the choco balls. The girl has one choco ball. The boy has two choco balls. Two is more than one. Trace the circle around boy, then tap boy as the correct answer.");
  }

  function clearAll(){
    completed = false;
    halfCheered = false;
    answerCorrect = false;
    strokes.length = 0;
    currentStroke = null;
    drawing = false;
    samples.forEach(s => s.hit = false);
    girlChoice.classList.remove("correct","wrong");
    boyChoice.classList.remove("correct","wrong");
    overallText.textContent = "0%";
    overallFill.style.width = "0%";
    starsEl.textContent = "";
    setStatus("Trace the circle around “boy,” then tap the correct answer.");
    redraw();
    saveProgress(0,false);
  }

  function saveProgress(score, done){
    const payload = {
      pageId:CONFIG.pageId,
      file:CONFIG.pageId + ".html",
      level:"A",
      week:1,
      type:"numbers",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!done,
      stars:score >= 95 ? 3 : score >= 65 ? 2 : score >= 35 ? 1 : 0,
      skills:{reading:1,writing:score >= 95 ? 3 : score > 0 ? 1 : 0,listening:1,speaking:0},
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_ ){}
    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(() => {});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(() => {});
    }catch(_ ){}
  }

  let navBusy = false;
  function fastNavigate(url){
    if(navBusy || !url) return;
    navBusy = true;
    stopSpeaking();
    window.location.href = url;
  }

  buildSamples();

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);

  girlChoice.addEventListener("click", () => chooseAnswer("girl"));
  boyChoice.addEventListener("click", () => chooseAnswer("boy"));
  posterGirl.addEventListener("click", () => chooseAnswer("girl"));
  posterBoy.addEventListener("click", () => chooseAnswer("boy"));
  posterOneBall.addEventListener("click", () => chooseAnswer("girl"));
  posterTwoBalls.addEventListener("click", () => chooseAnswer("boy"));

  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", () => { clearAll(); speak("Cleared. Start again."); });
  cheerBtn.addEventListener("click", () => { unlockAudio(); playChime(); clap(); confetti(); setStatus("You can do it! Great job!"); speak("You can do it! Great job!"); });
  homeBtn.addEventListener("click", event => { event.preventDefault(); fastNavigate(CONFIG.homeHref); });
  prevBtn.addEventListener("click", event => { event.preventDefault(); fastNavigate(CONFIG.prevHref); });
  nextBtn.addEventListener("click", event => { event.preventDefault(); fastNavigate(CONFIG.nextHref); });

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", stopSpeaking);

  function init(){
    resizeCanvases();
    clearAll();
    setTimeout(readInstructions, 650);
  }

  if(posterImg.complete) init();
  else posterImg.addEventListener("load", init, {once:true});
})();
</script>
</body>
</html>
