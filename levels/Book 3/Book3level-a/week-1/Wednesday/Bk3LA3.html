<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2 Week 1 - Spheres Tracing Lesson</title>
<style>
  :root{
    --ink:#2d2d2d;
    --bg:#fff9f1;
    --card:#ffffff;
    --accent:#f2475b;
    --pink:#f5a3c6;
    --blue:#19a9e8;
    --green:#13a856;
    --gold:#ffd24a;
    --soft:#fff7fb;
    --shadow:0 18px 38px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);}
  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:10px;
    overflow-x:hidden;
    background-image:linear-gradient(#f4e8d9 1px,transparent 1px),linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
    background-size:28px 28px;
  }
  .lesson-card{
    width:min(980px,100%);
    background:var(--card);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:10px 10px 16px;
  }
  .poster-wrap{
    position:relative;
    width:min(900px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#f6b6c1;
    touch-action:none;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .guide-layer,.trace-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:transparent;
  }
  .guide-layer{z-index:6;pointer-events:none;}
  .trace-layer{z-index:7;touch-action:none;cursor:crosshair;}
  .controls-panel{
    margin:12px auto 0;
    width:min(900px,100%);
    background:linear-gradient(180deg,#fff,#fff7fb);
    border:3px solid rgba(242,71,91,.25);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
  }
  .progress-title{
    font-size:clamp(1rem,2.6vw,1.35rem);
    font-weight:1000;
    text-align:center;
    color:#f2475b;
    margin-bottom:7px;
  }
  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-bar{
    flex:1;
    height:18px;
    background:#e7efff;
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#31b7ff,#84efab);
    border-radius:999px;
    transition:width .12s ease-out;
  }
  .progress-percent{
    min-width:58px;
    text-align:right;
    font-weight:1000;
    color:#175ca8;
    font-size:1.1rem;
  }
  .sphere-progress-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:9px;
  }
  .mini-progress{
    background:#fff;
    border:2px solid #ffe0ea;
    border-radius:14px;
    padding:8px 10px;
    text-align:center;
    font-weight:1000;
    color:#444;
  }
  .mini-progress span{color:#f2475b;}
  .mini-progress.done{
    background:#effff4;
    border-color:#6be39d;
    color:#126c36;
  }
  .status{
    min-height:1.45em;
    text-align:center;
    font-weight:1000;
    color:#6c4bbf;
    font-size:clamp(.95rem,2.5vw,1.15rem);
    margin-top:8px;
  }
  .facts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
  }
  .fact{
    background:#fff;
    border:2px solid #ffd0db;
    border-radius:16px;
    padding:10px;
    text-align:center;
    font-weight:1000;
    color:#333;
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .fact b{color:#f2475b;}
  .star-row{
    min-height:1.1em;
    text-align:center;
    font-size:clamp(1.4rem,4vw,2.2rem);
    letter-spacing:5px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
  }
  .button-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  button,.nav-link{
    border:none;
    border-radius:999px;
    padding:10px 16px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.16);
    transition:transform .1s ease,filter .1s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  button:hover,.nav-link:hover{filter:brightness(1.04);}
  button:active,.nav-link:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn-home{background:#fff0f4;color:#f2475b;border:2px solid #ffd0db;}
  .btn-prev,.btn-next{background:#ff8a5b;color:#fff;}
  .btn-clear{background:#dfeaff;color:#1f3b6b;}
  .btn-read{background:#f6da7b;color:#8b5a00;}
  .btn-cheer{background:#c9f2d6;color:#166c38;}
  .footer-note{margin-top:8px;text-align:center;color:#666;font-weight:800;font-size:.9rem;}
  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.8s linear forwards;
  }
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:720px){
    body{padding:6px;}
    .lesson-card{border-radius:16px;padding:6px 6px 12px;}
    .controls-panel{padding:10px;border-radius:14px;}
    .sphere-progress-grid{grid-template-columns:repeat(2,1fr);}
    .facts{grid-template-columns:1fr;}
    button,.nav-link{font-size:.85rem;padding:9px 12px;}
    .progress-row{gap:6px;}
  }
</style>
</head>

  const sphereGrid = document.getElementById("sphereGrid");
  const statusText = document.getElementById("statusText");
  const stars = document.getElementById("stars");
  const clearBtn = document.getElementById("clearBtn");
  const readBtn = document.getElementById("readBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const chimeAudio = document.getElementById("chimeAudio");

  let sx = 1, sy = 1, dpr = 1;
  let drawing = false;
  let lastPoint = null;
  let currentStroke = null;
  let activeTarget = null;
  let finalCelebrated = false;
  let audioCtx = null;
  let lastTick = 0;
  const strokes = [];

  const targets = [
    { id:"white", label:"White sphere", cx:263, cy:547, rx:158, ry:154, start:Math.PI },
    { id:"choco", label:"Choco sphere", cx:682, cy:544, rx:153, ry:153, start:Math.PI },
    { id:"pink", label:"Pink sphere", cx:276, cy:970, rx:157, ry:151, start:Math.PI },
    { id:"soccer", label:"Soccer sphere", cx:681, cy:968, rx:143, ry:145, start:Math.PI }
  ];

  function setStatus(text){
    statusText.textContent = text || "";
  }

  function buildTargets(){
    targets.forEach((t, index) => {
      t.samples = [];
      const total = 96;
      for(let i=0;i<total;i++){
        const a = t.start + (Math.PI * 2 * i / total);
        t.samples.push({x:t.cx + Math.cos(a) * t.rx, y:t.cy + Math.sin(a) * t.ry, hit:false});
      }
      t.percent = 0;
      t.complete = false;

      const item = document.createElement("div");
      item.className = "mini-progress";
      item.id = "mini-" + t.id;
      item.innerHTML = `${index + 1}. ${t.label}: <span id="pct-${t.id}">0%</span>`;
      sphereGrid.appendChild(item);
      t.boxEl = item;
      t.pctEl = item.querySelector("span");
    });
  }

  function resizeCanvases(){
    const rect = posterWrap.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;
    [guideLayer, traceLayer].forEach(canvas => {
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
    });
    redrawAll();
  }

  function clearCanvas(ctx, canvas){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  function drawEllipsePath(ctx, t){
    ctx.beginPath();
    ctx.ellipse(t.cx, t.cy, t.rx, t.ry, 0, 0, Math.PI * 2);
  }

  function drawGuide(){
    clearCanvas(gctx, guideLayer);
    gctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    gctx.lineCap = "round";
    gctx.lineJoin = "round";

    targets.forEach((t, index) => {
      if(t === activeTarget && !t.complete){
        gctx.save();
        drawEllipsePath(gctx, t);
        gctx.strokeStyle = "rgba(255, 210, 0, .92)";
        gctx.lineWidth = 18;
        gctx.shadowColor = "rgba(255, 105, 180, .80)";
        gctx.shadowBlur = 18;
        gctx.stroke();
        gctx.restore();
      }

      gctx.save();
      drawEllipsePath(gctx, t);
      gctx.strokeStyle = t.complete ? "rgba(35, 176, 91, .55)" : "rgba(31, 125, 255, .45)";
      gctx.lineWidth = 8;
      gctx.setLineDash([14, 11]);
      gctx.stroke();
      gctx.restore();

      const start = t.samples[0];
      const end = t.samples[Math.floor(t.samples.length / 2)];
      if(start && end){
        gctx.save();
        gctx.setLineDash([]);
        gctx.fillStyle = "#13a856";
        gctx.strokeStyle = "#ffffff";
        gctx.lineWidth = 3;
        gctx.beginPath();
        gctx.arc(start.x, start.y, 11, 0, Math.PI * 2);
        gctx.fill();
        gctx.stroke();

        gctx.fillStyle = "#f2475b";
        gctx.beginPath();
        gctx.arc(end.x, end.y, 11, 0, Math.PI * 2);
        gctx.fill();
        gctx.stroke();

        gctx.fillStyle = "#ffffff";
        gctx.font = "900 13px Comic Sans MS, Arial";
        gctx.textAlign = "center";
        gctx.textBaseline = "middle";
        gctx.fillText("1", start.x, start.y + 1);
        gctx.fillText("2", end.x, end.y + 1);
        gctx.restore();
      }
    });

    gctx.setTransform(1,0,0,1,0,0);
  }

  function drawStrokes(){
    clearCanvas(tctx, traceLayer);
    tctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    strokes.forEach(stroke => drawStroke(stroke.points, stroke.color));
    if(currentStroke) drawStroke(currentStroke.points, currentStroke.color);
    tctx.setTransform(1,0,0,1,0,0);
  }

  function drawStroke(points, color){
    if(!points || points.length < 2) return;
    tctx.strokeStyle = color || "rgba(31, 125, 255, .92)";
    tctx.lineWidth = 16;
    tctx.shadowColor = "rgba(255,255,255,.85)";
    tctx.shadowBlur = 2;
    tctx.beginPath();
    tctx.moveTo(points[0].x, points[0].y);
    for(let i=1;i<points.length;i++) tctx.lineTo(points[i].x, points[i].y);
    tctx.stroke();
    tctx.shadowBlur = 0;
  }

  function redrawAll(){
    drawGuide();
    drawStrokes();
  }

  function getPoint(evt){
    const rect = traceLayer.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left) / sx,
      y: (evt.clientY - rect.top) / sy
    };
  }

  function dist(a,b){
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function distanceToEllipse(p, t){
    let best = Infinity;
    for(const s of t.samples){
      const d = dist(p, s);
      if(d < best) best = d;
    }
    return best;
  }

  function findNearestTarget(p, radius){
    let best = null;
    let bestD = Infinity;
    for(const t of targets){
      const d = distanceToEllipse(p, t);
      if(d < bestD){
        bestD = d;
        best = t;
      }
    }
    return bestD <= radius ? best : null;
  }

  function markSamples(p){
    let changed = false;
    for(const t of targets){
      const quick = Math.abs(((p.x - t.cx) * (p.x - t.cx)) / (t.rx * t.rx) + ((p.y - t.cy) * (p.y - t.cy)) / (t.ry * t.ry) - 1);
      if(quick > .55) continue;
      for(const s of t.samples){
        if(!s.hit && dist(p, s) <= HIT_RADIUS){
          s.hit = true;
          changed = true;
        }
      }
    }
    if(changed) updateProgress();
  }

  function updateProgress(){
    let total = 0;
    targets.forEach(t => {
      const hits = t.samples.filter(s => s.hit).length;
      const raw = t.samples.length ? hits / t.samples.length : 0;
      const percent = Math.min(100, Math.round((raw / COMPLETE_RATIO) * 100));
      const wasComplete = t.complete;
      t.percent = percent;
      t.complete = percent >= 100;
      total += percent;
      if(t.pctEl) t.pctEl.textContent = percent + "%";
      if(t.boxEl) t.boxEl.classList.toggle("done", t.complete);

      if(!wasComplete && t.complete){
        playChime();
        speak(randomPraise());
        setStatus(`${t.label} is complete. Great job!`);
      }
    });

    const overall = Math.round(total / targets.length);
    progressPercent.textContent = overall + "%";
    progressFill.style.width = overall + "%";
    stars.textContent = overall >= 95 ? "⭐ ⭐ ⭐" : overall >= 70 ? "⭐ ⭐" : overall >= 35 ? "⭐" : "";

    activeTarget = targets.find(t => !t.complete) || null;
    drawGuide();

    if(overall >= 100 && !finalCelebrated){
      finalCelebrated = true;
      setStatus("Excellent! You traced all the sphere outlines!");
      playChime();
      playApplause();
      confetti();
      speak("Excellent! You traced all the sphere outlines. A sphere is a 3D shape. A sphere has zero faces. You are a superstar!");
      saveProgress(100, true);
    } else {
      if(overall > 0 && overall < 100){
        setStatus(`Nice tracing! ${overall} percent complete. Keep going.`);
      }
      saveProgress(overall, overall >= 100);
    }
  }

  function pointerDown(evt){
    evt.preventDefault();
    getAudioCtx();
    const p = getPoint(evt);
    const target = findNearestTarget(p, START_RADIUS);
    if(!target){
      setStatus("Touch close to a sphere outline to start tracing.");
      return;
    }
    drawing = true;
    activeTarget = target;
    lastPoint = p;
    const colors = {
      white:"rgba(31,125,255,.95)",
      choco:"rgba(130,80,45,.95)",
      pink:"rgba(242,71,91,.95)",
      soccer:"rgba(31,168,91,.95)"
    };
    currentStroke = { points:[p], color:colors[target.id] || "rgba(31,125,255,.95)" };
    markSamples(p);
    drawGuide();
    traceLayer.setPointerCapture?.(evt.pointerId);
  }

  function pointerMove(evt){
    if(!drawing || !currentStroke) return;
    evt.preventDefault();
    const p = getPoint(evt);
    if(lastPoint && dist(p, lastPoint) < 2) return;
    currentStroke.points.push(p);
    lastPoint = p;
    markSamples(p);
    playTraceTick();
    drawStrokes();
  }

  function pointerUp(evt){
    if(!drawing) return;
    evt.preventDefault();
    drawing = false;
    if(currentStroke && currentStroke.points.length > 1) strokes.push(currentStroke);
    currentStroke = null;
    lastPoint = null;
    drawStrokes();
    updateProgress();
  }

  function getAudioCtx(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){ audioCtx = null; }
    return audioCtx;
  }

  function tone(freq, dur, type, gainValue){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainValue || .045, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }

  function playTraceTick(){
    const now = Date.now();
    if(now - lastTick < 55) return;
    lastTick = now;
    tone(620, .035, "triangle", .018);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(() => {
        tone(880,.12,"sine",.055);
        setTimeout(() => tone(1175,.16,"sine",.05), 120);
      });
    }catch(_){
      tone(880,.12,"sine",.055);
      setTimeout(() => tone(1175,.16,"sine",.05), 120);
    }
  }

  function playApplause(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    for(let i=0;i<4;i++){
      const buffer = ctx.createBuffer(1, ctx.sampleRate * .09, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1) * Math.pow(1 - j/data.length, 2.2);
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      gain.gain.value = .075;
      src.buffer = buffer;
      src.connect(gain).connect(ctx.destination);
      src.start(ctx.currentTime + i*.12);
    }
  }

  function confetti(){
    const colors = ["#ff4d6d","#ffd24a","#31b7ff","#83e79f","#b86bff","#ff9f1c"];
    for(let i=0;i<42;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * .25 + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2200);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|serena|emma|ivy|grace|luna|nova|stella|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|daniel|thomas|alex|mark|paul|brian|steve|kevin|eric|christopher/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|serena|emma|ivy|grace|luna|nova|stella|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text){
    if(!text || !("speechSynthesis" in window)) return;
    try{ window.speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = .86;
    u.pitch = 1.17;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function randomPraise(){
    const list = [
      "Great tracing!",
      "Wonderful work!",
      "Amazing job!",
      "You are doing so well!",
      "Super tracing!"
    ];
    return list[Math.floor(Math.random() * list.length)];
  }

  function readInstructions(){
    getAudioCtx();
    setStatus("Trace the round sphere outlines. A sphere is a 3D shape with zero faces.");
    speak("Spheres. Week one. Look at the round objects. A sphere is a 3D shape. A sphere has zero faces. Trace around each sphere outline. Start on the glowing guide and follow the round line carefully.");
  }

  function clearAll(){
    drawing = false;
    lastPoint = null;
    currentStroke = null;
    strokes.length = 0;
    finalCelebrated = false;
    targets.forEach(t => {
      t.samples.forEach(s => s.hit = false);
      t.percent = 0;
      t.complete = false;
      if(t.pctEl) t.pctEl.textContent = "0%";
      if(t.boxEl) t.boxEl.classList.remove("done");
    });
    activeTarget = targets[0];
    progressPercent.textContent = "0%";
    progressFill.style.width = "0%";
    stars.textContent = "";
    setStatus("Trace the sphere outlines carefully.");
    redrawAll();
    saveProgress(0, false);
  }

  function saveProgress(score, completed){
    const starsCount = score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0;
    const payload = {
      pageId: PAGE_ID,
      file: PAGE_ID + ".html",
      level: LEVEL,
      week: 1,
      activityType: "sphere-tracing",
      type: "lesson",
      score: Math.round(score),
      tracing: Math.round(score),
      stars: starsCount,
      completed: !!completed,
      skills: {
        reading: 1,
        writing: score >= 70 ? 2 : score > 0 ? 1 : 0,
        speaking: 1,
        listening: 1
      },
      savedAt: new Date().toISOString(),
      ts: Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = {...(store[payload.pageId] || {}), ...payload};
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
    try{
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(() => {});
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(() => {});
    }catch(_){}
  }

  let navBusy = false;
  function fastNavigate(url){
    if(navBusy || !url) return;
    navBusy = true;
    try{ window.speechSynthesis.cancel(); }catch(_){}
    window.location.href = url;
  }

  buildTargets();

  traceLayer.addEventListener("pointerdown", pointerDown, {passive:false});
  traceLayer.addEventListener("pointermove", pointerMove, {passive:false});
  traceLayer.addEventListener("pointerup", pointerUp, {passive:false});
  traceLayer.addEventListener("pointercancel", pointerUp, {passive:false});
  traceLayer.addEventListener("pointerleave", pointerUp, {passive:false});

  clearBtn.addEventListener("click", () => { clearAll(); speak("Cleared. Start tracing again."); });
  readBtn.addEventListener("click", readInstructions);
  cheerBtn.addEventListener("click", () => {
    getAudioCtx();
    playChime();
    playApplause();
    confetti();
    setStatus("You can do it! Spheres are round 3D shapes!");
    speak("You can do it! Spheres are round 3D shapes!");
  });
  prevBtn.addEventListener("click", event => {
    event.preventDefault();
    fastNavigate(prevHref);
  });
  nextBtn.addEventListener("click", event => {
    event.preventDefault();
    fastNavigate(nextHref);
  });

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try{ window.speechSynthesis.cancel(); }catch(_){} });

  posterImg.addEventListener("load", () => {
    resizeCanvases();
    clearAll();
  }, {once:true});

  window.addEventListener("load", () => {
    resizeCanvases();
    clearAll();
    setTimeout(readInstructions, 650);
  }, {once:true});
})();
</script>
</body>
</html>
