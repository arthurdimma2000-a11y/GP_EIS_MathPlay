<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Building Blocks - Compare Blocks</title>
<style>
  :root{
    --ink:#25242a;
    --bg:#fff8f2;
    --card:#ffffff;
    --poster-blue:#5f86cb;
    --red:#ef3f2f;
    --green:#4cbc43;
    --blue:#5669be;
    --yellow:#fff6ad;
    --orange:#ff9956;
    --success:#188845;
    --danger:#c62828;
    --gold:#ffd24a;
    --shadow:0 14px 32px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#f4e8d9 1px,transparent 1px),linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
    background-size:26px 26px;
  }
  img{max-width:100%;height:auto;display:block;}
  .app{position:relative;width:min(980px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px;}
  .topbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;}
  .page-title{margin:0;text-align:center;font-size:clamp(1.65rem,4vw,3rem);font-weight:1000;color:var(--poster-blue);text-shadow:0 3px 0 #fff,0 5px 0 rgba(95,134,203,.18);letter-spacing:.5px;}
  .home-btn{
    position:absolute;right:12px;top:8px;z-index:30;
    min-width:70px;height:52px;border:none;border-radius:999px;background:#fff;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
    color:var(--red);font-weight:1000;font-size:1.65rem;box-shadow:0 7px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.12);
    transform-origin:top center;animation:homeSwing 2.4s ease-in-out infinite;
  }
  @keyframes homeSwing{0%,100%{transform:translateY(12%) rotate(-5deg);}50%{transform:translateY(12%) rotate(7deg);}}

  .poster-card{
    position:relative;width:min(904px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,.10);touch-action:manipulation;
  }
  .poster-image{width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .focus-zone{
    position:absolute;pointer-events:none;z-index:8;border-radius:26px;opacity:0;transform:scale(.96);
    transition:opacity .18s ease,transform .18s ease;
  }
  .focus-zone.show{opacity:1;transform:scale(1);outline:4px solid rgba(255,255,255,.98);box-shadow:0 0 0 6px rgba(255,215,0,.32),0 0 24px rgba(255,105,180,.48);}
  .focus-zone.sparkle{opacity:1;transform:scale(1.035);background:rgba(255,238,120,.18);outline:5px solid rgba(255,214,0,.9);box-shadow:0 0 14px rgba(255,214,0,.95),0 0 28px rgba(255,105,180,.70);animation:sparklePulse .9s ease-in-out infinite;}
  @keyframes sparklePulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.22);}}
  .focus-red-bubble{left:5.5%;top:51.7%;width:29.7%;height:10.2%;border-radius:999px;}
  .focus-green-bubble{left:37.5%;top:48.6%;width:28%;height:10.4%;border-radius:999px;}
  .focus-blue-bubble{left:67.0%;top:49.2%;width:29.3%;height:10.4%;border-radius:999px;}
  .focus-bottom-sentence{left:15.0%;top:88.0%;width:72.0%;height:7.6%;border-radius:999px;}
  .focus-red-block{left:23.0%;top:38.2%;width:16.2%;height:9.1%;border-radius:10px;}
  .focus-green-block{left:40.2%;top:39.7%;width:15.3%;height:8.1%;border-radius:10px;}
  .focus-blue-block{left:56.2%;top:39.4%;width:20.2%;height:9.6%;border-radius:10px;}

  .lesson-panel{
    width:min(904px,100%);margin:12px auto 0;border:3px solid rgba(95,134,203,.30);border-radius:18px;
    background:linear-gradient(180deg,#ffffff,#f6fbff);padding:12px;display:grid;gap:10px;
  }
  .mini-title{margin:0;text-align:center;font-size:clamp(1.05rem,2.5vw,1.35rem);font-weight:1000;color:#3e5fa8;}
  .progress-wrap{display:grid;justify-items:center;gap:6px;}
  .progress-text{font-size:clamp(.95rem,2vw,1.08rem);font-weight:1000;color:#6c4bbf;text-align:center;}
  .progress-bar{width:min(560px,92%);height:16px;background:#e7efff;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#ef3f2f,#4cbc43,#5669be,#ffd24a);transition:width .22s ease-out;}

  .conversation-panel{display:grid;gap:10px;}
  .convo-line{display:none;align-items:flex-start;gap:8px;}
  .convo-line.show{display:flex;}
  .convo-line.right{justify-content:flex-end;}
  .convo-line.center{justify-content:center;}
  .speaker-icon{width:45px;height:45px;object-fit:contain;flex:0 0 45px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18));background:#fff;border-radius:999px;padding:5px;border:2px solid #d7e5ff;}
  .bubble-stack{display:flex;flex-direction:column;gap:6px;max-width:min(100%,620px);}
  .convo-line.right .bubble-stack{align-items:flex-end;}
  .convo-line.center .bubble-stack{align-items:center;}
  .bubble{
    position:relative;padding:12px 16px;border-radius:22px;font-size:clamp(1rem,2.3vw,1.35rem);font-weight:1000;line-height:1.25;
    box-shadow:0 8px 16px rgba(0,0,0,.12);background:#fff;text-align:center;
  }
  .bubble.red{border:4px solid var(--red);color:#333;}
  .bubble.green{border:4px solid var(--green);color:#333;}
  .bubble.blue{border:4px solid var(--blue);color:#333;}
  .bubble.sentence{border:4px solid var(--poster-blue);color:#333;}
  .word-red{color:var(--red);}
  .word-green{color:var(--green);}
  .word-blue{color:var(--blue);}
  .bubble.sparkle{background:linear-gradient(120deg,#fff8b5,#ffdff1,#dce9ff);box-shadow:0 0 12px rgba(255,214,0,.75),0 0 20px rgba(95,134,203,.45);animation:sparklePulse .95s ease-in-out infinite;}
  .repeat-result{min-height:1.2em;font-size:clamp(1rem,2.4vw,1.35rem);line-height:1.2;font-weight:1000;color:var(--success);}
  .try-message{min-height:1.2em;font-size:clamp(.95rem,2.3vw,1.15rem);line-height:1.2;font-weight:1000;}
  .star-row{min-height:1.15em;display:flex;gap:6px;color:var(--gold);font-size:clamp(1.35rem,3.4vw,2rem);line-height:1;text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}

  .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;width:100%;}
  .btn,.mic-icon-btn{min-height:46px;min-width:46px;border:none;border-radius:999px;cursor:pointer;font-weight:1000;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .12s ease,filter .12s ease;}
  .btn:hover,.mic-icon-btn:hover{transform:translateY(-1px);filter:brightness(1.04);}
  .btn:active,.mic-icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .btn{padding:10px 16px;font-size:.95rem;}
  .btn.prev{background:#f8f0c7;color:#9c7b2f;}
  .btn.next{background:#ffe17a;color:#8b5a00;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.read{background:var(--orange);color:#fff;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .btn.teacher{display:none;background:#e7fbff;color:#06768a;border:2px solid #89ddea;}
  .btn.teacher.show{display:inline-flex;align-items:center;}
  .mic-icon-btn{position:relative;background:radial-gradient(circle at 35% 24%,#fff,#dff1ff);padding:4px;width:68px;height:68px;display:inline-flex;align-items:center;justify-content:center;}
  .mic-icon-btn img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));}
  .mic-icon-btn.is-busy{opacity:.72;pointer-events:none;transform:scale(.97);}
  .finger-cue{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:1.8rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));animation:fingerBob 1s ease-in-out infinite;display:none;pointer-events:none;}
  .finger-cue.show{display:block;}
  @keyframes fingerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}
  .status-wrap{display:grid;gap:6px;}
  .conversation-status,.listen-status{min-height:1.25em;text-align:center;font-weight:1000;}
  .conversation-status{color:#6c4bbf;font-size:clamp(.95rem,2.5vw,1.1rem);}
  .listen-status{color:#555;font-size:.92rem;}
  .footer-note{text-align:center;color:#666;font-size:.92rem;font-weight:800;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.75s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media (max-width:560px){
    body{padding:6px;}.app{border-radius:14px;padding:8px;}.page-title{font-size:1.45rem;margin-right:64px;}.home-btn{min-width:58px;height:46px;font-size:1.35rem;}
    .lesson-panel{padding:10px;}.controls{gap:8px;}.btn{font-size:.84rem;padding:9px 12px;}.mic-icon-btn{width:60px;height:60px;}.mic-icon-btn img{width:50px;height:50px;}.speaker-icon{width:38px;height:38px;flex-basis:38px;}
  }
</style>
</head>

  completionRemarks: ["Wonderful comparing!", "Great speaking!", "You are a building blocks superstar!", "Amazing work!"],
  successSpeech: ["Great job!", "Excellent!", "Wonderful speaking!", "Fantastic!"],
  failSpeech: "Sorry, try again. Listen carefully and repeat after me."
};
</script>

<script>
(function(){
  "use strict";

  const CONFIG = window.__PAGE_CONFIG__ || {};
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const teacherBtn = document.getElementById("teacherBtn");
  const micBtn = document.getElementById("micIconBtn");
  const micFinger = document.getElementById("micFinger");
  const chimeAudio = document.getElementById("chimeAudio");
  const conversationStatus = document.getElementById("conversationStatus");
  const listenStatus = document.getElementById("listenStatus");
  const progressPercent = document.getElementById("progressPercent");
  const progressFill = document.getElementById("progressFill");

  const lineEls = Array.from(document.querySelectorAll(".convo-line"));
  const bubbleEls = lineEls.map(line => line.querySelector(".bubble"));
  const resultEls = lineEls.map(line => line.querySelector(".repeat-result"));
  const tryMessageEls = lineEls.map(line => line.querySelector(".try-message"));
  const starEls = lineEls.map(line => line.querySelector(".star-row"));
  const focusEls = [document.getElementById("focus0"), document.getElementById("focus1"), document.getElementById("focus2"), document.getElementById("focus3")];
  const blockFocusEls = [document.getElementById("blockFocus0"), document.getElementById("blockFocus1"), document.getElementById("blockFocus2")];
  const micLines = Array.isArray(CONFIG.micLines) ? CONFIG.micLines : [];

  let audioCtx = null;
  let recognition = null;
  let recognizing = false;
  let recognitionToken = 0;

  const state = {
    index: 0,
    phase: "listenFirst",
    attempts: new Array(micLines.length).fill(0),
    stars: new Array(micLines.length).fill(0),
    busy: false,
    done: false
  };

  function setStatus(text){ conversationStatus.textContent = text || ""; }
  function setListen(text, color){ listenStatus.textContent = text || ""; listenStatus.style.color = color || ""; }
  function setBusy(value){ state.busy = !!value; micBtn.classList.toggle("is-busy", state.busy); }
  function setMicFinger(show){ micFinger.classList.toggle("show", !!show); }

  function getAudioCtx(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){ audioCtx = null; }
    return audioCtx;
  }

  function tone(freq, dur, type="sine", gain=.045){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(() => { tone(784,.12); setTimeout(() => tone(988,.14),120); setTimeout(() => tone(1319,.18),255); });
    }catch(_){ tone(784,.12); setTimeout(() => tone(988,.14),120); setTimeout(() => tone(1319,.18),255); }
  }

  function chooseVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    const preferred = voices.find(v => /en-US/i.test(v.lang) && /female|samantha|zira|jenny|aria|natural|google us english/i.test(v.name));
    return preferred || voices.find(v => /en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
  }

  function stopSpeaking(){ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }

  function speak(text, onEnd, opts={}){
    stopSpeaking();
    if(!("speechSynthesis" in window)){ if(typeof onEnd === "function") setTimeout(onEnd, 250); return; }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = opts.rate || 0.82;
    utter.pitch = opts.pitch || 1.15;
    utter.volume = opts.volume || 1;
    const v = chooseVoice();
    if(v) utter.voice = v;
    utter.onend = () => { if(typeof onEnd === "function") onEnd(); };
    utter.onerror = () => { if(typeof onEnd === "function") onEnd(); };
    window.speechSynthesis.speak(utter);
  }

  function confetti(amount=42){
    const colors = ["#ef3f2f", "#4cbc43", "#5669be", "#ffd24a", "#ff9956", "#8ad7ff"];
    for(let i=0;i<amount;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*0.35) + "s";
      piece.style.transform = `rotate(${Math.random()*160}deg)`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2100);
    }
  }

  function normalize(text){
    return (text || "").toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  }

  function scoreSpeech(target, heard){
    const tWords = normalize(target).split(" ").filter(Boolean);
    const h = normalize(heard);
    if(!tWords.length || !h) return 0;
    let hits = 0;
    tWords.forEach(w => { if(h.includes(w)) hits++; });
    return hits / tWords.length;
  }

  function showFocus(index, sparkle=false){
    focusEls.forEach((el,i) => {
      if(!el) return;
      el.classList.toggle("show", i === index && !sparkle);
      el.classList.toggle("sparkle", i === index && sparkle);
    });
    blockFocusEls.forEach((el,i) => {
      if(!el) return;
      const active = index === i;
      el.classList.toggle("show", active && !sparkle);
      el.classList.toggle("sparkle", active && sparkle);
    });
  }

  function clearFocus(){
    focusEls.concat(blockFocusEls).forEach(el => el && el.classList.remove("show", "sparkle"));
  }

  function updateProgress(){
    const total = micLines.length || 1;
    const completed = state.stars.filter(Boolean).length;
    const pct = Math.round((completed / total) * 100);
    progressPercent.textContent = pct + "%";
    progressFill.style.width = pct + "%";
    saveProgress(pct, pct >= 100);
  }

  function revealLine(index){
    lineEls.forEach((line,i) => line.classList.toggle("show", i <= index));
    bubbleEls.forEach((b,i) => b && b.classList.toggle("sparkle", i === index));
    tryMessageEls.forEach(el => el.textContent = "");
    resultEls.forEach((el,i) => { if(!state.stars[i]) el.textContent = ""; });
    showFocus(index, true);
    lineEls[Math.min(index,lineEls.length-1)]?.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  function setStars(index, count){
    const el = starEls[index];
    if(!el) return;
    el.textContent = "⭐".repeat(Math.max(1, count));
  }

  function lineSuccess(index, heardText){
    const stars = state.attempts[index] <= 1 ? 3 : state.attempts[index] === 2 ? 2 : 1;
    state.stars[index] = stars;
    resultEls[index].textContent = "I heard: “" + (heardText || micLines[index]) + "”";
    tryMessageEls[index].textContent = "Great!";
    tryMessageEls[index].style.color = "#188845";
    setStars(index, stars);
    playChime();
    confetti(22);
    updateProgress();
    showFocus(index, true);
    const praise = CONFIG.successSpeech[index % CONFIG.successSpeech.length] || "Great job!";
    speak(praise, () => {
      bubbleEls[index]?.classList.remove("sparkle");
      if(index >= micLines.length - 1){
        completeLesson();
      }else{
        state.index = index + 1;
        state.phase = "listenFirst";
        revealLine(state.index);
        setStatus("Tap the microphone to hear the next bubble.");
        setListen("Next: listen first, then repeat.");
        setMicFinger(true);
      }
    }, {rate:.88, pitch:1.18});
  }

  function lineTryAgain(index, heardText){
    tryMessageEls[index].textContent = heardText ? "Sorry, try again. I heard: “" + heardText + "”" : "Sorry, try again.";
    tryMessageEls[index].style.color = "#c62828";
    resultEls[index].textContent = "";
    showFocus(index, true);
    if(state.attempts[index] >= 2) teacherBtn.classList.add("show");
    speak(CONFIG.failSpeech || "Sorry, try again.", () => {
      state.phase = "listenFirst";
      setStatus("Tap the microphone to listen again.");
      setListen("Then tap the microphone again and say the sentence.");
      setMicFinger(true);
    }, {rate:.82, pitch:1.1});
  }

  function readCurrentLine(){
    if(state.done) return;
    const index = state.index;
    revealLine(index);
    setBusy(true);
    setMicFinger(false);
    setStatus("Listen carefully.");
    setListen("Sentence: " + micLines[index]);
    speak(micLines[index], () => {
      setBusy(false);
      state.phase = "speakNow";
      setStatus("Now tap the microphone again and repeat it.");
      setListen("Say: “" + micLines[index] + "”");
      setMicFinger(true);
    });
  }

  function getRecognition(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return null;
    if(!recognition){
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.maxAlternatives = 3;
    }
    return recognition;
  }

  function startListening(){
    if(state.done) return;
    const index = state.index;
    const rec = getRecognition();
    state.attempts[index] += 1;
    setMicFinger(false);
    setStatus("I am listening. Say the sentence now.");
    setListen("Speak loudly and clearly.", "#3e5fa8");
    tone(660,.08);

    if(!rec){
      setStatus("Speech microphone is not supported in this browser. Teacher Check is available.");
      teacherBtn.classList.add("show");
      setListen("Use Chrome or Edge for microphone speech recognition.", "#c62828");
      return;
    }

    recognizing = true;
    setBusy(true);
    const token = ++recognitionToken;
    let heard = "";

    rec.onresult = (event) => {
      const results = Array.from(event.results[0] || []);
      heard = results.map(r => r.transcript).join(" ").trim();
    };
    rec.onerror = () => {
      if(token !== recognitionToken) return;
      recognizing = false;
      setBusy(false);
      lineTryAgain(index, heard);
    };
    rec.onend = () => {
      if(token !== recognitionToken) return;
      recognizing = false;
      setBusy(false);
      const sc = scoreSpeech(micLines[index], heard);
      if(sc >= 0.50) lineSuccess(index, heard);
      else lineTryAgain(index, heard);
    };
    try{ rec.start(); }catch(_){
      recognizing = false;
      setBusy(false);
      setTimeout(() => startListening(), 250);
    }
  }

  function handleMicClick(){
    getAudioCtx();
    if(state.busy) return;
    if(recognizing){ try{ recognition && recognition.stop(); }catch(_){} return; }
    if(state.done){ cheer(); return; }
    if(state.phase === "listenFirst") readCurrentLine();
    else startListening();
  }

  function readPoster(){
    getAudioCtx();
    setMicFinger(false);
    setBusy(true);
    clearFocus();
    setStatus("Reading the poster.");
    setListen("Look at the blocks while you listen.");
    speak(CONFIG.posterSpeech, () => {
      setBusy(false);
      state.phase = "listenFirst";
      revealLine(state.index);
      setStatus("Tap the microphone to hear the first bubble.");
      setListen("Listen first, then repeat after me.");
      setMicFinger(true);
    }, {rate:.78, pitch:1.12});
  }

  function cheer(){
    getAudioCtx();
    playChime();
    confetti(50);
    const remark = CONFIG.completionRemarks[Math.floor(Math.random()*CONFIG.completionRemarks.length)] || "Great job!";
    setStatus(remark);
    speak(remark, null, {rate:.86, pitch:1.2});
  }

  function completeLesson(){
    state.done = true;
    setMicFinger(false);
    clearFocus();
    focusEls.forEach(el => el && el.classList.add("sparkle"));
    setStatus("Lesson complete! You compared the blocks.");
    setListen("Red is small. Green is smaller. Blue is the smallest.", "#188845");
    updateProgress();
    playChime();
    confetti(72);
    speak("Wonderful job! You compared the blocks. Red is small, green is smaller, and blue is the smallest!", null, {rate:.82, pitch:1.2});
  }

  function teacherApproved(){
    if(state.done) return;
    lineSuccess(state.index, micLines[state.index]);
  }

  function clearLesson(){
    try{ recognition && recognition.stop(); }catch(_){}
    stopSpeaking();
    recognizing = false;
    state.index = 0;
    state.phase = "listenFirst";
    state.done = false;
    state.busy = false;
    state.attempts = new Array(micLines.length).fill(0);
    state.stars = new Array(micLines.length).fill(0);
    lineEls.forEach((line,i) => line.classList.toggle("show", i === 0));
    bubbleEls.forEach(b => b && b.classList.remove("sparkle"));
    resultEls.forEach(el => el.textContent = "");
    tryMessageEls.forEach(el => { el.textContent = ""; el.style.color = ""; });
    starEls.forEach(el => el.textContent = "");
    teacherBtn.classList.remove("show");
    micBtn.classList.remove("is-busy");
    clearFocus();
    updateProgress();
    setStatus("Tap Read Poster, or tap the microphone to begin.");
    setListen("First sentence: The red block is small.");
    setMicFinger(true);
  }

  function saveProgress(score, completed){
    const payload = {
      pageId: CONFIG.pageId || "Building_Blocks_Compare_Lesson",
      file: CONFIG.file || location.pathname.split("/").pop(),
      level: CONFIG.level || "A",
      type: "speaking",
      activityType: "lesson",
      score: Math.round(score),
      speaking: Math.round(score),
      completed: !!completed,
      stars: score >= 100 ? 3 : score >= 67 ? 2 : score >= 34 ? 1 : 0,
      skills: {reading:1, listening:2, speaking: completed ? 3 : (score > 0 ? 1 : 0)},
      savedAt: new Date().toISOString(),
      ts: Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
  }

  homeBtn.href = CONFIG.homeHref || homeBtn.href;
  let navBusy = false;
  function fastNavigate(url){
    if(navBusy || !url) return;
    navBusy = true;
    stopSpeaking();
    try{ recognition && recognition.stop(); }catch(_){}
    window.location.replace(url);
  }
  prevBtn.addEventListener("click", () => { fastNavigate(CONFIG.prevHref || "javascript:history.back()"); });
  nextBtn.addEventListener("click", () => { fastNavigate(CONFIG.nextHref || "#"); });
  readBtn.addEventListener("click", readPoster);
  clearBtn.addEventListener("click", clearLesson);
  cheerBtn.addEventListener("click", cheer);
  teacherBtn.addEventListener("click", teacherApproved);
  micBtn.addEventListener("click", handleMicClick);
  document.getElementById("posterCard").addEventListener("click", () => { if(!state.done) readPoster(); });

  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { stopSpeaking(); try{ recognition && recognition.stop(); }catch(_){} });
  window.addEventListener("load", () => {
    clearLesson();
    setTimeout(() => {
      setStatus("Listen to the instructions.");
      speak(CONFIG.introSpeech, () => {
        setStatus("Tap the microphone to hear the first bubble.");
        setListen("Listen first, then repeat after me.");
        setMicFinger(true);
      }, {rate:.78, pitch:1.15});
    }, 650);
  }, {once:true});
})();
</script>
</body>
</html>
