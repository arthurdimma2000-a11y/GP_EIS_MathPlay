<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk3LC19 • Complements of 10</title>

<style>
*{box-sizing:border-box;}

:root{
  --green:#35ad46;
  --paper:#fffaf2;
  --ink:#27252c;
  --red:#ef2b2b;
  --gold:#ffd24a;
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}

html,body{
  margin:0;
  min-height:100%;
  background:#e7f7e7;
  color:var(--ink);
}

body{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:10px;
}

.app{
  width:min(940px,98vw);
}

.poster-wrap{
  position:relative;
  width:100%;
  margin:0 auto;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 18px 38px rgba(0,0,0,.16);
  background:var(--paper);
}

.poster-img{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* Transparent tracing areas placed exactly over the original dotted numbers on the poster. */
.trace-hit{
  position:absolute;
  z-index:10;
  touch-action:none;
  cursor:crosshair;
  background:transparent;
}

#branch7Canvas{ left:60.8%; top:46.4%; width:7.2%; height:4.8%; }
#sentence7Canvas{ left:79.6%; top:52.7%; width:6.7%; height:4.8%; }
#branch9Canvas{ left:60.8%; top:81.4%; width:7.2%; height:4.8%; }
#sentence9Canvas{ left:79.6%; top:88.3%; width:6.7%; height:4.8%; }

.trace-panel{
  width:100%;
  margin:12px auto 0;
  background:white;
  border:3px solid #bbf7d0;
  border-radius:18px;
  padding:10px 12px;
  box-shadow:0 8px 18px rgba(0,0,0,.10);
}

.progress-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

#progressText{
  color:#14532d;
  font-weight:1000;
  font-size:clamp(1rem,2vw,1.2rem);
}

#starsBox{
  font-size:1.4rem;
  letter-spacing:2px;
  color:var(--gold);
  text-shadow:0 2px 0 #b87900,0 5px 10px rgba(0,0,0,.22);
}

.progress-track{
  height:18px;
  border-radius:999px;
  background:#dbeafe;
  border:2px solid #93c5fd;
  overflow:hidden;
}

#progressFill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#22c55e,#a3e635,#ffd24a);
  transition:width .16s ease;
}

.controls{
  width:100%;
  margin:10px auto 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:999px;
  padding:10px 15px;
  font-family:inherit;
  font-weight:1000;
  cursor:pointer;
  color:white;
  background:#ff8a5b;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
}

.btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16);}
.btn.home{background:#22c55e;}
.btn.clear{background:#3b82f6;}
.btn.sound{background:#7c3aed;}

.status{
  margin-top:8px;
  text-align:center;
  color:#237b35;
  font-weight:1000;
}

.reward{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.85);
  z-index:30;
  pointer-events:none;
  opacity:0;
  background:#fff7ed;
  border:5px solid #22c55e;
  color:#166534;
  border-radius:24px;
  padding:18px 26px;
  font-size:clamp(1.2rem,4vw,2.2rem);
  font-weight:1000;
  box-shadow:0 18px 40px rgba(0,0,0,.24);
  transition:opacity .2s ease,transform .2s ease;
}

.reward.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.reward-star{
  position:absolute;
  z-index:31;
  pointer-events:none;
  font-size:30px;
  animation:flyStar 1.4s ease-out forwards;
}

@keyframes flyStar{
  from{transform:translate(0,0) scale(.5) rotate(0deg);opacity:1;}
  to{transform:translate(var(--x),var(--y)) scale(1.5) rotate(260deg);opacity:0;}
}

@media(max-width:640px){
  body{padding:5px;}
  .btn{padding:8px 11px;font-size:.85rem;}
  #branch7Canvas{ left:60.5%; top:46.1%; width:7.7%; height:5.2%; }
  #sentence7Canvas{ left:79.3%; top:52.5%; width:7.1%; height:5.2%; }
  #branch9Canvas{ left:60.5%; top:81.2%; width:7.7%; height:5.2%; }
  #sentence9Canvas{ left:79.3%; top:88.1%; width:7.1%; height:5.2%; }
}
</style>
</head>

<script>
const PAGE_ID = "Bk3LC19";
const PAGE_FILE = "Bk3LC19.html";
const LEVEL = "C";
const HOME_PAGE = "../../../../../index.html";
const PREVIOUS_PAGE = "Bk3LC15.html";
const NEXT_PAGE = "../Thursday/Bk3Wk3NonfictionC.html";

const traceTargets = [
  { id:"branch7Canvas", digit:"7", label:"top 7", progress:0 },
  { id:"sentence7Canvas", digit:"7", label:"sentence 7", progress:0 },
  { id:"branch9Canvas", digit:"9", label:"bottom 9", progress:0 },
  { id:"sentence9Canvas", digit:"9", label:"sentence 9", progress:0 }
];

const posterWrap = document.getElementById("posterWrap");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");
const starsBox = document.getElementById("starsBox");
const statusText = document.getElementById("statusText");
const reward = document.getElementById("reward");
const homeBtn = document.getElementById("homeBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let rewardShown = false;
let chimePlayed = false;
let audioCtx = null;
let lastTraceSoundTime = 0;

const completionChime = new Audio();
completionChime.preload = "auto";

const chimeSources = [
  "chime.mp3",
  "./chime.mp3",
  "../../../../assets/audio/chime.mp3",
  "../../../../assets/audio/chime.mp3.mp3"
];

let chimeIndex = 0;
completionChime.src = chimeSources[chimeIndex];

completionChime.onerror = function(){
  chimeIndex++;
  if(chimeIndex < chimeSources.length){
    completionChime.src = chimeSources[chimeIndex];
    completionChime.load();
  }
};

function getAudioContext(){
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if(!AudioContextClass) return null;

  if(!audioCtx){
    audioCtx = new AudioContextClass();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume().catch(() => {});
  }

  return audioCtx;
}

function playTraceSound(){
  const now = performance.now();
  if(now - lastTraceSoundTime < 75) return;
  lastTraceSoundTime = now;

  const ctx = getAudioContext();
  if(!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(720, ctx.currentTime);

  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.045, ctx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.075);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.085);
}

function playCheerSound(){
  const ctx = getAudioContext();
  if(!ctx) return;

  const notes = [523.25, 659.25, 783.99, 1046.5];

  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const start = ctx.currentTime + i * 0.07;

    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, start);

    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.055, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + 0.15);
  });
}

function goTo(url){
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  window.location.replace(url);
}

homeBtn.addEventListener("click", () => goTo(HOME_PAGE));
prevBtn.addEventListener("click", () => goTo(PREVIOUS_PAGE));
nextBtn.addEventListener("click", () => goTo(NEXT_PAGE));

function playCompletionChime(){
  completionChime.currentTime = 0;
  completionChime.volume = 1;
  completionChime.play().catch(() => playCheerSound());
}

function resizeCanvas(canvas){
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#ef2b2b";
  ctx.lineWidth = Math.max(4, rect.width * 0.07);
}

function setupTraceTarget(item){
  const canvas = document.getElementById(item.id);
  const ctx = canvas.getContext("2d");

  let drawing = false;
  let touched = new Set();
  let lastPoint = null;

  item.clear = function(){
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    touched.clear();
    item.progress = 0;
  };

  function resize(){
    resizeCanvas(canvas);
  }

  function getPoint(event){
    const rect = canvas.getBoundingClientRect();

    return {
      x:event.clientX - rect.left,
      y:event.clientY - rect.top,
      nx:(event.clientX - rect.left) / rect.width,
      ny:(event.clientY - rect.top) / rect.height
    };
  }

  function markCoverage(point){
    const cols = 9;
    const rows = 11;
    const col = Math.max(0, Math.min(cols - 1, Math.floor(point.nx * cols)));
    const row = Math.max(0, Math.min(rows - 1, Math.floor(point.ny * rows)));

    touched.add(row + ":" + col);
    item.progress = Math.min(100, Math.round((touched.size / 15) * 100));
    updateProgress();
  }

  function markCoverageBetween(a,b){
    const dx = b.nx - a.nx;
    const dy = b.ny - a.ny;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const steps = Math.max(5, Math.ceil(distance * 140));

    for(let i = 0; i <= steps; i++){
      const t = i / steps;
      markCoverage({ nx:a.nx + dx * t, ny:a.ny + dy * t });
    }
  }

  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    getAudioContext();

    drawing = true;
    const p = getPoint(event);
    lastPoint = p;

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    markCoverage(p);
    playTraceSound();

    try{ canvas.setPointerCapture(event.pointerId); }catch(err){}
  });

  canvas.addEventListener("pointermove", (event) => {
    if(!drawing) return;
    event.preventDefault();

    const p = getPoint(event);

    ctx.lineTo(p.x,p.y);
    ctx.strokeStyle = "#ef2b2b";
    ctx.lineWidth = Math.max(4, canvas.getBoundingClientRect().width * 0.07);
    ctx.stroke();

    markCoverageBetween(lastPoint,p);
    lastPoint = p;
    playTraceSound();
  });

  function stop(event){
    drawing = false;
    lastPoint = null;
    saveProgress();

    try{
      if(event && event.pointerId) canvas.releasePointerCapture(event.pointerId);
    }catch(err){}
  }

  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);
  canvas.addEventListener("pointerleave", stop);

  resize();
  window.addEventListener("resize", resize);
}

function getTotalProgress(){
  const total = traceTargets.reduce((sum,item) => sum + item.progress,0);
  return Math.round(total / traceTargets.length);
}

function getStars(percent){
  if(percent >= 90) return 3;
  if(percent >= 60) return 2;
  if(percent >= 30) return 1;
  return 0;
}

function updateProgress(){
  const percent = getTotalProgress();
  const stars = getStars(percent);

  progressText.textContent = "Tracing Progress: " + percent + "%";
  progressFill.style.width = percent + "%";
  starsBox.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);

  saveProgress();

  if(percent > 0 && percent < 100){
    statusText.textContent = "Good! Keep tracing the dotted 7 and 9.";
  }

  if(percent >= 90 && !rewardShown){
    rewardShown = true;
    showReward("Great tracing! ⭐⭐⭐");
    speak("Great tracing! You are almost done.");
  }

  if(percent >= 100 && !chimePlayed){
    chimePlayed = true;
    statusText.textContent = "Excellent! You completed the tracing task.";
    playCompletionChime();
    speak("Excellent! You completed the tracing task.");
  }
}

function showReward(text){
  reward.textContent = text;
  reward.classList.add("show");

  for(let i = 0; i < 16; i++){
    const star = document.createElement("div");
    star.className = "reward-star";
    star.textContent = "⭐";
    star.style.left = "50%";
    star.style.top = "50%";
    star.style.setProperty("--x", `${Math.random() * 340 - 170}px`);
    star.style.setProperty("--y", `${Math.random() * 260 - 200}px`);
    posterWrap.appendChild(star);
    setTimeout(() => star.remove(), 1450);
  }

  setTimeout(() => reward.classList.remove("show"),1700);
}

function clearTrace(){
  traceTargets.forEach(item => {
    if(typeof item.clear === "function") item.clear();
  });

  rewardShown = false;
  chimePlayed = false;
  updateProgress();

  statusText.textContent = "Trace cleared. Try again.";
  speak("Trace cleared. Try again. Trace the dotted seven and nine.");
}

function chooseVoice(){
  if(!("speechSynthesis" in window)) return null;
  const voices = speechSynthesis.getVoices();
  return (
    voices.find(v => /en-US/i.test(v.lang) && /Jenny|Aria|Samantha|Zira|Female|Google US English/i.test(v.name)) ||
    voices.find(v => /en-US/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang)) ||
    null
  );
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  u.pitch = 1.15;
  u.volume = 1;

  const voice = chooseVoice();
  if(voice) u.voice = voice;

  speechSynthesis.speak(u);
}

function playInstruction(){
  getAudioContext();
  const text = "Let us break apart ten. We can break apart ten into three and seven. We can break apart ten into one and nine. Trace the dotted seven and nine numbers.";
  statusText.textContent = "Trace the original dotted 7 and 9 numbers.";
  speak(text);
}

function getStudentSession(){
  try{
    return JSON.parse(localStorage.getItem("GP_EIS_STUDENT_SESSION") || "null");
  }catch(err){
    return null;
  }
}

function saveProgress(){
  const percent = getTotalProgress();
  const stars = getStars(percent);
  const session = getStudentSession() || {};

  const record = {
    pageId:PAGE_ID,
    file:PAGE_FILE,
    title:"Bk3LC19 • Complements of 10",
    level:LEVEL,
    week:3,
    month:1,
    type:"tracing",
    activityType:"tracing",
    score:percent,
    percent:percent,
    tracing:percent,
    stars:stars,
    completed:percent >= 90,
    skills:{
      reading:1,
      writing:percent >= 30 ? 1 : 0,
      speaking:0,
      listening:1
    },
    classId:session.classId || null,
    studentId:session.studentId || null,
    studentName:session.studentName || session.displayName || session.name || session.fullName || null,
    updatedAt:new Date().toISOString(),
    savedAt:new Date().toISOString(),
    ts:Date.now()
  };

  try{
    localStorage.setItem("BK3LC19_TRACE_PROGRESS", JSON.stringify(record));

    const activityProgress = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_PROGRESS") || "{}");
    activityProgress[PAGE_ID] = record;
    localStorage.setItem("GP_EIS_ACTIVITY_PROGRESS", JSON.stringify(activityProgress));

    const activityResults = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
    activityResults[PAGE_ID] = record;
    localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(activityResults));

    const progressReport = JSON.parse(localStorage.getItem("GP_EIS_PROGRESS_REPORT") || "{}");
    progressReport[PAGE_ID] = record;
    localStorage.setItem("GP_EIS_PROGRESS_REPORT", JSON.stringify(progressReport));

    localStorage.setItem("GP_EIS_LAST_FILE", PAGE_FILE);
    window.dispatchEvent(new CustomEvent("gp-eis-progress-updated", { detail:record }));
  }catch(err){
    console.warn("Progress could not be saved:", err);
  }
}

document.getElementById("clearBtn").addEventListener("click", clearTrace);
document.getElementById("instructionBtn").addEventListener("click", playInstruction);

function init(){
  traceTargets.forEach(setupTraceTarget);
  updateProgress();

  if("speechSynthesis" in window){
    speechSynthesis.onvoiceschanged = chooseVoice;
  }

  setTimeout(() => {
    statusText.textContent = "Tap Instruction, then trace the dotted 7 and 9.";
  },300);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
