function safeSpeak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang='en-US'; u.rate=.9; u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function getAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    if(!audioContext) audioContext=new AC();
    if(audioContext.state==='suspended') audioContext.resume().catch(()=>{});
    return audioContext;
  }catch(e){return null;}
}
function beep(freq=720,dur=.07){
  const ac=getAudio(); if(!ac) return;
  const o=ac.createOscillator(); const g=ac.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(.04,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
function chime(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*90));}
function confetti(){

    p.style.left=Math.random()*100+'vw'; p.style.background=colors[Math.floor(Math.random()*colors.length)]; p.style.animationDelay=Math.random()*.25+'s';
    document.body.appendChild(p); setTimeout(()=>p.remove(),2200);
  }
}

function saveProgress(){
  const pct=Math.round((answered.size/TOTAL_QUESTIONS)*100);
  const score=Math.round((correct/TOTAL_QUESTIONS)*100);
  const starCount=score>=90?3:score>=60?2:score>=30?1:0;
  const payload={pageId:PAGE_ID,file:FILE_NAME,level:'C',week:3,type:'quiz',activityType:'quiz',score,percent:pct,correct,totalQuestions:TOTAL_QUESTIONS,completed:pct>=100,stars:starCount,skills:{reading:1,listening:1,counting:1,addition:1,complementsOf10:1},savedAt:new Date().toISOString(),ts:Date.now()};
  try{
    const results=JSON.parse(localStorage.getItem('GP_EIS_ACTIVITY_RESULTS')||'{}');
    results[PAGE_ID]=payload;
    localStorage.setItem('GP_EIS_ACTIVITY_RESULTS',JSON.stringify(results));
    localStorage.setItem('GP_EIS_ACTIVITY_PROGRESS',JSON.stringify({...JSON.parse(localStorage.getItem('GP_EIS_ACTIVITY_PROGRESS')||'{}'),[PAGE_ID]:payload}));
    localStorage.setItem('GP_EIS_LAST_FILE',FILE_NAME);
    localStorage.setItem('gpLatestProgress',JSON.stringify(payload));
    window.dispatchEvent(new CustomEvent('gp-eis-progress-updated',{detail:payload}));
  }catch(e){}
}
function updateHud(){
  const pct=Math.round((answered.size/TOTAL_QUESTIONS)*100);
  const score=Math.round((correct/TOTAL_QUESTIONS)*100);
  qNo.textContent='Question '+(index+1)+' / '+TOTAL_QUESTIONS;
  scoreText.textContent=score;
  correctText.textContent=correct+' / '+TOTAL_QUESTIONS;
  fill.style.width=pct+'%';
  barText.textContent=pct+'%';
  stars.textContent=score>=90?'★ ★ ★':score>=60?'★ ★ ☆':score>=30?'★ ☆ ☆':'☆ ☆ ☆';
  saveProgress();
}
function showQuestion(i=index){
  clearTimeout(autoTimer);
  index=Math.max(0,Math.min(i,TOTAL_QUESTIONS-1));
  locked=false;
  finalBox.classList.remove('show');
  const item=questions[index];
  qNo.textContent='Question '+(index+1)+' / '+TOTAL_QUESTIONS;
  question.textContent=item.q;
  feedback.textContent='Tap the correct answer.';
  options.innerHTML='';
  renderVisual(item.visual);
  item.options.forEach(o=>{
    const b=document.createElement('button');
    b.className='option'; b.type='button'; b.textContent=o[0];
    b.addEventListener('click',()=>answerQuestion(b,o));
    options.appendChild(b);
  });
  updateHud();
  safeSpeak(item.say);
}
function lockQuestion(){ options.querySelectorAll('button').forEach(btn=>{btn.disabled=true;btn.style.pointerEvents='none';}); }
function answerQuestion(button,option){
  if(locked) return;
  const item=questions[index];
  const [text,isCorrect]=option;
  if(isCorrect){
    locked=true;
    button.classList.add('correct');
    if(!answered.has(index)){ answered.add(index); correct++; }
    lockQuestion();
    updateHud();
    chime(); confetti();
    feedback.textContent=item.good+' Moving to the next question...';
    safeSpeak(item.good+' Great job!');
    const finishedIndex=index;
    autoTimer=setTimeout(()=>{
      if(finishedIndex<TOTAL_QUESTIONS-1) showQuestion(finishedIndex+1);
      else finishQuiz();
    },850);
  }else{
    button.classList.add('wrong'); beep(220,.12); feedback.textContent=item.bad; safeSpeak(item.bad);
    setTimeout(()=>button.classList.remove('wrong'),650);
    updateHud();
  }
}
function finishQuiz(){
  index=TOTAL_QUESTIONS-1;
  finalBox.classList.add('show');
  updateHud();
  chime(); confetti();
  const score=Math.round((correct/TOTAL_QUESTIONS)*100);
  feedback.textContent='Quiz complete! Your score is '+score+'%.';
  safeSpeak('Quiz complete! Your score is '+score+' percent. Excellent learning!');
}

document.getElementById('readBtn').addEventListener('click',()=>safeSpeak(questions[index].say));
document.getElementById('cheerBtn').addEventListener('click',()=>{chime();confetti();feedback.textContent='Great job! Keep thinking.';safeSpeak('Great job! Keep thinking.')});
document.getElementById('resetBtn').addEventListener('click',()=>{index=0;correct=0;answered.clear();finalBox.classList.remove('show');showQuestion(0);});
document.getElementById('homeBtn').addEventListener('click',()=>window.location.replace(HOME_PAGE));
document.getElementById('prevBtn').addEventListener('click',()=>window.location.replace(GAME_PAGE));
document.getElementById('nextBtn').addEventListener('click',()=>window.location.replace(NEXT_PAGE));
document.addEventListener('pointerdown',()=>getAudio(),{once:true});
window.addEventListener('beforeunload',()=>{try{speechSynthesis.cancel()}catch(e){}});
showQuestion(0);
</script>
