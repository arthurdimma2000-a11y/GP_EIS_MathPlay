<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Numbers Week 3 - Subtract the Lines</title>

<style>
  :root{
    --ink:#2d2d2d;
    --paper:#fffaf2;
    --blue:#5d86c9;
    --pink:#f04d5f;
    --yellow:#f7df8a;
    --green:#19a85b;
    --purple:#6c4bbf;
    --gold:#ffd24a;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    background:var(--paper);
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#ece2d3 1px,transparent 1px),
      linear-gradient(90deg,#ece2d3 1px,transparent 1px);
    background-size:28px 28px;
  }

  .app{
    width:min(990px,100%);
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:10px 10px 14px;
  }

  .poster-wrap{
    position:relative;
    width:min(920px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
  }

  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .trace-zone{
    position:absolute;
    z-index:8;
    touch-action:none;
    cursor:crosshair;
    background:rgba(255,255,255,0.001);
  }

  .trace-zone canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }

  .trace-zone.is-active{
    outline:none;
    border-radius:18px;
  }

  .trace-zone.done{
    outline:none;
    border-radius:18px;
  }

  /*
    These zones sit exactly over the poster:
    - left/middle green diagonal lines
    - right dotted answers
  */
  .line-r1{left:38.5%;top:26.1%;width:17.5%;height:12.6%;}
  .answer-r1{left:56.0%;top:26.0%;width:32.0%;height:12.8%;}

  .line-r2{left:38.5%;top:39.8%;width:17.5%;height:12.8%;}
  .answer-r2{left:56.0%;top:39.7%;width:32.0%;height:12.9%;}

  .line-r3{left:38.5%;top:53.6%;width:17.5%;height:12.8%;}
  .answer-r3{left:56.0%;top:53.5%;width:32.0%;height:12.9%;}

  .line-r4{left:38.5%;top:67.4%;width:17.5%;height:12.8%;}
  .answer-r4{left:56.0%;top:67.3%;width:32.0%;height:12.9%;}

  .line-r5{left:38.5%;top:81.1%;width:17.5%;height:12.8%;}
  .answer-r5{left:56.0%;top:81.0%;width:32.0%;height:12.9%;}

  .panel{
    width:min(920px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff7fb);
    border:3px solid rgba(93,134,201,.25);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }

  .progress-title{
    text-align:center;
    font-size:clamp(1rem,2.6vw,1.28rem);
    font-weight:1000;
    color:#3f5fa8;
    margin-bottom:8px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .progress-bar{
    flex:1;
    height:18px;
    border-radius:999px;
    background:#e8eef8;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }

  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#31b7ff,#83e79f);
    transition:width .12s ease-out;
  }

  .progress-percent{
    min-width:62px;
    text-align:right;
    font-weight:1000;
    color:#175ca8;
    font-size:1.05rem;
  }

  .mini-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-top:9px;
  }

  .mini{
    background:#fff;
    border:2px solid #e7edf8;
    border-radius:12px;
    text-align:center;
    padding:7px 4px;
    font-weight:1000;
    font-size:.86rem;
    color:#444;
  }

  .mini.done{
    border-color:#62d98c;
    background:#effff4;
    color:#126c36;
  }

  .stars{
    text-align:center;
    min-height:1.25em;
    margin-top:6px;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
  }

  .status{
    min-height:1.45em;
    text-align:center;
    margin-top:7px;
    font-size:clamp(.98rem,2.5vw,1.25rem);
    font-weight:1000;
    color:var(--purple);
  }

  .buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }

  .btn{
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .btn-icon{
    width:22px;
    height:22px;
    object-fit:contain;
    margin-right:8px;
    flex:0 0 auto;
  }

  .btn:hover{
    filter:brightness(1.04);
    transform:translateY(-1px);
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 rgba(0,0,0,.14);
  }

  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5f;color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}

  .note{
    text-align:center;
    font-weight:900;
    color:#666;
    font-size:.9rem;
    margin-top:8px;
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.8s linear forwards;
  }

  @keyframes fall{
    to{transform:translateY(105vh) rotate(540deg);opacity:.1;}
  }

  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .mini-grid{grid-template-columns:repeat(2,1fr);}
    .btn{font-size:.85rem;padding:9px 12px;}
    .progress-row{gap:7px;}
  }
</style>
</head>

<body>
<main class="app" aria-label="Numbers Week 3 subtraction lines lesson">
  <section class="poster-wrap" id="posterWrap" aria-label="Numbers poster. Subtract the lines from the number.">
    <img class="poster-img" id="posterImg" src="/assets/images/Bk2Shapes/NumbersSubtractLinesWeek3.png" alt="Numbers Week 3 poster. Subtract the lines from the number.">

    <div class="trace-zone line-r1" data-id="r1-lines" data-kind="lines" data-row="1" data-count="6" data-direction="up"><canvas></canvas></div>
    <div class="trace-zone answer-r1" data-id="r1-answer" data-kind="answer" data-row="1" data-answer="14"><canvas></canvas></div>

    <div class="trace-zone line-r2" data-id="r2-lines" data-kind="lines" data-row="2" data-count="7" data-direction="down"><canvas></canvas></div>
    <div class="trace-zone answer-r2" data-id="r2-answer" data-kind="answer" data-row="2" data-answer="13"><canvas></canvas></div>

    <div class="trace-zone line-r3" data-id="r3-lines" data-kind="lines" data-row="3" data-count="8" data-direction="up"><canvas></canvas></div>
    <div class="trace-zone answer-r3" data-id="r3-answer" data-kind="answer" data-row="3" data-answer="12"><canvas></canvas></div>

    <div class="trace-zone line-r4" data-id="r4-lines" data-kind="lines" data-row="4" data-count="9" data-direction="down"><canvas></canvas></div>
    <div class="trace-zone answer-r4" data-id="r4-answer" data-kind="answer" data-row="4" data-answer="11"><canvas></canvas></div>

    <div class="trace-zone line-r5" data-id="r5-lines" data-kind="lines" data-row="5" data-count="10" data-direction="up"><canvas></canvas></div>
    <div class="trace-zone answer-r5" data-id="r5-answer" data-kind="answer" data-row="5" data-answer="10"><canvas></canvas></div>
  </section>

  <section class="panel">
    <div class="progress-title">Trace the diagonal lines and trace the answer numbers.</div>

    <div class="progress-row">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>

    <div class="mini-grid">
      <div class="mini" id="row1Mini">20 - 6 = 14<br><span id="row1Text">0%</span></div>
      <div class="mini" id="row2Mini">20 - 7 = 13<br><span id="row2Text">0%</span></div>
      <div class="mini" id="row3Mini">20 - 8 = 12<br><span id="row3Text">0%</span></div>
      <div class="mini" id="row4Mini">20 - 9 = 11<br><span id="row4Text">0%</span></div>
      <div class="mini" id="row5Mini">20 - 10 = 10<br><span id="row5Text">0%</span></div>
    </div>

    <div class="stars" id="stars">☆ ☆ ☆</div>
    <div class="status" id="statusText">Listen, then trace the lines and answers.</div>

    <div class="buttons">
      <button class="btn prev" type="button" id="prevBtn">⬅ Previous</button>
      <button class="btn read" type="button" id="readBtn"><img class="btn-icon" src="/assets/images/Bk2Shapes/Microphone.png" alt="Mic">Read Instructions</button>
      <button class="btn clear" type="button" id="clearBtn">Clear ✕</button>
      <button class="btn cheer" type="button" id="cheerBtn">👏 Cheer</button>
      <button class="btn next" type="button" id="nextBtn">Next ➜</button>
      <a class="btn home" href="../../../../../index.html">🏠 Home</a>
    </div>

    <div class="note">
      Trace the green diagonal lines. Then trace the dotted answers: 14, 13, 12, 11, and 10.
    </div>
  </section>
</main>

<script>
  const HOME_PAGE = "../../../../../index.html";
  const PREVIOUS_PAGE = "Bk2LB15.html";
  const NEXT_PAGE = "../Friday/BK2LBGame3.html";
  const CHIME_SRC = "/assets/audio/chimes/chime.mp3";

  const progressFill = document.getElementById("progressFill");
  const progressPercent = document.getElementById("progressPercent");
  const statusText = document.getElementById("statusText");
  const stars = document.getElementById("stars");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let pads = [];
  let celebrated = false;
  let lastTickTime = 0;

  const chimeAudio = new Audio(CHIME_SRC);
  chimeAudio.preload = "auto";

  function setStatus(text){
    statusText.textContent = text || "";
  }

  function chooseFemaleVoice(){
    if (!("speechSynthesis" in window)) return null;

    const voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;

    const english = voices.filter(v => /^en/i.test(v.lang || ""));

    const preferred = [
      "Jenny",
      "Aria",
      "Samantha",
      "Victoria",
      "Zira",
      "Susan",
      "Karen",
      "Moira",
      "Tessa",
      "Serena",
      "Google US English",
      "Microsoft Zira"
    ];

    for (const name of preferred){
      const found = english.find(v => (v.name || "").toLowerCase().includes(name.toLowerCase()));
      if (found) return found;
    }

    return english.find(v => /us|united states/i.test(v.lang || v.name || ""))
      || english[0]
      || voices[0]
      || null;
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = chooseFemaleVoice;
  }

  function speak(text,onDone){
    if (!("speechSynthesis" in window)) {
      if (typeof onDone === "function") onDone();
      return;
    }

    try{
      window.speechSynthesis.cancel();

      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      u.pitch = 1.16;
      u.volume = 1;

      const voice = chooseFemaleVoice();
      if (voice) u.voice = voice;

      if (typeof onDone === "function") {
        u.onend = onDone;
        u.onerror = onDone;
      }

      window.speechSynthesis.speak(u);
    }catch(e){
      if (typeof onDone === "function") onDone();
    }
  }

  function speakInstructions(){
    setStatus("Trace the diagonal lines. Then trace the answers.");
    speak(
      "Hello! This is Numbers, Week Three. Look at the lines. Subtract the lines from the number. Trace the green diagonal lines first. Then trace the dotted answer numbers. The answers are fourteen, thirteen, twelve, eleven, and ten."
    );
  }

  function playChime(){
    try{
      const s = chimeAudio.cloneNode(true);
      s.volume = 1;
      s.play().catch(() => playBeep(880,0.08));
    }catch(e){
      playBeep(880,0.08);
    }
  }

  function playBeep(freq,duration){
    try{
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
  }

  function playTraceTick(){
    const now = performance.now();
    if (now - lastTickTime < 75) return;

    lastTickTime = now;
    playBeep(620,0.045);
  }

  function playApplause(){
    try{
      for (let i = 0; i < 14; i++){
        setTimeout(() => {
          playBeep(420 + Math.random() * 560,0.06);
        }, i * 55);
      }
    }catch(e){}
  }

  function confetti(){
    const colors = ["#f13a52","#2876d9","#19a85b","#ffd24a","#ff8a5b","#8d5df7"];

    for (let i = 0; i < 42; i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * 0.35 + "s";
      document.body.appendChild(piece);

      setTimeout(() => piece.remove(),2300);
    }
  }

  function scalePoint(point,width,height){
    return {
      x:point[0] * width,
      y:point[1] * height
    };
  }

  function buildSamplesFromPaths(paths,width,height){
    const samples = [];

    paths.forEach(path => {
      for (let i = 0; i < path.length - 1; i++){
        const a = scalePoint(path[i],width,height);
        const b = scalePoint(path[i + 1],width,height);
        const dist = Math.hypot(b.x - a.x,b.y - a.y);
        const steps = Math.max(10,Math.ceil(dist / 3));

        for (let s = 0; s <= steps; s++){
          const t = s / steps;

          samples.push({
            x:a.x + (b.x - a.x) * t,
            y:a.y + (b.y - a.y) * t,
            hit:false
          });
        }
      }
    });

    return samples;
  }

  function makeLinePaths(count,direction){
    const paths = [];
    const startX = 0.18;
    const endX = 0.82;
    const spacing = count <= 1 ? 0 : (endX - startX) / (count - 1);

    for (let i = 0; i < count; i++){
      const c = startX + spacing * i;

      if (direction === "down") {
        paths.push([
          [c - 0.14,0.18],
          [c + 0.14,0.82]
        ]);
      } else {
        paths.push([
          [c - 0.14,0.82],
          [c + 0.14,0.18]
        ]);
      }
    }

    return paths;
  }

  function ovalPoints(cx,cy,rx,ry,steps){
    const pts = [];

    for (let i = 0; i <= steps; i++){
      const a = (Math.PI * 2 * i) / steps;
      pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }

    return pts;
  }

  function digitLocalPaths(digit){
    if (digit === "1") {
      return [
        [[0.50,0.12],[0.50,0.90]],
        [[0.34,0.28],[0.50,0.12],[0.66,0.28]]
      ];
    }

    if (digit === "2") {
      return [
        [[0.22,0.24],[0.40,0.12],[0.68,0.16],[0.78,0.34],[0.66,0.52],[0.28,0.86],[0.78,0.86]]
      ];
    }

    if (digit === "3") {
      return [
        [[0.24,0.18],[0.68,0.18],[0.54,0.48],[0.70,0.48],[0.78,0.70],[0.62,0.86],[0.28,0.82]]
      ];
    }

    if (digit === "4") {
      return [
        [[0.72,0.12],[0.26,0.60],[0.84,0.60]],
        [[0.72,0.12],[0.72,0.90]]
      ];
    }

    if (digit === "0") {
      return [
        ovalPoints(0.50,0.50,0.28,0.38,50)
      ];
    }

    return [];
  }

  function transformDigitPaths(paths,left,top,width,height){
    return paths.map(path => {
      return path.map(p => {
        return [
          left + p[0] * width,
          top + p[1] * height
        ];
      });
    });
  }

  function makeAnswerPaths(answer){
    const chars = String(answer).split("");
    const paths = [];

    const digitW = 0.30;
    const digitH = 0.78;
    const top = 0.12;

    const positions = chars.length === 2
      ? [0.22,0.53]
      : [0.36];

    chars.forEach((digit,index) => {
      const local = digitLocalPaths(digit);
      const transformed = transformDigitPaths(local,positions[index],top,digitW,digitH);
      transformed.forEach(path => paths.push(path));
    });

    return paths;
  }

  function createTracePad(zone){
    const canvas = zone.querySelector("canvas");
    const ctx = canvas.getContext("2d");

    const kind = zone.dataset.kind;
    const row = Number(zone.dataset.row || "1");
    const id = zone.dataset.id;
    const answer = zone.dataset.answer || "";
    const count = Number(zone.dataset.count || "0");
    const direction = zone.dataset.direction || "up";

    const pad = {
      id,
      zone,
      canvas,
      ctx,
      kind,
      row,
      answer,
      count,
      direction,
      width:0,
      height:0,
      paths:[],
      samples:[],
      drawing:false,
      last:null,
      percent:0,
      done:false,
      drawDistance:0
    };

    function resize(){
      const rect = zone.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      pad.width = Math.max(1,rect.width);
      pad.height = Math.max(1,rect.height);

      canvas.width = Math.round(pad.width * dpr);
      canvas.height = Math.round(pad.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);

      if (kind === "lines") {
        pad.paths = makeLinePaths(count,direction);
      } else {
        pad.paths = makeAnswerPaths(answer);
      }

      pad.samples = buildSamplesFromPaths(pad.paths,pad.width,pad.height);
      redrawGuide();
    }

    function redrawGuide(){
      ctx.clearRect(0,0,pad.width,pad.height);
    }

    function getPoint(event){
      const rect = canvas.getBoundingClientRect();

      return {
        x:event.clientX - rect.left,
        y:event.clientY - rect.top
      };
    }

    function drawStudentLine(from,to){
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = kind === "lines"
        ? "rgba(241,58,82,0.92)"
        : "rgba(40,118,217,0.92)";
      ctx.lineWidth = kind === "lines"
        ? Math.max(10,Math.min(pad.width,pad.height) * 0.13)
        : Math.max(9,Math.min(pad.width,pad.height) * 0.09);
      ctx.beginPath();
      ctx.moveTo(from.x,from.y);
      ctx.lineTo(to.x,to.y);
      ctx.stroke();
      ctx.restore();
    }

    function markPoint(point){
      const minSide = Math.min(pad.width,pad.height);

      const threshold = kind === "lines"
        ? Math.max(20,minSide * 0.28)
        : Math.max(18,minSide * 0.22);

      for (const sample of pad.samples){
        if (sample.hit) continue;

        const d = Math.hypot(sample.x - point.x,sample.y - point.y);

        if (d <= threshold) {
          sample.hit = true;
        }
      }

      refreshProgress();
    }

    function markBetween(from,to){
      const distance = Math.hypot(to.x - from.x,to.y - from.y);
      pad.drawDistance += distance;

      const steps = Math.max(1,Math.ceil(distance / 3));

      for (let i = 0; i <= steps; i++){
        const t = i / steps;

        markPoint({
          x:from.x + (to.x - from.x) * t,
          y:from.y + (to.y - from.y) * t
        });
      }

      refreshProgress();
    }

    function refreshProgress(){
      const hits = pad.samples.filter(s => s.hit).length;
      let pct = Math.round((hits / Math.max(1,pad.samples.length)) * 100);

      /*
        Child-friendly completion:
        This prevents the tracing from getting stuck at 80% or 90%.
      */
      if (pct >= 82) {
        pct = 100;
        pad.samples.forEach(s => s.hit = true);
      }

      pad.percent = Math.max(pad.percent,pct);

      if (pad.percent >= 100 && !pad.done) {
        pad.done = true;
        zone.classList.remove("is-active");
        zone.classList.add("done");
        playChime();

        if (kind === "lines") {
          speak("Good job tracing the diagonal lines.");
        } else {
          speak("Great job tracing the answer " + answer + ".");
        }
      }

      updateOverallProgress();
    }

    function pointerDown(event){
      event.preventDefault();

      try{
        canvas.setPointerCapture(event.pointerId);
      }catch(e){}

      zone.classList.add("is-active");
      pad.drawing = true;
      pad.last = getPoint(event);

      markPoint(pad.last);
      playTraceTick();
    }

    function pointerMove(event){
      if (!pad.drawing || !pad.last) return;

      event.preventDefault();

      const point = getPoint(event);

      drawStudentLine(pad.last,point);
      markBetween(pad.last,point);
      playTraceTick();

      pad.last = point;
    }

    function stopDrawing(event){
      if (event && event.pointerId != null) {
        try{
          canvas.releasePointerCapture(event.pointerId);
        }catch(e){}
      }

      pad.drawing = false;
      pad.last = null;

      if (!pad.done) {
        zone.classList.remove("is-active");
      }
    }

    function reset(){
      pad.samples.forEach(s => s.hit = false);
      pad.percent = 0;
      pad.done = false;
      pad.drawDistance = 0;
      zone.classList.remove("done","is-active");
      redrawGuide();
      updateOverallProgress();
    }

    canvas.addEventListener("pointerdown",pointerDown);
    canvas.addEventListener("pointermove",pointerMove);
    canvas.addEventListener("pointerup",stopDrawing);
    canvas.addEventListener("pointercancel",stopDrawing);
    canvas.addEventListener("lostpointercapture",stopDrawing);

    pad.resize = resize;
    pad.reset = reset;

    resize();
    return pad;
  }

  function updateOverallProgress(){
    const total = pads.length
      ? Math.round(pads.reduce((sum,pad) => sum + pad.percent,0) / pads.length)
      : 0;

    progressFill.style.width = total + "%";
    progressPercent.textContent = total + "%";

    for (let row = 1; row <= 5; row++){
      const rowPads = pads.filter(p => p.row === row);
      const rowScore = rowPads.length
        ? Math.round(rowPads.reduce((sum,p) => sum + p.percent,0) / rowPads.length)
        : 0;

      const text = document.getElementById("row" + row + "Text");
      const mini = document.getElementById("row" + row + "Mini");

      if (text) text.textContent = rowScore + "%";

      if (mini) {
        if (rowScore >= 100) mini.classList.add("done");
        else mini.classList.remove("done");
      }
    }

    if (total >= 90) stars.textContent = "★ ★ ★";
    else if (total >= 65) stars.textContent = "★ ★ ☆";
    else if (total >= 35) stars.textContent = "★ ☆ ☆";
    else stars.textContent = "☆ ☆ ☆";

    saveProgress(total);

    if (total >= 100 && !celebrated) {
      celebrated = true;
      playChime();
      playApplause();
      confetti();
      setStatus("Excellent! You traced all the lines and answers.");
      speak("Excellent work! You traced all the diagonal lines and all the answer numbers.");
    }
  }

  function resetAll(){
    celebrated = false;

    pads.forEach(pad => {
      if (pad && typeof pad.reset === "function") pad.reset();
    });

    setStatus("Try again. Trace the green lines and the dotted answers.");
    speak("Try again. Trace the green diagonal lines. Then trace the dotted answer numbers.");
  }

  function saveProgress(score){
    try{
      const payload = {
        pageId:"Bk2LB19",
        file:"Bk2LB19.html",
        level:"B",
        activityType:"lesson",
        score:Math.max(0,Math.min(100,Math.round(score))),
        tracing:Math.max(0,Math.min(100,Math.round(score))),
        stars:score >= 90 ? 3 : score >= 65 ? 2 : score >= 35 ? 1 : 0,
        completed:score >= 90,
        skills:{
          reading:1,
          writing:1,
          speaking:1,
          listening:1,
          tracing:1,
          math:1
        },
        savedAt:new Date().toISOString()
      };

      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store.Bk2LB19 = {
        ...(store.Bk2LB19 || {}),
        ...payload
      };

      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS",JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE","Bk2LB19.html");
    }catch(e){}
  }

  function init(){
    const zones = Array.from(document.querySelectorAll(".trace-zone"));
    pads = zones.map(createTracePad);
    updateOverallProgress();

    setTimeout(() => {
      speakInstructions();
    },700);
  }

  readBtn.addEventListener("click",speakInstructions);
  clearBtn.addEventListener("click",resetAll);

  cheerBtn.addEventListener("click",() => {
    playChime();
    playApplause();
    confetti();
    speak("You are doing great. Keep tracing the lines and numbers.");
  });

  prevBtn.addEventListener("click",() => {
    window.location.href = PREVIOUS_PAGE;
  });

  nextBtn.addEventListener("click",() => {
    window.location.href = NEXT_PAGE;
  });

  window.addEventListener("resize",() => {
    clearTimeout(window.__numbersResizeTimer);

    window.__numbersResizeTimer = setTimeout(() => {
      pads.forEach(pad => {
        if (pad && typeof pad.resize === "function") pad.resize();
      });

      updateOverallProgress();
    },180);
  });

  document.addEventListener("keydown",(event) => {
    if (event.key === "ArrowLeft") window.location.href = PREVIOUS_PAGE;
    if (event.key === "ArrowRight") window.location.href = NEXT_PAGE;
    if (event.key.toLowerCase() === "h") window.location.href = HOME_PAGE;
    if (event.key.toLowerCase() === "r") speakInstructions();
    if (event.key.toLowerCase() === "c") resetAll();
  });

  /*
    Helps mobile browsers unlock audio after the first child tap.
  */
  let firstTapDone = false;
  document.addEventListener("pointerdown",() => {
    if (firstTapDone) return;
    firstTapDone = true;

    try{
      chimeAudio.load();
    }catch(e){}

    if (!window.speechSynthesis?.speaking) {
      speak("Trace the diagonal lines and the answer numbers.");
    }
  },{once:true});

  window.addEventListener("load",init);
</script>
</body>
</html>
