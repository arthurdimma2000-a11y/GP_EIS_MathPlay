<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Vertical Lines - Line Directions</title>
<style>
  :root{
    --blue:#5f8fd3;
    --sky:#67c8df;
    --red:#f24b5e;
    --dark:#25222a;
    --card:#fffdf8;
    --gold:#ffd24a;
    --good:#19a85d;
    --purple:#6c4bbf;
    --soft-blue:#dfeaff;
    --orange:#ff8a5b;
    --shadow:0 14px 32px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    color:var(--dark);
    background:#fff9ef;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#f3e8d8 1px,transparent 1px),
      linear-gradient(90deg,#f3e8d8 1px,transparent 1px);
    background-size:28px 28px;
  }

  .app{
    width:min(980px,100%);
    background:var(--card);
    border:6px solid var(--blue);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:12px;
    position:relative;
    overflow:hidden;
  }

  .top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }

  .title-pill{
    background:#fff;
    border:4px solid var(--blue);
    border-radius:999px;
    padding:8px 14px;
    font-size:clamp(1.05rem,3vw,1.55rem);
    font-weight:1000;
    color:var(--blue);
    box-shadow:0 6px 0 rgba(95,143,211,.18);
  }

  .home-btn{
    position:absolute;
    top:14px;
    right:14px;
    z-index:20;
    width:78px;
    transform-origin:top center;
    animation:homeSwing 3.2s ease-in-out infinite;
  }

  .home-btn img{display:block;width:100%;}

  .poster-wrap{
    position:relative;
    width:min(860px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:var(--sky);
  }

  .poster-img{
      width:100%;
      height:auto;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    .trace-canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:5;
      cursor:crosshair;
      touch-action:none;
    }

  .line-zone{
    position:absolute;
    width:4.4%;
    border-radius:999px;
    cursor:pointer;
    z-index:6;
    background:rgba(255,255,255,.001);
    touch-action:manipulation;
  }

  .line-zone::after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    transform:translateX(-50%);
    width:9px;
    border-radius:999px;
    background:transparent;
    transition:.2s ease;
  }

  .line-zone:hover::after{
    background:rgba(255,255,255,.36);
    box-shadow:0 0 0 3px rgba(255,255,255,.55);
  }

  .line-zone.found::after{
    background:linear-gradient(180deg,#00c853,#a8ff78);
    box-shadow:0 0 0 4px rgba(0,200,83,.18),0 0 20px rgba(0,200,83,.7);
    animation:linePulse .9s ease-in-out infinite;
  }

  /* Vertical line tap areas on the poster */
  .zone1{left:10.4%;top:35.2%;height:41.4%;}
  .zone2{left:29.0%;top:38.5%;height:27.4%;}
  .zone3{left:32.5%;top:38.5%;height:27.4%;}
  .zone4{left:36.0%;top:38.5%;height:27.4%;}
  .zone5{left:42.1%;top:35.0%;height:41.6%;}
  .zone6{left:65.4%;top:35.0%;height:41.6%;}
  .zone7{left:70.5%;top:38.5%;height:27.4%;}
  .zone8{left:74.0%;top:38.5%;height:27.4%;}
  .zone9{left:77.4%;top:38.5%;height:27.4%;}
  .zone10{left:92.0%;top:35.2%;height:41.4%;}

  @keyframes linePulse{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.25);}
  }

  .conversation-panel{
    margin:12px auto 0;
    width:min(860px,100%);
    display:grid;
    gap:10px;
    background:linear-gradient(180deg,#fff,#f3fbff);
    border:3px dashed rgba(108,75,191,.35);
    border-radius:18px;
    padding:12px;
  }

  .convo-line{
    display:none;
    align-items:flex-start;
    justify-content:flex-start;
  }

  .convo-line.show{display:flex;}
  .convo-line.right{justify-content:flex-end;}

  .bubble-stack{
    max-width:min(100%,560px);
    display:grid;
    gap:5px;
  }

  .convo-line.right .bubble-stack{justify-items:end;}

  .bubble{
    font-size:clamp(1.05rem,3vw,1.55rem);
    line-height:1.25;
    font-weight:1000;
    padding:12px 16px;
    border-radius:22px;
    box-shadow:0 8px 16px rgba(0,0,0,.12);
    background:#fff;
    position:relative;
  }

  .bubble.green{border:4px solid #78bd43;}
  .bubble.blue{border:4px solid #58c6ff;}
  .bubble.black{border:4px solid var(--blue);}

  .bubble.sparkle{
    background:linear-gradient(120deg,#fff2a8,#ffd1f0,#c7f1ff);
    box-shadow:0 0 12px rgba(255,214,0,.75),0 0 22px rgba(88,198,255,.45),0 10px 20px rgba(0,0,0,.18);
    animation:sparklePulse 1s ease-in-out infinite;
  }

  @keyframes sparklePulse{
    0%,100%{filter:brightness(1);transform:scale(1);}
    50%{filter:brightness(1.16);transform:scale(1.02);}
  }

  .repeat-result{
    min-height:1.2em;
    font-size:clamp(1rem,2.5vw,1.25rem);
    font-weight:1000;
    color:#169b55;
  }

  .try-message{
    min-height:1.2em;
    font-size:clamp(.95rem,2.4vw,1.1rem);
    font-weight:1000;
    color:#c62828;
  }

  .star-row{
    min-height:1.2em;
    font-size:clamp(1.25rem,3.2vw,1.8rem);
    letter-spacing:3px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.25);
  }

  .progress-card{
    margin:12px auto 0;
    width:min(860px,100%);
    background:#fff8fb;
    border:3px solid #ffd1df;
    border-radius:18px;
    padding:12px;
    display:grid;
    gap:8px;
  }

  .progress-label{
    text-align:center;
    font-weight:1000;
    color:#4b3960;
    font-size:clamp(1rem,2.6vw,1.2rem);
  }

  .bar{
    height:16px;
    background:#e8eef8;
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.12);
  }

  .fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#58c6ff,#83e79f);
    transition:width .25s ease;
  }

  .controls{
    width:min(860px,100%);
    margin:12px auto 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .btn,.mic-icon-btn{
    border:none;
    border-radius:999px;
    min-height:46px;
    padding:10px 16px;
    font-size:.98rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.16);
    transition:transform .1s ease,filter .1s ease;
  }

  .btn:hover,.mic-icon-btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active,.mic-icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:var(--orange);color:#fff;}
  .btn.clear{background:var(--soft-blue);color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}

  .mic-icon-btn{
    background:#fff;
    padding:7px 14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#4b3960;
  }

  .mic-symbol{
    width:42px;
    height:42px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(180deg,#ffebf2,#e9f5ff);
    border:3px solid #fff;
    box-shadow:0 4px 10px rgba(0,0,0,.16);
    font-size:1.55rem;
  }

  .mic-icon-btn.is-busy{opacity:.7;pointer-events:none;}

  .status{
    width:min(860px,100%);
    margin:10px auto 0;
    text-align:center;
    min-height:1.5em;
    font-size:clamp(1rem,3vw,1.35rem);
    font-weight:1000;
    color:#5a3eb0;
  }

  .stars-overall{
    text-align:center;
    min-height:1.3em;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.25);
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:confettiFall 1.7s linear forwards;
  }

  @keyframes homeSwing{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(7deg);}
    75%{transform:rotate(-7deg);}
  }

  @keyframes confettiFall{
    to{transform:translateY(105vh) rotate(540deg);opacity:.1;}
  }

  @media(max-width:620px){
    .app{border-width:5px;padding:9px;}
    .controls{gap:8px;}
    .btn,.mic-icon-btn{font-size:.88rem;padding:9px 12px;}
    .home-btn{position:static;display:block;margin:0 0 8px auto;}
    .mic-symbol{width:36px;height:36px;font-size:1.25rem;}
  }
</style>
</head>
<body>
<main class="app">
  <a class="home-btn" id="homeBtn" href="../../../../../index.html" aria-label="Home">
    <img src="../../../Home1.png" alt="Home">
  </a>

  <div class="top-bar">
    <div class="title-pill">Vertical Lines · Line Directions</div>
  </div>

  <div class="poster-wrap" id="posterWrap" aria-label="Vertical lines department store poster">
    <img class="poster-img" id="posterImg" src="/assets/images/Bk2Shapes/Bk2LB8.png" alt="Vertical Lines poster">
    <canvas class="trace-canvas" id="traceCanvas" aria-label="Trace the vertical lines on the poster"></canvas>

    <button class="line-zone zone1" type="button" aria-label="left outside vertical line"></button>
    <button class="line-zone zone2" type="button" aria-label="left curtain vertical line one"></button>
    <button class="line-zone zone3" type="button" aria-label="left curtain vertical line two"></button>
    <button class="line-zone zone4" type="button" aria-label="left curtain vertical line three"></button>
    <button class="line-zone zone5" type="button" aria-label="middle left building vertical line"></button>
    <button class="line-zone zone6" type="button" aria-label="middle right building vertical line"></button>
    <button class="line-zone zone7" type="button" aria-label="right curtain vertical line one"></button>
    <button class="line-zone zone8" type="button" aria-label="right curtain vertical line two"></button>
    <button class="line-zone zone9" type="button" aria-label="right curtain vertical line three"></button>
    <button class="line-zone zone10" type="button" aria-label="right outside vertical line"></button>
  </div>

  <section class="conversation-panel" aria-label="Mic repeat conversation">
    <div class="convo-line" data-line-index="0">
      <div class="bubble-stack">
        <div class="bubble green">Let’s go shopping.</div>
        <div class="repeat-result"></div>
        <div class="try-message"></div>
        <div class="star-row"></div>
      </div>
    </div>

    <div class="convo-line right" data-line-index="1">
      <div class="bubble-stack">
        <div class="bubble blue">I want to go to the kid’s cafe.</div>
        <div class="repeat-result"></div>
        <div class="try-message"></div>
        <div class="star-row"></div>
      </div>
    </div>

    <div class="convo-line" data-line-index="2">
      <div class="bubble-stack">
        <div class="bubble black">The department store has many lines that go up and down.</div>
        <div class="repeat-result"></div>
        <div class="try-message"></div>
        <div class="star-row"></div>
      </div>
    </div>
  </section>

  <section class="progress-card" aria-live="polite">
    <div class="progress-label">Lesson progress: <span id="progressText">0%</span></div>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
    <div class="stars-overall" id="overallStars"></div>
  </section>

  <div class="controls">
    <button class="mic-icon-btn" id="micBtn" type="button" aria-label="Microphone repeat practice">
      <span class="mic-symbol">🎤</span><span>Mic</span>
    </button>
    <button class="btn read" id="readBtn" type="button">🔊 Read Instructions</button>
    <button class="btn cheer" id="cheerBtn" type="button">👏 Cheer</button>
    <button class="btn clear" id="clearBtn" type="button">Clear</button>
    <button class="btn prev" id="prevBtn" type="button">← Previous page</button>
    <button class="btn next" id="nextBtn" type="button">Next page →</button>
  </div>

  <div class="status" id="status">Tap the microphone to hear the first line. Tap the vertical lines on the department store.</div>
</main>

<script>
(function(){
  "use strict";

  const PAGE_ID = "VerticalLines_Lesson";
  const LEVEL = "A";
  const CHIME_SOURCES = ["chime.mp3", "../../../../../assets/audio/chimes/chime.mp3", "../../../../../assets/audio/chime.mp3"];

  const micLines = [
    "Let's go shopping.",
    "I want to go to the kid's cafe.",
    "The department store has many lines that go up and down."
  ];

  const statusEl = document.getElementById("status");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const overallStars = document.getElementById("overallStars");
  const micBtn = document.getElementById("micBtn");
  const readBtn = document.getElementById("readBtn");
    const cheerBtn = document.getElementById("cheerBtn");
    const clearBtn = document.getElementById("clearBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const posterWrap = document.getElementById("posterWrap");
    const posterImg = document.getElementById("posterImg");
    const traceCanvas = document.getElementById("traceCanvas");
    const lineZones = Array.from(document.querySelectorAll(".line-zone"));
    const convoLines = Array.from(document.querySelectorAll(".convo-line"));
    const traceCtx = traceCanvas.getContext("2d");

    const state = {
    index:0,
    phase:"reveal",
    busy:false,
    attempts:new Array(micLines.length).fill(0),
    stars:new Array(micLines.length).fill(0),
    completedLines:new Array(micLines.length).fill(false),
    verticalFound:new Array(lineZones.length).fill(false),
    done:false,
      celebratedLines:false
    };
    let isTracing = false;
    let lastPoint = null;

  let audioCtx = null;

  function setStatus(text){ statusEl.textContent = text || ""; }

  function delay(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

  function getAudioCtx(){
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if(!AudioContext) return null;
    if(!audioCtx) audioCtx = new AudioContext();
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text){
    return new Promise(resolve => {
      if(!text || !("speechSynthesis" in window)) { resolve(); return; }
      try{ window.speechSynthesis.cancel(); }catch(_e){}
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = "en-US";
      u.rate = 0.88;
      u.pitch = 1.16;
      u.volume = 1;
      const voice = pickVoice();
      if(voice) u.voice = voice;
      u.onend = resolve;
      u.onerror = resolve;
      window.speechSynthesis.speak(u);
    });
  }

  function stopSpeaking(){
    try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(_e){}
  }

  function playSynthChime(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    [660,880,1046].forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t = ctx.currentTime + i * 0.13;
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(0.22,t+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t+0.35);
    });
  }

  function playChime(){
    getAudioCtx();
    function trySource(index){
      if(index >= CHIME_SOURCES.length){ playSynthChime(); return; }
      try{
        const audio = new Audio(CHIME_SOURCES[index]);
        audio.volume = 0.9;
        const p = audio.play();
        if(p && typeof p.catch === "function") p.catch(()=>trySource(index+1));
      }catch(_e){
        trySource(index+1);
      }
    }
    trySource(0);
  }

  function playTap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = 840;
    gain.gain.setValueAtTime(0.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.055,ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime + 0.10);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.11);
  }

  function clap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    for(let i=0;i<4;i++){
      const bufferSize = Math.floor(ctx.sampleRate * 0.08);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<bufferSize;j++) data[j] = (Math.random()*2-1) * Math.pow(1-j/bufferSize,2);
      const noise = ctx.createBufferSource();
      const gain = ctx.createGain();
      noise.buffer = buffer;
      gain.gain.value = 0.22;
      noise.connect(gain);
      gain.connect(ctx.destination);
      noise.start(ctx.currentTime + i * 0.14);
    }
  }

  function confetti(){
    const colors = ["#f24b5e","#ffd24a","#58c6ff","#83e79f","#f7a6c9","#9ed06a"];
    for(let i=0;i<36;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = Math.random() * 0.35 + "s";
      piece.style.transform = "rotate(" + (Math.random()*180) + "deg)";
      document.body.appendChild(piece);
      piece.addEventListener("animationend",()=>piece.remove());
    }
  }

  function normalize(text){
    return String(text || "")
      .toLowerCase()
      .replace(/[’']/g, "")
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function matchPercent(expected, heard){
    const need = normalize(expected).split(" ").filter(Boolean);
    const got = normalize(heard).split(" ").filter(Boolean);
    if(!need.length || !got.length) return 0;
    let hits = 0;
    need.forEach(word => {
      if(got.includes(word)) hits += 1;
    });
    return Math.round((hits / need.length) * 100);
  }

  function isCorrectRepeat(expected, heard){
    return matchPercent(expected, heard) >= 50;
  }

  function listenForSpeech(timeoutMs){
    return new Promise(resolve => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SpeechRecognition){ resolve({supported:false, transcript:""}); return; }
      let done = false;
      const rec = new SpeechRecognition();
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      const timer = setTimeout(()=>{
        if(done) return;
        done = true;
        try{ rec.stop(); }catch(_e){}
        resolve({supported:true, transcript:""});
      }, timeoutMs || 7000);
      rec.onresult = ev => {
        if(done) return;
        done = true;
        clearTimeout(timer);
        const transcript = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
        resolve({supported:true, transcript});
      };
      rec.onerror = () => {
        if(done) return;
        done = true;
        clearTimeout(timer);
        resolve({supported:true, transcript:""});
      };
      rec.onend = () => {
        if(done) return;
        done = true;
        clearTimeout(timer);
        resolve({supported:true, transcript:""});
      };
      try{ rec.start(); }catch(_e){
        clearTimeout(timer);
        resolve({supported:true, transcript:""});
      }
    });
  }

  function getLineEl(index){ return convoLines[index]; }
  function getBubble(index){ return getLineEl(index)?.querySelector(".bubble"); }
  function getResult(index){ return getLineEl(index)?.querySelector(".repeat-result"); }
  function getTry(index){ return getLineEl(index)?.querySelector(".try-message"); }
  function getStars(index){ return getLineEl(index)?.querySelector(".star-row"); }

  function showLine(index){ getLineEl(index)?.classList.add("show"); }

  function clearHighlights(){
    convoLines.forEach(line => line.querySelector(".bubble")?.classList.remove("sparkle"));
  }

  function highlightLine(index, on){
    getBubble(index)?.classList.toggle("sparkle", !!on);
  }

  function setResult(index, text, color){
    const el = getResult(index);
    if(!el) return;
    el.textContent = text ? "You said: “" + text + "”" : "";
    if(color) el.style.color = color;
  }

  function setTryMessage(index, text, color){
    const el = getTry(index);
    if(!el) return;
    el.textContent = text || "";
    if(color) el.style.color = color;
  }

  function setStars(index, stars){
    const el = getStars(index);
    if(el) el.textContent = "⭐".repeat(stars);
  }

  function rewardStars(tryNo){
    if(tryNo <= 1) return 3;
    if(tryNo === 2) return 2;
    return 1;
  }

    function updateProgress(){
    const foundLines = state.verticalFound.filter(Boolean).length;
    const linePart = (foundLines / Math.max(1,lineZones.length)) * 50;
    const micPart = (state.completedLines.filter(Boolean).length / Math.max(1,micLines.length)) * 50;
    const total = Math.round(linePart + micPart);
    progressText.textContent = total + "%";
    progressFill.style.width = total + "%";

    const totalStars = state.stars.reduce((a,b)=>a+b,0);
    overallStars.textContent = totalStars ? "⭐".repeat(Math.min(3, Math.ceil(totalStars / 3))) : "";

    saveProgress(total);

    if(foundLines === lineZones.length && !state.celebratedLines){
      state.celebratedLines = true;
      playChime();
      clap();
      setStatus("Great! You found the vertical lines that go up and down.");
      speak("Great! You found the vertical lines that go up and down.");
    }

    if(total >= 100 && !state.done){
      state.done = true;
      finishSequence();
      }
    }

    function resizeTraceCanvas(){
      const rect = posterWrap.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      traceCanvas.width = Math.max(1, Math.round(rect.width * ratio));
      traceCanvas.height = Math.max(1, Math.round(rect.height * ratio));
      traceCtx.setTransform(1, 0, 0, 1, 0, 0);
      traceCtx.scale(ratio, ratio);
      traceCtx.lineCap = "round";
      traceCtx.lineJoin = "round";
      traceCtx.strokeStyle = "rgba(255, 99, 71, 0.78)";
      traceCtx.lineWidth = Math.max(6, rect.width * 0.011);
    }

    function clearTraceDrawing(){
      traceCtx.clearRect(0, 0, traceCanvas.width, traceCanvas.height);
      isTracing = false;
      lastPoint = null;
    }

    function getTracePoint(event){
      const rect = traceCanvas.getBoundingClientRect();
      return {
        x:event.clientX - rect.left,
        y:event.clientY - rect.top
      };
    }

    function markZoneFound(index){
      if(state.verticalFound[index]) return;
      const zone = lineZones[index];
      state.verticalFound[index] = true;
      zone.classList.add("found");
      playTap();
      const found = state.verticalFound.filter(Boolean).length;
      setStatus("Good! You found " + found + " vertical line" + (found === 1 ? "" : "s") + ".");
      if(found === 1 || found === 5 || found === 10){
        speak(found === 10 ? "Amazing! You found all the vertical lines." : "Good! Keep finding the lines that go up and down.");
      }
      updateProgress();
    }

    function markZonesAtPoint(point){
      const wrapRect = posterWrap.getBoundingClientRect();
      lineZones.forEach((zone, index) => {
        if(state.verticalFound[index]) return;
        const zoneRect = zone.getBoundingClientRect();
        const left = zoneRect.left - wrapRect.left;
        const right = zoneRect.right - wrapRect.left;
        const top = zoneRect.top - wrapRect.top;
        const bottom = zoneRect.bottom - wrapRect.top;
        if(point.x >= left && point.x <= right && point.y >= top && point.y <= bottom){
          markZoneFound(index);
        }
      });
    }

    function startTrace(event){
      getAudioCtx();
      event.preventDefault();
      isTracing = true;
      lastPoint = getTracePoint(event);
      markZonesAtPoint(lastPoint);
    }

    function moveTrace(event){
      if(!isTracing) return;
      event.preventDefault();
      const point = getTracePoint(event);
      traceCtx.beginPath();
      traceCtx.moveTo(lastPoint.x, lastPoint.y);
      traceCtx.lineTo(point.x, point.y);
      traceCtx.stroke();
      lastPoint = point;
      markZonesAtPoint(point);
    }

    function endTrace(){
      isTracing = false;
      lastPoint = null;
    }

  function saveProgress(score){
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = {
        pageId:PAGE_ID,
        file:PAGE_ID + ".html",
        level:LEVEL,
        type:"lesson",
        activityType:"vertical-lines-mic",
        score:Math.round(score || 0),
        stars:state.stars.reduce((a,b)=>a+b,0),
        completed:score >= 100,
        skills:{reading:1,writing:0,speaking:state.completedLines.filter(Boolean).length,listening:1},
        savedAt:new Date().toISOString(),
        ts:Date.now()
      };
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", PAGE_ID + ".html");
    }catch(_e){}
  }

  async function finishSequence(){
    clearHighlights();
    const remarks = ["Wow! You are super smart!", "Amazing Job!", "Great! Keep it up!"];
    const remark = remarks[Math.floor(Math.random()*remarks.length)];
    playChime();
    clap();
    confetti();
    setStatus(remark);
    await speak(remark);
  }

  async function revealCurrentLineAndSpeak(){
    clearHighlights();
    const text = micLines[state.index];
    showLine(state.index);
    setTryMessage(state.index,"","");
    setStatus(text);
    await speak(text);
    state.phase = "repeat-ready";
    setStatus("Tap the microphone again. Then repeat after me.");
    updateProgress();
  }

  async function moveToNextLine(){
    clearHighlights();
    if(state.index >= micLines.length - 1){
      state.phase = "done";
      updateProgress();
      if(state.completedLines.every(Boolean)){
        playChime();
        clap();
        setStatus("Great speaking! Now find the vertical lines on the store.");
        await speak("Great speaking! Now find the vertical lines on the store.");
      }
      return;
    }
    state.index += 1;
    state.phase = "repeat-ready";
    showLine(state.index);
    setStatus(micLines[state.index]);
    await speak(micLines[state.index]);
    setStatus("Tap the microphone again. Then repeat after me.");
    updateProgress();
  }

  async function handleRepeatAttempt(){
    const expected = micLines[state.index];
    if(!expected) return;
    highlightLine(state.index,true);
    setTryMessage(state.index,"","");
    setStatus("Repeat after me.");
    await speak("Repeat after me.");
    setBusy(true);
    setStatus("Listening... say the sentence now.");
    const heard = await listenForSpeech(7000);
    setBusy(false);

    if(!heard.supported){
      setTryMessage(state.index,"Speech check is not supported. Use Chrome or Edge.","#b06a00");
      setStatus("Speech check is not supported on this browser.");
      state.phase = "repeat-ready";
      return;
    }

    const transcript = (heard.transcript || "").trim();
    const attemptNumber = ++state.attempts[state.index];

    if(isCorrectRepeat(expected, transcript)){
      const stars = rewardStars(attemptNumber);
      state.stars[state.index] = stars;
      state.completedLines[state.index] = true;
      setResult(state.index, transcript || expected, "#2f9f5f");
      setTryMessage(state.index,"","");
      setStars(state.index, stars);
      playChime();
      await speak(stars === 3 ? "Excellent!" : stars === 2 ? "Great job!" : "Good work!");
      await moveToNextLine();
      return;
    }

    if(attemptNumber >= 3){
      state.stars[state.index] = 0;
      state.completedLines[state.index] = true;
      setStars(state.index,0);
      setResult(state.index,"","");
      setTryMessage(state.index,"You did a good Job. Nice try!","#b06a00");
      setStatus("You did a good Job. Nice try!");
      await speak("You did a good Job. Nice try!");
      await moveToNextLine();
      return;
    }

    setResult(state.index,"","");
    setTryMessage(state.index,"Sorry, try again!","#c62828");
    setStatus("Sorry, try again!");
    await speak("Sorry, try again!");
    state.phase = "repeat-ready";
    setStatus("Tap the microphone and try again.");
    updateProgress();
  }

  function setBusy(value){
    state.busy = !!value;
    micBtn.classList.toggle("is-busy", state.busy);
  }

  async function handleMic(){
    if(state.busy || state.phase === "done") return;
    getAudioCtx();
    if(state.phase === "reveal"){
      await revealCurrentLineAndSpeak();
      return;
    }
    await handleRepeatAttempt();
  }

  function readInstructions(){
    getAudioCtx();
    setStatus("Listen carefully.");
    speak("Welcome to Vertical Lines. The department store has many lines that go up and down. Tap the microphone to practice the conversation. Then tap the vertical lines on the store.");
  }

    function resetPage(){
    stopSpeaking();
    state.index = 0;
    state.phase = "reveal";
    state.busy = false;
    state.attempts.fill(0);
    state.stars.fill(0);
    state.completedLines.fill(false);
    state.verticalFound.fill(false);
    state.done = false;
    state.celebratedLines = false;
    convoLines.forEach(line => {
      line.classList.remove("show");
      line.querySelector(".bubble")?.classList.remove("sparkle");
      line.querySelector(".repeat-result").textContent = "";
      line.querySelector(".try-message").textContent = "";
      line.querySelector(".star-row").textContent = "";
      });
      lineZones.forEach(zone => zone.classList.remove("found"));
      clearTraceDrawing();
      setStatus("Cleared. Tap the microphone to begin again.");
      speak("Cleared. Tap the microphone to begin again.");
      updateProgress();
    }

    lineZones.forEach((zone,index) => {
      zone.addEventListener("click", () => {
        getAudioCtx();
        markZoneFound(index);
      });
    });

    traceCanvas.addEventListener("pointerdown", startTrace);
    traceCanvas.addEventListener("pointermove", moveTrace);
    traceCanvas.addEventListener("pointerup", endTrace);
    traceCanvas.addEventListener("pointerleave", endTrace);
    traceCanvas.addEventListener("pointercancel", endTrace);

  micBtn.addEventListener("click", handleMic);
  readBtn.addEventListener("click", readInstructions);

  cheerBtn.addEventListener("click", () => {
    getAudioCtx();
    playChime();
    clap();
    confetti();
    setStatus("You can do it! Great job!");
    speak("You can do it! Great job!");
  });

  clearBtn.addEventListener("click", resetPage);

  prevBtn.addEventListener("click", () => {
    stopSpeaking();
    window.location.href = "HorizontalLines_Lesson.html";
  });

  nextBtn.addEventListener("click", () => {
    stopSpeaking();
    window.location.href = "VerticalLines_Trace.html";
  });

    if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
    window.addEventListener("beforeunload", stopSpeaking);
    window.addEventListener("resize", resizeTraceCanvas);
    posterImg.addEventListener("load", resizeTraceCanvas, {once:true});

    window.addEventListener("load", () => {
      resizeTraceCanvas();
      updateProgress();
      setTimeout(() => {
        speak("Vertical Lines. Tap the microphone to practice the shopping conversation. Then tap the lines that go up and down.");
    }, 600);
  }, {once:true});
})();
</script>
