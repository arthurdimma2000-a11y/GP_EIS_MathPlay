<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Numbers - Add the Lines - Week 2</title>
<style>
  :root{
    --red:#f24b5e;
    --pink:#f5a1a5;
    --yellow:#f8df8a;
    --green:#9ed06a;
    --blue:#84d7ee;
    --ink:#474549;
    --purple:#6c4bbf;
    --gold:#ffd24a;
    --good:#1fa85b;
    --shadow:0 16px 36px rgba(0,0,0,.13);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff9ef;color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:8px;
    background-image:linear-gradient(#f1e6d8 1px,transparent 1px),linear-gradient(90deg,#f1e6d8 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{
    width:min(990px,100%);
    background:#fffdf7;
    border:8px solid var(--red);
    border-radius:30px;
    padding:12px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:visible;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{background:#fff;border:3px solid #ffe0ea;border-radius:999px;padding:8px 14px;font-weight:1000;box-shadow:0 8px 16px rgba(0,0,0,.08);}
  .badge span{color:var(--red);}
  .navs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .btn{
    border:none;border-radius:999px;padding:10px 15px;font-size:.98rem;font-weight:1000;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s ease,filter .1s ease;
  }
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .home{background:#25d17d;color:#fff;}
  .prev,.next{background:#f7dc6f;color:#8b5a00;}
  .read{background:var(--red);color:#fff;}
  .clear{background:#dfeaff;color:#1f3b6b;}
  .cheer{background:#c9f2d6;color:#166c38;}

  .poster-wrap{
    position:relative;
    width:min(940px,100%);
    margin:0 auto;
    border-radius:20px;
    overflow:hidden;
    background:#fff;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  .trace-canvas{
    position:absolute;
    background:transparent;
    touch-action:none;
    cursor:crosshair;
    z-index:5;
    border-radius:12px;
  }
  .active-hint{
    position:absolute;z-index:8;pointer-events:none;border:4px solid rgba(255,210,74,.85);border-radius:16px;
    box-shadow:0 0 0 6px rgba(255,210,74,.18),0 0 22px rgba(255,105,180,.35);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.82;}50%{transform:scale(1.02);opacity:1;}}

  /* answer boxes on the right side */
  #trace15{left:63.7%;top:27.2%;width:23.5%;height:10.7%;}
  #trace17{left:63.7%;top:40.6%;width:23.5%;height:10.7%;}
  #trace18{left:63.7%;top:54.2%;width:23.5%;height:10.8%;}
  #trace19{left:63.7%;top:67.7%;width:23.5%;height:10.8%;}
  #trace20{left:63.7%;top:81.5%;width:23.5%;height:10.6%;}

  .progress-card{
    margin:14px auto 0;width:min(940px,100%);background:#fff8fb;border:3px solid #ffd1df;border-radius:20px;padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }
  .progress-title{text-align:center;font-size:clamp(1rem,2.8vw,1.3rem);font-weight:1000;color:#4b3960;margin-bottom:8px;}
  .bar{height:16px;background:#e8eef8;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,#58c6ff,#83e79f);transition:width .2s ease;}
  .mini-progress{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;text-align:center;font-weight:900;font-size:.92rem;}
  .mini-box{background:#fff;border:2px solid #e7edf8;border-radius:12px;padding:6px;}
  .mini-box.done{border-color:#72db94;background:#effff4;}
  .stars{text-align:center;min-height:1.4em;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{margin:10px auto 0;width:min(940px,100%);min-height:1.6em;text-align:center;font-size:clamp(1rem,3vw,1.35rem);font-weight:1000;color:#5a3eb0;}
  .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:confettiFall 1.7s linear forwards;}
  @keyframes confettiFall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    .app{border-width:6px;padding:9px;border-radius:22px;}
    .mini-progress{grid-template-columns:repeat(2,1fr);}
    .topbar{justify-content:center;}
    .btn{font-size:.9rem;padding:9px 12px;}
  }
</style>
</head>

<main class="app">
  <div class="topbar">
    <div class="badge"><span>Numbers</span> · Add the lines to the number · Week 2</div>
    <div class="navs">
      <button class="btn home" id="homeBtn" type="button">🏠 Home</button>
      <button class="btn prev" id="prevBtn" type="button">← Previous</button>
      <button class="btn next" id="nextBtn" type="button">Next →</button>
    </div>
  </div>

    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function tick(volume = 0.06, freq = 820, duration = 0.03) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }

  function clap() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    for (let i = 0; i < 3; i++) {
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.12, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < data.length; j++) {
        data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (ctx.sampleRate * 0.02));
      }
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      src.buffer = buffer;
      gain.gain.value = 0.18;
      src.connect(gain).connect(ctx.destination);
      src.start(ctx.currentTime + i * 0.13);
    }
  }

  function loadChimeCandidate(idx) {
    if (!chimeAudio || idx >= CHIME_CANDIDATES.length) return false;
    chimeAudio.src = CHIME_CANDIDATES[idx];
    return true;
  }

  function playChime() {
    if (!chimeAudio) return;
    if (!chimeAudio.src) loadChimeCandidate(chimeIndex);
    chimeAudio.currentTime = 0;
    chimeAudio.play().catch(() => {

      || voices[0]

    if (!("speechSynthesis" in window)) return;

    for (let i = 1; i < points.length; i++) {
      const [x1, y1] = points[i - 1];
      const [x2, y2] = points[i];
      const dist = Math.hypot(x2 - x1, y2 - y1);
      if (dist > Math.min(w, h) * 0.32) continue;
      const steps = Math.max(2, Math.ceil(dist / 5));
      const seg = [];
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        seg.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]);
      }
      segments.push(seg);
    }

    const expandedPoints = [...points];
    segments.forEach(seg => expandedPoints.push(...seg));
    return { points: expandedPoints, segments };
  }
  function makePad(canvas, index) {
    const number = canvas.dataset.number;
    const state = {
      drawing:false,last:null,samples:[],visited:[],progress:0,completed:false,halfCheered:false
    };
    let ctx;
    let pathPts = [];
    let pathSegments = [];

    function setup() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.max(80, Math.round(rect.width * dpr));
      canvas.height = Math.max(60, Math.round(rect.height * dpr));
      ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 6.5;
      ctx.strokeStyle = "#2850c8";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const traceModel = numberTraceModel(number, rect.width, rect.height);
      pathSegments = traceModel.segments;
      pathPts = traceModel.points;
      state.visited = new Array(pathPts.length).fill(false);
      state.progress = 0;
      state.completed = false;
      state.halfCheered = false;
      state.samples = [];
      state.last = null;
      drawGuide();
    }

    function drawGuide() {
      if (!ctx) return;
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
    }

    function getPos(ev) {
      const r = canvas.getBoundingClientRect();
      const pt = ev.touches ? ev.touches[0] : ev;
      return { x: pt.clientX - r.left, y: pt.clientY - r.top };
    }

    function markVisited(x, y) {
      let gained = 0;
      const limit = Math.max(16, Math.min(24, canvas.getBoundingClientRect().width * 0.085));
      for (let i = 0; i < pathPts.length; i++) {
        if (state.visited[i]) continue;
        const dx = pathPts[i][0] - x;
        const dy = pathPts[i][1] - y;
        if (dx * dx + dy * dy <= limit * limit) {
          state.visited[i] = true;
          gained++;
        }
      }
      if (gained > 0) {
        state.progress = Math.round(state.visited.filter(Boolean).length / pathPts.length * 100);
        updateProgress();
        if (state.progress >= 45 && !state.halfCheered) {
          state.halfCheered = true;
          playChime();
          speak("Good tracing. Keep going.");
          setStatus("Good tracing. Keep going.");
        }
        if (state.progress >= 82 && !state.completed) {
          state.completed = true;
          playChime();
          clap();
          setStatus("Great job! Now trace the next number.");
          speak("Great job! Now trace the next number.");
          if (index < pads.length - 1) setActivePad(index + 1);
          else setActivePad(index);
        }
      }
    }

    function start(ev) {
      unlockVoice();
      getAudioCtx();
      ev.preventDefault();
      state.drawing = true;
      state.last = getPos(ev);
      ctx.save();
      ctx.strokeStyle = "#2950d2";
      ctx.lineWidth = 5.5;
      ctx.beginPath();
      ctx.moveTo(state.last.x, state.last.y);
      markVisited(state.last.x, state.last.y);
    }

    function move(ev) {
      if (!state.drawing) return;
      ev.preventDefault();
      const p = getPos(ev);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      tick(0.03, 650 + Math.random() * 220, 0.02);
      const steps = Math.max(1, Math.ceil(Math.hypot(p.x - state.last.x, p.y - state.last.y) / 6));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        markVisited(state.last.x + (p.x - state.last.x) * t, state.last.y + (p.y - state.last.y) * t);
      }
      state.last = p;
    }

    function end(ev) {
      if (!state.drawing) return;
      ev.preventDefault();
      state.drawing = false;
      ctx.closePath();
      ctx.restore();
    }

    canvas.addEventListener("pointerdown", start);
    canvas.addEventListener("pointermove", move);
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointerleave", end);
    canvas.addEventListener("pointercancel", end);

    const api = {
      number,
      get progress() { return state.progress; },
      reset() { setup(); updateProgress(); }
    };
    setup();
    return api;
  }

  function setActivePad(index) {
    activePadIndex = index;
    const c = canvases[index];
    if (!c || !activeHint || !posterWrap) return;
    const wrapRect = posterWrap.getBoundingClientRect();
    const rect = c.getBoundingClientRect();
    activeHint.hidden = false;
    activeHint.style.left = ((rect.left - wrapRect.left) / wrapRect.width * 100) + "%";
    activeHint.style.top = ((rect.top - wrapRect.top) / wrapRect.height * 100) + "%";
    activeHint.style.width = (rect.width / wrapRect.width * 100) + "%";
    activeHint.style.height = (rect.height / wrapRect.height * 100) + "%";
  }

  function updateProgress() {
    let total = 0;
    pads.forEach(p => {
      total += p.progress;
      const pct = document.getElementById("pct" + p.number);
      const box = document.getElementById("box" + p.number);
      if (pct) pct.textContent = p.progress + "%";
      if (box) box.classList.toggle("done", p.progress >= 82);
    });
    const overall = Math.round(total / Math.max(1, pads.length));
    overallText.textContent = overall + "%";
    overallFill.style.width = overall + "%";

    if (overall >= 95 && !completedAll) {
      completedAll = true;
      starsEl.textContent = "⭐ ⭐ ⭐";
      setStatus("Wow! You added the lines and traced all the numbers!");
      playChime();
      clap();
      confetti();
      speak("Wow! You added the lines and traced all the numbers. You are super smart!");
    } else if (overall >= 70) {
      starsEl.textContent = "⭐ ⭐";
      setStatus("Great job! Keep tracing the dotted numbers.");
    } else if (overall >= 35) {
      starsEl.textContent = "⭐";
      setStatus("Good job. Keep going.");
    } else if (overall > 0) {
      setStatus("Keep tracing carefully.");
    }

    saveProgress(overall);
  }

  function saveProgress(score) {
    try {
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[pageId] = {
        pageId,
        file: pageId + ".html",
        level:"A",
        week:2,
        month:1,
        type:"tracing",
        activityType:"lesson",
        score:Math.round(score),
        tracing:Math.round(score),
        stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0,
        completed:score >= 95,
        skills:{reading:1,writing:score >= 95 ? 3 : score > 0 ? 1 : 0,listening:1,speaking:0},
        savedAt:new Date().toISOString(),
        ts:Date.now()
      };
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", pageId + ".html");
    } catch (_ ) {}
  }

  function intro() {
    unlockVoice();
    getAudioCtx();
    setActivePad(activePadIndex);
    setStatus("Listen carefully. Trace the dotted answer numbers.");
    speak("Look at the lines. Add the lines to ten. Then trace the dotted answer numbers. Trace fifteen, seventeen, eighteen, nineteen, and twenty. Start from the top row and trace carefully.");
  }

  pads = canvases.map((canvas, i) => makePad(canvas, i));
  updateProgress();
  setActivePad(0);

  readBtn.addEventListener("click", intro);
  cheerBtn.addEventListener("click", () => {
    unlockVoice();
    getAudioCtx();
    playChime();
    clap();
    confetti();
    setStatus("You can do it! Great job!");
    speak("You can do it! Great job!");
  });
  clearBtn.addEventListener("click", () => {
    completedAll = false;
    starsEl.textContent = "";
    pads.forEach(p => p.reset());
    setActivePad(0);
    setStatus("Cleared. Start tracing again.");
    speak("Cleared. Start tracing again.");
  });
  homeBtn.addEventListener("click", () => { if (homeHref) window.location.href = homeHref; });
  prevBtn.addEventListener("click", () => { if (prevHref) window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { if (nextHref) window.location.href = nextHref; });

  window.addEventListener("resize", () => {
    pads = canvases.map((canvas, i) => makePad(canvas, i));
    setActivePad(activePadIndex);
    updateProgress();
  });

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      chosenVoice = chooseVoice();
    };
  }
  window.addEventListener("beforeunload", () => {
    try { window.speechSynthesis.cancel(); } catch (_ ) {}
  });

  ["pointerdown","touchstart","keydown","click"].forEach(evt => {
    window.addEventListener(evt, unlockVoice, { once:true, passive: evt !== "keydown" });
  });

  window.addEventListener("load", () => {
    setTimeout(intro, 650);
  }, {once:true});
})();
</script>
