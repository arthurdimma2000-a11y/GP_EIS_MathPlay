<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Directional Lines - Shoe Store Conversation Lesson</title>
<style>
:root{
  --ink:#29272d;
  --bg:#fff8f2;
  --card:#ffffff;
  --orange:#f59a1a;
  --red:#ef4052;
  --yellow:#f6da7b;
  --blue:#dfeaff;
  --success:#2f9f5f;
  --danger:#cf2836;
  --gold:#ffd24a;
  --shadow:0 12px 28px rgba(0,0,0,.10);
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px}
img{max-width:100%;height:auto;display:block}
.app{position:relative;width:min(980px,100%);background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px}
.home-btn{position:absolute;right:12px;top:8px;width:66px;height:66px;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff,#ffe8b9);border:3px solid #f0b23f;border-radius:50%;text-decoration:none;z-index:30;color:#8b5a00;
  font-size:32px;font-weight:900;box-shadow:0 8px 10px rgba(0,0,0,.22);transform-origin:top center;animation:homeSwing 2.4s ease-in-out infinite}
@keyframes homeSwing{0%{transform:translateY(18%) rotate(-6deg)}50%{transform:translateY(18%) rotate(8deg)}100%{transform:translateY(18%) rotate(-6deg)}}
.page-title{margin:0 72px 8px 0;text-align:center;font-size:clamp(1.55rem,4vw,2.9rem);font-weight:1000;color:var(--orange);text-shadow:0 2px 0 #fff}
.poster-card{position:relative;width:min(904px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#f26c73;box-shadow:0 8px 20px rgba(0,0,0,.10)}
.poster-image{width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.focus-zone{position:absolute;pointer-events:none;z-index:8;border-radius:999px;opacity:0;transform:scale(.96);transition:opacity .18s ease,transform .18s ease}
.focus-zone.show{opacity:1;transform:scale(1);outline:4px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 7px rgba(255,215,0,.34),0 0 18px rgba(255,153,0,.55)}
.focus-zone.sparkle{opacity:1;transform:scale(1.035);background:rgba(255,238,120,.18);outline:5px solid rgba(255,185,0,.97);
  box-shadow:0 0 14px rgba(255,190,0,.98),0 0 27px rgba(255,105,180,.45);animation:sparklePulse .9s ease-in-out infinite}
@keyframes sparklePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.focus-shoes{left:4.3%;top:48.5%;width:23.5%;height:7.3%}
.focus-help{left:72.8%;top:36.2%;width:23.0%;height:7.0%}
.lesson-panel{width:min(904px,100%);margin:12px auto 0;border:3px solid rgba(245,154,26,.28);border-radius:18px;
  background:linear-gradient(180deg,#fff,#fffaf2);padding:12px;display:grid;gap:10px}
.intro-text{text-align:center;font-size:clamp(.95rem,2.3vw,1.08rem);font-weight:900;color:#7b5a12}
.conversation-panel{display:grid;gap:10px}
.convo-line{display:none;align-items:flex-start;gap:8px}
.convo-line.show{display:flex}
.convo-line.right{justify-content:flex-end}
.bubble-stack{display:flex;flex-direction:column;gap:6px;max-width:min(100%,560px)}
.convo-line.right .bubble-stack{align-items:flex-end}
.bubble{position:relative;padding:12px 16px;border-radius:18px;font-size:clamp(1rem,2.3vw,1.28rem);font-weight:900;line-height:1.25;
  box-shadow:0 8px 16px rgba(0,0,0,.12);background:#fff}
.bubble.boy{border:3px solid #59b9ed}
.bubble.helper{border:3px solid var(--orange)}
.bubble.sparkle{background:linear-gradient(120deg,#fff2a8,#ffd1f0,#c7f1ff);
  box-shadow:0 0 12px rgba(255,214,0,.75),0 0 20px rgba(255,165,0,.45);animation:sparklePulse .95s ease-in-out infinite}
.repeat-result{min-height:1.2em;font-size:clamp(1rem,2.4vw,1.35rem);line-height:1.2;font-weight:1000;color:var(--success)}
.try-message{min-height:1.2em;font-size:clamp(.95rem,2.3vw,1.1rem);line-height:1.2;font-weight:1000}
.star-row{min-height:1.15em;display:flex;gap:6px;color:var(--gold);font-size:clamp(1.35rem,3.4vw,2rem);line-height:1;
  text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28)}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;width:100%}
.mic-hint{display:none !important;position:relative;align-items:center;gap:8px;background:#fff;border:2px solid #ffe0b3;border-radius:14px;
  padding:6px 10px;box-shadow:0 8px 16px rgba(0,0,0,.12)}
.hint-copy{font-size:.95rem;font-weight:900;color:#e28b11;white-space:nowrap}
.finger-cue{position:absolute;left:50%;top:-27px;transform:translateX(-50%);font-size:1.8rem;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));animation:fingerBob 1s ease-in-out infinite;display:none;pointer-events:none}
.finger-cue.show{display:block}
@keyframes fingerBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}
.btn,.mic-icon-btn{min-height:46px;min-width:46px;border:none;border-radius:999px;cursor:pointer;font-weight:900;
  box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .12s ease,filter .12s ease}
.btn:hover,.mic-icon-btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn:active,.mic-icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn{padding:10px 16px;font-size:.95rem}
.btn.prev{background:#f8f0c7;color:#9c7b2f}
.btn.next{background:var(--yellow);color:#8b5a00}
.btn.stop{background:var(--blue);color:#1f3b6b}
.btn.read{background:#ffb46b;color:#fff}
.mic-icon-btn{position:relative;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:none}
.mic-icon-btn img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.mic-icon-btn.is-busy{opacity:.7;pointer-events:none;transform:scale(.97)}
.status-wrap{display:grid;gap:6px}
.conversation-status,.recording-status{min-height:1.25em;text-align:center;font-weight:1000}
.conversation-status{color:#6c4bbf;font-size:clamp(.95rem,2.5vw,1.1rem)}
.recording-status{color:#555;font-size:.92rem}
.footer-note{text-align:center;color:#666;font-size:.92rem;font-weight:800}
.recording-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f44336;margin-right:6px;vertical-align:middle;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.7}50%{transform:scale(1.12);opacity:1}100%{transform:scale(.92);opacity:.7}}
@media (max-width:560px){
  body{padding:6px}
  .app{border-radius:14px;padding:8px}
  .page-title{font-size:1.35rem;margin-right:58px}
  .home-btn{width:54px;height:54px;font-size:26px}
  .lesson-panel{padding:10px}
  .controls{gap:8px}
  .mic-hint{width:100%;justify-content:center}
}
</style>
</head>

    { text:"I will help you.", focus:1 }
  ];

  const convoLines = [...document.querySelectorAll(".convo-line")];

  let currentLineIndex = 0;
  let introPlayed = false;
  let recognition = null;
  let femaleVoice = null;
  let speechUnlocked = false;
  let audioCtx = null;

  function setStatus(message) {
    conversationStatus.textContent = message || "";
  }

  function setRecordingStatus(message, recording = false) {
    recordingStatus.innerHTML = recording
      ? `<span class="recording-dot"></span>${message}`
      : (message || "");
  }

  function getAudioCtx() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function beep(frequency = 720, duration = 0.08, wait = 0, type = "sine", gain = 0.05) {
    const context = getAudioCtx();
    if (!context) return;
    const oscillator = context.createOscillator();
    const volume = context.createGain();
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    volume.gain.value = gain;
    oscillator.connect(volume).connect(context.destination);
    oscillator.start(context.currentTime + wait);
    oscillator.stop(context.currentTime + wait + duration);
  }

  function playChime() {
    try {
      chimeAudio.currentTime = 0;
      chimeAudio.play().catch(() => {
        beep(820, 0.07, 0, "sine", 0.04);
        beep(1120, 0.07, 0.07, "sine", 0.04);
        beep(1450, 0.08, 0.14, "sine", 0.04);
      });
    } catch (_error) {
      beep(820, 0.07, 0, "sine", 0.04);
      beep(1120, 0.07, 0.07, "sine", 0.04);
      beep(1450, 0.08, 0.14, "sine", 0.04);
    }
  }

  function clap() {
    const context = getAudioCtx();
    if (!context) return;
    for (let i = 0; i < 7; i++) {
      const buffer = context.createBuffer(1, 1700, context.sampleRate);
      const channel = buffer.getChannelData(0);
      for (let j = 0; j < channel.length; j++) {
        channel[j] = (Math.random() * 2 - 1) * Math.exp(-j / 270);
      }
      const source = context.createBufferSource();
      const gain = context.createGain();
      source.buffer = buffer;
      gain.gain.value = 0.16;
      source.connect(gain).connect(context.destination);
      source.start(context.currentTime + i * 0.065);
    }
  }

  function cheer() {
    playChime();
    clap();
    beep(900, 0.08, 0.03, "triangle", 0.04);
    beep(1120, 0.09, 0.12, "triangle", 0.04);
  }

  function normalize(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function similarity(target, spoken) {
    const targetWords = normalize(target).split(" ").filter(Boolean);
    const spokenWords = normalize(spoken).split(" ").filter(Boolean);
    if (!targetWords.length || !spokenWords.length) return 0;
    const spokenSet = new Set(spokenWords);
    const hits = targetWords.filter(word => spokenSet.has(word)).length;
    return hits / targetWords.length;
  }

  function pickFemaleVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    const english = voices.filter(voice => /^en/i.test(voice.lang || ""));
    const preferred = ["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"];
    for (const name of preferred) {
      const found = english.find(voice => (voice.name || "").toLowerCase().includes(name.toLowerCase()));
      if (found) return found;
    }
    return english.find(voice => /us|united states/i.test((voice.lang || "") + " " + (voice.name || "")))
      || english[0]
      || voices[0]
      || null;
  }

  function speak(text, options = {}) {
    if (!("speechSynthesis" in window)) {
      if (typeof options.onend === "function") setTimeout(options.onend, 300);
      return;
    }
    try {
      window.speechSynthesis.cancel();
      femaleVoice = femaleVoice || pickFemaleVoice();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      if (femaleVoice) utterance.voice = femaleVoice;
      utterance.rate = options.rate || 0.92;
      utterance.pitch = options.pitch || 1.14;
      utterance.volume = 1;
      utterance.onend = () => {
        if (typeof options.onend === "function") options.onend();
      };
      utterance.onerror = () => {
        if (typeof options.onend === "function") options.onend();
      };
      window.speechSynthesis.speak(utterance);
    } catch (_error) {
      if (typeof options.onend === "function") options.onend();
    }
  }

  function clearFocus() {
    focusZones.forEach(zone => zone.classList.remove("show", "sparkle"));
  }

  function showFocus(index, sparkle = false) {
    clearFocus();
    const zone = focusZones[index];
    if (!zone) return;
    zone.classList.add(sparkle ? "sparkle" : "show");
  }

  function unlockAudio() {
    if (speechUnlocked) return;
    speechUnlocked = true;
    getAudioCtx();
    femaleVoice = pickFemaleVoice();
  }

  function showLine(index) {
    const line = convoLines[index];
    if (!line) return;
    line.classList.add("show");
    showFocus(lines[index].focus, false);
  }

  function resetBubbleState(index) {
    const line = convoLines[index];
    if (!line) return;
    line.querySelector(".bubble").classList.remove("sparkle");
    line.querySelector(".repeat-result").textContent = "";
    line.querySelector(".try-message").textContent = "";
    line.querySelector(".star-row").textContent = "";
  }

  function resetAll() {
    currentLineIndex = 0;
    convoLines.forEach((line, index) => {
      line.classList.remove("show");
      resetBubbleState(index);
    });
    clearFocus();
    setStatus("Cleared. Tap the microphone to start again.");
    setRecordingStatus("");
    micIconBtn.classList.remove("is-busy");
    micFinger.classList.add("show");
    micFinger2.classList.remove("show");
    try { window.speechSynthesis.cancel(); } catch (_error) {}
    if (recognition) {
      try { recognition.stop(); } catch (_error) {}
    }
  }

  function startIntro() {
    if (introPlayed) return;
    introPlayed = true;
    setStatus("Listen carefully.");
    speak(
      "Hello, my smart friend. This is Directional Lines. We are in a shoe store. " +
      "The boy says, I need shoes. The helper says, I will help you. " +
      "Tap the microphone, listen, and repeat the air bubble sentences.",
      {
        onend: () => {
          setStatus("Tap the microphone to begin the air-bubbles conversation.");
          micFinger.classList.add("show");
          micFinger2.classList.remove("show");
        }
      }
    );
  }

  function readPoster() {
    setStatus("Reading the poster.");
    speak(
      "Directional Lines. Which style? I need shoes. I will help you. The shoe store has many different lines.",
      {
        onend: () => setStatus("Finished reading. Tap the microphone to practise.")
      }
    );
  }

  function acceptLine() {
    const line = convoLines[currentLineIndex];
    line.querySelector(".bubble").classList.remove("sparkle");
    line.querySelector(".repeat-result").textContent = lines[currentLineIndex].text;
    line.querySelector(".try-message").style.color = "var(--success)";
    line.querySelector(".try-message").textContent = "Great job!";
    line.querySelector(".star-row").textContent = "⭐";
    setRecordingStatus("");
    cheer();
    setStatus("Excellent! Let's continue.");

    const isLast = currentLineIndex === lines.length - 1;
    const praise = isLast
      ? "Wonderful! You said both shoe store sentences. Great job!"
      : "Great job! Listen to the next sentence.";

    speak(praise, {
      onend: () => {
        currentLineIndex++;
        if (currentLineIndex < lines.length) {
          showLine(currentLineIndex);
          setStatus("Listen to the next sentence.");
          beep(830, 0.04, 0, "square", 0.025);
          speak(lines[currentLineIndex].text, {
            onend: () => {
              setStatus("Tap the microphone again to repeat after me.");
              micFinger.classList.remove("show");
              micFinger2.classList.add("show");
            }
          });
        } else {
          clearFocus();
          setStatus("You finished the conversation. Tap Read poster or Clear to practise again.");
          micFinger.classList.remove("show");
          micFinger2.classList.remove("show");
          playChime();
        }
      }
    });
  }

  function rejectLine() {
    const line = convoLines[currentLineIndex];
    line.querySelector(".try-message").style.color = "var(--danger)";
    line.querySelector(".try-message").textContent = "Sorry, try again!";
    line.querySelector(".star-row").textContent = "";
    setStatus("Sorry, try again.");
    setRecordingStatus("Tap the microphone and say it again.");
    speak("Sorry, try again.", {
      onend: () => showFocus(lines[currentLineIndex].focus, true)
    });
  }

  function startRecognition() {
    const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognitionClass) {
      micIconBtn.classList.remove("is-busy");
      setRecordingStatus("Voice checking is not supported in this browser. Please open this page in Chrome or Edge.");
      setStatus("Microphone voice checking is not available on this browser.");
      speak("Please open this activity in Chrome or Edge so I can hear your voice.");
      return;
    }

    recognition = new SpeechRecognitionClass();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    micIconBtn.classList.add("is-busy");
    setRecordingStatus("Listening... Say it now.", true);

    recognition.onresult = event => {
      const spoken = event.results[0][0].transcript || "";
      const score = similarity(lines[currentLineIndex].text, spoken);
      if (score >= 0.5) acceptLine();
      else rejectLine();
    };

    recognition.onerror = () => {
      micIconBtn.classList.remove("is-busy");
      setRecordingStatus("Could not hear clearly. Tap the microphone and try again.");
      rejectLine();
    };

    recognition.onend = () => {
      micIconBtn.classList.remove("is-busy");
    };

    try {
      recognition.start();
    } catch (_error) {
      micIconBtn.classList.remove("is-busy");
      rejectLine();
    }
  }

  function micStep() {
    unlockAudio();

    if (currentLineIndex >= lines.length) {
      setStatus("You already finished. Tap Clear to start again.");
      return;
    }

    const line = convoLines[currentLineIndex];

    if (!line.classList.contains("show")) {
      showLine(currentLineIndex);
      setStatus("Listen carefully.");
      beep(830, 0.04, 0, "square", 0.025);
      speak(lines[currentLineIndex].text, {
        onend: () => {
          setStatus("Tap the microphone again to repeat after me.");
          micFinger.classList.remove("show");
          micFinger2.classList.add("show");
        }
      });
      return;
    }

    line.querySelector(".bubble").classList.add("sparkle");
    showFocus(lines[currentLineIndex].focus, true);
    setStatus("Repeat after me.");
    speak("Repeat after me. " + lines[currentLineIndex].text, {
      onend: () => startRecognition()
    });
  }

  readBtn.addEventListener("click", () => {
    unlockAudio();
    readPoster();
  });

  clearBtn.addEventListener("click", resetAll);
  micIconBtn.addEventListener("click", micStep);

  homeBtn.addEventListener("click", event => {
    if (!homeHref) event.preventDefault();
  });

  prevBtn.addEventListener("click", () => {
    if (prevHref) window.location.href = prevHref;
    else window.history.back();
  });

  nextBtn.addEventListener("click", () => {
    if (nextHref) window.location.href = nextHref;
  });

  ["pointerdown", "touchstart", "keydown", "click"].forEach(eventName => {
    window.addEventListener(eventName, unlockAudio, { once:true });
  });

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      femaleVoice = pickFemaleVoice();
    };
  }

  window.addEventListener("beforeunload", () => {
    try { window.speechSynthesis.cancel(); } catch (_error) {}
  });

  window.addEventListener("load", () => {
    setTimeout(startIntro, 650);
  }, { once:true });
})();
</script>
</body>
</html>
