<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2 Different Lines Quiz - Week 4</title>
<style>
:root{--orange:#ff9918;--orangeDark:#d87900;--cream:#fff9ef;--ink:#292631;--red:#f24b5e;--blue:#58b9ef;--green:#35b558;--purple:#7049c6;--gold:#ffd24a;--shadow:0 16px 34px rgba(0,0,0,.14);font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--cream);color:var(--ink)}body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;background-image:linear-gradient(#f1e6d8 1px,transparent 1px),linear-gradient(90deg,#f1e6d8 1px,transparent 1px);background-size:28px 28px}.app{width:min(1120px,100%);background:#fffdf8;border:8px solid var(--orange);border-radius:30px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}.week{position:absolute;right:18px;top:18px;background:#fff;border:4px solid var(--orange);border-radius:13px;padding:5px 12px;font-size:clamp(.95rem,2.4vw,1.35rem);font-weight:1000;z-index:5}.top-nav{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}.badge{background:#fff6e6;border:3px solid #ffd39a;border-radius:999px;padding:8px 13px;font-weight:1000;color:var(--orangeDark);box-shadow:0 7px 14px rgba(0,0,0,.07)}.nav-buttons,.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.btn{border:none;border-radius:999px;padding:10px 16px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s,filter .1s}.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}.btn.home{background:#25d17d;color:#fff}.btn.back,.btn.clear{background:#dfeaff;color:#203b6d}.btn.next{background:#f7dc6f;color:#8a5700}.btn.read{background:var(--red);color:#fff}.btn.cheer{background:#c9f2d6;color:#176e39}.title{margin:-6px 78px 11px 0;text-align:center;font-size:clamp(2.4rem,7vw,5.25rem);line-height:.95;color:#fff;font-weight:1000;-webkit-text-stroke:8px var(--orange);paint-order:stroke fill;text-shadow:0 5px 0 rgba(255,153,24,.25)}
.quiz-area{display:grid;grid-template-columns:.9fr 1.1fr;gap:13px}.panel{background:#fff;border:4px solid #ffe5c5;border-radius:23px;padding:12px;box-shadow:0 8px 17px rgba(0,0,0,.06)}.panel-title{text-align:center;font-size:clamp(1.14rem,3vw,1.6rem);font-weight:1000;color:var(--orangeDark);margin-bottom:9px}.poster-frame{background:#fff;border:4px solid #ffd3a1;border-radius:18px;overflow:hidden}.poster{display:block;width:100%;height:min(69vh,650px);object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}.poster-caption{text-align:center;background:#fff6e8;color:#975e00;font-weight:1000;padding:8px;font-size:.92rem}.quiz-box{background:#fffaf3;border:3px solid #ffd8a7;border-radius:20px;padding:13px}.q-chip{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:6px 15px;font-weight:1000;margin-bottom:9px}.question{font-size:clamp(1.35rem,3.5vw,2rem);line-height:1.24;text-align:center;font-weight:1000;color:#352b25;min-height:74px;display:grid;place-items:center}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.answer{min-height:76px;border:4px solid #ffe3b9;background:#fff;border-radius:19px;padding:10px;font-size:clamp(1.03rem,2.8vw,1.28rem);font-weight:1000;color:#654300;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.11)}.answer:hover{transform:scale(1.018)}.answer.correct{background:#d8ffd8;border-color:#22b46b;color:#126c36}.answer.wrong{background:#ffe0e7;border-color:#e03245;color:#a12036}.progress-card{margin-top:12px;background:#fff9fb;border:3px solid #ffd1df;border-radius:18px;padding:10px;display:grid;gap:8px}.progress-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:1000;color:#4b3960}.bar{height:16px;background:#e8eef8;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.13)}.fill{height:100%;width:0%;background:linear-gradient(90deg,#58c6ff,#83e79f);transition:width .18s ease}.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chip{background:#fff;border:3px solid #ffe5c5;border-radius:14px;text-align:center;font-weight:1000;padding:8px}.chip span{display:block;color:var(--purple)}.status{min-height:1.45em;text-align:center;margin-top:9px;font-size:clamp(1rem,2.7vw,1.25rem);font-weight:1000;color:#5b40b2}.stars{text-align:center;min-height:1.25em;font-size:2.05rem;letter-spacing:3px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.25)}.review{display:none;text-align:center;padding:14px;background:#fffaf0;border-radius:18px;border:3px dashed #ffd39a;font-weight:1000;color:#433224;font-size:1.17rem;margin-top:10px}.review.show{display:block}.confetti{position:fixed;top:-18px;width:10px;height:15px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.08}}@media(max-width:880px){.quiz-area{grid-template-columns:1fr}.poster{height:min(53vh,490px)}.title{-webkit-text-stroke:5px var(--orange);margin-right:0}}@media(max-width:540px){.app{padding:8px;border-width:5px;border-radius:20px}.week{position:static;display:inline-block;margin-bottom:8px}.answers{grid-template-columns:1fr}.score-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app" aria-label="Different Lines Week 4 interactive quiz"><audio id="chimeAudio" src="/assets/audio/chimes/chime.mp3" preload="auto"></audio><div class="week">Week 4</div><div class="top-nav"><div class="badge">⭐ Level A · Different Lines Quiz</div><div class="nav-buttons"><button class="btn back" id="backBtn" type="button">⬅ Back</button><button class="btn next" id="nextBtn" type="button">Next ➜</button><button class="btn home" id="homeBtn" type="button">🏠 Home</button></div></div><h1 class="title">Different Lines</h1>
<section class="quiz-area"><div class="panel"><div class="panel-title">Look at the Original Poster</div><div class="poster-frame"><img class="poster" id="posterImage" src="/assets/images/Bk2Shapes/poster_wearing.png" alt="Question poster"><div class="poster-caption" id="posterCaption">What are you wearing?</div></div></div>
<div class="panel"><div class="panel-title">Fun Picture Quiz</div><div class="quiz-box"><div class="q-chip" id="questionChip">Question 1 of 10</div><div class="question" id="questionQuestion">Loading...</div><div class="answers" id="answers"></div></div><div class="review" id="review"></div><div class="progress-card"><div class="progress-head"><span>Quiz Progress</span><span id="progressText">0%</span></div><div class="bar"><div class="fill" id="progressFill"></div></div><div class="score-row"><div class="chip">Correct<span id="correctText">0</span></div><div class="chip">Question<span id="questionTextChip">1 / 10</span></div><div class="chip">Stars<span id="starText">0</span></div></div><div class="stars" id="stars">☆ ☆ ☆</div></div><div class="status" id="status">Listen, look, and tap an answer.</div><div class="controls"><button class="btn read" id="readBtn" type="button">🔊 Read</button><button class="btn clear" id="restartBtn" type="button">Restart ✕</button><button class="btn cheer" id="cheerBtn" type="button">👏 Cheer</button></div></div></section>
</main>
<script>
(() => {
"use strict";
const PAGE_ID="Bk2LAQuiz4",HOME_PAGE="../../../../../index.html",PREVIOUS_PAGE="Bk2LAGame4.html",NEXT_PAGE="../../../../Book 3/Book3level-a/week-1/Monday/Bk3Wk1ArtClassA.html";
const questions=[
{poster:"/assets/images/Bk2Shapes/poster_wearing.png",caption:"The bride is getting ready.",q:"Which clothing item is the bride wearing on her body?",answer:"a dress",choices:["a cake","a dress","a book","a hat"]},
{poster:"/assets/images/Bk2Shapes/poster_wearing.png",caption:"Look at the bride's things.",q:"Which item can go over the bride's hair?",answer:"a veil",choices:["make up","a veil","a cake","shorts"]},
{poster:"/assets/images/Bk2Shapes/poster_count_lines.png",caption:"The makeup has 7 straight lines.",q:"What kind of lines does the makeup have?",answer:"straight lines",choices:["straight lines","curved lines","zig-zag lines","circle lines"]},
{poster:"/assets/images/Bk2Shapes/poster_count_lines.png",caption:"Count the makeup lines.",q:"How many straight lines does the makeup have?",answer:"7",choices:["3","5","7","10"]},
{poster:"/assets/images/Bk2Shapes/poster_count_lines.png",caption:"The dress has 3 zig-zag lines.",q:"What kind of lines does the dress have?",answer:"zig-zag lines",choices:["curved lines","zig-zag lines","straight lines","no lines"]},
{poster:"/assets/images/Bk2Shapes/poster_count_lines.png",caption:"Count the dress lines.",q:"How many zig-zag lines does the dress have?",answer:"3",choices:["7","10","5","3"]},
{poster:"/assets/images/Bk2Shapes/poster_count_lines.png",caption:"The veil has 5 curved lines.",q:"What kind of lines does the veil have?",answer:"curved lines",choices:["straight lines","curved lines","zig-zag lines","square lines"]},
{poster:"/assets/images/Bk2Shapes/poster_count_lines.png",caption:"Count the veil lines.",q:"How many curved lines does the veil have?",answer:"5",choices:["9","5","3","7"]},
{poster:"/assets/images/Bk2Shapes/poster_numbers_cakes.png",caption:"Count the first cake's lines.",q:"Circle the correct number for the first cake.",answer:"9",choices:["6","7","9","10"]},
{poster:"/assets/images/Bk2Shapes/poster_numbers_cakes.png",caption:"Count the second cake's lines.",q:"Circle the correct number for the second cake.",answer:"10",choices:["9","10","7","5"]}
];
const $=id=>document.getElementById(id),poster=$("posterImage"),caption=$("posterCaption"),chip=$("questionChip"),question=$("questionQuestion"),answers=$("answers"),progressText=$("progressText"),progressFill=$("progressFill"),correctText=$("correctText"),questionTextChip=$("questionTextChip"),starText=$("starText"),stars=$("stars"),status=$("status"),review=$("review"),chimeAudio=$("chimeAudio");
let index=0,correct=0,locked=false,audioCtx=null;
function voice(){if(!("speechSynthesis" in window))return null;const all=speechSynthesis.getVoices()||[],en=all.filter(v=>/^en/i.test(v.lang||""));for(const n of ["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"]){const hit=en.find(v=>(v.name||"").toLowerCase().includes(n.toLowerCase()));if(hit)return hit;}return en.find(v=>/us|united states/i.test((v.lang||"")+" "+(v.name||"")))||en[0]||all[0]||null;}
function speak(text,done){if(!("speechSynthesis" in window)){if(done)done();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;u.pitch=1.16;u.volume=1;const v=voice();if(v)u.voice=v;if(done){u.onend=done;u.onerror=done;}speechSynthesis.speak(u);}catch(e){if(done)done();}}
function audio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});return audioCtx;}
function beep(f=850,d=.09){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function chime(){try{const a=chimeAudio.cloneNode(true);a.play().catch(()=>beep());}catch(e){beep();}}
function clap(){const a=audio();if(!a)return;for(let i=0;i<10;i++){const s=a.currentTime+i*.055,b=a.createBuffer(1,Math.floor(a.sampleRate*.06),a.sampleRate),d=b.getChannelData(0);for(let n=0;n<d.length;n++)d[n]=(Math.random()*2-1)*Math.pow(1-n/d.length,2);const src=a.createBufferSource(),g=a.createGain();src.buffer=b;g.gain.setValueAtTime(.032,s);g.gain.exponentialRampToValueAtTime(.001,s+.06);src.connect(g);g.connect(a.destination);src.start(s);src.stop(s+.06);}}
function confetti(){const c=["#ff9918","#f24b5e","#58b9ef","#35b558","#ffd24a","#7049c6"];for(let i=0;i<40;i++){const p=document.createElement("div");p.className="confetti";p.style.left=Math.random()*100+"vw";p.style.background=c[Math.floor(Math.random()*c.length)];p.style.animationDelay=Math.random()*.3+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),2100);}}
function render(){locked=false;review.classList.remove("show");const q=questions[index];poster.src=q.poster;caption.textContent=q.caption;chip.textContent="Question "+(index+1)+" of "+questions.length;question.textContent=q.q;answers.innerHTML="";q.choices.forEach(value=>{const b=document.createElement("button");b.className="answer";b.type="button";b.textContent=value;b.addEventListener("click",()=>answer(b,value));answers.appendChild(b);});questionTextChip.textContent=(index+1)+" / "+questions.length;status.textContent="Listen, look, and tap the best answer.";update(false);speak("Question "+(index+1)+". "+q.q);}
function answer(b,value){if(locked)return;const q=questions[index];if(value!==q.answer){b.classList.add("wrong");status.textContent="Good try. Look at the picture and try again.";speak("Good try. Look at the picture and try again.");setTimeout(()=>b.classList.remove("wrong"),650);return;}locked=true;b.classList.add("correct");correct++;chime();clap();status.textContent="Correct! Wonderful job.";update(true);speak("Correct! Wonderful job.",()=>setTimeout(()=>{if(index<questions.length-1){index++;render();}else finish();},450));}
function update(answered){const complete=index+(answered?1:0),pct=Math.round(complete/questions.length*100),score=Math.round(correct/questions.length*100),n=score>=80?3:score>=50?2:correct>0?1:0;progressText.textContent=pct+"%";progressFill.style.width=pct+"%";correctText.textContent=correct;starText.textContent=n;stars.textContent=n?"★ ".repeat(n).trim()+" "+"☆ ".repeat(3-n).trim():"☆ ☆ ☆";save(score,n,complete===questions.length);}
function finish(){const score=Math.round(correct/questions.length*100),n=score>=80?3:score>=50?2:1;chip.textContent="Quiz Complete";question.textContent="You got "+correct+" out of "+questions.length+" correct!";answers.innerHTML="";review.classList.add("show");review.textContent="You learned: makeup has 7 straight lines, the dress has 3 zig-zag lines, the veil has 5 curved lines, and the cakes match 9 and 10.";progressText.textContent="100%";progressFill.style.width="100%";stars.textContent="★ ".repeat(n).trim();status.textContent="Fantastic work! You completed the quiz.";chime();clap();confetti();speak("Fantastic work! You completed the Different Lines quiz. You are a line and number superstar!");save(score,n,true);}
function save(score,n,done){try{const store=JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS")||"{}");store[PAGE_ID]={pageId:PAGE_ID,file:"Bk2LAQuiz4.html",level:"A",week:4,type:"quiz",activityType:"quiz",score,stars:n,completed:done,skills:{reading:1,listening:1,math:1},savedAt:new Date().toISOString(),ts:Date.now()};localStorage.setItem("GP_EIS_ACTIVITY_RESULTS",JSON.stringify(store));localStorage.setItem("GP_EIS_LAST_FILE","Bk2LAQuiz4.html");}catch(e){}}
function restart(){index=0;correct=0;locked=false;render();speak("Let us try the quiz again.");}
$("readBtn").addEventListener("click",()=>speak("Question "+(index+1)+". "+questions[index].q));$("restartBtn").addEventListener("click",restart);$("cheerBtn").addEventListener("click",()=>{audio();chime();clap();confetti();speak("Great job! Keep looking, counting, and learning!");});$("homeBtn").addEventListener("click",()=>location.href=HOME_PAGE);$("backBtn").addEventListener("click",()=>location.href=PREVIOUS_PAGE);$("nextBtn").addEventListener("click",()=>location.href=NEXT_PAGE);if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=voice;document.addEventListener("pointerdown",()=>audio(),{once:true});window.addEventListener("load",()=>{render();setTimeout(()=>speak("Welcome to the Different Lines quiz. Look at each original poster, listen to the question, and tap the correct answer."),650);},{once:true});
})();
</script>
</body>
</html>
