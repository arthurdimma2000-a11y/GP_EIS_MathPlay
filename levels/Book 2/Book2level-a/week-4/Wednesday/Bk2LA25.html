<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA25 - Numbers Week 4 | Clean Accurate Digit Tracing</title>

<style>
  :root{
    --orange:#ff9918;
    --orange-dark:#d97706;
    --pink:#f04d5f;
    --green:#26b66a;
    --blue:#2ba8ff;
    --purple:#7049c6;
    --gold:#ffd24a;
    --ink:#2b2930;
    --cream:#fffaf2;
    --shadow:0 16px 34px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    background:var(--cream);
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#efe5d7 1px,transparent 1px),
      linear-gradient(90deg,#efe5d7 1px,transparent 1px);
    background-size:28px 28px;
  }

  .app{
    width:min(960px,100%);
    background:#fff;
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:10px 10px 14px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }

  .badge{
    background:#fff7eb;
    border:3px solid #ffd39a;
    border-radius:999px;
    padding:8px 14px;
    font-weight:1000;
    color:var(--orange-dark);
    box-shadow:0 8px 16px rgba(0,0,0,.08);
  }

  .navs,
  .buttons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
  }

  .btn{
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    user-select:none;
  }

  .btn:hover{
    filter:brightness(1.04);
    transform:translateY(-1px);
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 rgba(0,0,0,.14);
  }

  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5f;color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}

  .poster-wrap{
    position:relative;
    width:min(895px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
  }

  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .trace-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    background:transparent;
    touch-action:none;
    cursor:crosshair;
  }

  .panel{
    width:min(895px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff9fb);
    border:3px solid rgba(255,153,24,.34);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }

  .progress-title{
    text-align:center;
    font-size:clamp(1rem,2.7vw,1.3rem);
    font-weight:1000;
    color:#d97706;
    margin-bottom:8px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .bar{
    flex:1;
    height:18px;
    border-radius:999px;
    background:#e8eef8;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }

  .fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#31b7ff,#83e79f);
    transition:width .12s ease-out;
  }

  .percent{
    min-width:60px;
    text-align:right;
    color:#175ca8;
    font-size:1.05rem;
    font-weight:1000;
  }

  .digit-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-top:10px;
  }

  .digit-card{
    background:#fff;
    border:2px solid #e7edf8;
    border-radius:14px;
    text-align:center;
    padding:9px 6px;
    font-weight:1000;
    color:#444;
    min-height:58px;
  }

  .digit-card small{
    display:block;
    color:#666;
    margin-top:1px;
    font-size:.76rem;
  }

  .digit-card span{
    display:block;
    margin-top:3px;
    color:#ef3f49;
    font-size:.96rem;
  }

  .digit-card.active{
    border-color:#31a9ff;
    box-shadow:0 0 0 4px rgba(49,169,255,.16);
  }

  .digit-card.done{
    border-color:#62d98c;
    background:#effff4;
    color:#126c36;
  }

  .digit-card.done span{
    color:#126c36;
  }

  .stars{
    text-align:center;
    min-height:1.25em;
    margin-top:7px;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:
      0 2px 0 #b87900,
      0 4px 0 #8a5a00,
      0 8px 14px rgba(0,0,0,.28);
  }

  .status{
    min-height:1.55em;
    text-align:center;
    margin-top:7px;
    font-size:clamp(.98rem,2.5vw,1.25rem);
    font-weight:1000;
    color:var(--purple);
  }

  .note{
    text-align:center;
    font-weight:900;
    color:#666;
    font-size:.9rem;
    margin-top:8px;
    line-height:1.5;
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.8s linear forwards;
  }

  @keyframes fall{
    to{
      transform:translateY(105vh) rotate(540deg);
      opacity:.1;
    }
  }

  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .digit-grid{grid-template-columns:repeat(3,1fr);}
    .btn{font-size:.85rem;padding:9px 12px;}
  }
</style>
</head>

  const MIN_SEGMENT_COMPLETE = 96;
  const TRACE_WIDTH = 17;
  const TRACE_GAP_FILL = 5;
  const TRACE_NEIGHBOURS = 3;

  const posterWrap = document.getElementById("posterWrap");
  const posterImg = document.getElementById("posterImg");
  const traceLayer = document.getElementById("traceLayer");
  const ctx = traceLayer.getContext("2d", {alpha:true});
  const chimeAudio = document.getElementById("chimeAudio");

  const overallText = document.getElementById("overallText");
  const overallFill = document.getElementById("overallFill");
  const overallPercent = document.getElementById("overallPercent");
  const digitGrid = document.getElementById("digitGrid");
  const starsEl = document.getElementById("stars");
  const statusEl = document.getElementById("status");

  let dpr = 1;
  let sx = 1;
  let sy = 1;
  let drawing = false;
  let activeTarget = null;
  let currentStroke = null;
  let lastTracePoint = null;
  let completedCelebration = false;
  let lastTickTime = 0;
  let lastGuidePulse = 0;
  let audioContext = null;
  let introStarted = false;

  function linePoints(x1, y1, x2, y2, steps = 80){
    const points = [];
    for(let i = 0; i <= steps; i++){
      const t = i / steps;
      points.push({x:x1 + (x2 - x1) * t, y:y1 + (y2 - y1) * t});
    }
    return points;
  }

  function ellipsePoints(cx, cy, rx, ry, steps = 230, start = -Math.PI / 2, end = Math.PI * 1.5){
    const points = [];
    for(let i = 0; i <= steps; i++){
      const t = i / steps;
      const angle = start + (end - start) * t;
      points.push({x:cx + Math.cos(angle) * rx, y:cy + Math.sin(angle) * ry});
    }
    return points;
  }

  function quadraticPoints(p0, p1, p2, steps = 100){
    const points = [];
    for(let i = 0; i <= steps; i++){
      const t = i / steps;
      const one = 1 - t;
      points.push({
        x:one * one * p0.x + 2 * one * t * p1.x + t * t * p2.x,
        y:one * one * p0.y + 2 * one * t * p1.y + t * t * p2.y
      });
    }
    return points;
  }

  function cubicPoints(p0, p1, p2, p3, steps = 130){
    const points = [];
    for(let i = 0; i <= steps; i++){
      const t = i / steps;
      const one = 1 - t;
      points.push({
        x:one * one * one * p0.x + 3 * one * one * t * p1.x + 3 * one * t * t * p2.x + t * t * t * p3.x,
        y:one * one * one * p0.y + 3 * one * one * t * p1.y + 3 * one * t * t * p2.y + t * t * t * p3.y
      });
    }
    return points;
  }

  function shiftedSegments(segments, dx, dy){
    return segments.map(segment => segment.map(point => ({x:point.x + dx, y:point.y + dy})));
  }

  function makeDigit9(rowName, label, yShift){
    const loop = ellipsePoints(406, 544, 45, 57, 250, -Math.PI * 0.55, Math.PI * 1.45);
    const tail = cubicPoints(
      {x:448, y:548},
      {x:446, y:587},
      {x:424, y:622},
      {x:374, y:642},
      145
    );

    return {
      id:rowName + "-9",
      label,
      digit:"9",
      row:rowName,
      color:"#f04d5f",
      guides:["loop", "tail"],
      segments:shiftedSegments([loop, tail], 0, yShift)
    };
  }

  function makeDigit1(rowName, label, yShift){
    const cap = linePoints(553, 502, 584, 484, 65);
    const stem = linePoints(584, 484, 584, 644, 170);

    return {
      id:rowName + "-1",
      label,
      digit:"1",
      row:rowName,
      color:"#2ba8ff",
      guides:["top slant", "long line"],
      segments:shiftedSegments([cap, stem], 0, yShift)
    };
  }

  function makeDigit0(rowName, label, yShift){
    const oval = ellipsePoints(721, 562, 51, 77, 270, -Math.PI / 2, Math.PI * 1.5);

    return {
      id:rowName + "-0",
      label,
      digit:"0",
      row:rowName,
      color:"#26b66a",
      guides:["oval"],
      segments:shiftedSegments([oval], 0, yShift)
    };
  }

  const targets = [
    makeDigit9("row-one", "Top 9", 0),
    makeDigit1("row-one", "Top 1", 0),
    makeDigit0("row-one", "Top 0", 0),
    makeDigit9("row-two", "Bottom 9", 270),
    makeDigit1("row-two", "Bottom 1", 270),
    makeDigit0("row-two", "Bottom 0", 270)
  ];

  targets.forEach(target => {
    target.segments = target.segments.map(segment => segment.map(point => ({x:point.x, y:point.y, hit:false})));
    target.samples = target.segments.flat();
    target.segmentPercents = target.segments.map(() => 0);
    target.percent = 0;
    target.complete = false;
    target.strokes = [];
  });

  function buildDigitCards(){
    digitGrid.innerHTML = "";
    targets.forEach(target => {
      const card = document.createElement("div");
      card.className = "digit-card";
      card.id = "card-" + target.id;
      card.innerHTML = target.label + "<small>trace " + target.guides.join(" + ") + "</small><span>0%</span>";
      digitGrid.appendChild(card);
      target.card = card;
      target.cardText = card.querySelector("span");
    });
  }

  function setStatus(text){
    statusEl.textContent = text || "";
  }

  function getAudioContext(){
    if(!audioContext){
      try{
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }catch(_){
        return null;
      }
    }

    if(audioContext.state === "suspended"){
      audioContext.resume().catch(() => {});
    }

    return audioContext;
  }

  function playTick(){
    const now = performance.now();
    if(now - lastTickTime < 58) return;
    lastTickTime = now;

    const audio = getAudioContext();
    if(!audio) return;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 720;
    gain.gain.setValueAtTime(0.038, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.042);
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime + 0.042);
  }

  function playSoftWrongTone(){
    const now = performance.now();
    if(now - lastGuidePulse < 350) return;
    lastGuidePulse = now;

    const audio = getAudioContext();
    if(!audio) return;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "triangle";
    oscillator.frequency.value = 260;
    gain.gain.setValueAtTime(0.028, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.09);
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime + 0.09);
  }

  function playSuccessTone(){
    const audio = getAudioContext();
    if(!audio) return;

    [523, 659, 784].forEach((freq, index) => {
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const start = audio.currentTime + index * 0.09;

      oscillator.type = "triangle";
      oscillator.frequency.value = freq;
      gain.gain.setValueAtTime(0.075, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.13);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + 0.13);
    });
  }

  function playChime(){
    try{
      if(chimeAudio && chimeAudio.src){
        const audio = chimeAudio.cloneNode(true);
        audio.volume = 1;
        const promise = audio.play();
        if(promise && typeof promise.catch === "function"){
          promise.catch(() => playSuccessTone());
        }
      }else{
        playSuccessTone();
      }
    }catch(_){
      playSuccessTone();
    }
  }

  function playApplause(){
    const audio = getAudioContext();
    if(!audio) return;

    for(let i = 0; i < 13; i++){
      const start = audio.currentTime + i * 0.052;
      const buffer = audio.createBuffer(1, audio.sampleRate * 0.065, audio.sampleRate);
      const channel = buffer.getChannelData(0);

      for(let j = 0; j < channel.length; j++){
        channel[j] = (Math.random() * 2 - 1) * (1 - j / channel.length);
      }

      const source = audio.createBufferSource();
      const filter = audio.createBandpassFilter();
      const gain = audio.createGain();

      source.buffer = buffer;
      filter.frequency.value = 1000 + Math.random() * 1000;
      filter.Q.value = 0.8;
      gain.gain.setValueAtTime(0.038, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.065);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.destination);
      source.start(start);
      source.stop(start + 0.065);
    }
  }

  function confetti(){
    const colors = ["#ff9918", "#f04d5f", "#36a8df", "#18a85c", "#ffd24a", "#7049c6"];

    for(let i = 0; i < 42; i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * 0.35 + "s";
      document.body.appendChild(piece);
      window.setTimeout(() => piece.remove(), 2300);
    }
  }

  function pickFemaleVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    if(!voices.length) return null;

    const englishVoices = voices.filter(voice => /^en/i.test(voice.lang || ""));
    const preferredNames = ["Jenny", "Aria", "Samantha", "Victoria", "Zira", "Susan", "Karen", "Moira", "Tessa", "Serena", "Google US English", "Microsoft Zira"];

    for(const name of preferredNames){
      const matchingVoice = englishVoices.find(voice => (voice.name || "").toLowerCase().includes(name.toLowerCase()));
      if(matchingVoice) return matchingVoice;
    }

    return englishVoices.find(voice => /us|united states/i.test((voice.lang || "") + " " + (voice.name || ""))) || englishVoices[0] || voices[0] || null;
  }

  function speak(text, onDone){
    if(!("speechSynthesis" in window)){
      if(typeof onDone === "function") onDone();
      return;
    }

    try{
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(text));
      utterance.lang = "en-US";
      utterance.rate = 0.88;
      utterance.pitch = 1.15;
      utterance.volume = 1;

      const voice = pickFemaleVoice();
      if(voice) utterance.voice = voice;

      if(typeof onDone === "function"){
        utterance.onend = onDone;
        utterance.onerror = onDone;
      }

      window.speechSynthesis.speak(utterance);
    }catch(_){
      if(typeof onDone === "function") onDone();
    }
  }

  function readInstructions(){
    introStarted = true;
    getAudioContext();
    setStatus("Trace all the grey digits carefully: 9, 1, and 0 in both rows.");
    speak(
      "Welcome to Numbers, Week Four. Trace the number digits carefully. " +
      "Start on a dotted guide. Keep your finger or mouse on the grey digit path. " +
      "Trace the full number nine, including the loop and the tail. " +
      "Trace the full number one, including the top slant and the long line. " +
      "Trace the full zero all the way around. Complete the top row and the bottom row."
    );
  }

  function resizeCanvas(){
    const rect = posterWrap.getBoundingClientRect();

    dpr = window.devicePixelRatio || 1;
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;

    traceLayer.width = Math.max(1, Math.round(rect.width * dpr));
    traceLayer.height = Math.max(1, Math.round(rect.height * dpr));
    traceLayer.style.width = rect.width + "px";
    traceLayer.style.height = rect.height + "px";
    ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    redrawAll();
  }

  function drawSegment(segment, options){
    if(!segment || segment.length < 2) return;

    ctx.save();
    ctx.beginPath();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = options.color;
    ctx.globalAlpha = options.alpha;
    ctx.lineWidth = options.lineWidth;
    if(options.dash){
      ctx.setLineDash(options.dash);
      ctx.lineDashOffset = options.dashOffset || 0;
    }

    ctx.moveTo(segment[0].x, segment[0].y);
    for(let i = 1; i < segment.length; i++) ctx.lineTo(segment[i].x, segment[i].y);
    ctx.stroke();
    ctx.restore();
  }

  function drawGuideDots(segment, color){
    const count = 9;
    for(let i = 1; i < count; i++){
      const index = Math.round((segment.length - 1) * (i / count));
      const point = segment[index];
      ctx.save();
      ctx.beginPath();
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = color;
      ctx.arc(point.x, point.y, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.restore();
    }
  }

  function hitFlagsWithCleanGaps(segment){
    const flags = segment.map(point => !!point.hit);

    /* Fill tiny missed spaces so the visible tracing is smooth, not broken. */
    let lastHit = -1;
    for(let i = 0; i < flags.length; i++){
      if(!flags[i]) continue;
      if(lastHit >= 0 && i - lastHit <= TRACE_GAP_FILL + 1){
        for(let j = lastHit; j <= i; j++) flags[j] = true;
      }
      lastHit = i;
    }

    return flags;
  }

  function drawCleanTraceRuns(segment, color, alpha = 0.94){
    const flags = hitFlagsWithCleanGaps(segment);
    const runs = [];
    let run = [];

    for(let i = 0; i < segment.length; i++){
      if(flags[i]){
        run.push(segment[i]);
      }else if(run.length){
        runs.push(run);
        run = [];
      }
    }

    if(run.length) runs.push(run);

    runs.forEach(points => {
      if(points.length === 1){
        const p = points[0];
        ctx.save();
        ctx.globalAlpha = 0.42;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, TRACE_WIDTH / 2 + 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, TRACE_WIDTH / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      drawSegment(points, {color:"#ffffff", alpha:0.38, lineWidth:TRACE_WIDTH + 9});
      drawSegment(points, {color, alpha, lineWidth:TRACE_WIDTH});
      drawSegment(points, {color:"#ffffff", alpha:0.22, lineWidth:4});
    });
  }

  function redrawGuides(){
    targets.forEach(target => {
      target.segments.forEach((segment) => {
        /* A soft white guide under the colored dots makes the path clear on top of the grey digits. */
        drawSegment(segment, {color:"#ffffff", alpha:0.34, lineWidth:19});

        if(target.complete){
          drawSegment(segment, {color:"#ffffff", alpha:0.42, lineWidth:TRACE_WIDTH + 9});
          drawSegment(segment, {color:target.color, alpha:0.90, lineWidth:TRACE_WIDTH});
          drawSegment(segment, {color:"#ffffff", alpha:0.23, lineWidth:4});
          return;
        }

        drawSegment(segment, {color:target.color, alpha:0.50, lineWidth:8, dash:[1, 13]});
        drawGuideDots(segment, target.color);
        drawCleanTraceRuns(segment, target.color, 0.93);
      });

      if(!target.complete){
        const firstSegment = target.segments[0];
        const lastSegment = target.segments[target.segments.length - 1];
        const firstPoint = firstSegment[0];
        const lastPoint = lastSegment[lastSegment.length - 1];

        ctx.save();
        ctx.beginPath();
        ctx.fillStyle = "#25b86a";
        ctx.globalAlpha = 0.96;
        ctx.arc(firstPoint.x, firstPoint.y, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.fillStyle = "#f04d5f";
        ctx.globalAlpha = 0.86;
        ctx.arc(lastPoint.x, lastPoint.y, 6.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.restore();
      }
    });
  }

  function redrawStrokes(){
    /* Raw hand strokes are intentionally not drawn. The child's movement fills the exact number path, keeping the tracing clean and readable. */
  }

  function redrawAll(){
    ctx.save();
    ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    ctx.clearRect(0, 0, NATURAL_W, NATURAL_H);
    redrawGuides();
    redrawStrokes();
    ctx.restore();
  }

  function pointerToPosterPoint(event){
    const rect = traceLayer.getBoundingClientRect();
    return {
      x:(event.clientX - rect.left) * NATURAL_W / rect.width,
      y:(event.clientY - rect.top) * NATURAL_H / rect.height
    };
  }

  function distance(a, b){
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function nearestTargetDistance(point, target){
    let nearest = Infinity;
    for(const segment of target.segments){
      for(const sample of segment){
        const sampleDistance = distance(point, sample);
        if(sampleDistance < nearest) nearest = sampleDistance;
      }
    }
    return nearest;
  }

  function findTarget(point){
    let bestTarget = null;
    let bestDistance = Infinity;

    targets.forEach(target => {
      if(target.complete) return;
      const currentDistance = nearestTargetDistance(point, target);
      if(currentDistance < bestDistance){
        bestDistance = currentDistance;
        bestTarget = target;
      }
    });

    return bestDistance <= START_RADIUS ? bestTarget : null;
  }

  function calculateTargetProgress(target){
    target.segmentPercents = target.segments.map(segment => {
      const hitCount = segment.filter(sample => sample.hit).length;
      return Math.round((hitCount / Math.max(1, segment.length)) * 100);
    });

    const totalHit = target.samples.filter(sample => sample.hit).length;
    const totalPercent = Math.round((totalHit / Math.max(1, target.samples.length)) * 100);
    target.percent = Math.max(target.percent, totalPercent);

    const completeAllSegments = target.segmentPercents.every(percent => percent >= MIN_SEGMENT_COMPLETE);
    if(completeAllSegments && !target.complete){
      completeTarget(target);
    }
  }

  function markAt(target, point){
    let marked = false;

    target.segments.forEach(segment => {
      let nearestIndex = -1;
      let nearestDistance = Infinity;

      for(let i = 0; i < segment.length; i++){
        const sampleDistance = distance(point, segment[i]);
        if(sampleDistance < nearestDistance){
          nearestDistance = sampleDistance;
          nearestIndex = i;
        }
      }

      if(nearestIndex >= 0 && nearestDistance <= HIT_RADIUS){
        const start = Math.max(0, nearestIndex - TRACE_NEIGHBOURS);
        const end = Math.min(segment.length - 1, nearestIndex + TRACE_NEIGHBOURS);
        for(let j = start; j <= end; j++) segment[j].hit = true;
        marked = true;
      }
    });

    if(marked){
      calculateTargetProgress(target);
      updateProgress();
    }

    return marked;
  }

  function markBetween(target, from, to){
    const length = distance(from, to);
    const steps = Math.max(1, Math.ceil(length / 2.4));

    for(let i = 0; i <= steps; i++){
      const t = i / steps;
      markAt(target, {x:from.x + (to.x - from.x) * t, y:from.y + (to.y - from.y) * t});
    }
  }

  function completeTarget(target){
    target.complete = true;
    target.percent = 100;
    target.segmentPercents = target.segmentPercents.map(() => 100);
    target.samples.forEach(sample => sample.hit = true);
    playChime();
    playSuccessTone();
    setStatus("Excellent tracing! You completed " + target.label + ".");
    speak("Excellent tracing! You completed " + target.label + ".");
    redrawAll();
  }

  function updateProgress(){
    const total = Math.round(targets.reduce((sum, target) => sum + target.percent, 0) / targets.length);

    overallText.textContent = total + "%";
    overallPercent.textContent = total + "%";
    overallFill.style.width = total + "%";

    targets.forEach(target => {
      if(!target.card) return;
      target.card.classList.toggle("done", target.complete);
      target.card.classList.toggle("active", target === activeTarget && !target.complete);
      target.cardText.textContent = target.complete ? "Done ✓" : Math.round(target.percent) + "%";
    });

    if(total >= 100) starsEl.textContent = "★ ★ ★";
    else if(total >= 65) starsEl.textContent = "★ ★ ☆";
    else if(total > 0) starsEl.textContent = "★ ☆ ☆";
    else starsEl.textContent = "☆ ☆ ☆";

    saveProgress(total, total >= 100);

    if(total >= 100 && !completedCelebration){
      completedCelebration = true;
      playChime();
      playApplause();
      confetti();
      setStatus("Fantastic! You traced every complete number digit.");
      speak("Fantastic work! You traced all the complete number digits. Nine, one, zero. Nine, one, zero.");
    }
  }

  function pointerDown(event){
    event.preventDefault();
    getAudioContext();

    if(!introStarted){
      window.setTimeout(() => readInstructions(), 150);
    }

    const point = pointerToPosterPoint(event);
    const target = findTarget(point);

    if(!target){
      setStatus("Start on a dotted guide line inside one grey digit.");
      playSoftWrongTone();
      return;
    }

    activeTarget = target;
    drawing = true;
    currentStroke = [point];
    lastTracePoint = point;
    activeTarget.strokes.push(currentStroke);

    try{ traceLayer.setPointerCapture(event.pointerId); }catch(_){}

    markAt(activeTarget, point);
    playTick();
    redrawAll();
  }

  function pointerMove(event){
    if(!drawing || !activeTarget || !currentStroke) return;
    event.preventDefault();

    const point = pointerToPosterPoint(event);
    const onPath = nearestTargetDistance(point, activeTarget) <= OFF_PATH_RADIUS;

    if(!onPath){
      lastTracePoint = null;
      setStatus("Stay close to the dotted line. Move back onto the number path.");
      playSoftWrongTone();
      return;
    }

    currentStroke.push(point);

    if(lastTracePoint){
      markBetween(activeTarget, lastTracePoint, point);
    }else{
      markAt(activeTarget, point);
    }

    lastTracePoint = point;
    playTick();
    redrawAll();

    if(activeTarget.complete){
      pointerUp(event);
    }
  }

  function pointerUp(event){
    if(event && event.pointerId !== undefined){
      try{ traceLayer.releasePointerCapture(event.pointerId); }catch(_){}
    }

    drawing = false;
    activeTarget = null;
    currentStroke = null;
    lastTracePoint = null;
    updateProgress();
  }

  function clearAll(sayIt = false){
    completedCelebration = false;
    drawing = false;
    activeTarget = null;
    currentStroke = null;
    lastTracePoint = null;

    targets.forEach(target => {
      target.segments.forEach(segment => segment.forEach(sample => sample.hit = false));
      target.percent = 0;
      target.complete = false;
      target.segmentPercents = target.segments.map(() => 0);
      target.strokes = [];
    });

    redrawAll();
    updateProgress();
    setStatus("Trace neatly on the dotted number paths until every digit is complete.");
    if(sayIt) speak("Cleared. Trace neatly on the dotted number paths until every digit is complete.");
  }

  function saveProgress(score, completed){
    const payload = {
      pageId:PAGE_ID,
      file:FILE_NAME,
      level:LEVEL,
      week:WEEK,
      type:"accurate-digit-tracing",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 100 ? 3 : score >= 65 ? 2 : score > 0 ? 1 : 0,
      skills:{reading:1, writing:1, listening:1, speaking:0, tracing:1, math:1},
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };

    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}

    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function"){
        window.GPTrack.finish(payload).catch(() => {});
      }
      if(typeof window.finishAndSave === "function"){
        window.finishAndSave(payload).catch(() => {});
      }
    }catch(_){}
  }

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);

  document.getElementById("readBtn").addEventListener("click", readInstructions);
  document.getElementById("clearBtn").addEventListener("click", () => clearAll(true));
  document.getElementById("cheerBtn").addEventListener("click", () => {
    getAudioContext();
    playChime();
    playApplause();
    confetti();
    setStatus("You are doing great! Keep tracing carefully.");
    speak("You are doing great. Keep tracing carefully on the dotted number path.");
  });

  document.getElementById("homeBtn").addEventListener("click", () => {
    try{ window.speechSynthesis.cancel(); }catch(_){}
    window.location.href = HOME_PAGE;
  });

  document.getElementById("prevBtn").addEventListener("click", () => {
    try{ window.speechSynthesis.cancel(); }catch(_){}
    window.location.href = PREVIOUS_PAGE;
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    try{ window.speechSynthesis.cancel(); }catch(_){}
    window.location.href = NEXT_PAGE;
  });

  posterImg.addEventListener("load", () => {
    resizeCanvas();
    clearAll(false);
  }, {once:true});

  posterImg.addEventListener("error", () => {
    setStatus("Poster image could not load. The poster is embedded in this HTML, so please copy the whole file without removing the image data.");
  });

  window.addEventListener("resize", resizeCanvas);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);

  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged = () => pickFemaleVoice();
  }

  window.addEventListener("beforeunload", () => {
    try{ window.speechSynthesis.cancel(); }catch(_){}
  });

  document.addEventListener("pointerdown", () => {
    getAudioContext();
    try{ chimeAudio.load(); }catch(_){}
  }, {once:true});

  buildDigitCards();

  window.addEventListener("load", () => {
    resizeCanvas();
    clearAll(false);
    window.setTimeout(() => readInstructions(), 750);
  }, {once:true});
})();
</script>
</body>
</html>
