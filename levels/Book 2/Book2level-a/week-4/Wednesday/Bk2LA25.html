<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA25 - Numbers Week 4 | Count and Circle</title>

<style>
  :root{
    --orange:#ff9918;
    --orange-dark:#d97706;
    --pink:#f04d5f;
    --green:#29b86a;
    --blue:#3aa8e5;
    --purple:#7049c6;
    --gold:#ffd24a;
    --ink:#2b2930;
    --cream:#fffaf2;
    --shadow:0 16px 34px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    background:var(--cream);
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#efe5d7 1px,transparent 1px),
      linear-gradient(90deg,#efe5d7 1px,transparent 1px);
    background-size:28px 28px;
  }

  .app{
    width:min(990px,100%);
    background:#fff;
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:10px 10px 14px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }

  .badge{
    background:#fff7eb;
    border:3px solid #ffd39a;
    border-radius:999px;
    padding:8px 14px;
    font-weight:1000;
    color:var(--orange-dark);
    box-shadow:0 8px 16px rgba(0,0,0,.08);
  }

  .navs,
  .buttons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
  }

  .btn{
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .btn:hover{
    filter:brightness(1.04);
    transform:translateY(-1px);
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 rgba(0,0,0,.14);
  }

  .btn.home{
    background:#25d17d;
    color:#fff;
  }

  .btn.prev,
  .btn.next{
    background:#f7dc6f;
    color:#8b5a00;
  }

  .btn.read{
    background:#f04d5f;
    color:#fff;
  }

  .btn.clear{
    background:#dfeaff;
    color:#1f3b6b;
  }

  .btn.cheer{
    background:#c9f2d6;
    color:#166c38;
  }

  .btn-icon{
    width:22px;
    height:22px;
    object-fit:contain;
    margin-right:8px;
    flex:0 0 auto;
  }

  .poster-wrap{
    position:relative;
    width:min(904px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
  }

  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .trace-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    background:transparent;
    touch-action:none;
    cursor:crosshair;
  }

  .panel{
    width:min(904px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff9fb);
    border:3px solid rgba(255,153,24,.34);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }

  .progress-title{
    text-align:center;
    font-size:clamp(1rem,2.7vw,1.3rem);
    font-weight:1000;
    color:#d97706;
    margin-bottom:8px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .bar{
    flex:1;
    height:18px;
    border-radius:999px;
    background:#e8eef8;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }

  .fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#31b7ff,#83e79f);
    transition:width .12s ease-out;
  }

  .percent{
    min-width:60px;
    text-align:right;
    color:#175ca8;
    font-size:1.05rem;
    font-weight:1000;
  }

  .task-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    margin-top:10px;
  }

  .task{
    background:#fff;
    border:2px solid #e7edf8;
    border-radius:14px;
    text-align:center;
    padding:10px 7px;
    font-weight:1000;
    font-size:.95rem;
    color:#444;
  }

  .task span{
    display:block;
    margin-top:4px;
    color:#ef3f49;
    font-size:1rem;
  }

  .task.done{
    border-color:#62d98c;
    background:#effff4;
    color:#126c36;
  }

  .task.done span{
    color:#126c36;
  }

  .stars{
    text-align:center;
    min-height:1.25em;
    margin-top:7px;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:
      0 2px 0 #b87900,
      0 4px 0 #8a5a00,
      0 8px 14px rgba(0,0,0,.28);
  }

  .status{
    min-height:1.55em;
    text-align:center;
    margin-top:7px;
    font-size:clamp(.98rem,2.5vw,1.25rem);
    font-weight:1000;
    color:var(--purple);
  }

  .note{
    text-align:center;
    font-weight:900;
    color:#666;
    font-size:.9rem;
    margin-top:8px;
    line-height:1.5;
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.8s linear forwards;
  }

  @keyframes fall{
    to{
      transform:translateY(105vh) rotate(540deg);
      opacity:.1;
    }
  }

  @media(max-width:760px){
    body{
      padding:6px;
    }

    .app{
      padding:6px;
      border-radius:16px;
    }

    .panel{
      padding:10px;
      border-radius:14px;
    }

    .task-grid{
      grid-template-columns:1fr;
    }

    .btn{
      font-size:.85rem;
      padding:9px 12px;
    }
  }
</style>
</head>

<body>
<main class="app" aria-label="Numbers Week 4 count and circle lesson">
  <div class="topbar">
    <div class="badge">📘 Numbers · Week 4 · Count and circle</div>

    <div class="navs">
      <button class="btn home" id="homeBtn" type="button">🏠 Home</button>
      <button class="btn prev" id="prevBtn" type="button">← Previous</button>
      <button class="btn next" id="nextBtn" type="button">Next →</button>
    </div>
  </div>

  <section
    class="poster-wrap"
    id="posterWrap"
    aria-label="Numbers Week 4 poster. Count the decorative lines on each cake and circle the correct number."
  >
    <img
      class="poster-img"
      id="posterImg"
      src="/assets/images/Bk2Shapes/NumbersWeek4CircleLines.png"
      alt="Numbers Week 4 poster with a bride, two cakes, and the number choices nine and ten."
    >

    <canvas
      class="trace-layer"
      id="traceLayer"
      aria-label="Circle the correct number of lines for each cake"
    ></canvas>
  </section>

  <section class="panel" aria-live="polite">
    <div class="progress-title">
      Circle progress: <span id="overallText">0%</span>
    </div>

    <div class="progress-row">
      <div class="bar">
        <div class="fill" id="overallFill"></div>
      </div>
      <div class="percent" id="overallPercent">0%</div>
    </div>

    <div class="task-grid">
      <div class="task" id="cakeOneBox">
        Cake 1: Count and circle
        <span id="cakeOneText">Not completed</span>
      </div>

      <div class="task" id="cakeTwoBox">
        Cake 2: Count and circle
        <span id="cakeTwoText">Not completed</span>
      </div>
    </div>

    <div class="stars" id="stars">☆ ☆ ☆</div>

    <div class="status" id="status">
      Listen, count the lines, then circle the correct number.
    </div>

    <div class="buttons">
      <button class="btn read" id="readBtn" type="button"><img class="btn-icon" src="/assets/images/Bk2Shapes/Microphone.png" alt="Mic">Read Instructions</button>
      <button class="btn clear" id="clearBtn" type="button">Clear Circle</button>
      <button class="btn cheer" id="cheerBtn" type="button">👏 Cheer</button>
    </div>

    <div class="note">
      Count each cake’s decorative lines. Circle <b>9</b> or <b>10</b> in the correct row.
    </div>
  </section>

  <audio id="chimeAudio" src="/assets/audio/chimes/chime.mp3" preload="auto"></audio>
</main>

<script>
(() => {
  "use strict";

  const PAGE_ID = "Bk2LA25_NumbersWeek4_CountAndCircle";
  const FILE_NAME = "Bk2LA25.html";
  const LEVEL = "A";
  const WEEK = 4;

  /*
    Change only these links if your real neighbouring page names are different.
  */
  const HOME_PAGE = "../../../../../index.html";
  const PREVIOUS_PAGE = "Bk2LA21.html";
  const NEXT_PAGE = "../Friday/Bk2LAGame4.html";

  /*
    Exact natural size of the supplied poster image.
  */
  const NATURAL_W = 961;
  const NATURAL_H = 1309;

  /*
    Child-friendly tracing settings.
  */
  const HIT_RADIUS = 42;
  const START_RADIUS = 88;
  const COMPLETE_AT = 58;

  const posterWrap = document.getElementById("posterWrap");
  const posterImg = document.getElementById("posterImg");
  const traceLayer = document.getElementById("traceLayer");
  const ctx = traceLayer.getContext("2d");
  const chimeAudio = document.getElementById("chimeAudio");

  const overallText = document.getElementById("overallText");
  const overallFill = document.getElementById("overallFill");
  const overallPercent = document.getElementById("overallPercent");

  const cakeOneBox = document.getElementById("cakeOneBox");
  const cakeTwoBox = document.getElementById("cakeTwoBox");
  const cakeOneText = document.getElementById("cakeOneText");
  const cakeTwoText = document.getElementById("cakeTwoText");

  const starsEl = document.getElementById("stars");
  const statusEl = document.getElementById("status");

  let dpr = 1;
  let sx = 1;
  let sy = 1;
  let drawing = false;
  let activeTarget = null;
  let currentStroke = null;
  let completedCelebration = false;
  let lastTickTime = 0;
  let audioContext = null;

  function ellipsePoints(cx, cy, rx, ry, steps = 160){
    const points = [];

    for(let i = 0; i <= steps; i++){
      const angle = (-Math.PI / 2) + ((Math.PI * 2 * i) / steps);

      points.push({
        x:cx + Math.cos(angle) * rx,
        y:cy + Math.sin(angle) * ry
      });
    }

    return points;
  }

  /*
    The first cake has 9 decorative lines.
    The second cake has 10 decorative lines.
    These circle targets sit directly over the existing printed choices.
  */
  const targets = [
    {
      id:"cake-one-nine",
      group:"cakeOne",
      answer:"9",
      correctMessage:"Correct! The first cake has nine lines.",
      color:"#f04d5f",
      samples:ellipsePoints(455, 605, 77, 110)
    },
    {
      id:"cake-two-ten",
      group:"cakeTwo",
      answer:"10",
      correctMessage:"Correct! The second cake has ten lines.",
      color:"#f04d5f",
      samples:ellipsePoints(704, 898, 139, 110)
    }
  ];

  const wrongChoices = [
    {
      group:"cakeOne",
      answer:"10",
      cx:704,
      cy:605,
      rx:139,
      ry:110
    },
    {
      group:"cakeTwo",
      answer:"9",
      cx:455,
      cy:898,
      rx:77,
      ry:110
    }
  ];

  targets.forEach(target => {
    target.samples = target.samples.map(point => ({
      x:point.x,
      y:point.y,
      hit:false
    }));

    target.percent = 0;
    target.complete = false;
    target.strokes = [];
  });

  function setStatus(text){
    statusEl.textContent = text || "";
  }

  function getAudioContext(){
    if(!audioContext){
      try{
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }catch(_){
        return null;
      }
    }

    if(audioContext.state === "suspended"){
      audioContext.resume().catch(() => {});
    }

    return audioContext;
  }

  function playTick(){
    const now = performance.now();

    if(now - lastTickTime < 72) return;

    lastTickTime = now;

    const audio = getAudioContext();

    if(!audio) return;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 650;

    gain.gain.setValueAtTime(0.045, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.045);

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.045);
  }

  function playChime(){
    try{
      const audio = chimeAudio.cloneNode(true);
      audio.volume = 1;
      audio.play().catch(() => {});
    }catch(_){}
  }

  function playApplause(){
    const audio = getAudioContext();

    if(!audio) return;

    for(let i = 0; i < 13; i++){
      const start = audio.currentTime + i * 0.052;
      const buffer = audio.createBuffer(1, audio.sampleRate * 0.065, audio.sampleRate);
      const channel = buffer.getChannelData(0);

      for(let j = 0; j < channel.length; j++){
        channel[j] = (Math.random() * 2 - 1) * (1 - j / channel.length);
      }

      const source = audio.createBufferSource();
      const filter = audio.createBandpassFilter();
      const gain = audio.createGain();

      source.buffer = buffer;
      filter.frequency.value = 1000 + Math.random() * 1000;
      filter.Q.value = 0.8;

      gain.gain.setValueAtTime(0.038, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.065);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.destination);

      source.start(start);
      source.stop(start + 0.065);
    }
  }

  function confetti(){
    const colors = [
      "#ff9918",
      "#f04d5f",
      "#36a8df",
      "#18a85c",
      "#ffd24a",
      "#7049c6"
    ];

    for(let i = 0; i < 42; i++){
      const piece = document.createElement("div");

      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * 0.35 + "s";

      document.body.appendChild(piece);

      window.setTimeout(() => {
        piece.remove();
      }, 2300);
    }
  }

  function pickFemaleVoice(){
    if(!("speechSynthesis" in window)) return null;

    const voices = window.speechSynthesis.getVoices() || [];

    if(!voices.length) return null;

    const englishVoices = voices.filter(voice => /^en/i.test(voice.lang || ""));

    const preferredNames = [
      "Jenny",
      "Aria",
      "Samantha",
      "Victoria",
      "Zira",
      "Susan",
      "Karen",
      "Moira",
      "Tessa",
      "Serena",
      "Google US English",
      "Microsoft Zira"
    ];

    for(const name of preferredNames){
      const matchingVoice = englishVoices.find(voice => {
        return (voice.name || "").toLowerCase().includes(name.toLowerCase());
      });

      if(matchingVoice) return matchingVoice;
    }

    return englishVoices.find(voice => {
      return /us|united states/i.test(
        (voice.lang || "") + " " + (voice.name || "")
      );
    }) || englishVoices[0] || voices[0] || null;
  }

  function speak(text, onDone){
    if(!("speechSynthesis" in window)){
      if(typeof onDone === "function") onDone();
      return;
    }

    try{
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(String(text));

      utterance.lang = "en-US";
      utterance.rate = 0.88;
      utterance.pitch = 1.15;
      utterance.volume = 1;

      const voice = pickFemaleVoice();

      if(voice){
        utterance.voice = voice;
      }

      if(typeof onDone === "function"){
        utterance.onend = onDone;
        utterance.onerror = onDone;
      }

      window.speechSynthesis.speak(utterance);
    }catch(_){
      if(typeof onDone === "function") onDone();
    }
  }

  function readInstructions(){
    getAudioContext();

    setStatus("Count the lines, then circle the correct number in each row.");

    speak(
      "Welcome to Numbers, Week Four. Count and circle the correct number of lines. " +
      "Look at the first cake. Count its decorative lines, then circle nine or ten. " +
      "Next, look at the second cake. Count its decorative lines, then circle nine or ten. " +
      "Use your finger or mouse to draw a circle around the correct number."
    );
  }

  function resizeCanvas(){
    const rect = posterWrap.getBoundingClientRect();

    dpr = window.devicePixelRatio || 1;
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;

    traceLayer.width = Math.max(1, Math.round(rect.width * dpr));
    traceLayer.height = Math.max(1, Math.round(rect.height * dpr));

    traceLayer.style.width = rect.width + "px";
    traceLayer.style.height = rect.height + "px";

    ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);

    redrawAll();
  }

  function redrawAll(){
    ctx.save();

    ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    ctx.clearRect(0, 0, NATURAL_W, NATURAL_H);

    targets.forEach(target => {
      target.strokes.forEach(stroke => {
        if(stroke.length < 1) return;

        ctx.beginPath();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = target.color;
        ctx.globalAlpha = 0.92;
        ctx.lineWidth = 11;

        ctx.moveTo(stroke[0].x, stroke[0].y);

        for(let i = 1; i < stroke.length; i++){
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }

        if(stroke.length === 1){
          ctx.lineTo(stroke[0].x + 0.1, stroke[0].y + 0.1);
        }

        ctx.stroke();
      });
    });

    ctx.restore();
  }

  function pointerToPosterPoint(event){
    const rect = traceLayer.getBoundingClientRect();

    return {
      x:(event.clientX - rect.left) * NATURAL_W / rect.width,
      y:(event.clientY - rect.top) * NATURAL_H / rect.height
    };
  }

  function distance(a, b){
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function nearestTargetDistance(point, target){
    let nearest = Infinity;

    for(const sample of target.samples){
      const sampleDistance = distance(point, sample);

      if(sampleDistance < nearest){
        nearest = sampleDistance;
      }
    }

    return nearest;
  }

  function isNearEllipse(point, item, padding = 30){
    const rx = item.rx + padding;
    const ry = item.ry + padding;
    const dx = (point.x - item.cx) / rx;
    const dy = (point.y - item.cy) / ry;

    return (dx * dx + dy * dy) <= 1;
  }

  function wrongChoiceAt(point){
    return wrongChoices.find(choice => {
      return isNearEllipse(point, choice, 22);
    }) || null;
  }

  function findCorrectTarget(point){
    let bestTarget = null;
    let bestDistance = Infinity;

    targets.forEach(target => {
      if(target.complete) return;

      const currentDistance = nearestTargetDistance(point, target);

      if(currentDistance < bestDistance){
        bestDistance = currentDistance;
        bestTarget = target;
      }
    });

    return bestDistance <= START_RADIUS ? bestTarget : null;
  }

  function markAt(target, point){
    target.samples.forEach(sample => {
      if(!sample.hit && distance(point, sample) <= HIT_RADIUS){
        sample.hit = true;
      }
    });

    const hitCount = target.samples.filter(sample => sample.hit).length;

    let percentage = Math.round(
      (hitCount / Math.max(1, target.samples.length)) * 100
    );

    /*
      Child-friendly completion:
      after most of a circle is correctly traced, complete it automatically.
    */
    if(percentage >= COMPLETE_AT){
      percentage = 100;

      target.samples.forEach(sample => {
        sample.hit = true;
      });
    }

    target.percent = Math.max(target.percent, percentage);

    if(target.percent >= 100 && !target.complete){
      completeTarget(target);
    }

    updateProgress();
  }

  function markBetween(target, from, to){
    const length = distance(from, to);
    const steps = Math.max(1, Math.ceil(length / 3));

    for(let i = 0; i <= steps; i++){
      const t = i / steps;

      markAt(target, {
        x:from.x + (to.x - from.x) * t,
        y:from.y + (to.y - from.y) * t
      });
    }
  }

  function completeTarget(target){
    target.complete = true;

    playChime();
    playApplause();

    setStatus(target.correctMessage);
    speak(target.correctMessage);
  }

  function updateProgress(){
    const total = Math.round(
      targets.reduce((sum, target) => sum + target.percent, 0) /
      targets.length
    );

    overallText.textContent = total + "%";
    overallPercent.textContent = total + "%";
    overallFill.style.width = total + "%";

    cakeOneBox.classList.toggle("done", targets[0].complete);
    cakeTwoBox.classList.toggle("done", targets[1].complete);

    cakeOneText.textContent = targets[0].complete
      ? "Correct: 9 lines ✓"
      : Math.round(targets[0].percent) + "%";

    cakeTwoText.textContent = targets[1].complete
      ? "Correct: 10 lines ✓"
      : Math.round(targets[1].percent) + "%";

    if(total >= 100){
      starsEl.textContent = "★ ★ ★";
    }else if(total >= 50){
      starsEl.textContent = "★ ★ ☆";
    }else if(total > 0){
      starsEl.textContent = "★ ☆ ☆";
    }else{
      starsEl.textContent = "☆ ☆ ☆";
    }

    saveProgress(total, total >= 100);

    if(total >= 100 && !completedCelebration){
      completedCelebration = true;

      playChime();
      playApplause();
      confetti();

      setStatus("Excellent! You counted and circled both correct numbers.");

      speak(
        "Excellent work! The first cake has nine lines. " +
        "The second cake has ten lines. " +
        "You circled both correct numbers."
      );
    }
  }

  function pointerDown(event){
    event.preventDefault();

    getAudioContext();

    const point = pointerToPosterPoint(event);
    const wrongChoice = wrongChoiceAt(point);

    if(wrongChoice){
      setStatus("Let’s count again. Try the other number in this row.");
      speak("Let us count again. Try the other number in this row.");
      return;
    }

    const target = findCorrectTarget(point);

    if(!target){
      setStatus("Draw a circle around the correct number, nine or ten.");
      return;
    }

    activeTarget = target;
    drawing = true;
    currentStroke = [point];

    activeTarget.strokes.push(currentStroke);

    try{
      traceLayer.setPointerCapture(event.pointerId);
    }catch(_){}

    markAt(activeTarget, point);
    playTick();
    redrawAll();
  }

  function pointerMove(event){
    if(!drawing || !activeTarget || !currentStroke) return;

    event.preventDefault();

    const point = pointerToPosterPoint(event);
    const previous = currentStroke[currentStroke.length - 1];

    currentStroke.push(point);

    markBetween(activeTarget, previous, point);
    playTick();
    redrawAll();

    if(activeTarget.complete){
      drawing = false;
      activeTarget = null;
      currentStroke = null;
    }
  }

  function pointerUp(event){
    if(event && event.pointerId !== undefined){
      try{
        traceLayer.releasePointerCapture(event.pointerId);
      }catch(_){}
    }

    drawing = false;
    activeTarget = null;
    currentStroke = null;
  }

  function clearAll(sayIt = false){
    completedCelebration = false;
    drawing = false;
    activeTarget = null;
    currentStroke = null;

    targets.forEach(target => {
      target.samples.forEach(sample => {
        sample.hit = false;
      });

      target.percent = 0;
      target.complete = false;
      target.strokes = [];
    });

    redrawAll();
    updateProgress();

    setStatus("Count the cake lines, then circle the correct number.");

    if(sayIt){
      speak("Cleared. Count again and circle the correct number.");
    }
  }

  function saveProgress(score, completed){
    const payload = {
      pageId:PAGE_ID,
      file:FILE_NAME,
      level:LEVEL,
      week:WEEK,
      type:"circle-choice",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 100 ? 3 : score >= 50 ? 2 : score > 0 ? 1 : 0,
      skills:{
        reading:1,
        writing:1,
        listening:1,
        speaking:0,
        tracing:1,
        math:1
      },
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };

    try{
      const store = JSON.parse(
        localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}"
      );

      store[payload.pageId] = payload;

      localStorage.setItem(
        "GP_EIS_ACTIVITY_RESULTS",
        JSON.stringify(store)
      );

      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));

      window.dispatchEvent(
        new CustomEvent("gp-progress-update", {detail:payload})
      );
    }catch(_){}

    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function"){
        window.GPTrack.finish(payload).catch(() => {});
      }

      if(typeof window.finishAndSave === "function"){
        window.finishAndSave(payload).catch(() => {});
      }
    }catch(_){}
  }

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);

  document.getElementById("readBtn").addEventListener("click", readInstructions);

  document.getElementById("clearBtn").addEventListener("click", () => {
    clearAll(true);
  });

  document.getElementById("cheerBtn").addEventListener("click", () => {
    getAudioContext();
    playChime();
    playApplause();
    confetti();

    setStatus("You are doing great! Keep counting and circling.");

    speak("You are doing great! Keep counting and circle the correct number.");
  });

  document.getElementById("homeBtn").addEventListener("click", () => {
    try{
      window.speechSynthesis.cancel();
    }catch(_){}

    window.location.href = HOME_PAGE;
  });

  document.getElementById("prevBtn").addEventListener("click", () => {
    try{
      window.speechSynthesis.cancel();
    }catch(_){}

    window.location.href = PREVIOUS_PAGE;
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    try{
      window.speechSynthesis.cancel();
    }catch(_){}

    window.location.href = NEXT_PAGE;
  });

  posterImg.addEventListener("load", () => {
    resizeCanvas();
    clearAll(false);
  }, {once:true});

  posterImg.addEventListener("error", () => {
    setStatus(
      "Poster image missing. Check /assets/images/Bk2Shapes/NumbersWeek4CircleLines.png."
    );
  });

  window.addEventListener("resize", resizeCanvas);

  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", resizeCanvas);
  }

  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged = () => {
      pickFemaleVoice();
    };
  }

  window.addEventListener("beforeunload", () => {
    try{
      window.speechSynthesis.cancel();
    }catch(_){}
  });

  let firstTapDone = false;

  document.addEventListener("pointerdown", () => {
    if(firstTapDone) return;

    firstTapDone = true;

    getAudioContext();

    try{
      chimeAudio.load();
    }catch(_){}
  }, {once:true});

  window.addEventListener("load", () => {
    resizeCanvas();
    clearAll(false);

    window.setTimeout(() => {
      readInstructions();
    }, 700);
  }, {once:true});
})();
</script>
</body>
