<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Different Lines - Week 4 Real-Time One-by-One Tracing</title>
<style>
  :root {
    --orange:#ff9918;
    --orange-dark:#d97706;
    --red:#f0444d;
    --green:#18a85c;
    --blue:#36a8df;
    --purple:#7049c6;
    --gold:#ffd24a;
    --ink:#27252c;
    --cream:#fffaf2;
    --panel:#ffffff;
    --shadow:0 16px 34px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }

  * { box-sizing:border-box; }

  html, body {
    margin:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    background:var(--cream);
    color:var(--ink);
  }

  body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#efe5d7 1px, transparent 1px),
      linear-gradient(90deg, #efe5d7 1px, transparent 1px);
    background-size:28px 28px;
  }

  .app {
    width:min(990px, 100%);
    background:#fff;
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:10px 10px 14px;
  }

  .topbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }

  .badge {
    background:#fff7eb;
    border:3px solid #ffd39a;
    border-radius:999px;
    padding:8px 14px;
    font-weight:1000;
    color:var(--orange-dark);
    box-shadow:0 8px 16px rgba(0,0,0,.08);
  }

  .navs, .buttons {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
  }

  .btn {
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease, filter .1s ease;
    font-family:inherit;
  }

  .btn:hover { filter:brightness(1.04); transform:translateY(-1px); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14); }

  .btn.home { background:#25d17d; color:#fff; }
  .btn.prev, .btn.next { background:#f7dc6f; color:#8b5a00; }
  .btn.read { background:#f04d5f; color:#fff; }
  .btn.clear { background:#dfeaff; color:#1f3b6b; }
  .btn.cheer { background:#c9f2d6; color:#166c38; }

  .poster-wrap {
    position:relative;
    width:min(895px, 100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
  }

  .poster-img {
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .trace-layer {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    background:transparent;
    touch-action:none;
    cursor:crosshair;
  }

  .panel {
    width:min(895px, 100%);
    margin:12px auto 0;
    background:linear-gradient(180deg, #fff, #fff9fb);
    border:3px solid rgba(255,153,24,.34);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }

  .progress-title {
    text-align:center;
    font-size:clamp(1rem, 2.7vw, 1.3rem);
    font-weight:1000;
    color:#d97706;
    margin-bottom:8px;
  }

  .progress-row { display:flex; align-items:center; gap:9px; }

  .bar {
    flex:1;
    height:18px;
    border-radius:999px;
    background:#e8eef8;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }

  .fill {
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, #31b7ff, #83e79f);
    transition:width .12s ease-out;
  }

  .percent {
    min-width:60px;
    text-align:right;
    color:#175ca8;
    font-size:1.05rem;
    font-weight:1000;
  }

  .mini-grid {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:10px;
  }

  .mini {
    background:#fff;
    border:2px solid #e7edf8;
    border-radius:14px;
    text-align:center;
    padding:9px 6px;
    font-weight:1000;
    font-size:.94rem;
    color:#444;
  }

  .mini span { display:block; margin-top:4px; color:#ef3f49; font-size:1rem; }
  .mini.done { border-color:#62d98c; background:#effff4; color:#126c36; }
  .mini.done span { color:#126c36; }

  .stars {
    text-align:center;
    min-height:1.25em;
    margin-top:7px;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900, 0 4px 0 #8a5a00, 0 8px 14px rgba(0,0,0,.28);
  }

  .status {
    min-height:1.55em;
    text-align:center;
    margin-top:7px;
    font-size:clamp(.98rem, 2.5vw, 1.25rem);
    font-weight:1000;
    color:var(--purple);
  }

  .note {
    text-align:center;
    font-weight:900;
    color:#666;
    font-size:.9rem;
    margin-top:8px;
    line-height:1.5;
  }

  .confetti-piece {
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.8s linear forwards;
  }

  @keyframes fall {
    to { transform:translateY(105vh) rotate(540deg); opacity:.1; }
  }

  @media(max-width:760px) {
    body { padding:6px; }
    .app { padding:6px; border-radius:16px; }
    .panel { padding:10px; border-radius:14px; }
    .mini-grid { grid-template-columns:1fr; }
    .btn { font-size:.85rem; padding:9px 12px; }
  }
</style>
</head>

  function linePoints(x1, y1, x2, y2, steps = 120) {
    const points = [];
    for(let i = 0; i <= steps; i++) {
      const t = i / steps;
      points.push({ x:x1 + (x2 - x1) * t, y:y1 + (y2 - y1) * t });
    }
    return points;
  }

  function polylinePoints(points, stepsPerSegment = 90) {
    const result = [];
    for(let i = 0; i < points.length - 1; i++) {
      const part = linePoints(points[i].x, points[i].y, points[i + 1].x, points[i + 1].y, stepsPerSegment);
      if(i > 0) part.shift();
      result.push(...part);
    }
    return result;
  }

  function cubicPoints(p0, p1, p2, p3, steps = 220) {
    const points = [];
    for(let i = 0; i <= steps; i++) {
      const t = i / steps;
      const mt = 1 - t;
      points.push({
        x:mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x,
        y:mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y
      });
    }
    return points;
  }

  function smoothCurvePoints(points, stepsPerSegment = 36) {
    /*
      Catmull-Rom interpolation through hand-aligned guide points.
      This keeps the visible trace on the actual dotted curve, not on a guessed straight chord.
    */
    const result = [];
    const n = points.length;

    for(let i = 0; i < n - 1; i++) {
      const p0 = points[Math.max(0, i - 1)];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[Math.min(n - 1, i + 2)];

      for(let step = 0; step <= stepsPerSegment; step++) {
        if(i > 0 && step === 0) continue;
        const t = step / stepsPerSegment;
        const t2 = t * t;
        const t3 = t2 * t;

        result.push({
          x:0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x) * t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x) * t3),
          y:0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y) * t3)
        });
      }
    }

    return result;
  }

  function resetTarget(target) {
    target.started = false;
    target.direction = 1;
    target.anchorIndex = -1;
    target.cursorIndex = -1;
    target.percent = 0;
    target.complete = false;
    target.completedSoundPlayed = false;
  }

  targets.forEach(resetTarget);

  function getAudioContext() {
    if(!audioContext) {
      try { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(_) { return null; }
    }
    if(audioContext.state === "suspended") audioContext.resume().catch(() => {});
    return audioContext;
  }

  function playTick() {
    const now = performance.now();
    if(now - lastTickTime < 75) return;
    lastTickTime = now;

    const ac = getAudioContext();
    if(!ac) return;

    const oscillator = ac.createOscillator();
    const gain = ac.createGain();
    oscillator.type = "sine";
    oscillator.frequency.value = 590;
    gain.gain.setValueAtTime(0.032, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);
    oscillator.connect(gain);
    gain.connect(ac.destination);
    oscillator.start();
    oscillator.stop(ac.currentTime + 0.04);
  }

  function playChime(volume = 1) {
    try {
      const audio = chimeAudio.cloneNode(true);
      audio.volume = volume;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    } catch(_) {}
  }

  function playApplause() {
    const ac = getAudioContext();
    if(!ac) return;

    for(let i = 0; i < 12; i++) {
      const start = ac.currentTime + i * 0.055;
      const buffer = ac.createBuffer(1, ac.sampleRate * 0.07, ac.sampleRate);
      const channel = buffer.getChannelData(0);
      for(let j = 0; j < channel.length; j++) channel[j] = (Math.random() * 2 - 1) * (1 - j / channel.length);

      const source = ac.createBufferSource();
      const filter = ac.createBandpassFilter();
      const gain = ac.createGain();
      source.buffer = buffer;
      filter.frequency.value = 1100 + Math.random() * 900;
      filter.Q.value = 0.7;
      gain.gain.setValueAtTime(0.035, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.07);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(ac.destination);
      source.start(start);
      source.stop(start + 0.07);
    }
  }

  function confetti() {

  function pickFemaleVoice() {
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    if(!voices.length) return null;

    const english = voices.filter(voice => /^en/i.test(voice.lang || ""));
    const preferredNames = ["Jenny", "Aria", "Samantha", "Victoria", "Zira", "Susan", "Karen", "Moira", "Tessa", "Serena", "Google US English", "Microsoft Zira"];

    for(const name of preferredNames) {
      const match = english.find(voice => (voice.name || "").toLowerCase().includes(name.toLowerCase()));
      if(match) return match;
    }

    return english.find(voice => /us|united states/i.test((voice.lang || "") + " " + (voice.name || ""))) || english[0] || voices[0] || null;
  }

  function speak(text, onDone) {
    if(!("speechSynthesis" in window)) {
      if(typeof onDone === "function") onDone();
      return;
    }

    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(text));
      utterance.lang = "en-US";
      utterance.rate = 0.88;
      utterance.pitch = 1.16;
      utterance.volume = 1;
      const voice = pickFemaleVoice();
      if(voice) utterance.voice = voice;
      if(typeof onDone === "function") {
        utterance.onend = onDone;
        utterance.onerror = onDone;
      }
      window.speechSynthesis.speak(utterance);
    } catch(_) {
      if(typeof onDone === "function") onDone();
    }
  }

  function setStatus(text) { statusEl.textContent = text || ""; }

  function readInstructions() {
    getAudioContext();
    setStatus("Trace one dotted line at a time. Start on a colored dot and follow the same dotted path.");

      "Trace the makeup straight lines, the dress zig-zag lines, and the veil curved lines carefully."
    );
  }

  function startIntroOnce() {
    if(introStarted) return;
    introStarted = true;
    window.setTimeout(readInstructions, 650);
  }

  function resizeCanvas() {
    const rect = posterWrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;

    traceLayer.width = Math.max(1, Math.round(rect.width * dpr));
    traceLayer.height = Math.max(1, Math.round(rect.height * dpr));
    traceLayer.style.width = rect.width + "px";
    traceLayer.style.height = rect.height + "px";
    ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    redrawAll();
  }

  function drawTraceSegment(target, startIndex, endIndex) {
    const samples = target.samples;
    if(startIndex < 0 || endIndex < 0 || startIndex === endIndex) return;

    const start = Math.min(startIndex, endIndex);
    const end = Math.max(startIndex, endIndex);
    if(end <= start) return;

    ctx.save();

    /*
      White under-stroke keeps the child's trace clean and readable over the poster lines.
      The coloured stroke is the real-time trace; it grows only as the child moves along the dotted path.
    */
    ctx.beginPath();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,.72)";
    ctx.globalAlpha = 1;
    ctx.lineWidth = (target.lineWidth || 7) + 2.8;
    ctx.moveTo(samples[start].x, samples[start].y);
    for(let i = start + 1; i <= end; i++) ctx.lineTo(samples[i].x, samples[i].y);
    ctx.stroke();

    ctx.beginPath();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = target.color;
    ctx.globalAlpha = 0.96;
    ctx.lineWidth = target.lineWidth || 7;
    ctx.moveTo(samples[start].x, samples[start].y);
    for(let i = start + 1; i <= end; i++) ctx.lineTo(samples[i].x, samples[i].y);
    ctx.stroke();

    ctx.restore();
  }

  function redrawAll() {
    ctx.save();
    ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    ctx.clearRect(0, 0, NATURAL_W, NATURAL_H);

    targets.forEach(target => {
      if(!target.started || target.anchorIndex < 0 || target.cursorIndex < 0) return;
      drawTraceSegment(target, target.anchorIndex, target.cursorIndex);
    });

    ctx.restore();
  }

  function pointerToPosterPoint(event) {
    const rect = traceLayer.getBoundingClientRect();
    return {
      x:(event.clientX - rect.left) * NATURAL_W / rect.width,
      y:(event.clientY - rect.top) * NATURAL_H / rect.height
    };
  }

  function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function pointToSampleDistance(point, target, index) {
    const sample = target.samples[index];
    return Math.hypot(point.x - sample.x, point.y - sample.y);
  }

  function nearestEndpointInfo(point, target) {
    const last = target.samples.length - 1;
    const dStart = pointToSampleDistance(point, target, 0);
    const dEnd = pointToSampleDistance(point, target, last);
    if(dStart <= dEnd) return { distance:dStart, index:0, direction:1 };
    return { distance:dEnd, index:last, direction:-1 };
  }

  function nearestFrontierInfo(point, target) {
    if(!target.started || target.cursorIndex < 0) return { distance:Infinity, index:-1 };
    return { distance:pointToSampleDistance(point, target, target.cursorIndex), index:target.cursorIndex };
  }

  function findTargetForPointerDown(point) {
    let bestTarget = null;
    let bestDistance = Infinity;
    let bestMode = "start";

    targets.forEach(target => {
      if(target.complete) return;

      if(target.started) {
        const frontier = nearestFrontierInfo(point, target);
        if(frontier.distance < bestDistance) {
          bestDistance = frontier.distance;
          bestTarget = target;
          bestMode = "resume";
        }
      } else {
        const endpoint = nearestEndpointInfo(point, target);
        if(endpoint.distance < bestDistance) {
          bestDistance = endpoint.distance;
          bestTarget = target;
          bestMode = "start";
        }
      }
    });

    if(!bestTarget) return null;
    const allowedRadius = bestMode === "resume" ? RESUME_RADIUS : START_RADIUS;
    if(bestDistance <= allowedRadius) return bestTarget;
    return null;
  }

  function startTarget(target, point) {
    if(target.started) return true;

    const endpoint = nearestEndpointInfo(point, target);
    if(endpoint.distance > START_RADIUS) return false;

    target.started = true;
    target.direction = endpoint.direction;
    target.anchorIndex = endpoint.index;
    target.cursorIndex = endpoint.index;
    updateTargetPercentage(target);
    return true;
  }

  function finalIndexForTarget(target) {
    return target.direction === 1 ? target.samples.length - 1 : 0;
  }

  function targetReachedFinish(target) {
    if(!target.started || target.cursorIndex < 0) return false;
    return Math.abs(target.cursorIndex - finalIndexForTarget(target)) <= COMPLETE_END_TOLERANCE_INDEXES;
  }

  function clampAdvanceIndex(target, proposedIndex) {
    const oldIndex = target.cursorIndex;
    const maxStep = MAX_ADVANCE_PER_POINTER_SAMPLE;
    if(target.direction === 1) {
      return Math.min(proposedIndex, oldIndex + maxStep, target.samples.length - 1);
    }
    return Math.max(proposedIndex, oldIndex - maxStep, 0);
  }

  function nearestForwardIndex(target, point) {
    const oldIndex = target.cursorIndex;
    const direction = target.direction;
    const hitRadius = target.hitRadius || 24;
    const lookAhead = target.lookAhead || DEFAULT_LOOK_AHEAD;

    let bestIndex = oldIndex;
    let bestDistance = pointToSampleDistance(point, target, oldIndex);

    for(let step = 1; step <= lookAhead; step++) {
      const index = oldIndex + direction * step;
      if(index < 0 || index >= target.samples.length) break;

      const d = pointToSampleDistance(point, target, index);
      if(d <= hitRadius && d <= bestDistance + 7) {
        bestDistance = d;
        bestIndex = index;
      }
    }

    if(bestIndex === oldIndex) {
      /*
        Allow very slow movement: if the next dot on the same path is close enough,
        advance by only one tiny sample. This prevents the trace from freezing at corners,
        but it still does not snap a whole line complete.
      */
      const nextIndex = oldIndex + direction;
      if(nextIndex >= 0 && nextIndex < target.samples.length) {
        const nextDistance = pointToSampleDistance(point, target, nextIndex);
        if(nextDistance <= hitRadius) return nextIndex;
      }
      return oldIndex;
    }

    return clampAdvanceIndex(target, bestIndex);
  }

  function advanceTargetWithPoint(target, point) {
    if(target.complete) return false;
    if(!target.started && !startTarget(target, point)) return false;

    const oldIndex = target.cursorIndex;
    const nextIndex = nearestForwardIndex(target, point);

    if(nextIndex === oldIndex) {
      updateTargetPercentage(target);
      return false;
    }

    target.cursorIndex = nextIndex;
    updateTargetPercentage(target);
    return true;
  }

  function markLineBetween(target, from, to) {
    if(!target || target.complete) return false;

    const length = distance(from, to);
    /*
      Dense sampling makes quick finger/mouse movement still look like live manual tracing.
      Each mini-sample can advance only a few path samples, so the line grows smoothly instead of snapping.
    */
    const steps = Math.max(1, Math.ceil(length / MOVE_SAMPLE_DISTANCE));
    let changed = false;

    for(let i = 0; i <= steps; i++) {
      const t = i / steps;
      const point = {
        x:from.x + (to.x - from.x) * t,
        y:from.y + (to.y - from.y) * t
      };

      if(advanceTargetWithPoint(target, point)) changed = true;
      if(target.complete) break;
    }

    return changed;
  }

  function updateTargetPercentage(target) {
    if(!target.started || target.anchorIndex < 0 || target.cursorIndex < 0) {
      target.percent = 0;
      return;
    }

    const totalSteps = Math.max(1, target.samples.length - 1);
    const tracedSteps = Math.abs(target.cursorIndex - target.anchorIndex);
    const rawRatio = tracedSteps / totalSteps;
    target.percent = target.complete ? 100 : Math.min(99, Math.floor(rawRatio * 100));

    if(targetReachedFinish(target)) {
      completeTarget(target);
    }
  }

  function completedCount(groupName) { return targets.filter(target => target.group === groupName && target.complete).length; }
  function groupTotal(groupName) { return targets.filter(target => target.group === groupName).length; }
  function groupComplete(groupName) { return completedCount(groupName) === groupTotal(groupName); }

  function completeTarget(target) {
    if(target.complete) return;
    target.complete = true;
    target.percent = 100;

    if(!target.completedSoundPlayed) {
      target.completedSoundPlayed = true;
      playChime(0.95);
    }

    const groupDone = completedCount(target.group);
    const groupSize = groupTotal(target.group);

    if(target.group === "makeup") {
      setStatus("Good tracing. Makeup straight lines: " + groupDone + " of " + groupSize + " complete.");
      if(groupComplete("makeup")) {
        playApplause();
        speak("Wonderful! The makeup has seven straight lines.");
      }
    }

    if(target.group === "dress") {
      setStatus("Good tracing. Dress zig-zag lines: " + groupDone + " of " + groupSize + " complete.");
      if(groupComplete("dress")) {
        playApplause();
        speak("Great job! This dress has three zig-zag lines.");
      }
    }

    if(target.group === "veil") {
      setStatus("Good tracing. Veil curved lines: " + groupDone + " of " + groupSize + " complete.");
      if(groupComplete("veil")) {
        playApplause();
        speak("Excellent! The veil has five curved lines.");
      }
    }

    updateProgress();
    redrawAll();

    /*
      After finishing one line, the next pointer down must choose another dotted path.
      This enforces one-by-one tracing and prevents accidental auto-tracing of nearby paths.
    */
    drawing = false;
    activeTarget = null;
    lastPosterPoint = null;
  }

  function percentageForGroup(groupName) {
    const groupTargets = targets.filter(target => target.group === groupName);
    return Math.round(groupTargets.reduce((total, target) => total + target.percent, 0) / Math.max(1, groupTargets.length));
  }

  function updateProgress() {
    const total = Math.round(targets.reduce((sum, target) => sum + target.percent, 0) / Math.max(1, targets.length));
    const makeupScore = percentageForGroup("makeup");
    const dressScore = percentageForGroup("dress");
    const veilScore = percentageForGroup("veil");

    overallText.textContent = total + "%";
    overallPercent.textContent = total + "%";
    overallFill.style.width = total + "%";
    makeupText.textContent = makeupScore + "%";
    dressText.textContent = dressScore + "%";
    veilText.textContent = veilScore + "%";

    makeupBox.classList.toggle("done", makeupScore >= 100);
    dressBox.classList.toggle("done", dressScore >= 100);
    veilBox.classList.toggle("done", veilScore >= 100);

    if(total >= 95) starsEl.textContent = "★ ★ ★";
    else if(total >= 70) starsEl.textContent = "★ ★ ☆";
    else if(total >= 35) starsEl.textContent = "★ ☆ ☆";
    else starsEl.textContent = "☆ ☆ ☆";

    const complete = targets.every(target => target.complete);
    saveProgress(total, complete);

    if(complete && !finalCelebrated) {
      finalCelebrated = true;
      playChime(1);
      window.setTimeout(() => playChime(0.85), 380);
      playApplause();
      confetti();
      setStatus("Excellent! You traced all the different lines completely.");
      speak("Excellent work! You traced seven straight lines, three zig-zag lines, and five curved lines.");
    }
  }

  function pointerDown(event) {
    event.preventDefault();
    getAudioContext();

    const point = pointerToPosterPoint(event);
    const target = findTargetForPointerDown(point);

    if(!target) {
      setStatus("Start on a colored dot. Trace only one dotted line from dot to dot.");
      return;
    }

    drawing = true;
    activeTarget = target;
    lastPosterPoint = point;

    try { traceLayer.setPointerCapture(event.pointerId); } catch(_) {}

    const changed = advanceTargetWithPoint(activeTarget, point);
    if(changed) playTick();

    updateProgress();
    redrawAll();

    if(activeTarget && activeTarget.group === "dress") {
      setStatus("Trace this zig-zag line slowly from one colored dot to the other colored dot.");
    } else if(activeTarget && activeTarget.group === "veil") {
      setStatus("Trace this curved line slowly. Keep your finger on the grey dotted curve.");
    } else if(activeTarget) {
      setStatus("Trace this straight line carefully from dot to dot.");
    }
  }

  function pointerMove(event) {
    if(!drawing || !activeTarget || !lastPosterPoint) return;
    event.preventDefault();

    const point = pointerToPosterPoint(event);
    const changed = markLineBetween(activeTarget, lastPosterPoint, point);

    if(changed) {
      playTick();
      updateProgress();
      redrawAll();
    }

    lastPosterPoint = point;
  }

  function pointerUp(event) {
    if(event && event.pointerId !== undefined) {
      try { traceLayer.releasePointerCapture(event.pointerId); } catch(_) {}
    }

    drawing = false;
    activeTarget = null;
    lastPosterPoint = null;
  }

  function clearAll(sayIt = false) {
    finalCelebrated = false;
    drawing = false;
    activeTarget = null;
    lastPosterPoint = null;
    targets.forEach(resetTarget);
    redrawAll();
    updateProgress();
    setStatus("Trace the straight, zig-zag, and curved dotted lines one by one.");
    if(sayIt) speak("Cleared. Start on a colored dot and trace one dotted line at a time.");
  }

  function saveProgress(score, completed) {
    const payload = {
      pageId:PAGE_ID,
      file:FILE_NAME,
      level:LEVEL,
      week:WEEK,
      type:"tracing",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0,
      skills:{ reading:1, writing:score >= 95 ? 3 : score > 0 ? 1 : 0, listening:1, speaking:0, tracing:1 },
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };

    try {
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", { detail:payload }));
    } catch(_) {}

    try {
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(() => {});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(() => {});
    } catch(_) {}
  }

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);

  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", () => clearAll(true));
  cheerBtn.addEventListener("click", () => {
    getAudioContext();
    playChime();
    playApplause();
    confetti();
    setStatus("You are doing great. Keep tracing one dotted line at a time.");
    speak("You can do it! Start at a colored dot and follow the dotted line carefully.");
  });

  homeBtn.addEventListener("click", () => {
    try { window.speechSynthesis.cancel(); } catch(_) {}
    window.location.href = HOME_PAGE;
  });

  prevBtn.addEventListener("click", () => {
    try { window.speechSynthesis.cancel(); } catch(_) {}
    window.location.href = PREVIOUS_PAGE;
  });

  nextBtn.addEventListener("click", () => {
    try { window.speechSynthesis.cancel(); } catch(_) {}
    window.location.href = NEXT_PAGE;
  });

  posterImg.addEventListener("load", () => {
    resizeCanvas();
    redrawAll();
  }, { once:true });

  posterImg.addEventListener("error", () => {
    setStatus("Poster image missing. The embedded poster could not load.");
  });

  window.addEventListener("resize", resizeCanvas);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);

  if("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => pickFemaleVoice();
  }

  window.addEventListener("beforeunload", () => {
    try { window.speechSynthesis.cancel(); } catch(_) {}
  });

  document.addEventListener("pointerdown", () => {
    getAudioContext();
    try { chimeAudio.load(); } catch(_) {}
  }, { once:true });

  window.addEventListener("load", () => {
    resizeCanvas();
    clearAll(false);
    startIntroOnce();
  }, { once:true });
})();
</script>

</body>
