<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA3 - Zig Zag Lines</title>
<style>
  :root{
    --ink:#2d2d2d;
    --bg:#fff9f1;
    --card:#ffffff;
    --accent:#5f88cc;
    --green:#13a856;
    --red:#f13a52;
    --gold:#ffd24a;
    --shadow:0 18px 38px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);}
  body{display:flex;align-items:flex-start;justify-content:center;padding:10px;overflow-x:hidden;}
  .lesson-card{width:min(980px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 16px;}
  .poster-wrap{position:relative;width:min(890px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .trace-zone{position:absolute;z-index:8;touch-action:none;cursor:crosshair;background:rgba(255,255,255,0.001);}
  .trace-zone canvas{width:100%;height:100%;display:block;touch-action:none;}
  .trace-zone.is-active{outline:3px solid rgba(52,157,255,.22);border-radius:20px;}
  .trace-zone.done{outline:4px solid rgba(47,159,95,.22);border-radius:20px;}
  .zone-1{left:30.427%;top:36.441%;width:38.862%;height:7.291%;} .zone-2{left:28.867%;top:55.482%;width:41.516%;height:9.010%;} .zone-3{left:20.620%;top:76.026%;width:58.866%;height:7.791%;}
  .controls-panel{margin:12px auto 0;width:min(890px,100%);background:linear-gradient(180deg,#fff,#fff7fb);border:3px solid rgba(95,136,204,.25);border-radius:18px;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.08);}
  .progress-title{font-size:clamp(1rem,2.6vw,1.35rem);font-weight:900;text-align:center;color:#4c78c1;margin-bottom:7px;}
  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-bar{flex:1;height:18px;background:#e7efff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#31b7ff,#84efab);border-radius:999px;transition:width .08s linear;}
  .progress-percent{min-width:58px;text-align:right;font-weight:1000;color:#175ca8;font-size:1.05rem;}
  .line-progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;}
  .mini-progress{background:#fff;border:2px solid #dbe7ff;border-radius:14px;padding:8px 10px;text-align:center;font-weight:900;color:#444;}
  .mini-progress span{color:#f2475b;}
  .status{min-height:1.45em;text-align:center;font-weight:1000;color:#6c4bbf;font-size:clamp(.95rem,2.5vw,1.15rem);margin-top:8px;}
  .button-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  button,.btn-home{border:none;border-radius:999px;padding:10px 16px;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .1s ease,filter .1s ease;text-decoration:none;}
  button:hover,.btn-home:hover{filter:brightness(1.04);}
  button:active,.btn-home:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn-prev,.btn-next{background:#ff8a5b;color:#fff;}
  .btn-clear{background:#dfeaff;color:#1f3b6b;}
  .btn-read{background:#f6da7b;color:#8b5a00;}
  .btn-home{background:#fff0f4;color:#4c78c1;border:2px solid #dbe7ff;display:inline-flex;}
  .footer-note{margin-top:8px;text-align:center;color:#666;font-weight:800;font-size:.9rem;}
  .home-float{position:fixed;top:18px;right:18px;z-index:1000;min-width:68px;background:#fff;color:#4c78c1;border:3px solid #dbe7ff;border-radius:999px;padding:10px 14px;font-weight:1000;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.14);transform-origin:top center;animation:homeSwing 3.2s ease-in-out infinite;}
  @keyframes homeSwing{0%,100%{transform:rotate(0deg);}25%{transform:rotate(7deg);}75%{transform:rotate(-7deg);}}
  @media(max-width:620px){
    body{padding:6px;}
    .lesson-card{border-radius:16px;padding:6px 6px 12px;}
    .controls-panel{padding:10px;border-radius:14px;}
    .line-progress-grid{grid-template-columns:1fr;}
    button,.btn-home{font-size:.85rem;padding:9px 12px;}
    .progress-row{gap:6px;}
    .home-float{font-size:.86rem;min-width:56px;padding:8px 10px;}
  }
</style>
</head>

  const pathConfigs = [[{'x': 0.0747, 'y': 0.6231}, {'x': 0.2177, 'y': 0.308}, {'x': 0.3037, 'y': 0.6585}, {'x': 0.4402, 'y': 0.2874}, {'x': 0.5551, 'y': 0.7033}, {'x': 0.6974, 'y': 0.3011}, {'x': 0.7991, 'y': 0.7126}, {'x': 0.9253, 'y': 0.3297}], [{'x': 0.0775, 'y': 0.7425}, {'x': 0.2177, 'y': 0.2948}, {'x': 0.2998, 'y': 0.6445}, {'x': 0.3893, 'y': 0.3303}, {'x': 0.4655, 'y': 0.622}, {'x': 0.556, 'y': 0.3203}, {'x': 0.6215, 'y': 0.5962}, {'x': 0.7204, 'y': 0.3042}, {'x': 0.8028, 'y': 0.622}, {'x': 0.9225, 'y': 0.2575}], [{'x': 0.0546, 'y': 0.6913}, {'x': 0.1464, 'y': 0.2987}, {'x': 0.243, 'y': 0.6799}, {'x': 0.3283, 'y': 0.3191}, {'x': 0.4254, 'y': 0.7021}, {'x': 0.5083, 'y': 0.3185}, {'x': 0.6036, 'y': 0.6741}, {'x': 0.6889, 'y': 0.3185}, {'x': 0.7913, 'y': 0.7022}, {'x': 0.8719, 'y': 0.2978}, {'x': 0.9454, 'y': 0.6394}]];
  const linePercents = [0,0,0];
  const cheeredLines = [false,false,false];
  let finalCelebrated = false;
  let audioCtx = null;
  let lastTick = 0;

  function setStatus(text){
    if (statusText) statusText.textContent = text || "";
  }

  function unlockAudio(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    } catch(_) {}
  }

  function pickVoice(){
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|serena|emma|ivy|grace|luna|nova|stella|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|daniel|thomas|alex|mark|paul|brian|steve|kevin|eric|christopher/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|serena|emma|ivy|grace|luna|nova|stella|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text, opts={}){
    return new Promise(resolve => {
      if (!text || !("speechSynthesis" in window)) { resolve(); return; }
      try { window.speechSynthesis.cancel(); } catch(_) {}
      const utter = new SpeechSynthesisUtterance(String(text));
      utter.lang = "en-US";
      utter.rate = typeof opts.rate === "number" ? opts.rate : 0.88;
      utter.pitch = typeof opts.pitch === "number" ? opts.pitch : 1.17;
      utter.volume = 1;
      const voice = pickVoice();
      if (voice) utter.voice = voice;
      utter.onend = resolve;
      utter.onerror = resolve;
      window.speechSynthesis.speak(utter);
    });
  }

  function stopSpeaking(){
    try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch(_) {}
  }

  function playChime(){
    try {
      const audio = new Audio(CHIME_SRC);
      audio.volume = 0.9;
      audio.play().catch(() => {});
    } catch(_) {}
  }

  function playApplause(){
    unlockAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      for (let i=0;i<12;i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i % 2 ? "triangle" : "sine";
        osc.frequency.value = 500 + Math.random() * 420;
        gain.gain.setValueAtTime(0.001, now + i * 0.045);
        gain.gain.exponentialRampToValueAtTime(0.07, now + i * 0.045 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.045 + 0.08);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i * 0.045);
        osc.stop(now + i * 0.045 + 0.09);
      }
    } catch(_) {}
  }

  function playTraceTick(){
    const nowMs = Date.now();
    if (nowMs - lastTick < 80) return;
    lastTick = nowMs;
    unlockAudio();
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.052, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.055);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.065);
    } catch(_) {}
  }

  function distanceToSegment(px, py, ax, ay, bx, by){
    const dx = bx - ax;
    const dy = by - ay;
    if (dx === 0 && dy === 0) return Math.hypot(px - ax, py - ay);
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
    const cx = ax + t * dx;
    const cy = ay + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  function saveProgress(score, completed){
    const stars = score >= 92 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0;
    const payload = {
      pageId: PAGE_ID,
      file: PAGE_ID + ".html",
      level: LEVEL,
      activityType: "zig-zag-tracing",
      type: "lesson",
      score,
      tracing: score,
      stars,
      completed: !!completed,
      skills: {reading:1, writing: score >= 70 ? 2 : score > 0 ? 1 : 0, speaking:1, listening:1},
      savedAt: new Date().toISOString(),
      ts: Date.now()
    };
    try {
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = Object.assign({}, store[payload.pageId] || {}, payload);
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      const byPage = JSON.parse(localStorage.getItem("gpProgressByPage") || "{}");
      byPage[payload.pageId] = payload;
      localStorage.setItem("gpProgressByPage", JSON.stringify(byPage));
    } catch(_) {}
    try { window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload})); } catch(_) {}
    if (typeof window.finishAndSave === "function") {
      window.finishAndSave(payload).catch(() => {});
    }
  }

  function updateOverall(index){
    const total = Math.round(linePercents.reduce((a,b)=>a+b,0) / linePercents.length);
    const lineEl = document.getElementById("linePct" + index);
    if (lineEl) lineEl.textContent = linePercents[index] + "%";
    if (progressPercent) progressPercent.textContent = total + "%";
    if (progressFill) progressFill.style.width = total + "%";

    if (linePercents[index] >= 82 && !cheeredLines[index]) {
      cheeredLines[index] = true;
      setStatus("Great tracing! You followed the original dots.");
      playChime();
      playApplause();
      speak("Great tracing! You followed the original dots.");
    }

    if (total >= 92 && !finalCelebrated) {
      finalCelebrated = true;
      setStatus("Wow! You traced all the zig-zag lines. Amazing job!");
      playChime();
      setTimeout(playChime, 420);
      playApplause();
      speak("Wow! You traced all the zig-zag lines. Amazing job! A zig-zag line has many points.");
      saveProgress(total, true);
      return;
    }

    if (total < 92) finalCelebrated = false;
    saveProgress(total, false);
  }

  function createLinePad(zone, index){
    const canvas = zone.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const points = pathConfigs[index];
    const covered = [];
    let drawing = false;
    let last = null;
    let samplePoints = [];
    let lastPercent = 0;

    function makeSamples(width, height){
      samplePoints = [];
      for (let i=0;i<points.length-1;i++) {
        const a = points[i];
        const b = points[i+1];
        const segmentLength = Math.hypot((b.x-a.x)*width, (b.y-a.y)*height);
        const steps = Math.max(14, Math.ceil(segmentLength / 8));
        for (let s=0;s<=steps;s++) {
          const t = s / steps;
          samplePoints.push({x:(a.x + (b.x-a.x)*t)*width, y:(a.y + (b.y-a.y)*t)*height});
        }
      }
      covered.length = samplePoints.length;
      covered.fill(false);
    }

    function redrawSavedLine(){
      ctx.beginPath();
      for (let i=0;i<points.length;i++) {
        const x = points[i].x * canvas.clientWidth;
        const y = points[i].y * canvas.clientHeight;
        if (i === 0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
      }
    }

    function resize(){
      const rect = zone.getBoundingClientRect();
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(9, Math.min(18, width * 0.034));
      ctx.strokeStyle = "rgba(18,168,86,0.88)";
      makeSamples(width, height);
      linePercents[index] = 0;
      lastPercent = 0;
      const el = document.getElementById("linePct" + index);
      if (el) el.textContent = "0%";
      zone.classList.remove("done", "is-active");
    }

    function pointFromEvent(e){
      const rect = zone.getBoundingClientRect();
      return {x:e.clientX - rect.left, y:e.clientY - rect.top};
    }

    function markCoverageBetween(a, b){
      const rect = zone.getBoundingClientRect();
      const threshold = Math.max(18, rect.width * 0.055);
      for (let i=0;i<samplePoints.length;i++) {
        const sp = samplePoints[i];
        const d = b ? distanceToSegment(sp.x, sp.y, a.x, a.y, b.x, b.y) : Math.hypot(sp.x-a.x, sp.y-a.y);
        if (d <= threshold) covered[i] = true;
      }
      const hit = covered.filter(Boolean).length;
      const pct = Math.min(100, Math.round((hit / Math.max(1, covered.length)) * 100));
      if (pct > linePercents[index]) {
        linePercents[index] = pct;
        if (pct - lastPercent >= 2) {
          playTraceTick();
          lastPercent = pct;
        }
        updateOverall(index);
      }
    }

    function begin(point){
      unlockAudio();
      drawing = true;
      last = point;
      zone.classList.add("is-active");
      ctx.beginPath();
      ctx.moveTo(point.x, point.y);
      markCoverageBetween(point, null);
    }

    function draw(point){
      if (!drawing || !last) return;
      const dist = Math.hypot(point.x-last.x, point.y-last.y);
      if (dist < 0.2) return;
      ctx.lineTo(point.x, point.y);
      ctx.stroke();
      markCoverageBetween(last, point);
      last = point;
      if (linePercents[index] >= 92) zone.classList.add("done");
    }

    function end(e){
      if (e && typeof zone.releasePointerCapture === "function") {
        try { zone.releasePointerCapture(e.pointerId); } catch(_) {}
      }
      drawing = false;
      last = null;
      zone.classList.remove("is-active");
    }

    zone.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (typeof zone.setPointerCapture === "function") {
        try { zone.setPointerCapture(e.pointerId); } catch(_) {}
      }
      begin(pointFromEvent(e));
    }, {passive:false});

    zone.addEventListener("pointermove", e => {
      if (!drawing) return;
      e.preventDefault();
      draw(pointFromEvent(e));
    }, {passive:false});

    zone.addEventListener("pointerup", end);
    zone.addEventListener("pointercancel", end);
    zone.addEventListener("pointerleave", end);

    function reset(){
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const width = canvas.width / ratio;
      const height = canvas.height / ratio;
      ctx.clearRect(0,0,width,height);
      covered.fill(false);
      drawing = false;
      last = null;
      linePercents[index] = 0;
      lastPercent = 0;
      cheeredLines[index] = false;
      zone.classList.remove("done", "is-active");
      const el = document.getElementById("linePct" + index);
      if (el) el.textContent = "0%";
    }

    resize();
    return {resize, reset};
  }

  const pads = zones.map((zone, index) => createLinePad(zone, index));

  function readInstructions(){
    setStatus("Trace each original zig-zag line from the green dot, through the blue points, to the red dot.");
    speak("Zig zag lines. Week two. Trace each zig zag line from point to point. Start at the green dot. Follow the blue points. Stop at the red dot. A zig zag line has many points.");
  }

  function clearAll(){
    stopSpeaking();
    pads.forEach(p => p.reset());
    for (let i=0;i<linePercents.length;i++) {
      linePercents[i] = 0;
      cheeredLines[i] = false;
      const el = document.getElementById("linePct" + i);
      if (el) el.textContent = "0%";
    }
    finalCelebrated = false;
    if (progressPercent) progressPercent.textContent = "0%";
    if (progressFill) progressFill.style.width = "0%";
    setStatus("Trace each original zig-zag line from the green dot to the red dot.");
    saveProgress(0, false);
  }

  window.addEventListener("resize", () => pads.forEach(p => p.resize()));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", () => pads.forEach(p => p.resize()));

  clearBtn.addEventListener("click", clearAll);
  readBtn.addEventListener("click", readInstructions);
  prevBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = nextHref; });

  if ("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};

  window.addEventListener("load", () => {
    clearAll();
    setTimeout(readInstructions, 650);
  }, {once:true});
})();
</script>
