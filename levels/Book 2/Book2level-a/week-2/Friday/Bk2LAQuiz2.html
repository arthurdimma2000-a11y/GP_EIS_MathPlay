<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA Quiz - Zig Zag Numbers</title>

<style>
  :root{
    --blue:#5f8fd3;
    --red:#f24b5e;
    --yellow:#f8df8a;
    --sky:#86d5eb;
    --green:#9ed06a;
    --cream:#fffdf5;
    --ink:#25242a;
    --gold:#ffd24a;
    --good:#1fa85b;
    --bad:#e03245;
    --shadow:0 16px 34px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    padding:0;
    background:#fff9ef;
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#f1e6d8 1px, transparent 1px),
      linear-gradient(90deg, #f1e6d8 1px, transparent 1px);
    background-size:28px 28px;
  }

  .app{
    width:min(1020px,100%);
    background:#fffdf7;
    border:8px solid var(--blue);
    border-radius:30px;
    padding:16px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }

  .main-title{
    margin:-10px auto 10px;
    text-align:center;
    font-size:clamp(2.6rem,8vw,5.5rem);
    line-height:.95;
    color:#fff;
    font-weight:1000;
    -webkit-text-stroke:8px var(--blue);
    paint-order:stroke fill;
    text-shadow:0 5px 0 rgba(95,143,211,.22);
  }

  .week{
    position:absolute;
    right:20px;
    top:22px;
    background:#fff;
    border:4px solid var(--blue);
    border-radius:12px;
    padding:5px 12px;
    font-size:clamp(.95rem,2.5vw,1.35rem);
    font-weight:1000;
  }

  .top-nav,.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
  }

  .top-nav{
    justify-content:space-between;
    margin-bottom:10px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:3px solid #d8e8ff;
    border-radius:999px;
    padding:8px 13px;
    font-weight:1000;
    color:#335c99;
    box-shadow:0 8px 16px rgba(0,0,0,.08);
  }

  .btn{
    border:none;
    border-radius:999px;
    padding:11px 17px;
    font-size:.98rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.18);
    transition:transform .1s ease,filter .1s ease;
  }

  .btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
  .btn.home{background:#25d17d;color:#fff}
  .btn.back,.btn.reset{background:#dfeaff;color:#1f3b6b}
  .btn.next{background:#f7dc6f;color:#8b5a00}
  .btn.read{background:var(--red);color:#fff}
  .btn.cheer{background:#c9f2d6;color:#166c38}

  .hero{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:14px;
  }

  .preview{
    border:5px solid #d8e8ff;
    border-radius:24px;
    background:#fff;
    overflow:hidden;
  }

  .preview-title{
    background:var(--blue);
    color:#fff;
    text-align:center;
    font-weight:1000;
    font-size:clamp(1.25rem,3vw,1.9rem);
    padding:8px;
  }

  .numbers-mini{
    display:grid;
    gap:8px;
    padding:10px;
  }

  .mini-row{
    display:grid;
    grid-template-columns:35% 65%;
    min-height:70px;
    border:3px solid;
    border-radius:14px;
    overflow:hidden;
  }

  .mini-row.yellow{border-color:#f2d36c}
  .mini-row.sky{border-color:#78d0e7}
  .mini-row.green{border-color:#96cf66}

  .mini-objects{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:4px;
  }

  .yellow .mini-objects{background:#f8df8a}
  .sky .mini-objects{background:#86d5eb}
  .green .mini-objects{background:#9ed06a}

  .mini-number{
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:
      linear-gradient(#b7ebff 1px, transparent 1px),
      linear-gradient(90deg, #b7ebff 1px, transparent 1px);
    background-size:18px 18px;
    font-size:3rem;
    font-weight:1000;
    color:#fff;
    -webkit-text-stroke:4px var(--red);
    paint-order:stroke fill;
  }

  .dot{
    width:18px;
    height:18px;
    border-radius:6px;
    background:#ffd12c;
    border:2px solid #5a3a00;
  }

  .egg{
    width:18px;
    height:24px;
    border-radius:50%;
    background:#e9a354;
    border:2px solid #5a3a00;
  }

  .cube{
    width:18px;
    height:18px;
    background:#fff;
    border:2px solid #222;
    transform:rotate(10deg);
  }

  .zig-mini{
    background:#86d5eb;
    min-height:250px;
    position:relative;
    padding:16px;
  }

  .cake{
    position:absolute;
    left:12%;
    right:12%;
    top:45%;
    height:80px;
    border:4px solid #222;
    border-radius:22px;
    background:#f6c35c;
  }

  .cake::before{
    content:"";
    position:absolute;
    left:-5px;
    right:-5px;
    top:-23px;
    height:30px;
    background:#fff6d5;
    border:4px solid #222;
    border-bottom:none;
    border-radius:50% 50% 8px 8px;
  }

  .zig{
    position:absolute;
    left:16%;
    right:16%;
    top:52%;
    height:55px;
  }

  .zig svg{
    width:100%;
    height:100%;
  }

  .zig polyline{
    fill:none;
    stroke:#222;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .zig .dash{
    stroke:#fff7d5;
    stroke-width:14;
  }

  .caption{
    position:absolute;
    left:0;
    right:0;
    bottom:18px;
    text-align:center;
    font-size:clamp(1.2rem,3vw,2rem);
    font-weight:1000;
  }

  .caption span{color:var(--red)}

  .quiz-panel{
    background:#fff8fb;
    border:4px solid #ffd1df;
    border-radius:24px;
    padding:14px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }

  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }

  .question-count,.score-box{
    font-size:1rem;
    font-weight:1000;
  }

  .question-count{color:#6c4bbf}
  .score-box{color:#166c38}

  .question{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#fff;
    border:3px dashed #f5b3c4;
    border-radius:18px;
    padding:14px;
    font-size:clamp(1.25rem,4vw,1.95rem);
    font-weight:1000;
  }

  .answers{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }

  .answer-btn{
    border:none;
    border-radius:18px;
    min-height:86px;
    padding:12px;
    font-size:clamp(1.1rem,3.5vw,1.85rem);
    font-weight:1000;
    cursor:pointer;
    background:#eef6ff;
    color:#17375e;
    box-shadow:0 6px 0 rgba(0,0,0,.15);
    transition:transform .1s ease, filter .1s ease, background .12s ease;
  }

  .answer-btn:hover{
    transform:translateY(-2px) scale(1.01);
    filter:brightness(1.04);
  }

  .answer-btn.correct{
    background:#c9f5d8;
    color:#0a6c34;
    animation:pop .45s ease;
  }

  .answer-btn.wrong{
    background:#ffd4dc;
    color:#a31325;
    animation:shake .35s ease;
  }

  @keyframes pop{
    0%{transform:scale(1)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
  }

  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    75%{transform:translateX(8px)}
  }

  .progress-wrap{
    margin-top:12px;
  }

  .progress-label{
    text-align:center;
    font-weight:1000;
    color:#4b3960;
    margin-bottom:6px;
  }

  .bar{
    height:16px;
    background:#e8eef8;
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.12);
  }

  .fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#58c6ff,#83e79f);
    transition:width .25s ease;
  }

  .controls{margin-top:14px}

  .status{
    margin-top:12px;
    min-height:1.5em;
    text-align:center;
    font-size:clamp(1rem,3vw,1.35rem);
    font-weight:1000;
    color:#5a3eb0;
  }

  .stars{
    text-align:center;
    min-height:1.3em;
    font-size:2.1rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.7s linear forwards;
  }

  @keyframes fall{
    to{transform:translateY(105vh) rotate(540deg);opacity:.1}
  }

  @media(max-width:780px){
    .hero{grid-template-columns:1fr}
    .answers{grid-template-columns:1fr}
    .main-title{-webkit-text-stroke:5px var(--blue)}
    .week{top:12px;right:12px}
  }
</style>
</head>

<body>
<main class="app">
  <div class="week">Week 2</div>

  <div class="top-nav">
    <div class="badge">🧠 Level A · Quiz</div>
    <div class="top-nav">
      <button class="btn back" id="backBtn">⬅ Back</button>
      <button class="btn next" id="nextPageBtn">Next ➜</button>
      <button class="btn home" id="homeBtn">🏠 Home</button>
    </div>
  </div>

  <h1 class="main-title">Zig Zag Quiz</h1>

  <section class="hero">
    <div class="preview">
      <div class="preview-title">Numbers 6, 7, 8</div>
      <div class="numbers-mini">
        <div class="mini-row yellow">
          <div class="mini-objects">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
          <div class="mini-number">6</div>
        </div>

        <div class="mini-row sky">
          <div class="mini-objects">
            <span class="egg"></span><span class="egg"></span><span class="egg"></span>
            <span class="egg"></span><span class="egg"></span><span class="egg"></span><span class="egg"></span>
          </div>
          <div class="mini-number">7</div>
        </div>

        <div class="mini-row green">
          <div class="mini-objects">
            <span class="cube"></span><span class="cube"></span><span class="cube"></span><span class="cube"></span>
            <span class="cube"></span><span class="cube"></span><span class="cube"></span><span class="cube"></span>
          </div>
          <div class="mini-number">8</div>
        </div>
      </div>
    </div>

    <div class="preview">
      <div class="preview-title">Zig Zag Lines</div>
      <div class="zig-mini">
        <div class="cake"></div>
        <div class="zig">
          <svg viewBox="0 0 100 40" preserveAspectRatio="none">
            <polyline class="dash" points="0,28 12,8 24,28 36,8 48,28 60,8 72,28 84,8 100,28"></polyline>
            <polyline points="0,28 12,8 24,28 36,8 48,28 60,8 72,28 84,8 100,28"></polyline>
          </svg>
        </div>
        <div class="caption">A zig-zag line has <span>many points</span>.</div>
      </div>
    </div>
  </section>

  <section class="quiz-panel">
    <div class="quiz-top">
      <div class="question-count" id="questionCount">Question 1 of 10</div>
      <div class="score-box" id="scoreBox">Score: 0</div>
    </div>

    <div class="question" id="questionText">Loading question…</div>
    <div class="answers" id="answers"></div>

    <div class="progress-wrap">
      <div class="progress-label">Quiz progress: <span id="progressText">0%</span></div>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
    </div>
  </section>

  <div class="controls">
    <button class="btn read" id="readBtn">🔊 Read Question</button>
    <button class="btn next" id="nextBtn">Next Question →</button>
    <button class="btn cheer" id="cheerBtn">👏 Cheer</button>
    <button class="btn reset" id="resetBtn">Reset Quiz</button>
  </div>

  <div class="stars" id="stars"></div>
  <div class="status" id="status">Tap “Read Question” and choose the correct answer.</div>
</main>

<script>
(function(){
  "use strict";

  const HOME_PAGE = "../../../../../index.html";
  const PREVIOUS_PAGE = "./Bk2LAGame2.html";
  const NEXT_PAGE = "../../week-3/Tuesday/Bk2LA14.html";
  const PAGE_ID = "Bk2LA_Quiz_ZigZagNumbers";

  const questions = [
    {text:"Which number is shown on the yellow row?", answers:["6","7","8"], correct:"6", speak:"Which number is shown on the yellow row?"},
    {text:"Which number is shown on the blue row?", answers:["6","7","8"], correct:"7", speak:"Which number is shown on the blue row?"},
    {text:"Which number is shown on the green row?", answers:["6","7","8"], correct:"8", speak:"Which number is shown on the green row?"},
    {text:"What comes after 6?", answers:["5","7","8"], correct:"7", speak:"What comes after six?"},
    {text:"What comes after 7?", answers:["6","8","9"], correct:"8", speak:"What comes after seven?"},
    {text:"What kind of line goes up and down like teeth?", answers:["Straight line","Zig-zag line","Circle"], correct:"Zig-zag line", speak:"What kind of line goes up and down like teeth?"},
    {text:"A zig-zag line has how many points?", answers:["Many points","No points","One point"], correct:"Many points", speak:"A zig-zag line has how many points?"},
    {text:"What should we do with the zig-zag line on the cake?", answers:["Trace it","Hide it","Erase it"], correct:"Trace it", speak:"What should we do with the zig-zag line on the cake?"},
    {text:"Which number is bigger?", answers:["6","8","4"], correct:"8", speak:"Which number is bigger? Six, eight, or four?"},
    {text:"What did the boy say in the poster?", answers:["Let’s make a cake!","Let’s sleep.","Let’s run away."], correct:"Let’s make a cake!", speak:"What did the boy say in the poster?"}
  ];

  const questionCount = document.getElementById("questionCount");
  const scoreBox = document.getElementById("scoreBox");
  const questionText = document.getElementById("questionText");
  const answersEl = document.getElementById("answers");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const statusEl = document.getElementById("status");
  const starsEl = document.getElementById("stars");

  const readBtn = document.getElementById("readBtn");
  const nextBtn = document.getElementById("nextBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const resetBtn = document.getElementById("resetBtn");
  const backBtn = document.getElementById("backBtn");
  const nextPageBtn = document.getElementById("nextPageBtn");
  const homeBtn = document.getElementById("homeBtn");

  let index = 0;
  let score = 0;
  let answered = false;
  let audioCtx = null;

  function setStatus(text){ statusEl.textContent = text || ""; }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text){
    if(!text || !("speechSynthesis" in window)) return;
    try{ window.speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.88;
    u.pitch = 1.16;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function getAudioCtx(){
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if(!AudioContext) return null;
    if(!audioCtx) audioCtx = new AudioContext();
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function playChime(){
    getAudioCtx();
    try{
      const a = new Audio("chime.mp3");
      a.volume = .9;
      a.play().catch(playSynthChime);
    }catch(_){ playSynthChime(); }
  }

  function playSynthChime(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    [660,880,1046].forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t = ctx.currentTime + i*.13;
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(.0001,t);
      gain.gain.exponentialRampToValueAtTime(.22,t+.03);
      gain.gain.exponentialRampToValueAtTime(.0001,t+.32);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t+.35);
    });
  }

  function wrongSound(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120,ctx.currentTime+.16);
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.08,ctx.currentTime+.02);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+.22);
  }

  function clap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    for(let i=0;i<4;i++){
      const bufferSize = Math.floor(ctx.sampleRate*.08);
      const buffer = ctx.createBuffer(1,bufferSize,ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<bufferSize;j++){
        data[j]=(Math.random()*2-1)*Math.pow(1-j/bufferSize,2);
      }
      const noise = ctx.createBufferSource();
      const gain = ctx.createGain();
      noise.buffer = buffer;
      gain.gain.value = .22;
      noise.connect(gain);
      gain.connect(ctx.destination);
      noise.start(ctx.currentTime+i*.14);
    }
  }

  function confetti(){
    const colors=["#f24b5e","#ffd24a","#58c6ff","#83e79f","#f7a6c9","#9ed06a"];
    for(let i=0;i<36;i++){
      const piece=document.createElement("div");
      piece.className="confetti-piece";
      piece.style.left=Math.random()*100+"vw";
      piece.style.background=colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay=Math.random()*.35+"s";
      document.body.appendChild(piece);
      piece.addEventListener("animationend",()=>piece.remove());
    }
  }

  function saveProgress(){
    try{
      const percent = Math.round((index / questions.length) * 100);
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = {
        pageId:PAGE_ID,
        file:PAGE_ID + ".html",
        level:"A",
        week:2,
        type:"quiz",
        activityType:"quiz",
        score,
        quizProgress:percent,
        stars:score >= 8 ? 3 : score >= 5 ? 2 : score >= 3 ? 1 : 0,
        completed:index >= questions.length,
        savedAt:new Date().toISOString(),
        ts:Date.now()
      };
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", PAGE_ID + ".html");
    }catch(_){}
  }

  function updateProgress(){
    const percent = Math.round((index / questions.length) * 100);
    progressText.textContent = percent + "%";
    progressFill.style.width = percent + "%";
    scoreBox.textContent = "Score: " + score;

    if(score >= 8) starsEl.textContent = "⭐ ⭐ ⭐";
    else if(score >= 5) starsEl.textContent = "⭐ ⭐";
    else if(score >= 3) starsEl.textContent = "⭐";
    else starsEl.textContent = "";
  }

  function renderQuestion(){
    answered = false;

    if(index >= questions.length){
      questionCount.textContent = "Quiz Complete";
      questionText.textContent = "Great job! You finished the quiz.";
      answersEl.innerHTML = "";
      progressText.textContent = "100%";
      progressFill.style.width = "100%";

      let message = "Good job! Nice try.";
      if(score >= 8) message = "Wow! You are super smart!";
      else if(score >= 5) message = "Amazing job!";

      setStatus(message + " Score: " + score + " out of " + questions.length + ".");
      playChime();
      clap();
      confetti();
      speak(message + " Your score is " + score + " out of " + questions.length + ".");
      saveProgress();
      return;
    }

    const q = questions[index];
    questionCount.textContent = "Question " + (index + 1) + " of " + questions.length;
    questionText.textContent = q.text;
    answersEl.innerHTML = "";

    q.answers.forEach(answer=>{
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.type = "button";
      btn.textContent = answer;
      btn.addEventListener("click",()=>chooseAnswer(btn,answer));
      answersEl.appendChild(btn);
    });

    setStatus("Choose the correct answer.");
    updateProgress();
    saveProgress();
  }

  function chooseAnswer(button,answer){
    if(answered) return;
    answered = true;
    getAudioCtx();

    const q = questions[index];
    const allButtons = Array.from(document.querySelectorAll(".answer-btn"));

    allButtons.forEach(btn=>{
      if(btn.textContent === q.correct) btn.classList.add("correct");
      if(btn === button && answer !== q.correct) btn.classList.add("wrong");
      btn.disabled = true;
    });

    if(answer === q.correct){
      score += 1;
      playChime();
      clap();
      confetti();
      setStatus("Correct! Great job!");
      speak("Correct! Great job!");
    }else{
      wrongSound();
      setStatus("Sorry, try again next time. The correct answer is " + q.correct + ".");
      speak("Sorry, try again next time. The correct answer is " + q.correct + ".");
    }

    index += 1;
    updateProgress();
    saveProgress();

    setTimeout(()=>{
      if(index < questions.length) setStatus("Tap Next Question.");
    },1000);
  }

  readBtn.addEventListener("click",()=>{
    getAudioCtx();
    if(index >= questions.length){
      speak("The quiz is complete. Your score is " + score + " out of " + questions.length + ".");
    }else{
      speak(questions[index].speak);
    }
  });

  nextBtn.addEventListener("click",()=>{
    getAudioCtx();
    renderQuestion();
    if(index < questions.length) speak(questions[index].speak);
  });

  cheerBtn.addEventListener("click",()=>{
    getAudioCtx();
    playChime();
    clap();
    confetti();
    setStatus("You can do it! Keep going!");
    speak("You can do it! Keep going!");
  });

  resetBtn.addEventListener("click",()=>{
    try{ window.speechSynthesis.cancel(); }catch(_){}
    index = 0;
    score = 0;
    answered = false;
    starsEl.textContent = "";
    renderQuestion();
    setStatus("Quiz reset. Tap Read Question to begin.");
    speak("Quiz reset. Let us start again.");
  });

  homeBtn.addEventListener("click",()=>{ window.location.href = HOME_PAGE; });
  backBtn.addEventListener("click",()=>{ window.location.href = PREVIOUS_PAGE; });
  nextPageBtn.addEventListener("click",()=>{ window.location.href = NEXT_PAGE; });

  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};

  window.addEventListener("load",()=>{
    renderQuestion();
    setTimeout(()=>{
      speak("Welcome to the Zig Zag Numbers quiz. Tap Read Question, then choose the correct answer.");
    },600);
  },{once:true});
})();
</script>
</body>
</html>
