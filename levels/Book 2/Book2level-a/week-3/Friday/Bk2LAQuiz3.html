<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Curved Lines Quiz</title>
<style>
:root{--green:#37b34a;--pink:#f49aaa;--red:#f24b5e;--blue:#63a6df;--ink:#25242a;--gold:#ffd24a;--shadow:0 16px 34px rgba(0,0,0,.14);font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff9ef;color:var(--ink);max-width:100%;overflow-x:hidden}body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;background-image:linear-gradient(#f1e6d8 1px,transparent 1px),linear-gradient(90deg,#f1e6d8 1px,transparent 1px);background-size:28px 28px}.app{width:min(1040px,100%);background:#fffdf7;border:8px solid var(--green);border-radius:30px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}.week{position:absolute;right:20px;top:22px;background:#fff;border:4px solid var(--green);border-radius:12px;padding:5px 12px;font-size:clamp(.95rem,2.5vw,1.35rem);font-weight:1000;z-index:4}.top-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.badge{background:#fff;border:3px solid #d7f2da;border-radius:999px;padding:8px 13px;font-weight:1000;color:#237935;box-shadow:0 8px 16px rgba(0,0,0,.08)}.nav-buttons,.controls{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}.btn{border:none;border-radius:999px;padding:11px 17px;font-size:.98rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s ease,filter .1s ease}.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}.btn.home{background:#25d17d;color:#fff}.btn.back,.btn.reset{background:#dfeaff;color:#1f3b6b}.btn.next{background:#f7dc6f;color:#8b5a00}.btn.read{background:var(--red);color:#fff}.btn.cheer{background:#c9f2d6;color:#166c38}.main-title{margin:-8px 72px 10px 0;text-align:center;font-size:clamp(2.5rem,7vw,5.2rem);line-height:.95;color:#fff;font-weight:1000;-webkit-text-stroke:8px var(--green);paint-order:stroke fill;text-shadow:0 5px 0 rgba(55,179,74,.24)}.hero{display:grid;grid-template-columns:minmax(110px,160px) 1fr minmax(120px,170px);gap:14px;align-items:center;background:linear-gradient(180deg,#d3ebb9,#f5fff4);border:4px dashed rgba(55,179,74,.3);border-radius:24px;padding:12px;margin-bottom:12px}.human-img{display:block;object-fit:contain;margin:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.16));user-select:none;-webkit-user-drag:none}.baker-img{width:min(145px,100%);height:190px}.bride-img{width:min(165px,100%);height:190px}.speech{background:#fff;border:4px solid #f28b20;border-radius:50%;padding:16px 20px;min-height:94px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.08rem,3.2vw,1.75rem);font-weight:1000;box-shadow:0 6px 0 rgba(0,0,0,.08)}.score-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.chip{background:#fff;border:3px solid #e8f8e9;border-radius:16px;padding:9px 10px;text-align:center;font-weight:1000;box-shadow:0 7px 14px rgba(0,0,0,.08)}.chip span{color:#6c4bbf}.quiz-card{background:#fff;border:4px solid #d7f2da;border-radius:28px;padding:16px;box-shadow:0 10px 22px rgba(0,0,0,.08)}.question{text-align:center;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:1000;color:#237935;margin-bottom:12px}.visual{min-height:120px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;background:#f8fff8;border-radius:20px;border:3px dashed #d7f2da;margin-bottom:12px;padding:12px}.mini-cake{width:190px;height:130px;object-fit:contain;border-radius:16px;box-shadow:0 8px 14px rgba(0,0,0,.1)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{background:#fff;border:4px solid #e8f8e9;border-radius:20px;padding:14px;min-height:86px;font-size:clamp(1.1rem,3vw,1.4rem);font-weight:1000;cursor:pointer;display:grid;place-items:center;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}.option:hover{transform:scale(1.02)}.option.correct{background:#d8ffd8;border-color:#22b46b}.option.wrong{background:#ffd9e1;border-color:#e03245}.line-svg{width:100%;max-width:240px;height:70px}.progress-card{margin:14px auto 0;background:#fff8fb;border:3px solid #ffd1df;border-radius:20px;padding:12px;display:grid;gap:9px}.bar{height:16px;background:#e8eef8;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}.fill{height:100%;width:0%;background:linear-gradient(90deg,#58c6ff,#83e79f);transition:width .18s ease}.status{margin-top:10px;min-height:1.5em;text-align:center;font-size:clamp(1rem,3vw,1.35rem);font-weight:1000;color:#5a3eb0}.stars{text-align:center;min-height:1.3em;font-size:2.1rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28)}.confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1}}@media(max-width:760px){.hero{grid-template-columns:1fr}.score-board{grid-template-columns:1fr}.options{grid-template-columns:1fr}.main-title{-webkit-text-stroke:5px var(--green);margin-right:0}.week{top:12px;right:12px}.baker-img,.bride-img{height:155px}}
</style>

function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  return voices.find(v => /^en[-_]us/i.test(v.lang || '') && /jenny|aria|ava|allison|ellie|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ''))
    || voices.find(v => /^en[-_]us/i.test(v.lang || '') && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ''))
    || voices.find(v => /^en/i.test(v.lang || '')) || voices[0] || null;
}
function speak(text){
  if(!text || !('speechSynthesis' in window)) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=.88; u.pitch=1.16; u.volume=1;
  const voice = pickVoice(); if(voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}
let audioCtx = null;
function getAudioCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!audioCtx) audioCtx = new AC();
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function tone(freq, dur=.12, type='sine', gain=.055){
  const ctx=getAudioCtx(); if(!ctx) return;
  const o=ctx.createOscillator(); const g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(gain, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+dur);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
}
let lastTick=0;
function tick(){
  const now=performance.now(); if(now-lastTick<55) return; lastTick=now;
  tone(720,.045,'triangle',.02);
}
function playChime(){
  const a=document.getElementById('chimeAudio');
  if(a){ try{ a.currentTime=0; a.volume=1; a.play().catch(()=>synthChime()); return; }catch(e){} }
  synthChime();
}
function synthChime(){ [659,880,1175].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sine',.06), i*120)); }
function clap(){
  const ctx=getAudioCtx(); if(!ctx) return;
  for(let i=0;i<4;i++){
    const buffer=ctx.createBuffer(1, Math.floor(ctx.sampleRate*.08), ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let j=0;j<data.length;j++) data[j]=(Math.random()*2-1)*Math.pow(1-j/data.length,2.1);
    const src=ctx.createBufferSource(); const g=ctx.createGain();
    src.buffer=buffer; g.gain.value=.11; src.connect(g); g.connect(ctx.destination); src.start(ctx.currentTime+i*.12);
  }
}
function confetti(){
  const colors=['#35b558','#ff4d6d','#ffd24a','#58c6ff','#b86bff','#ff9f1c'];
  for(let i=0;i<42;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'vw'; p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=(Math.random()*.35)+'s'; document.body.appendChild(p);
    p.addEventListener('animationend',()=>p.remove());
  }
}

function render(){answered=false;const item=questions[idx];qEl.textContent=item.q;visual.innerHTML=visualHTML(item.visual);options.innerHTML='';item.opts.forEach((txt,i)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=txt;b.addEventListener('click',()=>answer(i,b));options.appendChild(b);});questionText.textContent=(idx+1);speechBubble.textContent=item.say;statusEl.textContent='Choose your answer.';updateProgress();setTimeout(()=>speak(item.say),250);}
function answer(i,btn){if(answered)return;answered=true;getAudioCtx();const item=questions[idx];if(i===item.ans){btn.classList.add('correct');correct++;playChime();clap();statusEl.textContent='Correct! Great thinking.';speak('Correct! Great thinking.');}else{btn.classList.add('wrong');options.children[item.ans].classList.add('correct');statusEl.textContent='Good try. The green answer is correct.';speak('Good try. The green answer is correct.');}setTimeout(()=>{if(idx<questions.length-1){idx++;render();}else finish();},1400);updateProgress();}
function updateProgress(){const percent=Math.round((idx + (answered?1:0))/questions.length*100);correctText.textContent=correct;progressText.textContent=percent+'%';progressFill.style.width=percent+'%';const stars=correct>=6?3:correct>=4?2:correct>=2?1:0;starCount.textContent=stars;starsEl.textContent='⭐ '.repeat(stars).trim();saveProgress(PAGE_ID,'quiz',Math.round(correct/questions.length*100),stars,idx>=questions.length-1&&answered);}
function finish(){const score=Math.round(correct/questions.length*100);const stars=correct>=6?3:correct>=4?2:correct>=2?1:0;progressText.textContent='100%';progressFill.style.width='100%';saveProgress(PAGE_ID,'quiz',score,stars,true);if(score>=70){playChime();clap();confetti();statusEl.textContent='Wonderful quiz work!';speak('Wonderful quiz work! You understand curved lines.');}else{statusEl.textContent='Good practice! Try again to get more stars.';speak('Good practice! Try again to get more stars.');}}
function readCurrent(){getAudioCtx();speak(questions[idx].say)}function restart(){idx=0;correct=0;answered=false;render();}
document.getElementById('readBtn').addEventListener('click',readCurrent);document.getElementById('cheerBtn').addEventListener('click',()=>{getAudioCtx();playChime();clap();confetti();statusEl.textContent='You can do it!';speak('You can do it! Great job!')});document.getElementById('resetBtn').addEventListener('click',restart);document.getElementById('homeBtn').addEventListener('click',()=>location.href=HOME_PAGE);document.getElementById('backBtn').addEventListener('click',()=>location.href=GAME_PAGE);document.getElementById('nextPageBtn').addEventListener('click',()=>location.href=NEXT_PAGE);window.addEventListener('load',()=>setTimeout(render,350),{once:true});
