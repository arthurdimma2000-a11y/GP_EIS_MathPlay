<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Curved Lines - Lesson</title>
<style>
  :root{
    --ink:#26232b;
    --bg:#fff8f2;
    --card:#ffffff;
    --green:#38af48;
    --deep-green:#22a63e;
    --red:#f34458;
    --pink:#ff66aa;
    --orange:#ff8a32;
    --yellow:#f6da7b;
    --blue:#4aa3ff;
    --success:#218c53;
    --danger:#c62828;
    --gold:#ffd24a;
    --shadow:0 12px 28px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#f4e8d9 1px,transparent 1px),linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
    background-size:26px 26px;
  }
  .app{position:relative;width:min(990px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px;}
  .page-title{margin:0 72px 8px 0;text-align:center;font-size:clamp(1.55rem,4vw,2.7rem);font-weight:1000;color:var(--deep-green);text-shadow:0 2px 0 #fff;}
  .home-btn{position:absolute;right:12px;top:8px;min-width:64px;min-height:54px;border:0;border-radius:999px;background:#d9ffdf;color:#166c38;font-weight:1000;box-shadow:0 5px 0 rgba(0,0,0,.13);cursor:pointer;z-index:30;}
  .poster-card{position:relative;width:min(904px,100%);margin:0 auto;border-radius:20px;overflow:hidden;background:#a6d287;box-shadow:0 8px 20px rgba(0,0,0,.10);touch-action:none;}
  .poster-image{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .trace-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none;background:transparent;cursor:crosshair;}
  .guide-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;background:transparent;}
  .focus-zone{position:absolute;pointer-events:none;z-index:8;border-radius:999px;opacity:0;transform:scale(.96);transition:opacity .18s ease,transform .18s ease;}
  .focus-zone.show{opacity:1;transform:scale(1);outline:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 6px rgba(255,215,0,.28),0 0 18px rgba(255,105,180,.42);}
  .focus-zone.sparkle{opacity:1;transform:scale(1.03);background:rgba(255,238,120,.20);outline:5px solid rgba(255,214,0,.88);box-shadow:0 0 14px rgba(255,214,0,.95),0 0 26px rgba(255,105,180,.65);animation:sparklePulse .9s ease-in-out infinite;}
  @keyframes sparklePulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.22);}}
  .focus-bubble-1{left:23.3%;top:24.9%;width:17.5%;height:8.4%;}
  .focus-bubble-2{left:56.3%;top:25.3%;width:18.7%;height:9.2%;}
  .focus-line-1{left:38.2%;top:43.2%;width:23.6%;height:8.5%;border-radius:24px;}
  .focus-line-2{left:25.3%;top:78.3%;width:48.7%;height:7.2%;border-radius:24px;}

  .lesson-panel{width:min(904px,100%);margin:12px auto 0;border:3px solid rgba(56,175,72,.28);border-radius:18px;background:linear-gradient(180deg,#fff,#fbfff7);padding:12px;display:grid;gap:10px;}
  .progress-wrap{display:grid;justify-items:center;gap:6px;}
  .progress-text{font-size:clamp(.95rem,2vw,1.08rem);font-weight:900;color:#2a7b38;}
  .progress-bar{width:min(560px,94%);height:15px;background:#e8f3e7;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#4aa3ff,#7dffb3);transition:width .12s ease-out;}

  .conversation-panel{display:grid;gap:10px;}
  .convo-line{display:none;align-items:flex-start;gap:8px;}
  .convo-line.show{display:flex;}
  .convo-line.right{justify-content:flex-end;}
  .bubble-stack{display:flex;flex-direction:column;gap:6px;max-width:min(100%,560px);}
  .convo-line.right .bubble-stack{align-items:flex-end;}
  .bubble{position:relative;padding:12px 16px;border-radius:18px;font-size:clamp(1rem,2.4vw,1.32rem);font-weight:900;line-height:1.25;box-shadow:0 8px 16px rgba(0,0,0,.12);background:#fff;}
  .bubble.baker{border:3px solid #ef3e91;}
  .bubble.bride{border:3px solid #ff8a32;}
  .bubble.sentence{border:3px solid #38af48;}
  .bubble.sparkle{background:linear-gradient(120deg,#fff2a8,#ffd1f0,#c7f1ff);box-shadow:0 0 12px rgba(255,214,0,.75),0 0 20px rgba(255,105,180,.55);animation:sparklePulse .95s ease-in-out infinite;}
  .repeat-result{min-height:1.2em;font-size:clamp(1rem,2.4vw,1.35rem);line-height:1.2;font-weight:1000;color:var(--success);}
  .try-message{min-height:1.2em;font-size:clamp(.95rem,2.3vw,1.15rem);line-height:1.2;font-weight:1000;color:var(--danger);}
  .star-row{min-height:1.15em;display:flex;gap:6px;color:var(--gold);font-size:clamp(1.35rem,3.4vw,2rem);line-height:1;text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;width:100%;}
  .btn,.mic-icon-btn{min-height:46px;min-width:46px;border:none;border-radius:999px;cursor:pointer;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .12s ease,filter .12s ease;}
  .btn:hover,.mic-icon-btn:hover{transform:translateY(-1px);filter:brightness(1.03);}
  .btn:active,.mic-icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .btn{padding:10px 16px;font-size:.95rem;}
  .btn.prev{background:#f8f0c7;color:#9c7b2f;}
  .btn.next{background:var(--yellow);color:#8b5a00;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.read{background:var(--orange);color:#fff;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .mic-icon-btn{position:relative;background:radial-gradient(circle at 30% 30%,#ffffff,#dff1ff);padding:0;display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;}
  .mic-icon-btn img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));}
  .mic-icon-btn.is-busy{opacity:.7;pointer-events:none;transform:scale(.97);}
  .finger-cue{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:1.85rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));animation:fingerBob 1s ease-in-out infinite;display:none;pointer-events:none;}
  .finger-cue.show{display:block;}
  @keyframes fingerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}
  .status-wrap{display:grid;gap:6px;}
  .conversation-status,.trace-status{text-align:center;font-weight:1000;min-height:1.25em;}
  .conversation-status{color:#6c4bbf;font-size:clamp(.95rem,2.5vw,1.1rem);}
  .trace-status{color:#455b74;font-size:.95rem;}
  .footer-note{text-align:center;color:#666;font-size:.92rem;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.7s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media (max-width:560px){
    body{padding:6px;}
    .app{border-radius:14px;padding:8px;}
    .page-title{font-size:1.35rem;margin-right:58px;}
    .home-btn{min-width:54px;min-height:46px;font-size:.85rem;}
    .lesson-panel{padding:10px;}
    .controls{gap:8px;}
  }
</style>
</head>

  const traceStatus = document.getElementById("traceStatus");
  const conversationStatus = document.getElementById("conversationStatus");
  const micBtn = document.getElementById("micBtn");
  const fingerCue = document.getElementById("fingerCue");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const homeBtn = document.getElementById("homeBtn");
  const chimeAudio = document.getElementById("chimeAudio");

  const conversations = [
    { text:"I am a baker.", focus:"focusBubble1", line:"line0", bubble:"bubble0", result:"result0", tryMsg:"try0", stars:"stars0", role:"baker" },
    { text:"I am a bride.", focus:"focusBubble2", line:"line1", bubble:"bubble1", result:"result1", tryMsg:"try1", stars:"stars1", role:"bride" },
    { text:"These are curved lines.", focus:"focusLine2", line:"line2", bubble:"bubble2", result:"result2", tryMsg:"try2", stars:"stars2", role:"sentence" }
  ];

  const traceTargets = [
    { id:"top", label:"top curved line", color:"rgba(255,88,165,.92)", focus:"focusLine1", points:[{x:372,y:568},{x:418,y:643},{x:475,y:654},{x:532,y:642},{x:578,y:568}] },
    { id:"bottom", label:"bottom curved line", color:"rgba(33,126,83,.92)", focus:"focusLine2", points:[{x:252,y:1037},{x:365,y:1081},{x:476,y:1090},{x:590,y:1080},{x:706,y:1037}] }
  ];

  let dpr = 1, sx = 1, sy = 1;
  let audioCtx = null;
  let drawing = false;
  let currentStroke = null;
  let lastPoint = null;
  let lastTick = 0;
  let traceCelebrated = false;
  let convoIndex = 0;
  let convoPhase = "speak";
  let listening = false;
  let recognition = null;
  const strokes = [];

  function setStatus(el, text){ el.textContent = text || ""; }

  function flattenSamples(points, step){
    const out = [];
    for(let i=0;i<points.length-1;i++){
      const a = points[i], b = points[i+1];
      const dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.hypot(dx,dy);
      const n = Math.max(2, Math.ceil(len/step));
      for(let j=0;j<=n;j++){
        const t = j/n;
        out.push({x:a.x+dx*t,y:a.y+dy*t,hit:false});
      }
    }
    return out;
  }

  traceTargets.forEach(t => {
    t.samples = flattenSamples(t.points, 8);
    t.percent = 0;
    t.complete = false;
  });

  function resizeCanvases(){
    const rect = posterCard.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    [guideCanvas, traceCanvas].forEach(canvas => {
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
    });
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;
    redrawAll();
  }

  function clearCanvas(ctx, canvas){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  function drawGuides(){
    clearCanvas(gctx, guideCanvas);
    gctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    gctx.lineCap = "round";
    gctx.lineJoin = "round";
    traceTargets.forEach(t => {
      if(!t.complete){
        gctx.save();
        gctx.strokeStyle = "rgba(255,255,255,.0)";
        gctx.lineWidth = 24;
        gctx.beginPath();
        t.points.forEach((p,i)=> i ? gctx.lineTo(p.x,p.y) : gctx.moveTo(p.x,p.y));
        gctx.stroke();
        gctx.restore();
      }
    });
    gctx.setTransform(1,0,0,1,0,0);
  }

  function drawStroke(points, color){
    if(!points || points.length < 2) return;
    tctx.save();
    tctx.strokeStyle = color || "rgba(74,163,255,.92)";
    tctx.lineWidth = 15;
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    tctx.shadowColor = "rgba(255,255,255,.95)";
    tctx.shadowBlur = 2;
    tctx.beginPath();
    tctx.moveTo(points[0].x, points[0].y);
    for(let i=1;i<points.length;i++) tctx.lineTo(points[i].x, points[i].y);
    tctx.stroke();
    tctx.restore();
  }

  function drawStrokes(){
    clearCanvas(tctx, traceCanvas);
    tctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    strokes.forEach(s => drawStroke(s.points, s.color));
    if(currentStroke) drawStroke(currentStroke.points, currentStroke.color);
    tctx.setTransform(1,0,0,1,0,0);
  }

  function redrawAll(){
    drawGuides();
    drawStrokes();
  }

  function getPoint(evt){
    const rect = traceCanvas.getBoundingClientRect();
    return { x:(evt.clientX - rect.left) / sx, y:(evt.clientY - rect.top) / sy };
  }

  function distance(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function nearTarget(p, t, radius){
    let best = Infinity;
    for(const s of t.samples){
      const d = distance(p,s);
      if(d < best) best = d;
    }
    return best <= radius;
  }

  function markSamples(p){
    let changed = false;
    traceTargets.forEach(t => {
      for(const s of t.samples){
        if(!s.hit && distance(p,s) <= HIT_RADIUS){
          s.hit = true;
          changed = true;
        }
      }
    });
    if(changed) updateTraceProgress();
  }

  function updateTraceProgress(){
    let total = 0;
    traceTargets.forEach(t => {
      const hit = t.samples.filter(s => s.hit).length;
      const raw = t.samples.length ? hit / t.samples.length : 0;
      const before = t.complete;
      t.percent = Math.min(100, Math.round((raw / COMPLETE_RATIO) * 100));
      t.complete = t.percent >= 100;
      total += t.percent;
      if(t.complete && !before){
        playChime();
        speak("Great tracing! That curved line is complete.");
        showFocus(t.focus, "sparkle");
        setTimeout(clearPosterFocus, 1100);
      }
    });
    const overall = Math.round(total / traceTargets.length);
    tracePercent.textContent = overall + "%";
    traceFill.style.width = overall + "%";
    if(overall > 0 && overall < 100) setStatus(traceStatus, "Great! Keep tracing the curved lines. " + overall + "% complete.");
    if(overall >= 100 && !traceCelebrated){
      traceCelebrated = true;
      setStatus(traceStatus, "Excellent! You traced all the curved lines!");
      playChime();
      clap();
      confetti();
      speak("Excellent! You traced all the curved lines. You are a superstar!");
    }
    saveProgress(overall);
  }

  function pointerDown(evt){
    evt.preventDefault();
    unlockAudio();
    const p = getPoint(evt);
    const target = traceTargets.find(t => nearTarget(p,t,58));
    if(!target){
      setStatus(traceStatus,"Start on the curved line near a green dot or on the dotted curve.");
      return;
    }
    drawing = true;
    lastPoint = p;
    currentStroke = {points:[p], color:target.color};
    markSamples(p);
    try{ traceCanvas.setPointerCapture(evt.pointerId); }catch(_){}
  }

  function pointerMove(evt){
    if(!drawing || !currentStroke) return;
    evt.preventDefault();
    const p = getPoint(evt);
    if(lastPoint && distance(p,lastPoint) < 2) return;
    currentStroke.points.push(p);
    lastPoint = p;
    markSamples(p);
    tick();
    drawStrokes();
  }

  function pointerUp(evt){
    if(!drawing) return;
    evt.preventDefault();
    drawing = false;
    if(currentStroke && currentStroke.points.length > 1) strokes.push(currentStroke);
    currentStroke = null;
    lastPoint = null;
    drawStrokes();
    updateTraceProgress();
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|libby|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text, onend){
    if(!text || !("speechSynthesis" in window)){ if(onend) setTimeout(onend, 100); return; }
    try{ window.speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.88;
    u.pitch = 1.16;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    if(onend) u.onend = onend;
    window.speechSynthesis.speak(u);
  }

  function unlockAudio(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){ audioCtx = null; }
  }

  function tone(freq, dur, type="sine", gain=.05){
    unlockAudio();
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function tick(){
    const now = Date.now();
    if(now - lastTick < 55) return;
    lastTick = now;
    tone(690, .035, "triangle", .018);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(()=>{ tone(880,.12); setTimeout(()=>tone(1175,.16),120); });
    }catch(_){ tone(880,.12); setTimeout(()=>tone(1175,.16),120); }
  }

  function clap(){
    unlockAudio();
    if(!audioCtx) return;
    for(let i=0;i<4;i++){
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * .08, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1) * Math.pow(1-j/data.length,2.1);
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      src.buffer = buffer;
      gain.gain.value = .08;
      src.connect(gain).connect(audioCtx.destination);
      src.start(audioCtx.currentTime + i*.12);
    }
  }

  function confetti(){
    const colors=["#f34458","#ffd24a","#4aa3ff","#83e79f","#f7a6c9","#38af48"];
    for(let i=0;i<40;i++){
      const piece=document.createElement("div");
      piece.className="confetti-piece";
      piece.style.left=Math.random()*100+"vw";
      piece.style.background=colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay=Math.random()*.35+"s";
      document.body.appendChild(piece);
      piece.addEventListener("animationend",()=>piece.remove());
    }
  }

  function normalizeWords(text){
    return String(text || "").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  }

  function matchPercent(spoken, target){
    const a = normalizeWords(spoken);
    const b = normalizeWords(target);
    if(!b.length) return 0;
    let hits = 0;
    b.forEach(w => { if(a.includes(w)) hits++; });
    return hits / b.length;
  }

  function showFocus(id, mode="show"){
    clearPosterFocus();
    const el = document.getElementById(id);
    if(el) el.classList.add(mode);
  }

  function clearPosterFocus(){
    document.querySelectorAll(".focus-zone").forEach(el => el.classList.remove("show","sparkle"));
  }

  function showCurrentLine(item){
    document.getElementById(item.line).classList.add("show");
    showFocus(item.focus,"show");
  }

  function sparkleCurrent(item){
    const bubble = document.getElementById(item.bubble);
    if(bubble) bubble.classList.add("sparkle");
    showFocus(item.focus,"sparkle");
  }

  function clearBubbleSparkle(item){
    const bubble = document.getElementById(item.bubble);
    if(bubble) bubble.classList.remove("sparkle");
  }

  function buildRecognition(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return null;
    const rec = new SpeechRecognition();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    return rec;
  }

  function listenForRepeat(item){
    recognition = buildRecognition();
    const tryMsg = document.getElementById(item.tryMsg);
    const result = document.getElementById(item.result);
    if(!recognition){
      tryMsg.textContent = "Speech listening is not available in this browser. Tap the mic again to continue.";
      conversationStatus.textContent = "Use Chrome or Edge for microphone listening.";
      micBtn.classList.remove("is-busy");
      listening = false;
      convoPhase = "next";
      return;
    }
    listening = true;
    conversationStatus.textContent = "Listening... repeat: “" + item.text + "”";
    tryMsg.textContent = "";
    result.textContent = "";
    recognition.onresult = ev => {
      const spoken = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
      const score = matchPercent(spoken, item.text);
      if(score >= .5){
        result.textContent = spoken;
        tryMsg.textContent = "";
        document.getElementById(item.stars).textContent = "⭐";
        playChime();
        speak("Great speaking!", () => {
          clearBubbleSparkle(item);
          clearPosterFocus();
          convoIndex++;
          convoPhase = "speak";
          micBtn.classList.remove("is-busy");
          fingerCue.classList.add("show");
          listening = false;
          if(convoIndex >= conversations.length){
            conversationStatus.textContent = "Wonderful! Now trace the curved lines.";
            playChime();
            clap();
            confetti();
          }else{
            conversationStatus.textContent = "Tap the mic for the next air bubble.";
          }
        });
      }else{
        tryMsg.textContent = "Sorry, try again!";
        speak("Sorry, try again!", () => {
          micBtn.classList.remove("is-busy");
          fingerCue.classList.add("show");
          listening = false;
          convoPhase = "repeat";
        });
      }
    };
    recognition.onerror = () => {
      tryMsg.textContent = "Sorry, I could not hear you. Try again.";
      speak("Sorry, try again!", () => {
        micBtn.classList.remove("is-busy");
        fingerCue.classList.add("show");
        listening = false;
        convoPhase = "repeat";
      });
    };
    recognition.onend = () => { listening = false; };
    try{ recognition.start(); }catch(_){
      tryMsg.textContent = "Tap the mic and allow microphone permission.";
      micBtn.classList.remove("is-busy");
      fingerCue.classList.add("show");
      listening = false;
    }
  }

  function micStep(){
    unlockAudio();
    if(listening) return;
    if(convoIndex >= conversations.length){
      conversationStatus.textContent = "Great speaking! Trace the curved lines now.";
      speak("Great speaking! Trace the curved lines now.");
      return;
    }
    const item = conversations[convoIndex];
    micBtn.classList.add("is-busy");
    fingerCue.classList.remove("show");
    if(convoPhase === "speak"){
      showCurrentLine(item);
      conversationStatus.textContent = "Listen first.";
      speak(item.text, () => {
        convoPhase = "repeat";
        micBtn.classList.remove("is-busy");
        fingerCue.classList.add("show");
        conversationStatus.textContent = "Tap the mic again. Then repeat after me.";
      });
      return;
    }
    if(convoPhase === "repeat"){
      sparkleCurrent(item);
      speak("Repeat after me.", () => listenForRepeat(item));
      return;
    }
    if(convoPhase === "next"){
      clearBubbleSparkle(item);
      clearPosterFocus();
      convoIndex++;
      convoPhase = "speak";
      micBtn.classList.remove("is-busy");
      fingerCue.classList.add("show");
      conversationStatus.textContent = convoIndex >= conversations.length ? "Now trace the curved lines." : "Tap the mic for the next air bubble.";
    }
  }

  function readInstructions(){
    unlockAudio();
    conversationStatus.textContent = "Listen to the instructions.";
    traceStatus.textContent = "Trace from each green dot to each red dot.";
    speak("Welcome to curved lines. Tap the microphone to hear each air bubble. Then repeat after me. After the conversation, trace the curved lines on the wedding cake from the green dot to the red dot.");
  }

  function resetTrace(){
    strokes.length = 0;
    currentStroke = null;
    drawing = false;
    traceCelebrated = false;
    traceTargets.forEach(t => {
      t.samples.forEach(s => s.hit = false);
      t.percent = 0;
      t.complete = false;
    });
    tracePercent.textContent = "0%";
    traceFill.style.width = "0%";
    traceStatus.textContent = "Trace the pink and black curved lines from the green dot to the red dot.";
    redrawAll();
    saveProgress(0);
  }

  function cheer(){
    unlockAudio();
    playChime();
    clap();
    confetti();
    speak("You can do it! Keep tracing the curved lines. Great job!");
  }

  function saveProgress(score){
    try{
      const payload = {
        pageId:PAGE_ID,
        file:PAGE_ID + ".html",
        level:"A",
        week:2,
        type:"lesson",
        activityType:"tracing",
        score:Math.round(score),
        tracing:Math.round(score),
        completed:score >= 100,
        stars:score >= 95 ? 3 : score >= 65 ? 2 : score >= 35 ? 1 : 0,
        savedAt:new Date().toISOString(),
        ts:Date.now()
      };
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
  }

  micBtn.addEventListener("click", micStep);
  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", () => { resetTrace(); speak("Cleared. Start tracing again."); });
  cheerBtn.addEventListener("click", cheer);
  prevBtn.addEventListener("click", () => { window.location.href = PREVIOUS_PAGE; });
  nextBtn.addEventListener("click", () => { window.location.href = NEXT_PAGE; });
  homeBtn.addEventListener("click", () => { window.location.href = HOME_PAGE; });

  traceCanvas.addEventListener("pointerdown", pointerDown, {passive:false});
  traceCanvas.addEventListener("pointermove", pointerMove, {passive:false});
  traceCanvas.addEventListener("pointerup", pointerUp, {passive:false});
  traceCanvas.addEventListener("pointercancel", pointerUp, {passive:false});
  traceCanvas.addEventListener("pointerleave", pointerUp, {passive:false});

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try{ window.speechSynthesis.cancel(); }catch(_){} });

  posterImage.addEventListener("load", () => { resizeCanvases(); resetTrace(); }, {once:true});
  window.addEventListener("load", () => {
    resizeCanvases();
    resetTrace();
    setTimeout(readInstructions, 700);
  }, {once:true});
})();
</script>
</body>
</html>
