<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Curved Lines - Week 3 Tracing</title>
<style>
  :root{
    --green:#35b64b;
    --red:#f34458;
    --pink:#f59aa6;
    --ink:#25232a;
    --cream:#fffaf1;
    --gold:#ffd24a;
    --purple:#6c4bbf;
    --shadow:0 16px 34px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--cream);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#f1e6d8 1px,transparent 1px),linear-gradient(90deg,#f1e6d8 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{width:min(990px,100%);background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:10px 10px 14px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{background:#fff;border:3px solid #dff3df;border-radius:999px;padding:8px 14px;font-weight:1000;color:#218a35;box-shadow:0 8px 16px rgba(0,0,0,.08);}
  .navs,.buttons{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;}
  .btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s ease,filter .1s ease;}
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
  .btn.home{background:#25d17d;color:#fff}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00}
  .btn.read{background:#f04d5f;color:#fff}
  .btn.clear{background:#dfeaff;color:#1f3b6b}
  .btn.cheer{background:#c9f2d6;color:#166c38}

  .poster-wrap{position:relative;width:min(904px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#a8d489;touch-action:none;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .guide-layer,.trace-layer{position:absolute;inset:0;width:100%;height:100%;background:transparent;}
  .guide-layer{z-index:4;pointer-events:none;}
  .trace-layer{z-index:5;touch-action:none;cursor:crosshair;}

  .panel{width:min(904px,100%);margin:12px auto 0;background:linear-gradient(180deg,#fff,#fff9fb);border:3px solid rgba(53,182,75,.24);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.06);}
  .progress-title{text-align:center;font-size:clamp(1rem,2.7vw,1.3rem);font-weight:1000;color:#23853a;margin-bottom:8px;}
  .bar{height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#31b7ff,#83e79f);transition:width .12s ease-out;}
  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;}
  .mini{background:#fff;border:2px solid #e7edf8;border-radius:12px;text-align:center;padding:7px 5px;font-weight:1000;font-size:.92rem;color:#444;}
  .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .stars{text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{min-height:1.45em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px}
    .app{padding:6px;border-radius:16px}
    .panel{padding:10px;border-radius:14px}
    .mini-grid{grid-template-columns:1fr}
    .btn{font-size:.85rem;padding:9px 12px}
  }
</style>
</head>

  const overallFill = document.getElementById("overallFill");
  const statusEl = document.getElementById("status");
  const starsEl = document.getElementById("stars");
  const chimeAudio = document.getElementById("chimeAudio");
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");

  const targets = [
    {id:"top", label:"Top cake curve", color:"rgba(240,77,95,.96)", d:"M 286 544 C 375 570, 480 584, 568 565 C 612 558, 650 550, 682 544"},
    {id:"middle", label:"Middle cake curve", color:"rgba(240,77,95,.96)", d:"M 208 705 C 345 752, 515 785, 765 706"},
    {id:"bottom", label:"Bottom cake curve", color:"rgba(240,77,95,.96)", d:"M 119 879 C 310 942, 535 969, 844 879"}
  ];

  let dpr = 1;
  let sx = 1;
  let sy = 1;
  let drawing = false;
  let activeTarget = null;
  let lastPoint = null;
  let finalCelebrated = false;
  let lastTick = 0;
  let audioCtx = null;
  const strokes = [];
  let currentStroke = null;

  function setStatus(text){ statusEl.textContent = text || ""; }

  function sampleSvgPath(d, step){
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    let len = 0;
    try { len = p.getTotalLength(); } catch(_) { return []; }
    const samples = [];
    for(let dist=0; dist<=len; dist+=step){
      const pt = p.getPointAtLength(dist);
      samples.push({x:pt.x, y:pt.y, hit:false});
    }
    const end = p.getPointAtLength(len);
    samples.push({x:end.x, y:end.y, hit:false});
    return samples;
  }

  function prepareTargets(){
    targets.forEach((t, index) => {
      t.path = new Path2D(t.d);
      t.samples = sampleSvgPath(t.d, 7);
      t.complete = false;
      t.percent = 0;
      t.order = index;
      const div = document.createElement("div");
      div.className = "mini";
      div.id = "mini-" + t.id;
      div.innerHTML = `${index + 1}. ${t.label}: <span id="pct-${t.id}">0%</span>`;
      miniGrid.appendChild(div);
      t.pctEl = div.querySelector("span");
      t.boxEl = div;
    });
  }

  function resizeCanvases(){
    const rect = posterWrap.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    [guideLayer, traceLayer].forEach(canvas => {
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
    });
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;
    redrawAll();
  }

  function clearCanvas(ctx, canvas){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  function drawGuide(){
    clearCanvas(gctx, guideLayer);
    gctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    gctx.lineCap = "round";
    gctx.lineJoin = "round";

    targets.forEach(t => {
      if(t === activeTarget){
        gctx.save();
        gctx.strokeStyle = "rgba(255, 214, 0, .42)";
        gctx.lineWidth = 28;
        gctx.shadowColor = "rgba(255, 105, 180, .72)";
        gctx.shadowBlur = 15;
        gctx.stroke(t.path);
        gctx.restore();
      }

      if(t.complete){
        gctx.save();
        gctx.strokeStyle = "rgba(31,168,91,.38)";
        gctx.lineWidth = 18;
        gctx.stroke(t.path);
        gctx.restore();
      }

      drawDotsForTarget(t);
    });
    gctx.setTransform(1,0,0,1,0,0);
  }

  function drawDotsForTarget(t){
    if(!t.samples || !t.samples.length) return;
    const dotIndices = [0, Math.round(t.samples.length * .25), Math.round(t.samples.length * .50), Math.round(t.samples.length * .75), t.samples.length - 1];
    dotIndices.forEach((idx, i) => {
      const pt = t.samples[Math.max(0, Math.min(t.samples.length - 1, idx))];
      if(!pt) return;
      let fill = "#4aa9d8";
      let r = 10;
      if(i === 0){ fill = "#07994d"; r = 12; }
      if(i === dotIndices.length - 1){ fill = "#ef4050"; r = 12; }
      gctx.save();
      gctx.beginPath();
      gctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
      gctx.fillStyle = fill;
      gctx.strokeStyle = "rgba(255,255,255,.95)";
      gctx.lineWidth = 3;
      gctx.fill();
      gctx.stroke();
      gctx.restore();
    });
  }

  function drawStrokes(){
    clearCanvas(tctx, traceLayer);
    tctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    strokes.forEach(stroke => drawStroke(stroke.points, stroke.color));
    if(currentStroke) drawStroke(currentStroke.points, currentStroke.color);
    tctx.setTransform(1,0,0,1,0,0);
  }

  function drawStroke(points, color){
    if(!points || points.length < 2) return;
    tctx.strokeStyle = color || "rgba(35,103,217,.95)";
    tctx.lineWidth = 16;
    tctx.shadowColor = "rgba(255,255,255,.95)";
    tctx.shadowBlur = 2;
    tctx.beginPath();
    tctx.moveTo(points[0].x, points[0].y);
    for(let i=1; i<points.length; i++) tctx.lineTo(points[i].x, points[i].y);
    tctx.stroke();
    tctx.shadowBlur = 0;
  }

  function redrawAll(){ drawGuide(); drawStrokes(); }

  function getPoint(evt){
    const rect = traceLayer.getBoundingClientRect();
    const clientX = evt.clientX ?? (evt.touches && evt.touches[0] && evt.touches[0].clientX) ?? 0;
    const clientY = evt.clientY ?? (evt.touches && evt.touches[0] && evt.touches[0].clientY) ?? 0;
    return {x:(clientX - rect.left) / sx, y:(clientY - rect.top) / sy};
  }

  function dist(a,b){
    const dx = a.x-b.x, dy = a.y-b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function nearestDistanceToTarget(p,t){
    let best = Infinity;
    for(const s of t.samples){
      const d = dist(p,s);
      if(d < best) best = d;
    }
    return best;
  }

  function findNearestTarget(p, radius){
    let best = null;
    let bestD = Infinity;
    for(const t of targets){
      const d = nearestDistanceToTarget(p,t);
      if(d < bestD){ bestD = d; best = t; }
    }
    return bestD <= radius ? best : null;
  }

  function markSamples(p){
    let changed = false;
    for(const t of targets){
      for(const s of t.samples){
        if(!s.hit && dist(p,s) <= HIT_RADIUS){
          s.hit = true;
          changed = true;
        }
      }
    }
    if(changed) updateProgress();
  }

  function updateProgress(){
    let total = 0;
    targets.forEach(t => {
      const hitCount = t.samples.filter(s => s.hit).length;
      const raw = t.samples.length ? hitCount / t.samples.length : 0;
      const percent = Math.min(100, Math.round((raw / COMPLETE_RATIO) * 100));
      const wasComplete = t.complete;
      t.percent = percent;
      t.complete = percent >= 100;
      total += percent;
      if(t.pctEl) t.pctEl.textContent = percent + "%";
      if(t.boxEl) t.boxEl.classList.toggle("done", t.complete);
      if(!wasComplete && t.complete){
        playChime();
        clap();
        speak(shortPraise());
      }
    });

    const overall = Math.round(total / targets.length);
    overallText.textContent = overall + "%";
    overallFill.style.width = overall + "%";
    starsEl.textContent = overall >= 95 ? "⭐ ⭐ ⭐" : overall >= 70 ? "⭐ ⭐" : overall >= 35 ? "⭐" : "";
    activeTarget = targets.find(t => !t.complete) || null;
    drawGuide();

    if(overall >= 100 && !finalCelebrated){
      finalCelebrated = true;
      setStatus("Excellent! You traced all the curved lines!");
      playChime();
      clap();
      confetti();
      speak("Excellent! You traced all the curved lines. A curved line bends. You are a superstar!");
      saveProgress(100,true);
    } else {
      if(overall > 0 && overall < 100) setStatus(`Great tracing! Keep going. ${overall}% complete.`);
      saveProgress(overall, overall >= 100);
    }
  }

  function shortPraise(){
    const list = ["Great job tracing the curved line!", "Wonderful tracing!", "Amazing! That line bends beautifully.", "Super work! Keep going."];
    return list[Math.floor(Math.random() * list.length)];
  }

  function pointerDown(evt){
    evt.preventDefault();
    getAudioCtx();
    const p = getPoint(evt);
    const near = findNearestTarget(p, START_RADIUS);
    if(!near){
      setStatus("Start on a curved line. Try the green dot or the dotted curve.");
      return;
    }
    drawing = true;
    lastPoint = p;
    currentStroke = {points:[p], color:"rgba(35,103,217,.96)"};
    markSamples(p);
    traceLayer.setPointerCapture?.(evt.pointerId);
  }

  function pointerMove(evt){
    if(!drawing || !currentStroke) return;
    evt.preventDefault();
    const p = getPoint(evt);
    if(lastPoint && dist(p,lastPoint) < 2) return;
    currentStroke.points.push(p);
    lastPoint = p;
    markSamples(p);
    playTick();
    drawStrokes();
  }

  function pointerUp(evt){
    if(!drawing) return;
    evt.preventDefault?.();
    drawing = false;
    if(currentStroke && currentStroke.points.length > 1) strokes.push(currentStroke);
    currentStroke = null;
    lastPoint = null;
    drawStrokes();
    updateProgress();
  }

  function getAudioCtx(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){ audioCtx = null; }
    return audioCtx;
  }

  function tone(freq, dur, type="sine", gain=.045){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }

  function playTick(){
    const now = Date.now();
    if(now - lastTick < 55) return;
    lastTick = now;
    tone(620, .035, "triangle", .018);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(() => { tone(880,.12,"sine",.055); setTimeout(() => tone(1175,.16,"sine",.05),120); });
    }catch(_){
      tone(880,.12,"sine",.055);
      setTimeout(() => tone(1175,.16,"sine",.05),120);
    }
  }

  function clap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    for(let i=0; i<3; i++){
      const buffer = ctx.createBuffer(1, ctx.sampleRate * .09, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0; j<data.length; j++) data[j] = (Math.random()*2-1) * Math.pow(1 - j/data.length, 2.2);
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      gain.gain.value = .07;
      src.buffer = buffer;
      src.connect(gain).connect(ctx.destination);
      src.start(ctx.currentTime + i*.12);
    }
  }

  function confetti(){
    const colors = ["#ff4d6d","#ffd24a","#31b7ff","#83e79f","#b86bff","#ff9f1c"];
    for(let i=0; i<38; i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*.3) + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2200);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text){
    if(!text || !("speechSynthesis" in window)) return;
    try{ window.speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = .88;
    u.pitch = 1.16;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function readInstructions(){
    getAudioCtx();
    setStatus("Trace each curved line from the green dot to the red dot.");
    speak("Welcome to curved lines. A curved line bends. Trace each curved line on the cake from the green dot to the red dot. Follow the dotted line carefully. Your tracing score will go up as you trace.");
  }

  function clearAll(sayIt=false){
    finalCelebrated = false;
    strokes.length = 0;
    currentStroke = null;
    drawing = false;
    targets.forEach(t => {
      t.samples.forEach(s => s.hit = false);
      t.percent = 0;
      t.complete = false;
      if(t.pctEl) t.pctEl.textContent = "0%";
      if(t.boxEl) t.boxEl.classList.remove("done");
    });
    activeTarget = targets[0];
    overallText.textContent = "0%";
    overallFill.style.width = "0%";
    starsEl.textContent = "";
    setStatus("Trace each curved line from the green dot to the red dot.");
    redrawAll();
    saveProgress(0,false);
    if(sayIt) speak("Cleared. Start tracing again.");
  }

  function saveProgress(score, completed){
    const payload = {
      pageId,
      file: pageId + ".html",
      level:"A",
      week:3,
      type:"tracing",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0,
      skills:{reading:1,writing:score >= 95 ? 3 : score > 0 ? 1 : 0,listening:1,speaking:0},
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(() => {});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(() => {});
    }catch(_){}
  }

  prepareTargets();
  activeTarget = targets[0];

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);

  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", () => clearAll(true));
  cheerBtn.addEventListener("click", () => { getAudioCtx(); playChime(); clap(); confetti(); setStatus("You can do it! Great job!"); speak("You can do it! Great job!"); });
  homeBtn.addEventListener("click", () => { try{ window.speechSynthesis.cancel(); }catch(_){} window.location.href = homeHref; });
  prevBtn.addEventListener("click", () => { try{ window.speechSynthesis.cancel(); }catch(_){} window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { try{ window.speechSynthesis.cancel(); }catch(_){} window.location.href = nextHref; });

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try{ window.speechSynthesis.cancel(); }catch(_){} });

  posterImg.addEventListener("load", () => { resizeCanvases(); clearAll(false); }, {once:true});
  window.addEventListener("load", () => { resizeCanvases(); clearAll(false); setTimeout(readInstructions, 700); }, {once:true});
})();
</script>
</body>
</html>
