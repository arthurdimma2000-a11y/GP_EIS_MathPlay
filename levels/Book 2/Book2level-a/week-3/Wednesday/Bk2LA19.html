<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Numbers 9 and 10 - Trace the Numbers</title>
<style>
  :root{
    --ink:#2d2d2d;
    --paper:#fffaf2;
    --green:#35ad46;
    --pink:#f04d5f;
    --yellow:#f7df8a;
    --purple:#6c4bbf;
    --gold:#ffd24a;
    --blue:#5d86c9;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#ece2d3 1px,transparent 1px),linear-gradient(90deg,#ece2d3 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{width:min(990px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 14px;}
  .poster-wrap{position:relative;width:min(920px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;touch-action:none;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .guide-layer,.trace-layer{position:absolute;inset:0;width:100%;height:100%;background:transparent;}
  .guide-layer{z-index:4;pointer-events:none;}
  .trace-layer{z-index:5;touch-action:none;cursor:crosshair;}
  .panel{width:min(920px,100%);margin:12px auto 0;background:linear-gradient(180deg,#fff,#fff7fb);border:3px solid rgba(53,173,70,.28);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.06);}
  .progress-title{text-align:center;font-size:clamp(1rem,2.6vw,1.28rem);font-weight:1000;color:#2a8d38;margin-bottom:8px;}
  .progress-bar{height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#35ad46,#83e79f);transition:width .10s ease-out;}
  .mini-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:9px;}
  .mini{background:#fff;border:2px solid #e7edf8;border-radius:12px;text-align:center;padding:6px 4px;font-weight:1000;font-size:.86rem;color:#444;}
  .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .stars{text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{min-height:1.45em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);}
  .buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s ease,filter .1s ease;}
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5f;color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .mini-grid{grid-template-columns:repeat(2,1fr);}
    .btn{font-size:.85rem;padding:9px 12px;}
  }
</style>
</head>

  const overallText = document.getElementById("overallText");
  const overallFill = document.getElementById("overallFill");
  const statusEl = document.getElementById("status");
  const starsEl = document.getElementById("stars");
  const chimeAudio = document.getElementById("chimeAudio");
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");

  const targets = [
    {id:"9a", label:"9", type:"9", box:{x:390,y:502,w:150,h:205}},
    {id:"9b", label:"9", type:"9", box:{x:555,y:500,w:150,h:210}},
    {id:"9c", label:"9", type:"9", box:{x:718,y:505,w:155,h:205}},
    {id:"10a", label:"10", type:"10", box:{x:355,y:836,w:140,h:125}},
    {id:"10b", label:"10", type:"10", box:{x:525,y:838,w:150,h:125}},
    {id:"10c", label:"10", type:"10", box:{x:720,y:830,w:160,h:140}}
  ];

  let dpr = 1;
  let sx = 1;
  let sy = 1;
  let drawing = false;
  let activeTarget = null;
  let lastPoint = null;
  let finalCelebrated = false;
  let lastTick = 0;
  let audioCtx = null;
  const strokes = [];
  let currentStroke = null;

  function setStatus(text){ statusEl.textContent = text || ""; }

  function makePath(type, b){
    const x=b.x, y=b.y, w=b.w, h=b.h;
    if(type === "9"){
      return [
        `M ${x+w*.58} ${y+h*.14}`,
        `C ${x+w*.28} ${y+h*.10}, ${x+w*.18} ${y+h*.35}, ${x+w*.30} ${y+h*.50}`,
        `C ${x+w*.42} ${y+h*.67}, ${x+w*.75} ${y+h*.58}, ${x+w*.75} ${y+h*.34}`,
        `C ${x+w*.75} ${y+h*.17}, ${x+w*.66} ${y+h*.11}, ${x+w*.58} ${y+h*.14}`,
        `M ${x+w*.74} ${y+h*.38}`,
        `C ${x+w*.73} ${y+h*.55}, ${x+w*.59} ${y+h*.72}, ${x+w*.32} ${y+h*.86}`
      ].join(" ");
    }
    return [
      `M ${x+w*.12} ${y+h*.24}`,
      `L ${x+w*.25} ${y+h*.12}`,
      `L ${x+w*.25} ${y+h*.86}`,
      `M ${x+w*.15} ${y+h*.86}`,
      `L ${x+w*.35} ${y+h*.86}`,
      `M ${x+w*.63} ${y+h*.12}`,
      `C ${x+w*.82} ${y+h*.12}, ${x+w*.91} ${y+h*.31}, ${x+w*.91} ${y+h*.50}`,
      `C ${x+w*.91} ${y+h*.75}, ${x+w*.80} ${y+h*.90}, ${x+w*.62} ${y+h*.90}`,
      `C ${x+w*.44} ${y+h*.90}, ${x+w*.36} ${y+h*.73}, ${x+w*.36} ${y+h*.50}`,
      `C ${x+w*.36} ${y+h*.28}, ${x+w*.44} ${y+h*.12}, ${x+w*.63} ${y+h*.12}`
    ].join(" ");
  }

  function sampleSvgPath(d, step){
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    let len = 0;
    try { len = p.getTotalLength(); } catch(_) { return []; }
    const samples = [];
    for(let dist=0; dist<=len; dist+=step){
      const pt = p.getPointAtLength(dist);
      samples.push({x:pt.x, y:pt.y, hit:false});
    }
    const end = p.getPointAtLength(len);
    samples.push({x:end.x, y:end.y, hit:false});
    return samples;
  }

  function prepareTargets(){
    targets.forEach((t) => {
      t.d = makePath(t.type, t.box);
      t.path = new Path2D(t.d);
      t.samples = sampleSvgPath(t.d, 8);
      t.complete = false;
      t.percent = 0;
      const div = document.createElement("div");
      div.className = "mini";
      div.id = "mini-" + t.id;
      div.innerHTML = `${t.label}: <span id="pct-${t.id}">0%</span>`;
      miniGrid.appendChild(div);
      t.pctEl = div.querySelector("span");
      t.boxEl = div;
    });
  }

  function resizeCanvases(){
    const rect = posterWrap.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    [guideLayer, traceLayer].forEach(canvas => {
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
    });
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;
    redrawAll();
  }

  function clearCanvas(ctx, canvas){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  function drawGuide(){
    clearCanvas(gctx, guideLayer);
    if(!activeTarget) return;
    gctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    gctx.lineCap = "round";
    gctx.lineJoin = "round";
    gctx.save();
    gctx.strokeStyle = "rgba(255, 215, 0, .34)";
    gctx.lineWidth = activeTarget.type === "10" ? 18 : 22;
    gctx.shadowColor = "rgba(255, 214, 0, .65)";
    gctx.shadowBlur = 10;
    gctx.stroke(activeTarget.path);
    gctx.restore();
    gctx.setTransform(1,0,0,1,0,0);
  }

  function drawStrokes(){
    clearCanvas(tctx, traceLayer);
    tctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    strokes.forEach(stroke => drawStroke(stroke.points, stroke.color));
    if(currentStroke) drawStroke(currentStroke.points, currentStroke.color);
    tctx.setTransform(1,0,0,1,0,0);
  }

  function drawStroke(points, color){
    if(!points || points.length < 2) return;
    tctx.strokeStyle = color || "rgba(240,77,95,.92)";
    tctx.lineWidth = 15;
    tctx.shadowColor = "rgba(255,255,255,.85)";
    tctx.shadowBlur = 2;
    tctx.beginPath();
    tctx.moveTo(points[0].x, points[0].y);
    for(let i=1;i<points.length;i++) tctx.lineTo(points[i].x, points[i].y);
    tctx.stroke();
    tctx.shadowBlur = 0;
  }

  function redrawAll(){ drawGuide(); drawStrokes(); }

  function getPoint(evt){
    const rect = traceLayer.getBoundingClientRect();
    return {x:(evt.clientX - rect.left) / sx, y:(evt.clientY - rect.top) / sy};
  }

  function dist(a,b){
    const dx = a.x-b.x, dy = a.y-b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function pointNearBox(p,t,extra){
    const b=t.box;
    return p.x >= b.x-extra && p.x <= b.x+b.w+extra && p.y >= b.y-extra && p.y <= b.y+b.h+extra;
  }

  function nearestDistanceToTarget(p,t){
    let best = Infinity;
    if(!pointNearBox(p,t,START_RADIUS)) return best;
    for(const s of t.samples){
      const d = dist(p,s);
      if(d < best) best = d;
    }
    return best;
  }

  function findNearestTarget(p, radius){
    let best = null;
    let bestD = Infinity;
    for(const t of targets){
      const d = nearestDistanceToTarget(p,t);
      if(d < bestD){ bestD = d; best = t; }
    }
    return bestD <= radius ? best : null;
  }

  function markSamples(p){
    let changed = false;
    for(const t of targets){
      if(!pointNearBox(p,t,HIT_RADIUS)) continue;
      for(const s of t.samples){
        if(!s.hit && dist(p,s) <= HIT_RADIUS){
          s.hit = true;
          changed = true;
        }
      }
    }
    if(changed) updateProgress();
  }

  function updateProgress(){
    let total = 0;
    targets.forEach(t => {
      const hitCount = t.samples.filter(s => s.hit).length;
      const raw = t.samples.length ? hitCount / t.samples.length : 0;
      const percent = Math.min(100, Math.round((raw / COMPLETE_RATIO) * 100));
      const wasComplete = t.complete;
      t.percent = percent;
      t.complete = percent >= 100;
      total += percent;
      if(t.pctEl) t.pctEl.textContent = percent + "%";
      if(t.boxEl) t.boxEl.classList.toggle("done", t.complete);
      if(!wasComplete && t.complete){
        playChime();
        speak(shortPraise());
      }
    });

    const overall = Math.round(total / targets.length);
    overallText.textContent = overall + "%";
    overallFill.style.width = overall + "%";
    starsEl.textContent = overall >= 95 ? "⭐ ⭐ ⭐" : overall >= 70 ? "⭐ ⭐" : overall >= 35 ? "⭐" : "";

    activeTarget = targets.find(t => !t.complete) || null;
    drawGuide();

    if(overall >= 100 && !finalCelebrated){
      finalCelebrated = true;
      setStatus("Excellent! You traced all the number digits!");
      playChime();
      clap();
      confetti();
      speak("Excellent! You traced all the number nine and number ten digits. You are a superstar!");
      saveProgress(100,true);
    } else {
      if(overall > 0 && overall < 100) setStatus(`Great tracing! Keep going. ${overall}% complete.`);
      saveProgress(overall, overall >= 100);
    }
  }

  function shortPraise(){
    const list = ["Great job!", "Amazing tracing!", "Wonderful!", "You are doing so well!", "Super work!"];
    return list[Math.floor(Math.random() * list.length)];
  }

  function pointerDown(evt){
    evt.preventDefault();
    getAudioCtx();
    const p = getPoint(evt);
    const near = findNearestTarget(p, START_RADIUS);
    if(!near){
      setStatus("Start tracing on one of the visible 9 or 10 number lines.");
      return;
    }
    drawing = true;
    activeTarget = near;
    drawGuide();
    lastPoint = p;
    const colors = {"9":"rgba(240,77,95,.95)", "10":"rgba(25,169,232,.95)"};
    currentStroke = {points:[p], color:colors[near.label] || "rgba(240,77,95,.95)"};
    markSamples(p);
    traceLayer.setPointerCapture?.(evt.pointerId);
  }

  function pointerMove(evt){
    if(!drawing || !currentStroke) return;
    evt.preventDefault();
    const p = getPoint(evt);
    if(lastPoint && dist(p,lastPoint) < 2) return;
    currentStroke.points.push(p);
    lastPoint = p;
    markSamples(p);
    playTick();
    drawStrokes();
  }

  function pointerUp(evt){
    if(!drawing) return;
    evt.preventDefault();
    drawing = false;
    if(currentStroke && currentStroke.points.length > 1) strokes.push(currentStroke);
    currentStroke = null;
    lastPoint = null;
    drawStrokes();
    updateProgress();
  }

  function getAudioCtx(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(_){ audioCtx = null; }
    return audioCtx;
  }

  function tone(freq, dur, type="sine", gain=.045){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }

  function playTick(){
    const now = Date.now();
    if(now - lastTick < 55) return;
    lastTick = now;
    tone(620, .035, "triangle", .018);
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      chimeAudio.play().catch(() => {
        tone(880,.12,"sine",.055);
        setTimeout(() => tone(1175,.16,"sine",.05), 120);
      });
    }catch(_){
      tone(880,.12,"sine",.055);
      setTimeout(() => tone(1175,.16,"sine",.05), 120);
    }
  }

  function clap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    for(let i=0;i<3;i++){
      const buffer = ctx.createBuffer(1, ctx.sampleRate * .09, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1) * Math.pow(1 - j/data.length, 2.2);
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      gain.gain.value = .07;
      src.buffer = buffer;
      src.connect(gain).connect(ctx.destination);
      src.start(ctx.currentTime + i*.12);
    }
  }

  function confetti(){
    const colors = ["#ff4d6d","#ffd24a","#31b7ff","#83e79f","#b86bff","#ff9f1c"];
    for(let i=0;i<38;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*.3) + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2200);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text){
    if(!text || !("speechSynthesis" in window)) return;
    try{ window.speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = .88;
    u.pitch = 1.16;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function readInstructions(){
    getAudioCtx();
    setStatus("Trace the visible 9 and 10 number lines. Follow the poster carefully.");
    speak("Let us write numbers. Trace every nine and every ten beside the cakes. Follow the number lines carefully. Your tracing score will go up immediately as you trace. Listen for the chime when you do a great job.");
  }

  function clearAll(){
    finalCelebrated = false;
    strokes.length = 0;
    currentStroke = null;
    drawing = false;
    targets.forEach(t => {
      t.samples.forEach(s => s.hit = false);
      t.percent = 0;
      t.complete = false;
      if(t.pctEl) t.pctEl.textContent = "0%";
      if(t.boxEl) t.boxEl.classList.remove("done");
    });
    activeTarget = targets[0];
    overallText.textContent = "0%";
    overallFill.style.width = "0%";
    starsEl.textContent = "";
    setStatus("Trace each visible number digit carefully.");
    redrawAll();
    saveProgress(0,false);
  }

  function saveProgress(score, completed){
    const payload = {
      pageId,
      file:pageId + ".html",
      level:"A",
      week:3,
      type:"tracing",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0,
      skills:{reading:1,writing:score >= 95 ? 3 : score > 0 ? 1 : 0,listening:1,speaking:0},
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(() => {});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(() => {});
    }catch(_){}
  }

  prepareTargets();
  activeTarget = targets[0];

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);
  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", () => { clearAll(); speak("Cleared. Start tracing again."); });
  cheerBtn.addEventListener("click", () => { getAudioCtx(); playChime(); clap(); confetti(); setStatus("You can do it! Great job!"); speak("You can do it! Great job!"); });
  homeBtn.addEventListener("click", () => { window.location.href = homeHref; });
  prevBtn.addEventListener("click", () => { window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { window.location.href = nextHref; });

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try{ window.speechSynthesis.cancel(); }catch(_){} });

  posterImg.addEventListener("load", () => { resizeCanvases(); clearAll(); }, {once:true});
  window.addEventListener("load", () => { resizeCanvases(); clearAll(); setTimeout(readInstructions, 650); }, {once:true});
})();
</script>
</body>
