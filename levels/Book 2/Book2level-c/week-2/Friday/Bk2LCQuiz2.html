<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Ordinal Numbers & Less Than Quiz</title>

<style>
:root{
  --blue:#5d83c7;
  --deepBlue:#426db4;
  --sky:#bfefff;
  --red:#ef3f45;
  --green:#1fa85b;
  --gold:#ffd24a;
  --ink:#27242a;
  --shadow:0 16px 36px rgba(0,0,0,.13);
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  background:#fff9ef;
  color:var(--ink);
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:10px;
  background-image:
    linear-gradient(#f1e6d8 1px,transparent 1px),
    linear-gradient(90deg,#f1e6d8 1px,transparent 1px);
  background-size:28px 28px;
}

.app{
  width:min(1050px,100%);
  background:#fff;
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:12px;
}

.header{
  background:#fff;
  border:8px solid var(--blue);
  border-radius:26px;
  padding:16px;
  text-align:center;
}

.title{
  margin:0;
  color:#fff;
  font-size:clamp(2.4rem,8vw,5.2rem);
  line-height:.9;
  font-weight:1000;
  text-shadow:
    5px 0 var(--blue),-5px 0 var(--blue),
    0 5px var(--blue),0 -5px var(--blue),
    4px 4px var(--blue),-4px 4px var(--blue),
    4px -4px var(--blue),-4px -4px var(--blue);
}

.nav{
  margin:12px auto 0;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

.btn{
  border:none;
  border-radius:999px;
  padding:11px 16px;
  font-size:1rem;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.18);
  transition:transform .1s ease,filter .1s ease;
}

.btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
.btn.home{background:#eef5ff;color:#244f9c;border:2px solid #c7dcff;}
.btn.navbtn{background:#f7dc6f;color:#8b5a00;}
.btn.read{background:var(--red);color:#fff;}
.btn.clear{background:#dfeaff;color:#1f3b6b;}
.btn.green{background:#c9f2d6;color:#166c38;}

.score-card{
  margin:12px auto;
  background:linear-gradient(180deg,#fff8fb,#ffffff);
  border:3px solid #d6e4ff;
  border-radius:20px;
  padding:12px;
}

.score-title{
  text-align:center;
  font-size:clamp(1rem,3vw,1.35rem);
  font-weight:1000;
  color:#355fa8;
  margin-bottom:8px;
}

.bar-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.bar{
  flex:1;
  height:20px;
  background:#e8eef8;
  border-radius:999px;
  overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.12);
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#58c6ff,#83e79f,#ffd24a,#ff9cac);
  transition:width .25s ease;
}

.percent{
  min-width:88px;
  text-align:right;
  font-size:1.05rem;
  font-weight:1000;
  color:#175ca8;
}

.quiz-card{
  background:#fff;
  border:5px solid var(--blue);
  border-radius:24px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 10px 22px rgba(0,0,0,.08);
}

.question{
  font-size:clamp(1.25rem,4vw,2rem);
  font-weight:1000;
  text-align:center;
  color:#222;
  margin:0 0 14px;
}

.options{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.option{
  background:#fff4c2;
  border:3px solid #e5b800;
  border-radius:18px;
  padding:10px 18px;
  font-size:1.2rem;
  font-weight:1000;
  cursor:pointer;
  min-width:110px;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
}

.option.wrong{
  background:#ffe4e6;
  border-color:#ef4444;
}

.race-row,.shape-row,.stick-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  margin:10px 0 16px;
}

.shape{
  width:110px;
  height:100px;
  cursor:pointer;
  border-radius:16px;
  padding:6px;
  transition:transform .12s ease,box-shadow .12s ease;
}

.shape:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 18px rgba(0,0,0,.16);
}

.shape.selected{
  outline:6px solid rgba(31,168,91,.35);
}

.stick-group{
  min-width:220px;
  min-height:140px;
  border:3px solid #dbe4f7;
  border-radius:20px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:12px;
}

.stick{
  width:76px;
  height:14px;
  background:linear-gradient(90deg,#c27a3d,#f2c27b,#a95b2d);
  border:2px solid #693812;
  border-radius:999px;
  transform:rotate(var(--r));
}

.sign-choice{
  font-size:3rem;
  line-height:1;
  min-width:90px;
}

.status{
  margin:12px auto 0;
  min-height:1.6em;
  text-align:center;
  font-size:clamp(1rem,3vw,1.25rem);
  font-weight:1000;
  color:#5a3eb0;
}

.stars{
  text-align:center;
  min-height:1.3em;
  font-size:2.1rem;
  letter-spacing:4px;
  color:var(--gold);
  text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
}

.confetti-piece{
  position:fixed;
  top:-20px;
  width:10px;
  height:16px;
  border-radius:3px;
  z-index:9999;
  pointer-events:none;
  animation:confettiFall 1.7s linear forwards;
}

@keyframes confettiFall{
  to{transform:translateY(105vh) rotate(540deg);opacity:.1;}
}

@media(max-width:760px){
  .stick-group{min-width:100%;}
  .option{width:100%;}
}
</style>
</head>

<body>
<audio id="chimeAudio" src="chime.mp3" preload="auto"></audio>

<main class="app">
  <section class="header">
    <h1 class="title">Stick Shapes Quiz</h1>
  </section>

  <nav class="nav">
    <button class="btn home" onclick="goHome()">🏠 Home</button>
    <button class="btn navbtn" onclick="goPrev()">⬅ Prev</button>
    <button class="btn read" onclick="repeatInstruction()">🔊 Read</button>
    <button class="btn clear" onclick="resetQuiz()">🔁 Restart</button>
    <button class="btn navbtn" onclick="goNext()">Next ▶</button>
  </nav>

  <section class="score-card">
    <div class="score-title">Quiz Score</div>
    <div class="bar-row">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="percent" id="percent">0 / 6</div>
    </div>
    <div class="stars" id="stars">⭐</div>
  </section>

  <section class="quiz-card">
    <p class="question">1. Which shape is in first place?</p>
    <div class="race-row">
      <svg class="shape" onclick="checkShape(this,false)" viewBox="0 0 140 120">
        <polygon points="70,10 125,48 105,105 35,105 15,48" fill="#fff0a8" stroke="#222" stroke-width="5"/>
      </svg>
      <svg class="shape" onclick="checkShape(this,true)" viewBox="0 0 140 120">
        <polygon points="35,25 105,25 130,60 105,95 35,95 10,60" fill="#ffe4b5" stroke="#222" stroke-width="5"/>
      </svg>
      <svg class="shape" onclick="checkShape(this,false)" viewBox="0 0 140 120">
        <rect x="25" y="20" width="90" height="80" rx="8" fill="#ffd2d2" stroke="#222" stroke-width="5"/>
      </svg>
    </div>
  </section>

  <section class="quiz-card">
    <p class="question">2. Circle the 4th shape.</p>
    <div class="shape-row" id="q2">
      <svg class="shape" onclick="checkOrdinal(this,false,'q2')" viewBox="0 0 140 120">
        <polygon points="70,10 125,48 105,105 35,105 15,48" fill="#fff0a8" stroke="#222" stroke-width="5"/>
      </svg>
      <svg class="shape" onclick="checkOrdinal(this,false,'q2')" viewBox="0 0 140 120">
        <polygon points="35,25 105,25 130,60 105,95 35,95 10,60" fill="#ffe4b5" stroke="#222" stroke-width="5"/>
      </svg>
      <svg class="shape" onclick="checkOrdinal(this,false,'q2')" viewBox="0 0 140 120">
        <rect x="25" y="20" width="90" height="80" rx="8" fill="#ffd2d2" stroke="#222" stroke-width="5"/>
      </svg>
      <svg class="shape" onclick="checkOrdinal(this,true,'q2')" viewBox="0 0 140 120">
        <polygon points="70,12 124,50 103,105 37,105 16,50" fill="#dcfce7" stroke="#222" stroke-width="5"/>
      </svg>
      <svg class="shape" onclick="checkOrdinal(this,false,'q2')" viewBox="0 0 140 120">
        <polygon points="70,12 126,105 14,105" fill="#fff4c2" stroke="#222" stroke-width="5"/>
      </svg>
    </div>
  </section>

  <section class="quiz-card">
    <p class="question">3. Circle the 6th shape.</p>
    <div class="shape-row" id="q3">
      <svg class="shape" onclick="checkOrdinal(this,false,'q3')" viewBox="0 0 140 120"><rect x="25" y="20" width="90" height="80" rx="8" fill="#ffd2d2" stroke="#222" stroke-width="5"/></svg>
      <svg class="shape" onclick="checkOrdinal(this,false,'q3')" viewBox="0 0 140 120"><polygon points="70,12 126,105 14,105" fill="#fff4c2" stroke="#222" stroke-width="5"/></svg>
      <svg class="shape" onclick="checkOrdinal(this,false,'q3')" viewBox="0 0 140 120"><polygon points="35,25 105,25 130,60 105,95 35,95 10,60" fill="#ffe4b5" stroke="#222" stroke-width="5"/></svg>
      <svg class="shape" onclick="checkOrdinal(this,false,'q3')" viewBox="0 0 140 120"><polygon points="70,10 125,48 105,105 35,105 15,48" fill="#fff0a8" stroke="#222" stroke-width="5"/></svg>
      <svg class="shape" onclick="checkOrdinal(this,false,'q3')" viewBox="0 0 140 120"><polygon points="35,25 105,25 130,60 105,95 35,95 10,60" fill="#ffe4b5" stroke="#222" stroke-width="5"/></svg>
      <svg class="shape" onclick="checkOrdinal(this,true,'q3')" viewBox="0 0 140 120"><polygon points="70,12 126,105 14,105" fill="#fff4c2" stroke="#222" stroke-width="5"/></svg>
    </div>
  </section>

  <section class="quiz-card">
    <p class="question">4. Choose the correct sign: 3 ___ 5</p>
    <div class="options">
      <button class="option sign-choice" onclick="checkOption(this,true,'q4')">&lt;</button>
      <button class="option sign-choice" onclick="checkOption(this,false,'q4')">&gt;</button>
      <button class="option sign-choice" onclick="checkOption(this,false,'q4')">=</button>
    </div>
  </section>

  <section class="quiz-card">
    <p class="question">5. Choose the correct sentence.</p>
    <div class="stick-row">
      <div class="stick-group" id="sticksLeft"></div>
      <div class="stick-group" id="sticksRight"></div>
    </div>
    <div class="options">
      <button class="option" onclick="checkOption(this,true,'q5')">2 is less than 4</button>
      <button class="option" onclick="checkOption(this,false,'q5')">4 is less than 2</button>
      <button class="option" onclick="checkOption(this,false,'q5')">2 is greater than 4</button>
    </div>
  </section>

  <section class="quiz-card">
    <p class="question">6. Who collected the most sticks?</p>
    <div class="options">
      <button class="option" onclick="checkOption(this,true,'q6')">Anne</button>
      <button class="option" onclick="checkOption(this,false,'q6')">Joe</button>
      <button class="option" onclick="checkOption(this,false,'q6')">Ben</button>
    </div>
  </section>

  <div class="status" id="status">Tap 🔊 Read to hear the quiz instruction.</div>
</main>

<script>
const HOME_PAGE = "../../../../../index.html";
const NEXT_PAGE = "../../week-3/Monday/BK2Wk3ScienceClassC.html";

function goHome(){ location.href = HOME_PAGE; }
function goPrev(){ location.href = "./Bk2LCGame2.html"; }
function goNext(){ location.href = NEXT_PAGE; }

const chimeAudio = document.getElementById("chimeAudio");
const fill = document.getElementById("fill");
const percent = document.getElementById("percent");
const stars = document.getElementById("stars");
const statusEl = document.getElementById("status");

let score = 0;
const total = 6;
let answered = new Set();

function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  u.pitch = 1.15;
  u.volume = 1;
  const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
  const voice = voices.find(v => /en-US/i.test(v.lang) && /female|jenny|aria|samantha|zira/i.test(v.name)) ||
                voices.find(v => /en-US/i.test(v.lang)) ||
                voices.find(v => /^en/i.test(v.lang));
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

function playChime(){
  try{
    chimeAudio.currentTime = 0;
    const p = chimeAudio.play();
    if(p && p.catch) p.catch(()=>fallbackChime());
  }catch(e){ fallbackChime(); }
}

function fallbackChime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660,880,1046].forEach((n,i)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = n;
      o.type = "sine";
      g.gain.value = .05;
      o.connect(g);
      g.connect(ctx.destination);
      o.start(ctx.currentTime + i*.11);
      o.stop(ctx.currentTime + i*.11 + .12);
    });
  }catch(e){}
}

function updateScore(){
  const pct = Math.round((score/total)*100);
  fill.style.width = pct + "%";
  percent.textContent = score + " / " + total;
  stars.textContent = score >= 6 ? "⭐⭐⭐" : score >= 4 ? "⭐⭐" : score >= 1 ? "⭐" : "⭐";
}

function good(questionKey){
  if(answered.has(questionKey)) return;
  answered.add(questionKey);
  score++;
  updateScore();
  playChime();
  confetti();
  statusEl.textContent = "Great job!";
  speak("Great job!");
  if(score === total){
    setTimeout(()=>speak("Excellent work. You finished the quiz."),600);
  }
}

function wrong(){
  statusEl.textContent = "Try again. Look carefully.";
  speak("Try again. Look carefully.");
}

function checkShape(el,isCorrect){
  if(isCorrect){
    el.classList.add("selected");
    good("q1");
  }else{
    wrong();
  }
}

function checkOrdinal(el,isCorrect,key){
  if(answered.has(key)) return;
  if(isCorrect){
    el.classList.add("selected");
    good(key);
  }else{
    wrong();
  }
}

function checkOption(btn,isCorrect,key){
  if(answered.has(key)) return;
  if(isCorrect){
    btn.classList.add("correct");
    good(key);
  }else{
    btn.classList.add("wrong");
    wrong();
  }
}

function makeSticks(container,count){
  container.innerHTML = "";
  for(let i=0;i<count;i++){
    const s = document.createElement("div");
    s.className = "stick";
    s.style.setProperty("--r", ((i%5)-2)*10 + "deg");
    container.appendChild(s);
  }
}

function repeatInstruction(){
  speak("This is the quiz. Answer each question. Click the correct ordinal shape, choose the correct less than sign, and choose who collected the most sticks.");
}

function resetQuiz(){
  score = 0;
  answered = new Set();
  updateScore();
  document.querySelectorAll(".selected,.correct,.wrong").forEach(el=>el.classList.remove("selected","correct","wrong"));
  statusEl.textContent = "Quiz restarted.";
  speak("Quiz restarted. Try again.");
}

function confetti(){
  const colors = ["#ef3f45","#5d83c7","#ffd24a","#1fa85b","#ff9cac"];
  for(let i=0;i<28;i++){
    const p = document.createElement("span");
    p.className = "confetti-piece";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = Math.random()*220 + "ms";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1900);
  }
}

window.addEventListener("load",()=>{
  updateScore();
  makeSticks(document.getElementById("sticksLeft"),2);
  makeSticks(document.getElementById("sticksRight"),4);
  setTimeout(()=>speak("Welcome to the quiz. Answer each question carefully."),500);
});

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
</script>
</body>
</html>
