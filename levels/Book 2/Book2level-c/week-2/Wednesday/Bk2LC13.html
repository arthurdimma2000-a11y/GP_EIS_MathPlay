<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Less Than - Week 2</title>
<style>
  :root{
    --blue:#5d83c7;
    --deepBlue:#426db4;
    --red:#ef3f45;
    --softRed:#ff9cac;
    --ink:#27242a;
    --good:#1fa85b;
    --gold:#ffd24a;
    --purple:#6c4bbf;
    --paper:#fffdf7;
    --shadow:0 16px 36px rgba(0,0,0,.13);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:#fff9ef;
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#f1e6d8 1px,transparent 1px),
      linear-gradient(90deg,#f1e6d8 1px,transparent 1px);
    background-size:28px 28px;
  }

  .app{
    width:min(990px,100%);
    background:#ffffff;
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:10px 10px 14px;
    position:relative;
    overflow:visible;
  }

  .poster-wrap{
    position:relative;
    width:min(952px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
  }

  .poster-img{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .trace-zone{
    position:absolute;
    z-index:12;
    touch-action:none;
    cursor:crosshair;
    border-radius:12px;
    background:rgba(255,255,255,.94);
    border:2px solid rgba(93,131,199,.18);
    box-shadow:
      0 4px 10px rgba(0,0,0,.055),
      inset 0 0 0 1px rgba(255,255,255,.92);
    overflow:hidden;
  }

  .trace-zone[data-kind="sign"]{
    border-radius:18px;
    background:rgba(255,255,255,.90);
    border-color:rgba(239,63,69,.24);
  }

  .trace-zone[data-kind="number"]{
    border-radius:11px;
    background:rgba(255,255,255,.965);
    border-color:rgba(93,131,199,.22);
  }

  .trace-zone canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }

  .trace-zone.active{
    box-shadow:
      0 0 0 4px rgba(255,210,74,.42),
      0 0 20px rgba(255,210,74,.62),
      inset 0 0 0 1px rgba(255,255,255,.96);
  }

  .trace-zone.done{
    box-shadow:
      0 0 0 4px rgba(31,168,91,.24),
      0 0 20px rgba(31,168,91,.52),
      inset 0 0 0 1px rgba(255,255,255,.96);
  }

  /* Professionally adjusted poster overlay positions
     - slightly wider/taller so digits and signs sit cleanly on top of the poster
     - centered to cover the old rough marks and show neat traceable guides
  */
  #sign1{left:41.30%;top:21.20%;width:17.70%;height:12.85%;}
  #sign2{left:41.30%;top:46.05%;width:17.70%;height:12.85%;}
  #sign3{left:41.30%;top:75.55%;width:17.70%;height:12.85%;}

  #num3{left:35.55%;top:35.92%;width:6.25%;height:6.05%;}
  #num5{left:58.60%;top:35.92%;width:6.25%;height:6.05%;}

  #num2{left:35.55%;top:62.55%;width:6.25%;height:6.05%;}
  #num4{left:58.60%;top:62.55%;width:6.25%;height:6.05%;}

  #num6{left:35.55%;top:89.22%;width:6.25%;height:6.05%;}
  #num8{left:58.60%;top:89.22%;width:6.25%;height:6.05%;}

  .progress-card{
    width:min(952px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff8fb,#ffffff);
    border:3px solid #d6e4ff;
    border-radius:20px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.08);
  }

  .progress-title{
    text-align:center;
    font-size:clamp(1rem,3vw,1.35rem);
    font-weight:1000;
    color:#355fa8;
    margin-bottom:8px;
  }

  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .bar{
    flex:1;
    height:18px;
    background:#e8eef8;
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.12);
  }

  .fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#58c6ff,#83e79f,#ffd24a);
    transition:width .18s ease;
  }

  .percent{
    min-width:58px;
    text-align:right;
    font-size:1.05rem;
    font-weight:1000;
    color:#175ca8;
  }

  .mini-progress{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
  }

  .mini-box{
    background:#fff;
    border:2px solid #e8edf8;
    border-radius:14px;
    padding:7px 4px;
    text-align:center;
    font-size:.92rem;
    font-weight:1000;
  }

  .mini-box.done{
    border-color:#72db94;
    background:#effff4;
    color:#157a3d;
  }

  .controls{
    width:min(952px,100%);
    margin:12px auto 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .btn{
    border:none;
    border-radius:999px;
    padding:11px 16px;
    font-size:.98rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.18);
    transition:transform .1s ease,filter .1s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .btn:hover{
    filter:brightness(1.04);
    transform:translateY(-1px);
  }

  .btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 rgba(0,0,0,.14);
  }

  .btn.home{background:#eef5ff;color:#244f9c;border:2px solid #c7dcff;}
  .btn.nav{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:var(--red);color:#fff;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}

  .status{
    width:min(952px,100%);
    margin:10px auto 0;
    min-height:1.5em;
    text-align:center;
    font-size:clamp(1rem,3vw,1.28rem);
    font-weight:1000;
    color:#5a3eb0;
  }

  .stars{
    text-align:center;
    min-height:1.3em;
    font-size:2.1rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:
      0 2px 0 #b87900,
      0 4px 0 #8a5a00,
      0 8px 14px rgba(0,0,0,.28);
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:confettiFall 1.7s linear forwards;
  }

  @keyframes confettiFall{
    to{transform:translateY(105vh) rotate(540deg);opacity:.1;}
  }

  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:18px;}
    .mini-progress{grid-template-columns:1fr;}
    .btn{font-size:.86rem;padding:9px 12px;}
  }
</style>
</head>

  const chimeAudio = document.getElementById("chimeAudio");

  const row1Chip = document.getElementById("row1Chip");
  const row2Chip = document.getElementById("row2Chip");
  const row3Chip = document.getElementById("row3Chip");

  const store = new Map();
  const progress = {};

  let audioCtx = null;
  let lastTick = 0;
  let introStarted = false;
  let finalCelebrationDone = false;

  zones.forEach(zone => progress[zone.dataset.key] = 0);

  function setStatus(text){
    statusBox.textContent = text;
  }

  function pickAmericanFemaleVoice(){
    if (!("speechSynthesis" in window)) return null;

    const voices = window.speechSynthesis.getVoices() || [];

    return voices.find(v =>
      /^en[-_]US/i.test(v.lang || "") &&
      /jenny|aria|ava|allison|samantha|zira|karen|susan|female|woman|girl|olivia|emma|ivy|luna|nova/i.test(v.name || "")
    )
    || voices.find(v =>
      /^en[-_]US/i.test(v.lang || "") &&
      !/male|man|david|mark|alex|daniel|tom|guy|brian|james|paul|kevin/i.test(v.name || "")
    )
    || voices.find(v => /^en[-_]US/i.test(v.lang || ""))
    || voices.find(v => /^en/i.test(v.lang || ""))
    || voices[0]
    || null;
  }

  function speak(text, options){
    return new Promise(resolve => {
      if (!("speechSynthesis" in window) || !text) {
        resolve();
        return;
      }

      try{ window.speechSynthesis.cancel(); }catch(e){}

      const utter = new SpeechSynthesisUtterance(text);
      const opts = options || {};

      utter.lang = "en-US";
      utter.rate = typeof opts.rate === "number" ? opts.rate : 0.86;
      utter.pitch = typeof opts.pitch === "number" ? opts.pitch : 1.18;
      utter.volume = 1;

      const voice = pickAmericanFemaleVoice();
      if (voice) utter.voice = voice;

      utter.onend = resolve;
      utter.onerror = resolve;

      window.speechSynthesis.speak(utter);
    });
  }

  function getAudioContext(){
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;

    if (!audioCtx) audioCtx = new AudioContextClass();

    if (audioCtx.state === "suspended") {
      audioCtx.resume().catch(()=>{});
    }

    return audioCtx;
  }

  function playTraceTick(){
    const now = Date.now();
    if (now - lastTick < 55) return;
    lastTick = now;

    const ctx = getAudioContext();
    if (!ctx) return;

    try{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(850, ctx.currentTime);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.055, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.055);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.06);
    }catch(e){}
  }

  function synthChime(){
    const ctx = getAudioContext();
    if (!ctx) return;

    try{
      [660, 880, 1040].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t = ctx.currentTime + i * 0.08;

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.075, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(t);
        osc.stop(t + 0.28);
      });
    }catch(e){}
  }

  function playChime(){
    let played = false;

    try{
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 1;
      const p = chimeAudio.play();
      if (p && typeof p.then === "function") {
        p.then(() => { played = true; }).catch(() => synthChime());
      } else {
        played = true;
      }
    }catch(e){
      synthChime();
    }

    setTimeout(() => {
      if (!played) synthChime();
    }, 120);
  }

  function playCheerSound(){
    const ctx = getAudioContext();
    if (!ctx) return;

    try{
      for (let i = 0; i < 10; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(520 + i * 65, ctx.currentTime + i * 0.045);

        gain.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.045);
        gain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + i * 0.045 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.045 + 0.13);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime + i * 0.045);
        osc.stop(ctx.currentTime + i * 0.045 + 0.14);
      }
    }catch(e){}
  }

  function confetti(){
    const colors = ["#ffd24a","#58c6ff","#83e79f","#f24b5e","#b38cff","#ff9f43"];

    for (let i = 0; i < 42; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * 0.3 + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2100);
    }
  }

  function fitCanvas(zone){
    const canvas = zone.querySelector("canvas");
    const rect = zone.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);

    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));

    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const mask = document.createElement("canvas");
    mask.width = canvas.width;
    mask.height = canvas.height;

    const maskCtx = mask.getContext("2d", { willReadFrequently:true });
    maskCtx.setTransform(dpr,0,0,dpr,0,0);

    const data = store.get(zone) || {
      points:[],
      drawing:false,
      done:false,
      visited:new Set(),
      totalCells:1
    };

    data.canvas = canvas;
    data.ctx = ctx;
    data.mask = mask;
    data.maskCtx = maskCtx;
    data.width = rect.width;
    data.height = rect.height;
    data.dpr = dpr;

    store.set(zone, data);
    createMask(zone);
    redraw(zone);
  }

  function getFontSize(zone, data){
    if (zone.dataset.kind === "sign") {
      return Math.floor(data.height * 0.86);
    }

    return Math.floor(data.height * 0.92);
  }

  function withTracePath(ctx, target, w, h){
    const x = n => n * w;
    const y = n => n * h;

    ctx.beginPath();

    /*
      Clean professional tracing paths:
      - every digit is centered inside its overlay box
      - every path has rounded corners/caps
      - the less-than sign is balanced and big enough for young learners
    */
    if (target === "<") {
      ctx.moveTo(x(.76), y(.18));
      ctx.lineTo(x(.25), y(.50));
      ctx.lineTo(x(.76), y(.82));
      return;
    }

    if (target === "2") {
      ctx.moveTo(x(.29), y(.30));
      ctx.bezierCurveTo(x(.34), y(.13), x(.67), y(.12), x(.76), y(.30));
      ctx.bezierCurveTo(x(.86), y(.50), x(.57), y(.58), x(.43), y(.69));
      ctx.bezierCurveTo(x(.35), y(.75), x(.29), y(.81), x(.23), y(.88));
      ctx.lineTo(x(.80), y(.88));
      return;
    }

    if (target === "3") {
      ctx.moveTo(x(.30), y(.22));
      ctx.bezierCurveTo(x(.48), y(.10), x(.76), y(.16), x(.74), y(.35));
      ctx.bezierCurveTo(x(.73), y(.47), x(.61), y(.53), x(.48), y(.53));
      ctx.bezierCurveTo(x(.64), y(.53), x(.78), y(.60), x(.75), y(.75));
      ctx.bezierCurveTo(x(.72), y(.94), x(.43), y(.94), x(.26), y(.80));
      return;
    }

    if (target === "4") {
      ctx.moveTo(x(.72), y(.16));
      ctx.lineTo(x(.26), y(.61));
      ctx.lineTo(x(.81), y(.61));
      ctx.moveTo(x(.72), y(.16));
      ctx.lineTo(x(.72), y(.90));
      return;
    }

    if (target === "5") {
      ctx.moveTo(x(.77), y(.17));
      ctx.lineTo(x(.34), y(.17));
      ctx.lineTo(x(.29), y(.45));
      ctx.bezierCurveTo(x(.43), y(.38), x(.70), y(.40), x(.80), y(.59));
      ctx.bezierCurveTo(x(.91), y(.80), x(.59), y(.97), x(.25), y(.80));
      return;
    }

    if (target === "6") {
      ctx.moveTo(x(.73), y(.18));
      ctx.bezierCurveTo(x(.45), y(.19), x(.29), y(.42), x(.30), y(.67));
      ctx.bezierCurveTo(x(.31), y(.88), x(.48), y(.95), x(.64), y(.88));
      ctx.bezierCurveTo(x(.84), y(.79), x(.82), y(.54), x(.63), y(.47));
      ctx.bezierCurveTo(x(.44), y(.41), x(.29), y(.55), x(.31), y(.72));
      ctx.bezierCurveTo(x(.34), y(.91), x(.57), y(.93), x(.70), y(.80));
      return;
    }

    if (target === "8") {
      ctx.moveTo(x(.52), y(.16));
      ctx.bezierCurveTo(x(.30), y(.17), x(.28), y(.40), x(.52), y(.50));
      ctx.bezierCurveTo(x(.80), y(.61), x(.77), y(.88), x(.53), y(.89));
      ctx.bezierCurveTo(x(.27), y(.88), x(.26), y(.61), x(.52), y(.50));
      ctx.bezierCurveTo(x(.79), y(.39), x(.76), y(.17), x(.52), y(.16));
      return;
    }

    const fontSize = Math.floor(h * .9);
    ctx.font = `900 ${fontSize}px Comic Sans MS, Segoe UI, Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.strokeText(target, w / 2, h / 2 + h * .03);
  }

  function drawTraceDot(ctx, x, y, r, fill, label){
    ctx.save();
    ctx.fillStyle = fill;
    ctx.shadowColor = "rgba(0,0,0,.24)";
    ctx.shadowBlur = Math.max(2, r * .42);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineWidth = Math.max(1.5, r * .16);
    ctx.strokeStyle = "rgba(255,255,255,.96)";
    ctx.stroke();

    if (label) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff";
      ctx.font = `900 ${Math.max(9, r * 1.02)}px Comic Sans MS, Segoe UI, Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x, y + r * .03);
    }
    ctx.restore();
  }

  function getEndpoints(zone, data){
    const w = data.width;
    const h = data.height;
    const target = zone.dataset.target;

    if (target === "<") return { start:{x:w*.76,y:h*.18}, end:{x:w*.76,y:h*.82} };
    if (target === "2") return { start:{x:w*.29,y:h*.30}, end:{x:w*.80,y:h*.88} };
    if (target === "3") return { start:{x:w*.30,y:h*.22}, end:{x:w*.26,y:h*.80} };
    if (target === "4") return { start:{x:w*.72,y:h*.16}, end:{x:w*.72,y:h*.90} };
    if (target === "5") return { start:{x:w*.77,y:h*.17}, end:{x:w*.25,y:h*.80} };
    if (target === "6") return { start:{x:w*.73,y:h*.18}, end:{x:w*.70,y:h*.80} };
    if (target === "8") return { start:{x:w*.52,y:h*.16}, end:{x:w*.52,y:h*.16} };

    return { start:{x:w*.30,y:h*.25}, end:{x:w*.70,y:h*.80} };
  }

  function drawZoneBackdrop(ctx, zone, data){
    const w = data.width;
    const h = data.height;
    const r = Math.max(6, Math.min(w, h) * .16);

    ctx.save();
    ctx.clearRect(0,0,w,h);

    ctx.fillStyle = zone.dataset.kind === "sign"
      ? "rgba(255,255,255,.91)"
      : "rgba(255,255,255,.965)";

    ctx.strokeStyle = zone.dataset.kind === "sign"
      ? "rgba(239,63,69,.22)"
      : "rgba(93,131,199,.20)";

    ctx.lineWidth = Math.max(1, Math.min(w,h) * .035);
    const x0 = 1.5;
    const y0 = 1.5;
    const bw = Math.max(1, w - 3);
    const bh = Math.max(1, h - 3);
    const rr = Math.min(r, bw / 2, bh / 2);

    ctx.beginPath();
    ctx.moveTo(x0 + rr, y0);
    ctx.lineTo(x0 + bw - rr, y0);
    ctx.quadraticCurveTo(x0 + bw, y0, x0 + bw, y0 + rr);
    ctx.lineTo(x0 + bw, y0 + bh - rr);
    ctx.quadraticCurveTo(x0 + bw, y0 + bh, x0 + bw - rr, y0 + bh);
    ctx.lineTo(x0 + rr, y0 + bh);
    ctx.quadraticCurveTo(x0, y0 + bh, x0, y0 + bh - rr);
    ctx.lineTo(x0, y0 + rr);
    ctx.quadraticCurveTo(x0, y0, x0 + rr, y0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawGuideText(ctx, zone, data, mode){
    const target = zone.dataset.target;
    const kind = zone.dataset.kind;
    const w = data.width;
    const h = data.height;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (mode === "guide") {
      drawZoneBackdrop(ctx, zone, data);

      const guideWidth = kind === "sign"
        ? Math.max(9, h * 0.13)
        : Math.max(6, h * 0.18);

      /*
        The guide has three layers:
        1. white bold underlay to hide old rough poster marks
        2. soft pink/blue shadow to make the tracing target visible
        3. clean red dotted center path for the child to follow
      */
      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(255,255,255,.99)";
      ctx.lineWidth = guideWidth + Math.max(8, h * .16);
      ctx.shadowColor = "rgba(0,0,0,.10)";
      ctx.shadowBlur = Math.max(2, h * .045);
      withTracePath(ctx, target, w, h);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = kind === "sign"
        ? "rgba(255,156,172,.38)"
        : "rgba(93,131,199,.20)";
      ctx.lineWidth = guideWidth + Math.max(3, h * .055);
      withTracePath(ctx, target, w, h);
      ctx.stroke();

      ctx.strokeStyle = "rgba(239,63,69,.98)";
      ctx.lineWidth = guideWidth;
      ctx.setLineDash(kind === "sign"
        ? [Math.max(8,h*.14), Math.max(7,h*.12)]
        : [Math.max(6,h*.125), Math.max(5,h*.105)]
      );
      withTracePath(ctx, target, w, h);
      ctx.stroke();

      const ends = getEndpoints(zone, data);
      const dotR = kind === "sign" ? Math.max(6, h*.082) : Math.max(5, h*.115);
      drawTraceDot(ctx, ends.start.x, ends.start.y, dotR, "#1fa85b", "1");

      if (target !== "8") {
        drawTraceDot(ctx, ends.end.x, ends.end.y, dotR, "#ef3f45", "2");
      }
    }

    if (mode === "mask") {
      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(0,0,0,1)";
      ctx.lineWidth = kind === "sign"
        ? Math.max(30, h * 0.35)
        : Math.max(22, h * 0.46);
      withTracePath(ctx, target, w, h);
      ctx.stroke();
    }

    ctx.restore();
  }

  function createMask(zone){
    const data = store.get(zone);
    const ctx = data.maskCtx;
    const w = data.width;
    const h = data.height;

    ctx.clearRect(0,0,w,h);
    drawGuideText(ctx, zone, data, "mask");

    data.totalCells = 0;

    const cell = Math.max(3, Math.round(Math.min(w,h) / 14));

    for (let y = 0; y < h; y += cell) {
      for (let x = 0; x < w; x += cell) {
        if (maskHit(zone, x + cell / 2, y + cell / 2, 2)) {
          data.totalCells++;
        }
      }
    }

    data.cellSize = cell;
    if (data.totalCells < 1) data.totalCells = 1;
  }

  function maskHit(zone, x, y, radius){
    const data = store.get(zone);
    if (!data || !data.maskCtx) return false;

    const r = radius || 4;
    const dpr = data.dpr || 1;
    const mx = Math.round(x * dpr);
    const my = Math.round(y * dpr);
    const rr = Math.round(r * dpr);

    try{
      const step = Math.max(1, Math.floor(rr / 3));
      for (let yy = -rr; yy <= rr; yy += step) {
        for (let xx = -rr; xx <= rr; xx += step) {
          const px = Math.max(0, Math.min(data.mask.width - 1, mx + xx));
          const py = Math.max(0, Math.min(data.mask.height - 1, my + yy));
          const alpha = data.maskCtx.getImageData(px, py, 1, 1).data[3];
          if (alpha > 18) return true;
        }
      }
    }catch(e){
      return true;
    }

    return false;
  }

  function drawSmoothPath(ctx, pts){
    if (pts.length < 2) return;

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);

    for (let i = 1; i < pts.length - 1; i++) {
      const midX = (pts[i].x + pts[i + 1].x) / 2;
      const midY = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
    }

    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
  }

  function redraw(zone){
    const data = store.get(zone);
    if (!data || !data.ctx) return;

    const ctx = data.ctx;
    const w = data.width;
    const h = data.height;
    const pts = data.points || [];

    ctx.clearRect(0,0,w,h);
    drawGuideText(ctx, zone, data, "guide");

    if (pts.length > 1) {
      const traceWidth = zone.dataset.kind === "sign"
        ? Math.max(9, h * 0.145)
        : Math.max(7, h * 0.205);

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.shadowColor = "rgba(31,122,224,.28)";
      ctx.shadowBlur = Math.max(4, h * .045);
      ctx.strokeStyle = "rgba(31,122,224,.98)";
      ctx.lineWidth = traceWidth;
      drawSmoothPath(ctx, pts);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,.82)";
      ctx.lineWidth = Math.max(2.25, traceWidth * .38);
      drawSmoothPath(ctx, pts);
      ctx.stroke();

      ctx.restore();
    }
  }

  function pointFromEvent(event, zone){
    const rect = zone.getBoundingClientRect();

    return {
      x: Math.max(0, Math.min(rect.width, event.clientX - rect.left)),
      y: Math.max(0, Math.min(rect.height, event.clientY - rect.top))
    };
  }

  function recordVisited(zone, p){
    const data = store.get(zone);
    const cell = data.cellSize || 4;

    const brush = zone.dataset.kind === "sign"
      ? Math.max(11, data.height * .155)
      : Math.max(8, data.height * .205);

    const spread = Math.ceil(brush / cell);
    const gx = Math.floor(p.x / cell);
    const gy = Math.floor(p.y / cell);

    for (let oy = -spread; oy <= spread; oy++) {
      for (let ox = -spread; ox <= spread; ox++) {
        const px = (gx + ox) * cell + cell / 2;
        const py = (gy + oy) * cell + cell / 2;
        const closeEnough = Math.hypot(px - p.x, py - p.y) <= brush;

        if (closeEnough && maskHit(zone, px, py, 3)) {
          data.visited.add((gx + ox) + "," + (gy + oy));
        }
      }
    }
  }

  function addTracePoint(zone, p){
    const data = store.get(zone);
    const last = data.points[data.points.length - 1];

    if (!last) {
      if (maskHit(zone, p.x, p.y, zone.dataset.kind === "sign" ? 28 : 24)) {
        data.points.push(p);
        recordVisited(zone, p);
      }
      return;
    }

    const dist = Math.hypot(p.x - last.x, p.y - last.y);
    const step = Math.max(2.5, Math.min(data.width, data.height) / 22);
    const pieces = Math.max(1, Math.ceil(dist / step));

    for (let i = 1; i <= pieces; i++) {
      const t = i / pieces;
      const ip = {
        x: last.x + (p.x - last.x) * t,
        y: last.y + (p.y - last.y) * t
      };

      if (maskHit(zone, ip.x, ip.y, zone.dataset.kind === "sign" ? 28 : 24)) {
        data.points.push(ip);
        recordVisited(zone, ip);
      }
    }
  }

  function estimateZoneProgress(zone){
    const data = store.get(zone);
    if (!data) return 0;

    const raw = Math.round((data.visited.size / data.totalCells) * 100);
    return Math.max(0, Math.min(100, raw));
  }

  function updateRowChips(){
    const row1Done = progress.sign1 >= 82 && progress.num3 >= 76 && progress.num5 >= 76;
    const row2Done = progress.sign2 >= 82 && progress.num2 >= 76 && progress.num4 >= 76;
    const row3Done = progress.sign3 >= 82 && progress.num6 >= 76 && progress.num8 >= 76;

    row1Chip.classList.toggle("done", row1Done);
    row2Chip.classList.toggle("done", row2Done);
    row3Chip.classList.toggle("done", row3Done);
  }

  function updateProgress(){
    let total = 0;

    zones.forEach(zone => {
      const key = zone.dataset.key;
      const label = zone.dataset.label;
      const data = store.get(zone);

      const current = estimateZoneProgress(zone);
      progress[key] = Math.max(progress[key] || 0, current);

      const pct = Math.min(100, progress[key]);
      total += pct;

      const completeAt = zone.dataset.kind === "sign" ? 82 : 76;

      if (pct >= completeAt && data && !data.done) {
        data.done = true;
        zone.classList.add("done");

        playChime();
        playCheerSound();

        setStatus(`Great tracing! You traced the ${label}.`);
        speak(`Great job! You traced the ${label}.`, {
          rate:.88,
          pitch:1.22
        });
      }
    });

    const overall = Math.round(total / zones.length);

    progressFill.style.width = overall + "%";
    progressPercent.textContent = overall + "%";

    updateRowChips();
    saveProgress(overall);

    if (overall >= 86 && !finalCelebrationDone) {
      finalCelebrationDone = true;

      playChime();
      playCheerSound();
      confetti();

      stars.textContent = "⭐⭐⭐";
      setStatus("Excellent! 3 is less than 5, 2 is less than 4, and 6 is less than 8.");

      speak("Excellent work! Three is less than five. Two is less than four. Six is less than eight. You did it!", {
        rate:.86,
        pitch:1.25
      });
    }
  }

  function saveProgress(score){
    try{
      localStorage.setItem("LessThanWeek2_trace_score", String(score));

      const report = JSON.parse(localStorage.getItem("GP_EIS_PROGRESS_REPORT") || "{}");
      report["LessThanWeek2"] = {
        title:"Less Than Week 2",
        score:score,
        completed:score >= 86,
        updatedAt:new Date().toISOString()
      };
      localStorage.setItem("GP_EIS_PROGRESS_REPORT", JSON.stringify(report));
    }catch(e){}
  }

  function startDraw(event, zone){
    event.preventDefault();

    try{ getAudioContext(); }catch(e){}
    try{ zone.setPointerCapture(event.pointerId); }catch(e){}

    zone.classList.add("active");

    const data = store.get(zone);
    data.drawing = true;

    const p = pointFromEvent(event, zone);

    if (maskHit(zone, p.x, p.y, zone.dataset.kind === "sign" ? 30 : 26)) {
      addTracePoint(zone, p);
      playTraceTick();
      redraw(zone);
      updateProgress();
    } else {
      setStatus("Start on the green dot and trace along the clean red dotted line.");
    }
  }

  function moveDraw(event, zone){
    const data = store.get(zone);
    if (!data || !data.drawing) return;

    event.preventDefault();

    const p = pointFromEvent(event, zone);

    if (!maskHit(zone, p.x, p.y, zone.dataset.kind === "sign" ? 32 : 28)) {
      setStatus("Good try. Keep your finger on the clean red dotted line.");
      return;
    }

    addTracePoint(zone, p);
    redraw(zone);
    playTraceTick();
    updateProgress();
  }

  function endDraw(event, zone){
    const data = store.get(zone);
    if (!data) return;

    if (data.drawing && event) {
      const p = pointFromEvent(event, zone);
      if (maskHit(zone, p.x, p.y, zone.dataset.kind === "sign" ? 32 : 28)) {
        addTracePoint(zone, p);
      }
    }

    data.drawing = false;
    zone.classList.remove("active");
    redraw(zone);
    updateProgress();
  }

  function clearAll(){
    zones.forEach(zone => {
      const data = store.get(zone);

      if (data) {
        data.points = [];
        data.visited = new Set();
        data.drawing = false;
        data.done = false;
      }

      zone.classList.remove("active","done");
      progress[zone.dataset.key] = 0;
      redraw(zone);
    });

    finalCelebrationDone = false;

    progressFill.style.width = "0%";
    progressPercent.textContent = "0%";
    stars.textContent = "";

    row1Chip.classList.remove("done");
    row2Chip.classList.remove("done");
    row3Chip.classList.remove("done");

    setStatus("Try again. Trace the clean red dotted numbers and less-than signs.");

    speak("Let's try again. Trace the clean red dotted numbers and the less than signs carefully.", {
      rate:.88,
      pitch:1.16
    });
  }

  async function playIntro(){
    if (introStarted) return;

    introStarted = true;
    setStatus("Listen carefully. Then trace the numbers and signs.");

    await speak(
      "Hello superstar! Today we are learning less than. Look at the poster. Three is less than five. Two is less than four. Six is less than eight. Trace the numbers in each sentence. Then trace the less than sign in each middle box. The less than sign opens toward the bigger group. Stay on the clean red dotted lines.",
      {
        rate:.84,
        pitch:1.18
      }
    );

    setStatus("Start tracing the clean red dotted numbers and less-than signs.");
  }

  function checkWork(){
    const score = Number(progressPercent.textContent.replace("%","")) || 0;

    if (score >= 86) {
      playChime();
      playCheerSound();
      confetti();

      stars.textContent = "⭐⭐⭐";
      setStatus("Perfect! You traced all the less-than work.");

      speak("Perfect! Three is less than five. Two is less than four. Six is less than eight. Great job!", {
        rate:.86,
        pitch:1.25
      });
    } else {
      setStatus("Good try! Keep tracing on the clean red dotted lines until the progress bar is full.");

      speak("Good try! Keep tracing on the clean red dotted lines until the progress bar is full.", {
        rate:.88,
        pitch:1.15
      });
    }
  }

  function setup(){
    zones.forEach(zone => {
      fitCanvas(zone);

      zone.addEventListener("pointerdown", event => startDraw(event, zone));
      zone.addEventListener("pointermove", event => moveDraw(event, zone));
      zone.addEventListener("pointerup", event => endDraw(event, zone));
      zone.addEventListener("pointercancel", event => endDraw(event, zone));
      zone.addEventListener("pointerleave", event => endDraw(event, zone));
    });

    clearBtn.addEventListener("click", clearAll);

    voiceBtn.addEventListener("click", () => {
      introStarted = false;
      playIntro();
    });

    checkBtn.addEventListener("click", checkWork);

    window.addEventListener("resize", () => {
      zones.forEach(fitCanvas);
    });

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = function(){};
    }

    if (posterImg.complete) {
      setTimeout(() => zones.forEach(fitCanvas), 150);
    } else {
      posterImg.addEventListener("load", () => zones.forEach(fitCanvas));
    }

    setTimeout(playIntro, 800);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setup);
  } else {
    setup();
  }
})();
</script>
</body>
</html>
