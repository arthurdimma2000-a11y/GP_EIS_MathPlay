<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Adding to 10 - Week 2 Trace and Circle</title>
<style>
:root{
  --ink:#25232a; --paper:#fff8ef; --blue:#5f88cc; --red:#f04855; --green:#20aa5d;
  --yellow:#f7dc6f; --orange:#ff8f24; --purple:#7049c6; --gold:#ffd24a;
  --shadow:0 15px 34px rgba(0,0,0,.13);
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;background-image:linear-gradient(#efe5d8 1px,transparent 1px),linear-gradient(90deg,#efe5d8 1px,transparent 1px);background-size:28px 28px}
.app{width:min(1000px,100%);background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:10px 10px 14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 auto 8px;width:min(930px,100%)}
.badge{background:#eef5ff;border:3px solid #cfe0ff;color:#315eaa;border-radius:999px;padding:8px 13px;font-weight:1000}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.home{background:#25d17d;color:#fff} .btn.prev,.btn.next{background:var(--yellow);color:#8a5700} .btn.read{background:var(--red);color:#fff} .btn.clear{background:#dfeaff;color:#1f3b6b} .btn.cheer{background:#c9f2d6;color:#166c38}
.poster-wrap{position:relative;width:min(930px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;touch-action:none}
.poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.trace-layer{position:absolute;inset:0;width:100%;height:100%;z-index:6;touch-action:none;cursor:crosshair;background:transparent}
.digit-glow{position:absolute;z-index:5;border:4px solid rgba(255,210,74,.95);border-radius:12px;box-shadow:0 0 0 6px rgba(255,210,74,.25),0 0 20px rgba(255,100,160,.4);pointer-events:none;display:none;animation:pulse 1.1s ease-in-out infinite}
.digit-glow.show{display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.answer-hotspot{position:absolute;z-index:7;border-radius:999px;border:4px solid transparent;background:rgba(255,255,255,.001);cursor:pointer}
.answer-hotspot.ready{box-shadow:0 0 0 5px rgba(255,210,74,.20)}
.answer-hotspot.done{border-color:#19a85b;background:rgba(48,220,105,.12);box-shadow:0 0 0 6px rgba(48,220,105,.20)}
.answer-hotspot.wrong{border-color:#f04855;background:rgba(240,72,85,.12)}
.panel{width:min(930px,100%);margin:12px auto 0;background:linear-gradient(180deg,#fff,#fff7fb);border:3px solid rgba(93,134,201,.25);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.06)}
.progress-title{text-align:center;font-size:clamp(1rem,2.6vw,1.28rem);font-weight:1000;color:#3f5fa8;margin-bottom:8px}
.progress-bar{height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16)}
.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#31b7ff,#83e79f);transition:width .15s ease-out}
.mini-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:9px}
.mini{background:#fff;border:2px solid #e7edf8;border-radius:12px;text-align:center;padding:6px 4px;font-weight:1000;font-size:.88rem;color:#444}
.mini.active{border-color:#ffd24a;background:#fff9d9;color:#8a5700}
.mini.done{border-color:#62d98c;background:#effff4;color:#126c36}
.status{min-height:1.45em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple)}
.stars{text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28)}
.buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px}
.confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1}}
@media(max-width:760px){body{padding:6px}.app{padding:6px;border-radius:16px}.panel{padding:10px;border-radius:14px}.mini-grid{grid-template-columns:repeat(3,1fr)}.btn{font-size:.85rem;padding:9px 12px}}
</style>
</head>

    {id:"d3", label:"3", row:1, type:"3", box:{x:410,y:790,w:28,h:44}},
    {id:"d0a", label:"0", row:1, type:"0", box:{x:438,y:790,w:23,h:44}},
    {id:"d4", label:"4", row:2, type:"4", box:{x:405,y:1152,w:29,h:45}},
    {id:"d0b", label:"0", row:2, type:"0", box:{x:435,y:1152,w:23,h:45}}
  ];
  const answerZones = [
    {el:answerButtons[0], x:610,y:430,w:76,h:70, text:"25"},
    {el:answerButtons[1], x:610,y:785,w:78,h:70, text:"40"},
    {el:answerButtons[2], x:608,y:1145,w:82,h:72, text:"50"}
  ];
  let dpr=1, sx=1, sy=1, drawing=false, activeIndex=0, lastPoint=null, audioCtx=null, finalCelebrated=false, lastTick=0;
  const strokes=[]; let currentStroke=null;

  function setStatus(t){ statusEl.textContent = t || ""; }
  function pointLerp(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
  function addLine(arr,a,b,n){ for(let i=0;i<=n;i++) arr.push(pointLerp(a,b,i/n)); }
  function addCubic(arr,p0,p1,p2,p3,n){
    for(let i=0;i<=n;i++){ const t=i/n,u=1-t; arr.push({x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x, y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}); }
  }
  function makeSamples(type,b){
    const x=b.x,y=b.y,w=b.w,h=b.h, s=[];
    if(type==="1"){ addLine(s,{x:x+w*.48,y:y+h*.08},{x:x+w*.48,y:y+h*.92},22); addLine(s,{x:x+w*.20,y:y+h*.24},{x:x+w*.48,y:y+h*.08},7); return s; }
    if(type==="5"){ addLine(s,{x:x+w*.80,y:y+h*.10},{x:x+w*.18,y:y+h*.10},16); addLine(s,{x:x+w*.18,y:y+h*.10},{x:x+w*.18,y:y+h*.46},10); addLine(s,{x:x+w*.18,y:y+h*.46},{x:x+w*.60,y:y+h*.46},12); addCubic(s,{x:x+w*.60,y:y+h*.46},{x:x+w*.92,y:y+h*.48},{x:x+w*.94,y:y+h*.92},{x:x+w*.46,y:y+h*.91},26); addCubic(s,{x:x+w*.46,y:y+h*.91},{x:x+w*.23,y:y+h*.91},{x:x+w*.13,y:y+h*.78},{x:x+w*.12,y:y+h*.70},12); return s; }
    if(type==="3"){ addCubic(s,{x:x+w*.18,y:y+h*.15},{x:x+w*.86,y:y+h*.02},{x:x+w*.90,y:y+h*.43},{x:x+w*.43,y:y+h*.49},28); addCubic(s,{x:x+w*.43,y:y+h*.49},{x:x+w*.96,y:y+h*.57},{x:x+w*.84,y:y+h*.98},{x:x+w*.15,y:y+h*.84},30); return s; }
    if(type==="4"){ addLine(s,{x:x+w*.72,y:y+h*.08},{x:x+w*.72,y:y+h*.92},24); addLine(s,{x:x+w*.72,y:y+h*.08},{x:x+w*.18,y:y+h*.62},18); addLine(s,{x:x+w*.18,y:y+h*.62},{x:x+w*.92,y:y+h*.62},18); return s; }
    // zero
    for(let i=0;i<=72;i++){ const a=Math.PI*2*i/72; s.push({x:x+w*.50+Math.cos(a)*w*.35, y:y+h*.50+Math.sin(a)*h*.42}); }
    return s;
  }
  function prepareTargets(){
    miniGrid.innerHTML="";
    targets.forEach((t,i)=>{
      t.samples=makeSamples(t.type,t.box).map(p=>({...p,hit:false})); t.complete=false; t.percent=0;
      const div=document.createElement("div"); div.className="mini"; div.id="mini-"+t.id; div.innerHTML=`${t.label}: <span>0%</span>`;
      miniGrid.appendChild(div); t.mini=div; t.pctEl=div.querySelector("span");
    });
  }
  function resizeCanvas(){
    const rect=posterWrap.getBoundingClientRect(); dpr=Math.max(1,window.devicePixelRatio||1);
    traceLayer.width=Math.round(rect.width*dpr); traceLayer.height=Math.round(rect.height*dpr);
    sx=rect.width/NATURAL_W; sy=rect.height/NATURAL_H;
    ctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
    positionOverlays(); redraw();
  }
  function positionOverlays(){
    const active=targets[activeIndex];
    if(active && !active.complete){ const b=active.box; digitGlow.classList.add("show"); digitGlow.style.left=(b.x*sx-5)+"px"; digitGlow.style.top=(b.y*sy-5)+"px"; digitGlow.style.width=(b.w*sx+10)+"px"; digitGlow.style.height=(b.h*sy+10)+"px"; }
    else digitGlow.classList.remove("show");
    answerZones.forEach(z=>{ z.el.style.left=(z.x*sx)+"px"; z.el.style.top=(z.y*sy)+"px"; z.el.style.width=(z.w*sx)+"px"; z.el.style.height=(z.h*sy)+"px"; });
    targets.forEach((t,i)=>{ if(t.mini) t.mini.classList.toggle("active", i===activeIndex && !t.complete); });
  }
  function redraw(){
    ctx.clearRect(0,0,NATURAL_W,NATURAL_H);
    // Draw completed and current strokes only. The original dotted digits on the poster stay unchanged.
    ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round";
    strokes.forEach(st=>drawStroke(st,false)); if(currentStroke) drawStroke(currentStroke,true);
    ctx.restore();
  }
  function drawStroke(st,active){
    if(!st || st.points.length<2) return;
    ctx.lineWidth=active?7:8; ctx.strokeStyle=active?"rgba(240,72,85,.95)":"rgba(25,168,91,.92)";
    ctx.beginPath(); ctx.moveTo(st.points[0].x,st.points[0].y); st.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
  }
  function clientToNatural(e){ const r=traceLayer.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*NATURAL_W, y:(e.clientY-r.top)/r.height*NATURAL_H}; }
  function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
  function getAudioCtx(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){return null;} } if(audioCtx.state==="suspended") audioCtx.resume().catch(()=>{}); return audioCtx; }
  function beep(freq=680,dur=.045,vol=.04){ const a=getAudioCtx(); if(!a)return; const o=a.createOscillator(),g=a.createGain(); o.frequency.value=freq; o.type="sine"; g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur); }
  function tick(){ const now=performance.now(); if(now-lastTick<80)return; lastTick=now; beep(620,.04,.03); }
  function playChime(){ try{ const a=chimeAudio.cloneNode(true); a.play().catch(()=>{ const f=new Audio(fallbackChime); f.play().catch(()=>beep(880,.15,.06)); }); }catch(_){ try{new Audio(fallbackChime).play();}catch(e){beep(880,.15,.06);} } }
  function clap(){ const a=getAudioCtx(); if(!a)return; for(let i=0;i<12;i++){ const start=a.currentTime+i*.055; const buffer=a.createBuffer(1,Math.floor(a.sampleRate*.06),a.sampleRate); const data=buffer.getChannelData(0); for(let n=0;n<data.length;n++) data[n]=(Math.random()*2-1)*Math.pow(1-n/data.length,2); const src=a.createBufferSource(),g=a.createGain(); src.buffer=buffer; g.gain.setValueAtTime(.04,start); g.gain.exponentialRampToValueAtTime(.001,start+.06); src.connect(g); g.connect(a.destination); src.start(start); src.stop(start+.06); } }
  function confetti(){ const colors=["#ff8f24","#f04855","#31b7ff","#20aa5d","#ffd24a","#7049c6"]; for(let i=0;i<42;i++){ const p=document.createElement("div"); p.className="confetti-piece"; p.style.left=Math.random()*100+"vw"; p.style.background=colors[Math.floor(Math.random()*colors.length)]; p.style.animationDelay=Math.random()*.35+"s"; document.body.appendChild(p); setTimeout(()=>p.remove(),2200); } }
  function voice(){ if(!("speechSynthesis" in window)) return null; const all=speechSynthesis.getVoices()||[]; const en=all.filter(v=>/^en/i.test(v.lang||"")); const names=["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"]; for(const name of names){ const v=en.find(x=>(x.name||"").toLowerCase().includes(name.toLowerCase())); if(v)return v; } return en.find(v=>/us|united states/i.test((v.lang||"")+(v.name||"")))||en[0]||all[0]||null; }
  function speak(text,done){ if(!("speechSynthesis" in window)){ if(done)done(); return; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=.9; u.pitch=1.14; u.volume=1; const v=voice(); if(v)u.voice=v; if(done){u.onend=done; u.onerror=done;} speechSynthesis.speak(u); }catch(_){ if(done)done(); } }
  function updateProgress(){
    const tracePct=Math.round(targets.reduce((s,t)=>s+t.percent,0)/targets.length); overallText.textContent=tracePct+"%"; overallFill.style.width=tracePct+"%";
    const done=targets.filter(t=>t.complete).length; const stars=done>=6?3:done>=4?2:done>=2?1:0; starsEl.textContent=stars?"★ ".repeat(stars).trim()+" "+"☆ ".repeat(3-stars).trim():"☆ ☆ ☆";
    targets.forEach((t,i)=>{ if(t.pctEl)t.pctEl.textContent=t.percent+"%"; if(t.mini){ t.mini.classList.toggle("done",t.complete); t.mini.classList.toggle("active",i===activeIndex&&!t.complete); } });
    if(done===6 && !finalCelebrated){ finalCelebrated=true; playChime(); clap(); confetti(); answerButtons.forEach(b=>b.classList.add("ready")); setStatus("Wonderful tracing! Now tap 25, 40, and 50 to circle the correct numbers."); speak("Wonderful tracing! Now tap twenty five, forty, and fifty to circle the correct numbers."); }
    saveProgress(tracePct, done===6 && answerButtons.every(b=>b.classList.contains("done")));
  }
  function markHits(p){
    const t=targets[activeIndex]; if(!t||t.complete)return;
    t.samples.forEach(s=>{ if(!s.hit && dist(p,s)<=HIT_RADIUS) s.hit=true; });
    t.percent=Math.min(100,Math.round(t.samples.filter(s=>s.hit).length/Math.max(1,t.samples.length)*100));
    if(t.percent>=Math.round(COMPLETE_RATIO*100)) completeTarget(t);
    else updateProgress();
  }
  function completeTarget(t){
    t.complete=true; t.percent=100; if(currentStroke){ strokes.push(currentStroke); currentStroke=null; }
    playChime(); const numberNames={"1":"one","5":"five","3":"three","0":"zero","4":"four"}; setStatus("Great! You traced " + t.label + "."); speak("Great! You traced " + (numberNames[t.label]||t.label) + ".");
    const next=targets.findIndex(x=>!x.complete); activeIndex = next>=0 ? next : targets.length; positionOverlays(); updateProgress(); redraw();
  }
  function pointerDown(e){
    const t=targets[activeIndex]; if(!t || t.complete) return; e.preventDefault(); getAudioCtx();
    const p=clientToNatural(e); const near=t.samples.some(s=>dist(p,s)<=START_RADIUS);
    if(!near){ setStatus("Start inside the glowing number box and follow the dotted digit."); beep(220,.08,.04); return; }
    drawing=true; currentStroke={target:t.id,points:[p]}; lastPoint=p; markHits(p); tick(); redraw(); try{traceLayer.setPointerCapture(e.pointerId);}catch(_){}
  }
  function pointerMove(e){ if(!drawing || !currentStroke) return; e.preventDefault(); const p=clientToNatural(e); if(!lastPoint || dist(p,lastPoint)>1.5){ currentStroke.points.push(p); lastPoint=p; markHits(p); tick(); redraw(); } }
  function pointerUp(e){ if(!drawing)return; drawing=false; if(currentStroke && currentStroke.points.length>1){ strokes.push(currentStroke); currentStroke=null; } redraw(); try{traceLayer.releasePointerCapture(e.pointerId);}catch(_){} }
  function clearAll(){
    strokes.length=0; currentStroke=null; finalCelebrated=false; activeIndex=0; answerButtons.forEach(b=>{b.classList.remove("done","wrong","ready");});
    targets.forEach(t=>{ t.samples.forEach(s=>s.hit=false); t.complete=false; t.percent=0; });
    setStatus("Trace 15, 30, and 40. Follow the dotted numbers carefully."); positionOverlays(); updateProgress(); redraw();
  }
  function setAnswerPositions(){ positionOverlays(); }
  function handleAnswer(btn){
    if(targets.some(t=>!t.complete)){ setStatus("Trace all dotted numbers first. Then circle the red answers."); speak("Trace all dotted numbers first. Then circle the red answers."); return; }
    if(btn.classList.contains("done")) return;
    btn.classList.add("done"); playChime(); const txt=btn.dataset.answer; setStatus("Correct! You circled " + txt + "."); speak("Correct! You circled " + txt + ".");
    if(answerButtons.every(b=>b.classList.contains("done"))){ clap(); confetti(); setStatus("Excellent! 10 and 15 make 25, 10 and 30 make 40, and 10 and 40 make 50."); speak("Excellent! Ten and fifteen make twenty five. Ten and thirty make forty. Ten and forty make fifty. You are a measurement math superstar!"); saveProgress(100,true); }
  }
  function readInstructions(){ speak("Welcome to Adding to Ten. First, trace the dotted number fifteen. Then trace thirty and forty. After tracing, tap the red answers twenty five, forty, and fifty to circle them. Listen, trace, and have fun!"); }
  function saveProgress(score, completed){
    const payload={pageId:PAGE_ID,file:PAGE_ID+".html",level:"A",week:2,type:"tracing",activityType:"lesson",score:Math.round(score),tracing:Math.round(score),completed:!!completed,stars:score>=95?3:score>=70?2:score>=35?1:0,skills:{reading:1,writing:score>=95?3:score>0?1:0,listening:1,math:1},savedAt:new Date().toISOString(),ts:Date.now()};
    try{ const store=JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS")||"{}"); store[payload.pageId]=payload; localStorage.setItem("GP_EIS_ACTIVITY_RESULTS",JSON.stringify(store)); localStorage.setItem("GP_EIS_LAST_FILE",payload.file); localStorage.setItem("gpLatestProgress",JSON.stringify(payload)); window.dispatchEvent(new CustomEvent("gp-progress-update",{detail:payload})); }catch(_){}
  }
  document.getElementById("homeBtn").addEventListener("click",()=>location.href=HOME_PAGE);
  document.getElementById("prevBtn").addEventListener("click",()=>location.href=PREVIOUS_PAGE);
  document.getElementById("nextBtn").addEventListener("click",()=>location.href=NEXT_PAGE);
  document.getElementById("readBtn").addEventListener("click",readInstructions);
  document.getElementById("clearBtn").addEventListener("click",()=>{clearAll(); speak("Cleared. Start tracing again.");});
  document.getElementById("cheerBtn").addEventListener("click",()=>{getAudioCtx(); playChime(); clap(); confetti(); setStatus("You can do it! Keep tracing."); speak("You can do it! Keep tracing.");});
  answerButtons.forEach(b=>b.addEventListener("click",()=>handleAnswer(b)));
  traceLayer.addEventListener("pointerdown",pointerDown);
  traceLayer.addEventListener("pointermove",pointerMove);
  traceLayer.addEventListener("pointerup",pointerUp);
  traceLayer.addEventListener("pointercancel",pointerUp);
  traceLayer.addEventListener("pointerleave",pointerUp);
  window.addEventListener("resize",resizeCanvas); if(window.visualViewport) window.visualViewport.addEventListener("resize",resizeCanvas);
  if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{};
  window.addEventListener("beforeunload",()=>{try{speechSynthesis.cancel();}catch(_){}});
  prepareTargets(); posterImg.addEventListener("load",()=>{resizeCanvas();clearAll();},{once:true});
  window.addEventListener("load",()=>{resizeCanvas();clearAll();setTimeout(readInstructions,650);},{once:true});
})();
</script>
