<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Adding to 10 - Trace the Number Digits</title>
<style>
  :root{
    --ink:#2f2f34;
    --paper:#fff8ee;
    --card:#ffffff;
    --red:#f34e5d;
    --blue:#0794b3;
    --deep-blue:#345fbb;
    --green:#1fa65a;
    --orange:#ff9800;
    --gold:#ffd24a;
    --purple:#6848b8;
    --soft:#eef5ff;
    --shadow:0 18px 36px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#eadfd2 1px,transparent 1px),linear-gradient(90deg,#eadfd2 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{
    width:min(1000px,100%);
    background:rgba(255,255,255,.98);
    border-radius:22px;
    padding:10px 10px 14px;
    box-shadow:var(--shadow);
  }
  .poster-wrap{
    position:relative;
    width:min(954px,100%);
    margin:0 auto;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    touch-action:none;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    max-width:100%;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  canvas.guide-layer,canvas.trace-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:transparent;
  }
  canvas.guide-layer{z-index:4;pointer-events:none;}
  canvas.trace-layer{z-index:5;touch-action:none;cursor:crosshair;}
  .panel{
    width:min(954px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff7fb);
    border:3px solid rgba(52,95,187,.22);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }
  .progress-title{
    text-align:center;
    font-size:clamp(1rem,2.5vw,1.28rem);
    font-weight:1000;
    color:#345fbb;
    margin-bottom:8px;
  }
  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-bar{
    flex:1;
    height:18px;
    border-radius:999px;
    background:#e8eef8;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#31b7ff,#83e79f);
    transition:width .12s ease-out;
  }
  .overall-text{min-width:64px;text-align:right;font-weight:1000;color:#175ca8;font-size:1.05rem;}
  .mini-grid{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:7px;
    margin-top:9px;
  }
  .mini{
    background:#fff;
    border:2px solid #e7edf8;
    border-radius:12px;
    text-align:center;
    padding:6px 4px;
    font-weight:1000;
    font-size:.84rem;
    color:#444;
    min-height:38px;
  }
  .mini b{color:#f2475b;}
  .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .stars{
    text-align:center;
    min-height:1.25em;
    margin-top:6px;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
  }
  .status{
    min-height:1.45em;
    text-align:center;
    margin-top:7px;
    font-size:clamp(.98rem,2.5vw,1.18rem);
    font-weight:1000;
    color:var(--purple);
  }
  .buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .btn{
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
  }
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5f;color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .btn.mic{background:#ffffff;color:#0a5f7a;border:3px solid #85dce8;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;}
  .mic-badge{font-size:1.5rem;line-height:1;}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .mini-grid{grid-template-columns:repeat(3,1fr);}
    .btn{font-size:.85rem;padding:9px 12px;}
    .btn.mic{padding:6px 10px;}
  }
</style>
</head>

  chimeAudio.addEventListener("error", () => {
    if(!triedEmbeddedChime){
      triedEmbeddedChime = true;
      chimeAudio.src = CHIME_FALLBACK;
      chimeAudio.load();
    }
  });

  const targets = [
    {id:"top-circle-3", label:"top 3", type:"3", box:{x:303,y:502,w:55,h:50}, prompt:"Trace the first 3."},
    {id:"top-box-7", label:"top 7", type:"7", box:{x:300,y:648,w:62,h:50}, prompt:"Trace the top 7."},
    {id:"sentence-3", label:"3", type:"3", box:{x:205,y:722,w:55,h:56}, prompt:"Trace 3 centimeters."},
    {id:"sentence-7", label:"7", type:"7", box:{x:408,y:723,w:55,h:56}, prompt:"Trace 7 centimeters."},
    {id:"bottom-circle-10", label:"top 10", type:"10", box:{x:330,y:942,w:68,h:52}, prompt:"Trace 10 centimeters."},
    {id:"bottom-box-7", label:"bottom 7", type:"7", box:{x:331,y:1090,w:67,h:54}, prompt:"Trace the bottom 7."},
    {id:"sentence-10", label:"10", type:"10", box:{x:201,y:1166,w:58,h:57}, prompt:"Trace the 10 in the sentence."},
    {id:"sentence-bottom-7", label:"7", type:"7", box:{x:408,y:1167,w:55,h:56}, prompt:"Trace the last 7."},
    {id:"answer-17", label:"17", type:"17", box:{x:574,y:1018,w:66,h:58}, prompt:"Trace 17 centimeters."}
  ];

  let dpr = 1, sx = 1, sy = 1;
  let drawing = false;
  let activeTarget = null;
  let lastPoint = null;
  let currentStroke = null;
  let finalCelebrated = false;
  let lastTick = 0;
  let audioCtx = null;
  let introSpoken = false;
  const strokes = [];

  function setStatus(text){ statusEl.textContent = text || ""; }

  function digitPath(type, b){
    const x=b.x, y=b.y, w=b.w, h=b.h;
    if(type === "1"){
      return [
        `M ${x+w*.44} ${y+h*.25} L ${x+w*.60} ${y+h*.10}`,
        `M ${x+w*.60} ${y+h*.10} L ${x+w*.60} ${y+h*.88}`,
        `M ${x+w*.39} ${y+h*.88} L ${x+w*.78} ${y+h*.88}`
      ].join(" ");
    }
    if(type === "0"){
      return [
        `M ${x+w*.50} ${y+h*.08}`,
        `C ${x+w*.18} ${y+h*.08}, ${x+w*.10} ${y+h*.30}, ${x+w*.10} ${y+h*.50}`,
        `C ${x+w*.10} ${y+h*.72}, ${x+w*.20} ${y+h*.92}, ${x+w*.50} ${y+h*.92}`,
        `C ${x+w*.80} ${y+h*.92}, ${x+w*.90} ${y+h*.72}, ${x+w*.90} ${y+h*.50}`,
        `C ${x+w*.90} ${y+h*.28}, ${x+w*.80} ${y+h*.08}, ${x+w*.50} ${y+h*.08}`
      ].join(" ");
    }
    if(type === "3"){
      return [
        `M ${x+w*.24} ${y+h*.16}`,
        `C ${x+w*.92} ${y+h*.04}, ${x+w*.96} ${y+h*.42}, ${x+w*.50} ${y+h*.48}`,
        `C ${x+w*.96} ${y+h*.50}, ${x+w*.93} ${y+h*.94}, ${x+w*.22} ${y+h*.82}`
      ].join(" ");
    }
    if(type === "7"){
      return [
        `M ${x+w*.18} ${y+h*.18} L ${x+w*.86} ${y+h*.18}`,
        `M ${x+w*.86} ${y+h*.18} L ${x+w*.38} ${y+h*.88}`
      ].join(" ");
    }
    return "";
  }

  function makePaths(t){
    const b = t.box;
    if(t.type === "10"){
      const b1 = {x:b.x, y:b.y, w:b.w*.42, h:b.h};
      const b0 = {x:b.x+b.w*.36, y:b.y, w:b.w*.64, h:b.h};
      return [digitPath("1", b1), digitPath("0", b0)];
    }
    if(t.type === "17"){
      const b1 = {x:b.x, y:b.y, w:b.w*.42, h:b.h};
      const b7 = {x:b.x+b.w*.36, y:b.y, w:b.w*.64, h:b.h};
      return [digitPath("1", b1), digitPath("7", b7)];
    }
    return [digitPath(t.type, b)];
  }

  function sampleSvgPath(d, step){
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    const len = p.getTotalLength();
    const pts = [];
    if(!isFinite(len) || len <= 0) return pts;
    const count = Math.max(10, Math.ceil(len / step));
    for(let i=0;i<=count;i++){
      const q = p.getPointAtLength((i / count) * len);
      pts.push({x:q.x, y:q.y, hit:false});
    }
    return pts;
  }

  function prepareTargets(){
    miniGrid.innerHTML = "";
    targets.forEach((t, index) => {
      t.paths = makePaths(t);
      t.samples = [];
      t.paths.forEach(d => { t.samples.push(...sampleSvgPath(d, 6)); });
      t.percent = 0;
      t.complete = false;
      const mini = document.createElement("div");
      mini.className = "mini";
      mini.innerHTML = `<b>${t.label}</b><br><span>0%</span>`;
      t.boxEl = mini;
      t.pctEl = mini.querySelector("span");
      miniGrid.appendChild(mini);
    });
  }

  function resizeCanvases(){
    const rect = posterWrap.getBoundingClientRect();
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    sx = rect.width / NATURAL_W;
    sy = rect.height / NATURAL_H;
    [guideLayer, traceLayer].forEach(canvas => {
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
    });
    gctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    tctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    redrawAll();
  }

  function clearCanvas(ctx, canvas){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.restore();
  }

  function drawPath(ctx, d){
    const p = new Path2D(d);
    ctx.stroke(p);
  }

  function drawGuide(){
    clearCanvas(gctx, guideLayer);
    gctx.save();
    gctx.lineCap = "round";
    gctx.lineJoin = "round";
    targets.forEach(t => {
      const b = t.box;
      if(t === activeTarget && !t.complete){
        gctx.save();
        gctx.fillStyle = "rgba(255,225,70,.18)";
        gctx.strokeStyle = "rgba(255,80,95,.95)";
        gctx.lineWidth = 4;
        gctx.setLineDash([8,6]);
        roundedRect(gctx, b.x-8, b.y-8, b.w+16, b.h+16, 14);
        gctx.fill();
        gctx.stroke();
        gctx.restore();
      }

      gctx.save();
      gctx.lineWidth = t.complete ? 5 : 4;
      gctx.strokeStyle = t.complete ? "rgba(30,166,90,.95)" : (t === activeTarget ? "rgba(255,48,77,.95)" : "rgba(40,40,40,.55)");
      gctx.setLineDash(t.complete ? [] : [2,11]);
      t.paths.forEach(d => drawPath(gctx, d));
      gctx.restore();

      if(t === activeTarget && !t.complete && t.samples.length){
        const start = t.samples[0];
        const end = t.samples[t.samples.length - 1];
        dot(gctx, start.x, start.y, 7, "#19a85b", "#ffffff");
        dot(gctx, end.x, end.y, 7, "#f13a52", "#ffffff");
      }
    });
    gctx.restore();
  }

  function roundedRect(ctx, x, y, w, h, r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function dot(ctx, x, y, r, fill, stroke){
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }

  function drawTrace(){
    clearCanvas(tctx, traceLayer);
    tctx.save();
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    tctx.lineWidth = 16;
    tctx.strokeStyle = "rgba(0,154,190,.76)";
    strokes.forEach(stroke => {
      if(stroke.points.length < 2) return;
      tctx.beginPath();
      tctx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for(let i=1;i<stroke.points.length;i++) tctx.lineTo(stroke.points[i].x, stroke.points[i].y);
      tctx.stroke();
    });
    tctx.restore();
  }

  function redrawAll(){
    drawGuide();
    drawTrace();
  }

  function pointerToNatural(evt){
    const rect = posterWrap.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left) / rect.width * NATURAL_W,
      y: (evt.clientY - rect.top) / rect.height * NATURAL_H
    };
  }

  function dist(a,b){
    const dx = a.x-b.x, dy = a.y-b.y;
    return Math.hypot(dx,dy);
  }

  function nearestDistanceToTarget(pt, t){
    let best = Infinity;
    for(const s of t.samples){
      const d = Math.hypot(pt.x - s.x, pt.y - s.y);
      if(d < best) best = d;
    }
    return best;
  }

  function chooseActiveTarget(pt){
    let best = null, bestD = Infinity;
    for(const t of targets){
      if(t.complete) continue;
      const d = nearestDistanceToTarget(pt, t);
      if(d < bestD){ bestD = d; best = t; }
    }
    if(best && bestD < HIT_RADIUS * 2.4){
      activeTarget = best;
      setStatus(best.prompt || `Trace ${best.label}.`);
      drawGuide();
      return true;
    }
    return !!activeTarget;
  }

  function markSamplesNear(pt){
    if(!activeTarget || activeTarget.complete) return false;
    let any = false;
    for(const s of activeTarget.samples){
      if(!s.hit && Math.hypot(pt.x - s.x, pt.y - s.y) <= HIT_RADIUS){
        s.hit = true;
        any = true;
      }
    }
    if(any) updateProgress();
    return any;
  }

  function updateProgress(){
    targets.forEach(t => {
      const hit = t.samples.filter(s => s.hit).length;
      t.percent = t.samples.length ? Math.min(100, Math.round((hit / (t.samples.length * COMPLETE_RATIO)) * 100)) : 0;
      if(t.pctEl) t.pctEl.textContent = `${t.percent}%`;
      if(t.percent >= 100 && !t.complete){
        t.complete = true;
        if(t.boxEl) t.boxEl.classList.add("done");
        setStatus(`Great tracing! You finished ${t.label}.`);
        playChime();
        speak(randomCheer(t.label));
        activeTarget = targets.find(item => !item.complete) || null;
        drawGuide();
      }
    });
    const overall = Math.round(targets.reduce((sum,t)=>sum+t.percent,0) / targets.length);
    overallText.textContent = overall + "%";
    overallFill.style.width = overall + "%";
    starsEl.textContent = overall >= 95 ? "⭐⭐⭐" : overall >= 70 ? "⭐⭐" : overall >= 35 ? "⭐" : "";
    saveProgress(overall, targets.every(t => t.complete));
    if(targets.every(t => t.complete) && !finalCelebrated){
      finalCelebrated = true;
      setTimeout(() => {
        playChime();
        clap();
        confetti();
        setStatus("Excellent! 3 centimeters and 7 centimeters make 10 centimeters. 10 centimeters and 7 centimeters make 17 centimeters.");
        speak("Excellent work! You completed adding to ten. Three centimeters and seven centimeters make ten centimeters. Ten centimeters and seven centimeters make seventeen centimeters.");
      }, 350);
    }
  }

  function pointerDown(evt){
    evt.preventDefault();
    getAudioCtx();
    if(!introSpoken){ introSpoken = true; setTimeout(readInstructions, 80); }
    const pt = pointerToNatural(evt);
    chooseActiveTarget(pt);
    drawing = true;
    lastPoint = pt;
    currentStroke = {points:[pt]};
    strokes.push(currentStroke);
    try{ traceLayer.setPointerCapture(evt.pointerId); }catch(_){}
  }

  function pointerMove(evt){
    if(!drawing || !currentStroke) return;
    evt.preventDefault();
    const pt = pointerToNatural(evt);
    const moved = lastPoint ? dist(pt,lastPoint) : 0;
    if(moved < 1.8) return;
    chooseActiveTarget(pt);
    currentStroke.points.push(pt);
    lastPoint = pt;
    const ok = markSamplesNear(pt);
    drawTrace();
    if(ok) playTraceTick();
  }

  function pointerUp(evt){
    if(!drawing) return;
    evt.preventDefault();
    drawing = false;
    lastPoint = null;
    currentStroke = null;
    try{ traceLayer.releasePointerCapture(evt.pointerId); }catch(_){}
    if(activeTarget && !activeTarget.complete){
      setStatus(`${activeTarget.prompt} Keep going. You have ${activeTarget.percent}%.`);
    }
  }

  function getAudioCtx(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }catch(_){ return null; }
  }

  function playTraceTick(){
    const now = Date.now();
    if(now - lastTick < 70) return;
    lastTick = now;
    const ctx = getAudioCtx();
    if(!ctx) return;
    try{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(740, ctx.currentTime);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.035, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.07);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    }catch(_){}
  }

  function playChime(){
    try{
      chimeAudio.pause();
      chimeAudio.currentTime = 0;
      const p = chimeAudio.play();
      if(p && typeof p.catch === "function") p.catch(() => fallbackChime());
    }catch(_){ fallbackChime(); }
  }

  function fallbackChime(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    [523,659,784,1046].forEach((freq,i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.08;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.07, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.24);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.28);
    });
  }

  function clap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    try{
      for(let i=0;i<3;i++){
        const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let j=0;j<data.length;j++) data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j/data.length, 2.4);
        const src = ctx.createBufferSource();
        const gain = ctx.createGain();
        gain.gain.value = 0.12;
        src.buffer = buffer;
        src.connect(gain).connect(ctx.destination);
        src.start(ctx.currentTime + i * 0.13);
      }
    }catch(_){}
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    const preferred = voices.find(v => /en-US/i.test(v.lang) && /(female|zira|aria|jenny|samantha|google us english|natural)/i.test(v.name));
    return preferred || voices.find(v => /en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
  }

  function speak(text, opts={}){
    if(!("speechSynthesis" in window)) return;
    try{
      const utter = new SpeechSynthesisUtterance(text);
      const voice = pickVoice();
      if(voice) utter.voice = voice;
      utter.lang = "en-US";
      utter.rate = opts.rate || 0.88;
      utter.pitch = opts.pitch || 1.12;
      utter.volume = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }catch(_){}
  }

  function readInstructions(){
    introSpoken = true;
    setStatus("Listen, then trace the number digits in the red boxes.");
    speak("Hello! This is Adding to ten. First, look at the rulers. Trace the number digits in the red boxes and circles. Trace slowly on the dotted lines. Three centimeters and seven centimeters make ten centimeters. Ten centimeters and seven centimeters make seventeen centimeters.");
  }

  function randomCheer(label){
    const cheers = [
      `Wonderful! You traced ${label}.`,
      `Great job! ${label} is complete.`,
      `Nice tracing! You finished ${label}.`,
      `Excellent! Keep going.`
    ];
    return cheers[Math.floor(Math.random() * cheers.length)];
  }

  function bubbleTalk(){
    getAudioCtx();
    playChime();
    setStatus("Mic time: Say, I have many rulers.");
    speak("I have many rulers. Now you say it. I have many rulers.");
  }

  function confetti(){
    const colors = ["#f34e5d", "#31b7ff", "#ffd24a", "#83e79f", "#ff9800", "#a78bfa"];
    for(let i=0;i<42;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * .4 + "s";
      piece.style.transform = `rotate(${Math.random()*180}deg)`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2300);
    }
  }

  function clearAll(silent=false){
    strokes.length = 0;
    finalCelebrated = false;
    targets.forEach(t => {
      t.samples.forEach(s => s.hit = false);
      t.percent = 0;
      t.complete = false;
      if(t.pctEl) t.pctEl.textContent = "0%";
      if(t.boxEl) t.boxEl.classList.remove("done");
    });
    activeTarget = targets[0];
    overallText.textContent = "0%";
    overallFill.style.width = "0%";
    starsEl.textContent = "";
    setStatus("Trace each dotted number carefully.");
    redrawAll();
    saveProgress(0,false);
    if(!silent) speak("Cleared. Start tracing again.");
  }

  function saveProgress(score, completed){
    const payload = {
      pageId,
      file:pageId + ".html",
      level:"A",
      week:1,
      type:"tracing",
      activityType:"lesson",
      lesson:"Adding to 10",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0,
      skills:{reading:1,writing:score >= 95 ? 3 : score > 0 ? 1 : 0,listening:1,speaking:0},
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(() => {});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(() => {});
    }catch(_){}
  }

  prepareTargets();
  activeTarget = targets[0];

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);
  readBtn.addEventListener("click", readInstructions);
  micBtn.addEventListener("click", bubbleTalk);
  clearBtn.addEventListener("click", () => clearAll(false));
  cheerBtn.addEventListener("click", () => { getAudioCtx(); playChime(); clap(); confetti(); setStatus("You can do it! Great job!"); speak("You can do it! Great job!"); });
  homeBtn.addEventListener("click", () => { window.location.href = homeHref; });
  prevBtn.addEventListener("click", () => { window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { window.location.href = nextHref; });

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try{ window.speechSynthesis.cancel(); }catch(_){} });

  posterImg.addEventListener("load", () => { resizeCanvases(); clearAll(true); }, {once:true});
  window.addEventListener("load", () => {
    resizeCanvases();
    clearAll(true);
    setTimeout(readInstructions, 750);
  }, {once:true});
})();
</script>
</body>
