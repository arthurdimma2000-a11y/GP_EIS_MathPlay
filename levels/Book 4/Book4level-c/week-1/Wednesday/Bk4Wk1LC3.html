<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>My Body - Measuring the Body</title>
<style>
  :root {
    --ink:#25232a;
    --paper:#fffaf2;
    --card:#ffffff;
    --red:#f24b5d;
    --blue:#00a0bd;
    --deep:#17466b;
    --green:#13a856;
    --gold:#ffd34e;
    --soft:#fff3f5;
    --shadow:0 16px 36px rgba(0,0,0,.13);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);}
  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    overflow-x:hidden;
    background-image:
      linear-gradient(#ebe3d8 1px,transparent 1px),
      linear-gradient(90deg,#ebe3d8 1px,transparent 1px);
    background-size:26px 26px;
  }
  .lesson-card{
    width:min(1010px,100%);
    background:var(--card);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:10px 10px 16px;
  }
  .top-row{
    width:min(979px,100%);
    margin:0 auto 8px;
    display:flex;
    gap:10px;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
  }
  .page-name{
    margin:0;
    font-size:clamp(1.2rem,3.2vw,2.2rem);
    color:#ef4758;
    font-weight:1000;
    text-shadow:0 2px 0 #fff;
  }
  .nav-small{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .poster-wrap{
    position:relative;
    width:min(979px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:visible;
    background:#fff;
    touch-action:none;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .trace-zone{
    position:absolute;
    z-index:10;
    touch-action:none;
    cursor:crosshair;
    background:rgba(255,255,255,0.001);
    border-radius:10px;
  }
  .trace-zone canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }
  .trace-zone.active{
    outline:3px solid rgba(0,160,189,.35);
    box-shadow:0 0 0 5px rgba(255,211,78,.22);
  }
  .trace-zone.done{
    outline:4px solid rgba(19,168,86,.45);
    box-shadow:0 0 14px rgba(19,168,86,.35);
  }

  /* Number boxes on the original poster: 45, 55, and 17 */
  .zone-arm{left:48.35%;top:37.18%;width:7.45%;height:5.36%;}
  .zone-leg{left:47.78%;top:62.73%;width:7.45%;height:5.36%;}
  .zone-foot{left:49.30%;top:88.17%;width:7.30%;height:5.28%;}

  .controls-panel{
    width:min(979px,100%);
    margin:12px auto 0;
    border:3px solid rgba(242,75,93,.28);
    border-radius:20px;
    padding:12px;
    background:linear-gradient(180deg,#fff,#fff7fa);
    box-shadow:0 8px 20px rgba(0,0,0,.08);
  }
  .progress-title{
    margin:0 0 8px;
    text-align:center;
    color:#ef4758;
    font-size:clamp(1rem,2.7vw,1.35rem);
    font-weight:1000;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .progress-bar{
    flex:1;
    height:18px;
    border-radius:999px;
    background:#ffe1e7;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.15);
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#00a0bd,#73e3a1,#ffd34e);
    transition:width .12s linear;
  }
  .progress-percent{
    min-width:62px;
    text-align:right;
    font-size:1.05rem;
    color:#17466b;
    font-weight:1000;
  }
  .mini-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:9px;
  }
  .mini-card{
    background:#fff;
    border:2px solid #ffd2da;
    border-radius:14px;
    padding:8px 10px;
    text-align:center;
    font-weight:1000;
  }
  .mini-card span{color:#f2475b;}
  .status{
    min-height:1.5em;
    margin-top:8px;
    text-align:center;
    color:#6543b8;
    font-size:clamp(.96rem,2.4vw,1.14rem);
    font-weight:1000;
  }
  .button-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  button,.link-btn{
    border:none;
    border-radius:999px;
    padding:10px 16px;
    min-height:44px;
    font-size:.96rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.16);
    transition:transform .1s ease,filter .1s ease;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  button:hover,.link-btn:hover{filter:brightness(1.04);}
  button:active,.link-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn-home{background:#fff0f4;color:#17466b;border:2px solid #ffd2da;}
  .btn-prev,.btn-next{background:#ff8a5b;color:#fff;}
  .btn-clear{background:#dfeaff;color:#1f3b6b;}
  .btn-read{background:#f6da7b;color:#8b5a00;}
  .btn-mic{
    background:#e7f9ff;
    color:#0a7190;
    border:2px solid #bcecff;
  }
  .btn-mic svg{width:25px;height:25px;display:block;}
  .footer-note{
    margin-top:8px;
    text-align:center;
    color:#666;
    font-size:.9rem;
    font-weight:800;
  }
  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    pointer-events:none;
    z-index:9999;
    animation:fall 1.65s linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(105vh) rotate(520deg);opacity:.1;}
  }
  @media(max-width:620px){
    body{padding:6px;}
    .lesson-card{border-radius:16px;padding:6px 6px 12px;}
    .top-row{justify-content:center;text-align:center;}
    .mini-grid{grid-template-columns:1fr;}
    button,.link-btn{font-size:.86rem;padding:9px 12px;}
    .progress-row{gap:6px;}
  }
</style>
</head>

        [[72,16],[53,16],[53,45],[68,45],[76,55],[76,71],[67,84],[50,84]]
      ]
    },
    {
      label:"55",
      bodyPart:"leg",
      sentence:"My leg is 55 centimeters long.",
      doneLine:"Wonderful! My leg is 55 centimeters long.",
      paths:[
        [[39,16],[20,16],[20,45],[35,45],[44,55],[44,72],[35,84],[18,84]],
        [[77,16],[58,16],[58,45],[73,45],[82,55],[82,72],[73,84],[56,84]]
      ]
    },
    {
      label:"17",
      bodyPart:"foot",
      sentence:"My foot is 17 centimeters long.",
      doneLine:"Excellent! My foot is 17 centimeters long.",
      paths:[
        [[36,18],[48,11],[48,86]],
        [[58,17],[82,17],[66,86]]
      ]
    }
  ];

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function getAudioCtx() {
    if (!AudioContextClass) return null;
    if (!audioCtx) audioCtx = new AudioContextClass();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function tracingTick() {
    const now = performance.now();
    if (now - lastTick < 120) return;
    lastTick = now;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.07);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  }

  function playChime() {
    const local = new Audio("chime.mp3");
    local.volume = 0.72;
    local.onerror = () => {
      const fallback = new Audio(CHIME_FALLBACK);
      fallback.volume = 0.72;
      fallback.play().catch(() => {});
    };
    local.play().catch(() => {
      const fallback = new Audio(CHIME_FALLBACK);
      fallback.volume = 0.72;
      fallback.play().catch(() => {});
    });
  }

  function playApplause() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    for (let i = 0; i < 10; i++) {
      const buffer = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * 0.055)), ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < data.length; j++) data[j] = (Math.random() * 2 - 1) * (1 - j / data.length);
      const source = ctx.createBufferSource();
      const gain = ctx.createGain();
      const t = ctx.currentTime + i * 0.055;
      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      source.buffer = buffer;
      source.connect(gain).connect(ctx.destination);
      source.start(t);
      source.stop(t + 0.08);
    }
  }

  function chooseVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    const preferred = [
      "Samantha","Jenny","Aria","Zira","Google US English Female",
      "Microsoft Jenny Online","Microsoft Aria Online"
    ];
    return voices.find(v => preferred.some(name => v.name.toLowerCase().includes(name.toLowerCase()))) ||
           voices.find(v => /female|woman|girl|samantha|jenny|aria|zira/i.test(v.name) && /en-US/i.test(v.lang)) ||
           voices.find(v => /en-US/i.test(v.lang)) ||
           voices.find(v => /^en/i.test(v.lang)) ||
           null;
  }

  function speak(text, opts={}) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voice = chooseVoice();
    if (voice) u.voice = voice;
    u.lang = "en-US";
    u.rate = opts.rate || 0.88;
    u.pitch = opts.pitch || 1.12;
    u.volume = opts.volume || 1;
    window.speechSynthesis.speak(u);
  }

  function readInstructions() {
    getAudioCtx();
    speak("Hello! Today we are learning about my body. Rulers can measure. Trace the dotted number 45 for the arm. Then trace 55 for the leg. Then trace 17 for the foot. Follow the dots slowly until the progress bar reaches one hundred percent.");
    setStatus("Start by tracing 45 in the arm box.");
  }

  function sayPosterLine() {
    playChime();
    speak("I can measure my body. I have an arm. I have a leg. I have a foot. Rulers can measure.");
    setStatus("Listen and repeat: I can measure my body.");
  }

  function celebrate(text, final=false) {
    playChime();
    speak(text, {rate:0.9, pitch:1.2});
    if (final) {
      playApplause();
      launchConfetti();
    }
  }

  function launchConfetti() {
    const colors = ["#f24b5d","#ffd34e","#00a0bd","#73e3a1","#ff8a5b","#9b6cff"];
    for (let i = 0; i < 50; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.35) + "s";
      piece.style.transform = "rotate(" + (Math.random() * 180) + "deg)";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2200);
    }
  }

  function distPointToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    if (dx === 0 && dy === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    const x = ax + t * dx;
    const y = ay + t * dy;
    return Math.hypot(px - x, py - y);
  }

  function makeSamples(paths, w, h) {
    const out = [];
    paths.forEach(poly => {
      for (let i = 0; i < poly.length - 1; i++) {
        const a = poly[i], b = poly[i+1];
        const ax = a[0] / 100 * w, ay = a[1] / 100 * h;
        const bx = b[0] / 100 * w, by = b[1] / 100 * h;
        const len = Math.max(1, Math.hypot(bx - ax, by - ay));
        const steps = Math.max(3, Math.ceil(len / 4));
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          out.push({x: ax + (bx - ax) * t, y: ay + (by - ay) * t});
        }
      }
    });
    return out;
  }

  class TracePad {
    constructor(el, task, index) {
      this.el = el;
      this.canvas = el.querySelector("canvas");
      this.ctx = this.canvas.getContext("2d");
      this.task = task;
      this.index = index;
      this.samples = [];
      this.covered = [];
      this.percent = 0;
      this.done = false;
      this.isDown = false;
      this.last = null;
      this.strokeSegments = [];
      this.bind();
      this.resize();
    }

    bind() {
      this.el.addEventListener("pointerdown", e => this.pointerDown(e));
      this.el.addEventListener("pointermove", e => this.pointerMove(e));
      this.el.addEventListener("pointerup", e => this.pointerUp(e));
      this.el.addEventListener("pointercancel", e => this.pointerUp(e));
      this.el.addEventListener("lostpointercapture", e => this.pointerUp(e));
    }

    resize() {
      const rect = this.canvas.getBoundingClientRect();
      this.w = Math.max(1, rect.width);
      this.h = Math.max(1, rect.height);
      const dpr = window.devicePixelRatio || 1;
      this.canvas.width = Math.round(this.w * dpr);
      this.canvas.height = Math.round(this.h * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const oldCoveredRatio = this.percent;
      this.samples = makeSamples(this.task.paths, this.w, this.h);
      this.covered = new Array(this.samples.length).fill(false);
      this.strokeSegments = [];
      this.percent = 0;
      if (oldCoveredRatio > 0) {
        /* If the screen changes size, the child can continue cleanly from the new layout. */
        updateOverall();
      }
      this.redraw();
    }

    getPoint(e) {
      const r = this.canvas.getBoundingClientRect();
      return {x:e.clientX - r.left, y:e.clientY - r.top};
    }

    pointerDown(e) {
      getAudioCtx();
      this.el.setPointerCapture(e.pointerId);
      this.isDown = true;
      this.last = this.getPoint(e);
      this.el.classList.add("active");
      this.markNear(this.last, this.last);
      this.redraw();
      updateOverall();
      e.preventDefault();
    }

    pointerMove(e) {
      if (!this.isDown) return;
      const p = this.getPoint(e);
      const near = this.isNearPath(p);
      if (near) {
        this.strokeSegments.push([this.last, p]);
        tracingTick();
      }
      this.markNear(this.last, p);
      this.last = p;
      this.redraw();
      updateOverall();
      e.preventDefault();
    }

    pointerUp(e) {
      if (!this.isDown) return;
      this.isDown = false;
      this.el.classList.remove("active");
      this.last = null;
      this.checkDone();
      e.preventDefault();
    }

    isNearPath(p) {
      const tol = Math.max(12, Math.min(this.w, this.h) * 0.19);
      return this.samples.some(s => Math.hypot(s.x - p.x, s.y - p.y) <= tol);
    }

    markNear(a, b) {
      const tol = Math.max(12, Math.min(this.w, this.h) * 0.19);
      let changed = false;
      for (let i = 0; i < this.samples.length; i++) {
        if (this.covered[i]) continue;
        const s = this.samples[i];
        const d = distPointToSegment(s.x, s.y, a.x, a.y, b.x, b.y);
        if (d <= tol) {
          this.covered[i] = true;
          changed = true;
        }
      }
      if (changed) {
        const coveredCount = this.covered.filter(Boolean).length;
        this.percent = Math.min(100, Math.round(coveredCount / this.covered.length * 100));
      }
    }

    checkDone() {
      if (!this.done && this.percent >= 88) {
        this.done = true;
        this.percent = 100;
        this.el.classList.add("done");
        miniEls[this.index].textContent = "100%";
        celebrate(this.task.doneLine);
        const next = pads.find(p => !p.done);
        if (next) {
          pads.forEach(p => p.el.classList.remove("active"));
          next.el.classList.add("active");
          setStatus("Great! Now trace " + next.task.label + " for the " + next.task.bodyPart + ".");
        } else {
          updateOverall();
          finishAll();
        }
      }
    }

    redraw() {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, this.w, this.h);

      /* Soft invisible guide made visible only a little, so the original poster is not changed. */
      ctx.save();
      ctx.lineWidth = Math.max(2.5, Math.min(this.w, this.h) * 0.045);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.setLineDash([2, 7]);
      ctx.strokeStyle = "rgba(23,70,107,.16)";
      this.task.paths.forEach(poly => {
        ctx.beginPath();
        poly.forEach((pt, i) => {
          const x = pt[0] / 100 * this.w;
          const y = pt[1] / 100 * this.h;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
      ctx.restore();

      ctx.save();
      ctx.lineWidth = Math.max(4, Math.min(this.w, this.h) * 0.075);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(0,143,174,.86)";
      this.strokeSegments.forEach(seg => {
        ctx.beginPath();
        ctx.moveTo(seg[0].x, seg[0].y);
        ctx.lineTo(seg[1].x, seg[1].y);
        ctx.stroke();
      });
      ctx.restore();
    }

    clear() {
      this.percent = 0;
      this.done = false;
      this.covered = new Array(this.samples.length).fill(false);
      this.strokeSegments = [];
      this.el.classList.remove("done","active");
      this.redraw();
    }
  }

  const pads = Array.from(document.querySelectorAll(".trace-zone")).map((el, i) => new TracePad(el, tasks[i], i));

  function updateOverall() {
    let total = 0;
    pads.forEach((p, i) => {
      total += p.percent;
      miniEls[i].textContent = p.percent + "%";
    });
    const avg = Math.round(total / pads.length);
    progressFill.style.width = avg + "%";
    progressPercent.textContent = avg + "%";
    try {
      localStorage.setItem(PAGE_ID + "_progress", JSON.stringify({progress:avg, completed:avg >= 100, updatedAt:Date.now()}));
    } catch(e) {}
    if (avg < 100) {
      const current = pads.find(p => !p.done) || pads[0];
      if (!statusEl.textContent || /Trace|Start|Great|Now/.test(statusEl.textContent)) {
        setStatus("Trace " + current.task.label + " in the " + current.task.bodyPart + " number box.");
      }
    }
  }

  function finishAll() {
    if (finalCelebrated) return;
    finalCelebrated = true;
    progressFill.style.width = "100%";
    progressPercent.textContent = "100%";
    setStatus("Excellent! You traced all the measuring numbers.");
    celebrate("Excellent work! You traced 45 centimeters for the arm, 55 centimeters for the leg, and 17 centimeters for the foot. Rulers can measure!", true);
    try {
      localStorage.setItem(PAGE_ID + "_progress", JSON.stringify({progress:100, completed:true, updatedAt:Date.now()}));
    } catch(e) {}
  }

  function clearAll() {
    finalCelebrated = false;
    pads.forEach(p => p.clear());
    pads[0].el.classList.add("active");
    miniEls.forEach(el => el.textContent = "0%");
    progressFill.style.width = "0%";
    progressPercent.textContent = "0%";
    setStatus("Trace 45 in the first box.");
    try {
      localStorage.setItem(PAGE_ID + "_progress", JSON.stringify({progress:0, completed:false, updatedAt:Date.now()}));
    } catch(e) {}
  }

  function stopSpeaking() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  }

  clearBtn.addEventListener("click", () => {
    playChime();
    clearAll();
    speak("Let's try again. Trace 45 first.");
  });
  readBtn.addEventListener("click", readInstructions);
  micBtn.addEventListener("click", sayPosterLine);
  prevBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = PREVIOUS_PAGE; });
  nextBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = NEXT_PAGE; });

  window.addEventListener("resize", () => pads.forEach(p => p.resize()));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", () => pads.forEach(p => p.resize()));
  if ("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};

  window.addEventListener("load", () => {
    clearAll();
    setTimeout(readInstructions, 650);
  }, {once:true});
})();
</script>
