<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>My Body Ruler Quiz - 7 Years Old</title>
<style>
:root{--red:#f24b5e;--paper:#fffaf3;--ink:#292631;--blue:#0696b7;--green:#26b35a;--orange:#ff9d20;--yellow:#ffde58;--purple:#7254c8;--gold:#ffd24a;--shadow:0 16px 34px rgba(0,0,0,.14);font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink)}body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;background-image:linear-gradient(#eadfd3 1px,transparent 1px),linear-gradient(90deg,#eadfd3 1px,transparent 1px);background-size:28px 28px}.app{width:min(1160px,100%);background:#fff;border:8px solid var(--red);border-radius:30px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}.week{position:absolute;right:18px;top:18px;background:#fff;border:4px solid var(--red);border-radius:13px;padding:5px 12px;font-size:clamp(.95rem,2.4vw,1.35rem);font-weight:1000;z-index:5}.top-nav{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}.badge{background:#fff0f4;border:3px solid #ffd1dc;border-radius:999px;padding:8px 13px;font-weight:1000;color:#a72537;box-shadow:0 7px 14px rgba(0,0,0,.07)}.nav-buttons,.control-buttons{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.btn{border:none;border-radius:999px;padding:10px 16px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s,filter .1s}.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}.btn.home{background:#25d17d;color:#fff}.btn.back,.btn.clear{background:#dfeaff;color:#203b6d}.btn.next{background:#f7dc6f;color:#8a5700}.btn.read{background:var(--red);color:#fff}.btn.cheer{background:#c9f2d6;color:#176e39}.title{margin:-5px 82px 12px 0;text-align:center;font-size:clamp(2.35rem,7vw,5.1rem);line-height:.96;color:#fff;font-weight:1000;-webkit-text-stroke:8px var(--red);paint-order:stroke fill;text-shadow:0 5px 0 rgba(242,75,94,.22)}
.hero{display:grid;grid-template-columns:minmax(160px,260px) 1fr;gap:13px;align-items:center;background:linear-gradient(180deg,#ffe4ec,#fff9fb);border:4px dashed rgba(242,75,94,.35);border-radius:23px;padding:11px;margin-bottom:12px}.hero-img{width:100%;height:215px;object-fit:contain;object-position:top center;border-radius:16px;border:3px solid #fff;background:#fff;filter:drop-shadow(0 7px 10px rgba(0,0,0,.14))}.speech{background:#fff;border:4px solid var(--blue);border-radius:40px;padding:16px 21px;min-height:100px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.06rem,2.9vw,1.62rem);font-weight:1000;box-shadow:0 6px 0 rgba(0,0,0,.07);position:relative}.speech:after{content:"";position:absolute;left:-19px;bottom:22px;width:26px;height:21px;border-left:4px solid var(--blue);border-bottom:4px solid var(--blue);background:#fff;border-radius:0 0 0 20px;transform:rotate(-12deg)}.quiz-area{display:grid;grid-template-columns:.9fr 1.1fr;gap:13px}.panel{background:#fff;border:4px solid #ffe0e8;border-radius:23px;padding:12px;box-shadow:0 8px 17px rgba(0,0,0,.06)}.panel-title{text-align:center;font-size:clamp(1.16rem,3vw,1.7rem);font-weight:1000;color:#a72537;margin-bottom:9px}.poster-frame{background:#fff;border:4px solid #ffc7d4;border-radius:18px;overflow:hidden;position:relative}.poster{display:block;width:100%;height:min(64vh,560px);object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}.question-card{background:#fffafc;border:4px solid #ffd4df;border-radius:20px;padding:14px;min-height:156px}.q-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.q-count{background:#fff0bd;color:#8a5700;border-radius:999px;padding:6px 11px;font-weight:1000}.score{background:#e8fff1;color:#126c36;border-radius:999px;padding:6px 11px;font-weight:1000}.question{font-size:clamp(1.15rem,3.2vw,1.65rem);line-height:1.35;font-weight:1000;text-align:center}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.choice{min-height:70px;background:#fff;border:4px solid #ffd9e3;border-radius:17px;font-size:clamp(1rem,2.8vw,1.2rem);font-weight:1000;color:#46313a;cursor:pointer;padding:10px 7px;box-shadow:0 4px 0 rgba(0,0,0,.11)}.choice:hover{transform:scale(1.018)}.choice:disabled{cursor:not-allowed}.choice.correct{background:#d8ffd8;border-color:#22b46b;color:#126c36}.choice.wrong{background:#ffe0e7;border-color:#e03245;color:#a12036}.explain{min-height:1.4em;text-align:center;font-weight:1000;color:#5b40b2;margin-top:10px;font-size:clamp(1rem,2.7vw,1.22rem)}.progress-card{margin-top:12px;background:#fff9fb;border:3px solid #ffd1df;border-radius:18px;padding:10px;display:grid;gap:7px}.progress-title{text-align:center;font-weight:1000;color:#4b3960}.bar{height:16px;background:#e8eef8;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.13)}.fill{height:100%;width:0%;background:linear-gradient(90deg,#58c6ff,#83e79f);transition:width .18s ease}.stars{text-align:center;min-height:1.25em;font-size:2.05rem;letter-spacing:3px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.25)}.result{display:none;text-align:center;background:#fff7da;border:4px solid #ffd24a;border-radius:22px;padding:16px;font-weight:1000;font-size:clamp(1.12rem,3vw,1.5rem);margin-top:12px}.result.show{display:block}.confetti{position:fixed;top:-18px;width:10px;height:15px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.08}}.note{text-align:center;margin-top:9px;font-size:.9rem;font-weight:900;color:#666}
@media(max-width:900px){.hero,.quiz-area{grid-template-columns:1fr}.poster{height:min(58vh,500px)}.title{-webkit-text-stroke:5px var(--red);margin-right:0}.hero-img{height:250px}}@media(max-width:540px){.app{padding:8px;border-width:5px;border-radius:20px}.week{position:static;display:inline-block;margin-bottom:8px}.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app" aria-label="My Body Ruler Quiz">
<audio id="chimeAudio" src="chime.mp3" preload="auto"></audio>
<div class="week">Week 1</div>
<div class="top-nav"><div class="badge">🧠 Level B · My Body Ruler Quiz</div><div class="nav-buttons"><button class="btn back" id="backBtn" type="button">⬅ Back</button><button class="btn next" id="nextBtn" type="button">Next ➜</button><button class="btn home" id="homeBtn" type="button">🏠 Home</button></div></div>
<h1 class="title">My Body Ruler Quiz</h1>
<section class="hero"><img class="hero-img" id="heroImage" src="body_rulers.png" alt="Original My Body poster"><div class="speech" id="speechBubble">Answer the questions. Use the poster to think like a measuring scientist!</div></section>
<section class="quiz-area"><div class="panel"><div class="panel-title">Poster Clue</div><div class="poster-frame"><img class="poster" id="stagePoster" src="body_rulers.png" alt="Poster clue"></div></div><div class="panel"><div class="panel-title">Interactive Quiz</div><div class="question-card"><div class="q-top"><span class="q-count" id="qCount">Question 1 / 10</span><span class="score" id="scoreBox">Score: 0</span></div><div class="question" id="question">Loading...</div><div class="choices" id="choices"></div><div class="explain" id="explain"></div></div><div class="progress-card"><div class="progress-title">Quiz Progress: <span id="progressText">0%</span></div><div class="bar"><div class="fill" id="progressFill"></div></div><div class="stars" id="stars">☆ ☆ ☆</div></div><div class="result" id="result"></div><div class="control-buttons" style="margin-top:12px"><button class="btn read" id="readBtn" type="button">🔊 Read</button><button class="btn clear" id="restartBtn" type="button">Restart ✕</button><button class="btn cheer" id="cheerBtn" type="button">👏 Cheer</button></div></div></section><div class="note">The original poster images remain unchanged and visible as learning clues.</div>
</main>
<script>
(() => {
"use strict";
const PAGE_ID="MyBody_Ruler_Quiz_7", HOME_PAGE="../../../../../index.html", PREVIOUS_PAGE="MyBody_Ruler_Game_7.html", NEXT_PAGE="Bk2LA8.html";
const qs=[
 {poster:"body_rulers.png",q:"What tool can measure length?",opts:["A ruler","A spoon","A pillow","A shoe"],a:"A ruler",why:"A ruler measures length in centimeters."},
 {poster:"body_rulers.png",q:"What sentence is written at the bottom of the first poster?",opts:["Rulers can measure.","Cakes can measure.","Feet can fly.","The book is blue."],a:"Rulers can measure.",why:"The poster says, Rulers can measure."},
 {poster:"body_measurements.png",q:"How long is the arm on the poster?",opts:["45 cm","55 cm","17 cm","10 cm"],a:"45 cm",why:"The arm measurement is forty five centimeters."},
 {poster:"body_measurements.png",q:"How long is the leg on the poster?",opts:["55 cm","45 cm","17 cm","7 cm"],a:"55 cm",why:"The leg measurement is fifty five centimeters."},
 {poster:"body_measurements.png",q:"How long is the foot on the poster?",opts:["17 cm","55 cm","45 cm","3 cm"],a:"17 cm",why:"The foot measurement is seventeen centimeters."},
 {poster:"body_measurements.png",q:"Which body part is the longest?",opts:["Leg","Arm","Foot","Hand"],a:"Leg",why:"Fifty five centimeters is greater than forty five and seventeen."},
 {poster:"adding_to_10.png",q:"Complete: 3 cm and 7 cm make __ cm.",opts:["10","17","45","55"],a:"10",why:"Three plus seven equals ten."},
 {poster:"adding_to_10.png",q:"Complete: 10 cm and 7 cm make __ cm.",opts:["17","10","7","3"],a:"17",why:"Ten plus seven equals seventeen."},
 {poster:"adding_to_10.png",q:"Which number is missing in this sentence: 10 cm and __ cm make 17 cm?",opts:["7","3","10","45"],a:"7",why:"Ten plus seven equals seventeen."},
 {poster:"body_measurements.png",q:"Which is the best full sentence?",opts:["My foot is 17 cm long.","My foot is 55 cm long.","My arm is 17 cm long.","My leg is 10 cm long."],a:"My foot is 17 cm long.",why:"The poster shows the foot is seventeen centimeters long."}
];
const $=id=>document.getElementById(id), stagePoster=$("stagePoster"), heroImage=$("heroImage"), speechBubble=$("speechBubble"), qCount=$("qCount"), scoreBox=$("scoreBox"), question=$("question"), choices=$("choices"), explain=$("explain"), progressText=$("progressText"), progressFill=$("progressFill"), stars=$("stars"), result=$("result"), chimeAudio=$("chimeAudio");
let index=0,score=0,locked=false,audioCtx=null;
function femaleVoice(){if(!("speechSynthesis" in window))return null;const all=speechSynthesis.getVoices()||[],en=all.filter(v=>/^en/i.test(v.lang||""));for(const n of ["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"]){const v=en.find(x=>(x.name||"").toLowerCase().includes(n.toLowerCase()));if(v)return v;}return en.find(v=>/us|united states/i.test((v.lang||"")+" "+(v.name||"")))||en[0]||all[0]||null;}
function speak(text,done){if(!("speechSynthesis" in window)){if(done)done();return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;u.pitch=1.15;u.volume=1;const v=femaleVoice();if(v)u.voice=v;if(done){u.onend=done;u.onerror=done;}speechSynthesis.speak(u);}catch(e){if(done)done();}}
function audio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});return audioCtx;}function beep(f=760,d=.08,v=.05){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}function chime(){try{const a=chimeAudio.cloneNode(true);a.currentTime=0;a.play().catch(()=>beep());}catch(e){beep();}}
function clap(){const a=audio();if(!a)return;for(let i=0;i<10;i++){const s=a.currentTime+i*.055,b=a.createBuffer(1,Math.floor(a.sampleRate*.06),a.sampleRate),d=b.getChannelData(0);for(let n=0;n<d.length;n++)d[n]=(Math.random()*2-1)*Math.pow(1-n/d.length,2);const src=a.createBufferSource(),g=a.createGain();src.buffer=b;g.gain.setValueAtTime(.035,s);g.gain.exponentialRampToValueAtTime(.001,s+.06);src.connect(g);g.connect(a.destination);src.start(s);src.stop(s+.06);}}
function confetti(){const colors=["#f24b5e","#0696b7","#26b35a","#ff9d20","#ffd24a","#7254c8"];for(let i=0;i<38;i++){const p=document.createElement("div");p.className="confetti";p.style.left=Math.random()*100+"vw";p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=Math.random()*.3+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),2100);}}
function update(){const pct=Math.round(index/qs.length*100),star=pct>=100?3:pct>=60?2:pct>=20?1:0;progressText.textContent=pct+"%";progressFill.style.width=pct+"%";stars.textContent=star?("★ ".repeat(star)+"☆ ".repeat(3-star)).trim():"☆ ☆ ☆";scoreBox.textContent="Score: "+score;save(pct,pct===100,star);}function save(pct,completed,star){try{const store=JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS")||"{}");store[PAGE_ID]={pageId:PAGE_ID,file:"MyBody_Ruler_Quiz_7.html",level:"B",week:1,type:"quiz",activityType:"quiz",score:pct,rawScore:score,total:qs.length,stars:star,completed,skills:{reading:1,listening:1,math:1,measurement:1},savedAt:new Date().toISOString(),ts:Date.now()};localStorage.setItem("GP_EIS_ACTIVITY_RESULTS",JSON.stringify(store));localStorage.setItem("GP_EIS_LAST_FILE","MyBody_Ruler_Quiz_7.html");}catch(e){}}
function show(){locked=false;result.classList.remove("show");if(index>=qs.length){finish();return;}const item=qs[index];stagePoster.src=item.poster;heroImage.src=item.poster;speechBubble.textContent="Use the poster clue to answer question "+(index+1)+".";qCount.textContent="Question "+(index+1)+" / "+qs.length;question.textContent=item.q;explain.textContent="";choices.innerHTML="";item.opts.forEach(o=>{const b=document.createElement("button");b.className="choice";b.type="button";b.textContent=o;b.onclick=()=>pick(b,o,item);choices.appendChild(b);});update();speak(item.q);}function pick(btn,value,item){if(locked)return;locked=true;choices.querySelectorAll("button").forEach(b=>b.disabled=true);if(value===item.a){score++;btn.classList.add("correct");explain.textContent="✅ "+item.why;chime();speak("Correct. "+item.why,()=>setTimeout(()=>{index++;show();},650));}else{btn.classList.add("wrong");[...choices.children].forEach(b=>{if(b.textContent===item.a)b.classList.add("correct")});explain.textContent="Good try. "+item.why;speak("Good try. "+item.why,()=>setTimeout(()=>{index++;show();},900));}update();}
function finish(){update();const pct=Math.round(score/qs.length*100);progressText.textContent="100%";progressFill.style.width="100%";stars.textContent=pct>=80?"★ ★ ★":pct>=60?"★ ★ ☆":"★ ☆ ☆";result.classList.add("show");result.innerHTML="🎉 Quiz complete!<br>You got "+score+" out of "+qs.length+".<br>"+(pct>=80?"Excellent measuring and addition work!":pct>=60?"Good work! Review the posters and try again for 3 stars.":"Keep practicing with the posters. You can do it!");chime();clap();confetti();speak("Quiz complete. You got "+score+" out of "+qs.length+". Great job learning about rulers, body measurements, and adding to ten.");save(100,true,pct>=80?3:pct>=60?2:1);}function restart(){index=0;score=0;locked=false;show();speak("Let us start the quiz again.");}
$("readBtn").onclick=()=>{if(index<qs.length)speak(qs[index].q);};$("restartBtn").onclick=restart;$("cheerBtn").onclick=()=>{audio();chime();clap();confetti();speak("You are doing great. Think, measure, and choose your answer.");};$("homeBtn").onclick=()=>location.href=HOME_PAGE;$("backBtn").onclick=()=>location.href=PREVIOUS_PAGE;$("nextBtn").onclick=()=>location.href=NEXT_PAGE;if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=femaleVoice;document.addEventListener("pointerdown",()=>audio(),{once:true});window.addEventListener("load",()=>{show();setTimeout(()=>speak("Welcome to My Body Ruler Quiz. Look at the poster clue, listen to each question, and choose the best answer."),650);},{once:true});
})();
</script>
</body>
</html>
