<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>My Body - Measuring the Body</title>
<style>
  :root{
    --ink:#26232b;
    --cream:#fff8f2;
    --pink:#f6b8c8;
    --red:#f34558;
    --blue:#0096b3;
    --green:#20a45b;
    --orange:#ff9356;
    --yellow:#ffd95c;
    --gold:#ffd24a;
    --panel:#ffffff;
    --shadow:0 12px 28px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);}
  body{
    display:flex;justify-content:center;align-items:flex-start;padding:10px;
    background-image:linear-gradient(#f4e8d9 1px,transparent 1px),linear-gradient(90deg,#f4e8d9 1px,transparent 1px);
    background-size:26px 26px;
  }
  .app{width:min(1040px,100%);background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:12px;position:relative;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .title-wrap{display:grid;gap:2px;}
  .small-title{font-size:clamp(.95rem,2.2vw,1.15rem);font-weight:1000;color:#fff;background:var(--red);border-radius:999px;padding:7px 16px;width:max-content;box-shadow:0 4px 0 rgba(0,0,0,.12);}
  h1{margin:0;font-size:clamp(1.35rem,3.6vw,2.35rem);line-height:1;color:var(--red);text-shadow:0 2px 0 #fff;}
  .nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .btn{
    border:none;border-radius:999px;min-height:44px;padding:10px 16px;font-size:.95rem;font-weight:1000;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .12s ease,filter .12s ease;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.04);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .btn.home{background:#dff1ff;color:#1e5f9e;text-decoration:none;display:inline-flex;align-items:center;}
  .btn.prev{background:#f8f0c7;color:#8a6b1c;}
  .btn.next{background:#ffe274;color:#805a00;}
  .btn.start{background:var(--orange);color:#fff;}
  .btn.clear{background:#e7edff;color:#284677;}
  .btn.cheer{background:#cbf4d8;color:#176b39;}

  .poster-wrap{width:min(963px,100%);margin:0 auto;position:relative;}
  .poster-stage{position:relative;width:100%;border-radius:20px;overflow:hidden;background:#f6b8c8;box-shadow:0 8px 20px rgba(0,0,0,.12);touch-action:manipulation;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .hotspot{
    position:absolute;border:4px dashed rgba(255,255,255,.92);border-radius:24px;background:rgba(255,255,255,.08);z-index:5;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:1000;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.45);
    opacity:.06;transition:opacity .15s ease,transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .hotspot.active{opacity:1;background:rgba(255,223,85,.22);box-shadow:0 0 0 6px rgba(255,223,85,.35),0 0 22px rgba(255,80,125,.55);animation:pulse 1.05s ease-in-out infinite;}
  .hotspot.done{opacity:.45;border-style:solid;background:rgba(32,164,91,.22);box-shadow:0 0 0 5px rgba(32,164,91,.22);animation:none;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
  .brain{left:58.5%;top:35.5%;width:14%;height:7.5%;border-radius:999px;}
  .lungs{left:59.4%;top:45.6%;width:14.6%;height:8.5%;border-radius:999px;}
  .bones{left:49.5%;top:53.0%;width:30%;height:16%;}
  .rulers{left:8.4%;top:78.4%;width:63.2%;height:10.0%;}

  .poster-mic{
    position:absolute;left:43.5%;top:41.0%;z-index:7;width:clamp(48px,7.2vw,72px);height:clamp(48px,7.2vw,72px);
    border:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dff4ff);display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 7px 0 rgba(0,0,0,.16),0 0 0 5px rgba(0,150,179,.18);animation:micBob 1.7s ease-in-out infinite;
  }
  .poster-mic img{width:82%;height:82%;object-fit:contain;pointer-events:none;}
  .poster-mic.busy{opacity:.68;pointer-events:none;animation:none;}
  @keyframes micBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  .finger{position:absolute;right:-6px;top:-26px;font-size:1.8rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));animation:fingerBob .9s ease-in-out infinite;}
  @keyframes fingerBob{0%,100%{transform:translateY(0);}50%{transform:translateY(7px);}}

  .lesson-panel{width:min(963px,100%);margin:12px auto 0;border:3px solid rgba(243,69,88,.24);border-radius:22px;background:linear-gradient(180deg,#fff,#fff7fb);padding:12px;display:grid;gap:12px;}
  .progress-row{display:grid;gap:6px;justify-items:center;}
  .progress-text{font-size:clamp(1rem,2.4vw,1.2rem);font-weight:1000;color:#ed4050;text-align:center;}
  .progress-bar{width:min(640px,94%);height:16px;border-radius:999px;background:#f3d7df;overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.18);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff6b7a,#ffd95c,#42d879);transition:width .25s ease;}
  .taskline{text-align:center;font-size:clamp(1rem,2.4vw,1.2rem);font-weight:1000;color:#354056;min-height:1.4em;}
  .activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{border:3px solid rgba(0,150,179,.22);border-radius:18px;background:#fff;padding:12px;box-shadow:0 6px 16px rgba(0,0,0,.08);}
  .card h2{font-size:clamp(1.05rem,2.4vw,1.32rem);margin:0 0 8px;color:#0096b3;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:2px solid rgba(243,69,88,.28);border-radius:999px;padding:8px 12px;font-weight:1000;background:#fff;}
  .chip.done{background:#e6ffe9;border-color:#36bf67;color:#168041;}
  .conversation-card{display:grid;gap:8px;}
  .bubble-row{display:flex;align-items:flex-start;gap:8px;}
  .bubble-text{flex:1;border:3px solid #0096b3;border-radius:22px;background:#fff;padding:12px 14px;font-size:clamp(1.05rem,2.6vw,1.4rem);font-weight:1000;line-height:1.22;box-shadow:0 6px 14px rgba(0,0,0,.10);}
  .bubble-text.active{background:linear-gradient(120deg,#fff5a7,#ffe1f0,#d6f6ff);animation:pulse .95s ease-in-out infinite;}
  .mini-mic{border:none;border-radius:50%;min-width:58px;width:58px;height:58px;background:radial-gradient(circle at 35% 30%,#fff,#dff4ff);box-shadow:0 5px 0 rgba(0,0,0,.14);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .mini-mic img{width:48px;height:48px;object-fit:contain;}
  .result{min-height:1.35em;font-size:clamp(1rem,2.4vw,1.15rem);font-weight:1000;color:#168041;}
  .status{text-align:center;font-weight:1000;color:#6844b6;min-height:1.3em;font-size:clamp(.98rem,2.3vw,1.1rem);}
  .stars{min-height:1.1em;color:var(--gold);font-size:1.5rem;text-shadow:0 2px 0 #a76f00;}
  .bottom-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(560deg);opacity:.08;}}
  @media (max-width:760px){.activity-grid{grid-template-columns:1fr;}.topbar{align-items:flex-start;flex-direction:column;}.nav{justify-content:flex-start;}.poster-mic{left:42.5%;top:40.4%;}.app{border-radius:16px;padding:8px;}}
</style>
</head>

  const startBtn = document.getElementById("startBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const clearBtn = document.getElementById("clearBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const homeBtn = document.getElementById("homeBtn");

  let femaleVoice = null;
  let tapped = new Set();
  let currentTargetIndex = 0;
  let talkIndex = 0;
  let micPhase = "listen";
  let attempts = [0,0,0,0];
  let talkStars = [0,0,0,0];
  let busy = false;

  chimeAudio.addEventListener("error", () => { chimeAudio.src = CHIME_FALLBACK; }, {once:true});

  function loadVoices(){
    const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
    femaleVoice = voices.find(v => /en[-_]US/i.test(v.lang) && /(female|zira|jenny|aria|samantha|ava|susan|victoria|google us english)/i.test(v.name))
      || voices.find(v => /en[-_]US/i.test(v.lang))
      || voices.find(v => /^en/i.test(v.lang))
      || voices[0]
      || null;
  }
  if("speechSynthesis" in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text){
    return new Promise(resolve => {
      if(!("speechSynthesis" in window)) return resolve();
      try{ speechSynthesis.cancel(); }catch(_e){}
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.88;
      u.pitch = 1.16;
      u.volume = 1;
      if(femaleVoice) u.voice = femaleVoice;
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.speak(u);
      setTimeout(resolve, Math.max(2500, text.length * 95));
    });
  }

  function stopSpeaking(){ try{ speechSynthesis.cancel(); }catch(_e){} }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      const play = chimeAudio.play();
      if(play && play.catch) play.catch(() => { chimeAudio.src = CHIME_FALLBACK; chimeAudio.play().catch(()=>{}); });
    }catch(_e){}
  }

  function applause(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      const ctx = new AudioCtx();
      const now = ctx.currentTime;
      for(let i=0;i<16;i++){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(520 + Math.random()*520, now + i*0.035);
        gain.gain.setValueAtTime(0.0001, now + i*0.035);
        gain.gain.exponentialRampToValueAtTime(0.08, now + i*0.035 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.035 + 0.11);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + i*0.035);
        osc.stop(now + i*0.035 + 0.13);
      }
      setTimeout(()=>ctx.close(), 1200);
    }catch(_e){}
  }

  function confetti(){
    const colors = ["#f34558","#ffd95c","#20a45b","#0096b3","#ff8fd1"];
    for(let i=0;i<46;i++){
      const p = document.createElement("span");
      p.className = "confetti-piece";
      p.style.left = Math.random()*100 + "vw";
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random()*0.25 + "s";
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 2200);
    }
  }

  function getScore(){
    const findScore = Math.round((tapped.size / bodyTargets.length) * 50);
    const speakScore = Math.round((talkStars.reduce((a,b)=>a+b,0) / 12) * 50);
    return Math.min(100, findScore + speakScore);
  }

  function updateProgress(){
    const score = getScore();
    progressText.textContent = `Lesson Progress: ${score}%`;
    progressFill.style.width = score + "%";
    saveProgress();
    if(score >= 100){
      taskLine.textContent = "Excellent! You finished the My Body measuring lesson.";
    }
  }

  function setActiveTarget(){
    hotspots.forEach(h => {
      const t = h.dataset.target;
      h.classList.toggle("done", tapped.has(t));
      h.classList.toggle("active", !tapped.has(t) && t === bodyTargets[currentTargetIndex]);
    });
    document.querySelectorAll(".chip").forEach(chip => chip.classList.toggle("done", tapped.has(chip.dataset.chip)));
    const target = bodyTargets[currentTargetIndex];
    if(target && !tapped.has(target)) taskLine.textContent = `Tap the ${bodyNames[target]} on the poster.`;
  }

  async function handleHotspot(target){
    if(tapped.has(target)){
      playChime();
      taskLine.textContent = `Yes, that is the ${bodyNames[target]}.`;
      await speak(`Yes, that is the ${bodyNames[target]}.`);
      return;
    }
    if(target !== bodyTargets[currentTargetIndex]){
      taskLine.textContent = "Good try! Follow the glowing part first.";
      await speak("Good try. Follow the glowing part first.");
      return;
    }
    tapped.add(target);
    playChime();
    const messages = {
      brain:"Great! The brain helps us think.",
      lungs:"Great! The lungs help us breathe.",
      bones:"Great! Bones help our body stand and move.",
      rulers:"Great! Rulers can measure."
    };
    taskLine.textContent = messages[target];
    await speak(messages[target]);
    currentTargetIndex++;
    setActiveTarget();
    updateProgress();
    if(tapped.size === bodyTargets.length){
      playChime();
      applause();
      confetti();
      taskLine.textContent = "Wonderful! Now use the microphone for the air bubble conversation.";
      await speak("Wonderful! Now use the microphone for the air bubble conversation.");
    }
  }

  function cleanWords(text){
    return String(text || "").toLowerCase().replace(/okay/g,"ok").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  }

  function matchPercent(expected, heard){
    const e = cleanWords(expected), h = cleanWords(heard);
    if(!e.length || !h.length) return 0;
    let matched = 0;
    const used = new Array(h.length).fill(false);
    e.forEach(word => {
      const idx = h.findIndex((w,i)=>!used[i] && w===word);
      if(idx >= 0){ used[idx] = true; matched++; }
    });
    return Math.round((matched / e.length) * 100);
  }

  function SpeechRecognitionCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
  function listenForSpeech(timeoutMs){
    return new Promise(resolve => {
      const Rec = SpeechRecognitionCtor();
      if(!Rec) return resolve({supported:false, transcript:""});
      const rec = new Rec();
      let done = false;
      let transcript = "";
      const finish = () => {
        if(done) return;
        done = true;
        try{ rec.stop(); }catch(_e){}
        resolve({supported:true, transcript});
      };
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = e => { transcript = Array.from(e.results).map(r => r[0]?.transcript || "").join(" ").trim(); };
      rec.onerror = finish;
      rec.onend = finish;
      try{ rec.start(); }catch(_e){ return resolve({supported:false, transcript:""}); }
      setTimeout(finish, timeoutMs || 7500);
    });
  }

  function setTalkLine(){
    bubbleText.textContent = talkLines[talkIndex];
    speechResult.textContent = "";
    starsEl.textContent = talkStars[talkIndex] ? "⭐ ".repeat(talkStars[talkIndex]).trim() : "";
    bubbleText.classList.add("active");
    talkStatus.textContent = "Tap the microphone once to listen. Tap again to repeat.";
  }

  async function nextTalkLine(){
    if(talkIndex >= talkLines.length - 1){
      bubbleText.classList.remove("active");
      fingerCue.style.display = "none";
      playChime();
      applause();
      confetti();
      talkStatus.textContent = "Fantastic speaking! You completed the air bubble conversation.";
      await speak("Fantastic speaking! You completed the air bubble conversation.");
      updateProgress();
      return;
    }
    talkIndex++;
    micPhase = "listen";
    setTalkLine();
    updateProgress();
    await speak("Next sentence.");
  }

  async function micPractice(){
    if(busy) return;
    busy = true;
    posterMic.classList.add("busy");
    panelMic.disabled = true;
    const expected = talkLines[talkIndex];
    try{
      if(micPhase === "listen"){
        talkStatus.textContent = "Listen carefully.";
        bubbleText.classList.add("active");
        await speak(expected);
        micPhase = "repeat";
        talkStatus.textContent = "Tap the microphone again. Then repeat after me.";
        return;
      }

      talkStatus.textContent = "Repeat after me.";
      await speak("Repeat after me.");
      await speak(expected);
      talkStatus.textContent = "Listening... say the sentence now.";
      speechResult.style.color = "#6844b6";
      speechResult.textContent = "Listening...";
      const heard = await listenForSpeech(7600);
      if(!heard.supported){
        speechResult.style.color = "#b06a00";
        speechResult.textContent = "Speech check works best in Chrome or Edge. Practice saying: " + expected;
        talkStatus.textContent = "Microphone speech recognition is not supported here.";
        return;
      }
      const transcript = heard.transcript || "";
      const tryNo = ++attempts[talkIndex];
      const pct = matchPercent(expected, transcript);
      if(pct >= 50){
        const stars = tryNo <= 1 ? 3 : tryNo === 2 ? 2 : 1;
        talkStars[talkIndex] = stars;
        speechResult.style.color = "#168041";
        speechResult.textContent = transcript ? `You said: “${transcript}”` : "Good speaking!";
        starsEl.textContent = "⭐ ".repeat(stars).trim();
        playChime();
        talkStatus.textContent = stars === 3 ? "Excellent! 3 stars!" : stars === 2 ? "Great job! 2 stars!" : "Good work! 1 star!";
        await speak(talkStatus.textContent);
        await nextTalkLine();
      } else if(tryNo >= 3){
        speechResult.style.color = "#b06a00";
        speechResult.textContent = "Nice try. Let us move to the next sentence.";
        await speak("Nice try. Let us move to the next sentence.");
        await nextTalkLine();
      } else {
        speechResult.style.color = "#c62828";
        speechResult.textContent = "Sorry, try again!";
        talkStatus.textContent = `Try ${tryNo} of 3. Tap the microphone and try again.`;
        await speak("Sorry, try again.");
        micPhase = "repeat";
      }
      updateProgress();
    } finally {
      busy = false;
      posterMic.classList.remove("busy");
      panelMic.disabled = false;
      saveProgress();
    }
  }

  async function startLesson(){
    playChime();
    fingerCue.style.display = "block";
    setActiveTarget();
    taskLine.textContent = "Listen carefully.";
    await speak("Welcome to My Body. It is my body. Look at the human body poster. Tap the brain, lungs, bones, and rulers. Rulers can measure. Then tap the microphone and repeat the air bubble sentences.");
    taskLine.textContent = "Tap the glowing brain on the poster.";
  }

  async function cheer(){
    playChime();
    applause();
    confetti();
    taskLine.textContent = "Great job! You can do it!";
    await speak("Great job! You can do it!");
  }

  function clearPage(){
    stopSpeaking();
    tapped = new Set();
    currentTargetIndex = 0;
    talkIndex = 0;
    micPhase = "listen";
    attempts = [0,0,0,0];
    talkStars = [0,0,0,0];
    speechResult.textContent = "";
    starsEl.textContent = "";
    fingerCue.style.display = "block";
    setTalkLine();
    setActiveTarget();
    updateProgress();
    taskLine.textContent = "Cleared. Tap Start Lesson to begin again.";
    talkStatus.textContent = "Tap the microphone once to listen. Tap again to repeat.";
  }

  function saveProgress(){
    try{
      const score = getScore();
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = {
        pageId:PAGE_ID,
        file:"MyBody_MeasuringBody.html",
        level:"A",
        type:"lesson",
        activityType:"speaking-and-tap-lesson",
        score,
        tapped:[...tapped],
        speakingStars:talkStars,
        completed:score >= 100,
        savedAt:new Date().toISOString(),
        ts:Date.now()
      };
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", "MyBody_MeasuringBody.html");
    }catch(_e){}
  }

  hotspots.forEach(h => h.addEventListener("click", () => handleHotspot(h.dataset.target), {passive:true}));
  posterMic.addEventListener("click", micPractice, {passive:true});
  panelMic.addEventListener("click", micPractice, {passive:true});
  startBtn.addEventListener("click", startLesson, {passive:true});
  cheerBtn.addEventListener("click", cheer, {passive:true});
  clearBtn.addEventListener("click", clearPage, {passive:true});
  prevBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = PREVIOUS_PAGE; });
  nextBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = NEXT_PAGE; });
  homeBtn.addEventListener("click", () => { stopSpeaking(); homeBtn.href = HOME_PAGE; });
  window.addEventListener("beforeunload", stopSpeaking);

  setTalkLine();
  setActiveTarget();
  updateProgress();
  window.addEventListener("load", () => { setTimeout(startLesson, 700); }, {once:true});
})();
</script>
</body>
</html>
