<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Long Length - Circle the Dog with Long Fur</title>
<style>
  :root{
    --ink:#2b2830;
    --paper:#fff9ef;
    --card:#ffffff;
    --blue:#5f88cc;
    --blue2:#7fb8ea;
    --pink:#f49aaa;
    --red:#f24b5e;
    --green:#15a85b;
    --gold:#ffd24a;
    --purple:#6d4bcc;
    --shadow:0 18px 38px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);}
  body{
    display:flex;align-items:flex-start;justify-content:center;padding:10px;overflow-x:hidden;
    background-image:linear-gradient(#eadfce 1px,transparent 1px),linear-gradient(90deg,#eadfce 1px,transparent 1px);
    background-size:28px 28px;
  }
  .lesson-card{width:min(990px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 16px;}
  .top-nav{width:min(910px,100%);margin:0 auto 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .title-pill{background:#eef5ff;border:3px solid rgba(95,136,204,.25);border-radius:999px;padding:8px 14px;font-weight:1000;color:#315d9f;}
  .nav-buttons{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .poster-wrap{position:relative;width:min(910px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;touch-action:none;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .trace-layer{position:absolute;inset:0;width:100%;height:100%;z-index:7;touch-action:none;cursor:crosshair;background:transparent;}
  .tap-zone{position:absolute;z-index:8;border-radius:999px;background:rgba(255,255,255,.001);touch-action:none;pointer-events:none;}
  .tap-zone.dog{left:5.8%;top:43.6%;width:41.5%;height:29.5%;}
  .tap-zone.cat{left:48.5%;top:44.2%;width:40.6%;height:28.0%;}
  .target-glow{position:absolute;z-index:6;pointer-events:none;border-radius:50%;opacity:0;transition:opacity .25s ease,transform .25s ease;}
  .target-glow.show{opacity:1;transform:scale(1.02);outline:5px dashed rgba(255,154,86,.9);box-shadow:0 0 0 6px rgba(255,255,255,.8),0 0 22px rgba(255,166,0,.55);}
  .target-glow.done{opacity:1;outline:6px solid rgba(30,170,90,.78);box-shadow:0 0 0 8px rgba(255,255,255,.85),0 0 28px rgba(30,170,90,.65);}
  .dog-glow{left:5.8%;top:43.6%;width:41.5%;height:29.5%;}
  .num-glow{left:18.3%;top:16.8%;width:5.8%;height:4.6%;}
  .num-glow.show{outline-color:rgba(255,70,90,.95);}
  .controls-panel{margin:12px auto 0;width:min(910px,100%);background:linear-gradient(180deg,#fff,#f7fbff);border:3px solid rgba(95,136,204,.25);border-radius:18px;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.08);}
  .progress-title{font-size:clamp(1rem,2.6vw,1.35rem);font-weight:1000;text-align:center;color:#4c78c1;margin-bottom:7px;}
  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-bar{flex:1;height:18px;background:#e7efff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#31b7ff,#84efab);border-radius:999px;transition:width .12s linear;}
  .progress-percent{min-width:62px;text-align:right;font-weight:1000;color:#175ca8;font-size:1.05rem;}
  .mission-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px;}
  .mission-card{background:#fff;border:2px solid #dbe7ff;border-radius:14px;padding:8px 10px;text-align:center;font-weight:1000;color:#444;}
  .mission-card.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .status{min-height:1.45em;text-align:center;font-weight:1000;color:var(--purple);font-size:clamp(.95rem,2.5vw,1.15rem);margin-top:8px;}
  .stars{text-align:center;min-height:1.2em;margin-top:5px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.26);}
  .button-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  button,.btn-home{border:none;border-radius:999px;padding:10px 16px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .1s ease,filter .1s ease;text-decoration:none;}
  button:hover,.btn-home:hover{filter:brightness(1.04);transform:translateY(-1px);}
  button:active,.btn-home:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn-prev,.btn-next{background:#5f88cc;color:#fff;}
  .btn-clear{background:#dfeaff;color:#1f3b6b;}
  .btn-read{background:#f6da7b;color:#8b5a00;}
  .btn-cheer{background:#c9f2d6;color:#166c38;}
  .btn-home{background:#fff0f4;color:#4c78c1;border:2px solid #dbe7ff;display:inline-flex;}
  .footer-note{margin-top:8px;text-align:center;color:#666;font-weight:800;font-size:.9rem;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.08;}}
  @media(max-width:620px){
    body{padding:6px;}
    .lesson-card{border-radius:16px;padding:6px 6px 12px;}
    .controls-panel{padding:10px;border-radius:14px;}
    .mission-grid{grid-template-columns:1fr;}
    button,.btn-home{font-size:.85rem;padding:9px 12px;}
    .progress-row{gap:6px;}
    .top-nav{justify-content:center;}
  }
</style>
</head>

  let numberDone = false, dogDone = false, completed = false;

  function getVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices() || [];
    const english = voices.filter(v => /^en/i.test(v.lang || ""));
    const preferred = ["Jenny", "Aria", "Samantha", "Victoria", "Zira", "Susan", "Google US English", "Microsoft Zira"];
    for (const name of preferred) {
      const v = english.find(x => (x.name || "").toLowerCase().includes(name.toLowerCase()));
      if (v) return v;
    }
    return english.find(v => /us|united states/i.test((v.lang || "") + " " + (v.name || ""))) || english[0] || voices[0] || null;
  }

  function speak(text, onEnd) {
    if (!("speechSynthesis" in window)) { if (onEnd) onEnd(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.15; u.volume = 1;
      const v = getVoice(); if (v) u.voice = v;
      if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
      speechSynthesis.speak(u);
    } catch(e) { if (onEnd) onEnd(); }
  }
  function readInstructions() {
    speak("Welcome! This page is about long length. First, trace the red number one beside the instruction. Then circle the dog with long fur. Remember, the dog has long fur and the cat has short fur.");
  }
  function unlockAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  }
  function beep(freq=720, dur=.045, vol=.04) {
    unlockAudio(); if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  }
  function tick() {
    const now = performance.now();
    if (now - lastTick < 70) return;
    lastTick = now; beep(620 + Math.random()*120, .045, .035);
  }
  function chime() {
    try {
      const a = chimeAudio.cloneNode(true); a.volume = .95; a.play().catch(() => beep(900,.18,.06));
    } catch(e) { beep(900,.18,.06); }
  }
  function applause() {
    unlockAudio(); if (!audioCtx) return;
    for (let i=0;i<13;i++) {
      const start = audioCtx.currentTime + i*.055;
      const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*.065), audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let n=0;n<data.length;n++) data[n] = (Math.random()*2-1) * Math.pow(1-n/data.length,2);
      const src = audioCtx.createBufferSource(), gain = audioCtx.createGain();
      src.buffer = buffer; gain.gain.setValueAtTime(.035,start); gain.gain.exponentialRampToValueAtTime(.001,start+.065);
      src.connect(gain); gain.connect(audioCtx.destination); src.start(start); src.stop(start+.065);
    }
  }
  function confetti() {
    const colors=["#5f88cc","#f24b5e","#58b9ef","#35b558","#ffd24a","#7049c6"];
    for(let i=0;i<42;i++){
      const p=document.createElement("div"); p.className="confetti-piece";
      p.style.left=Math.random()*100+"vw"; p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay=Math.random()*.28+"s"; document.body.appendChild(p); setTimeout(()=>p.remove(),2200);
    }
  }

  function resizeCanvas() {
    const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    canvas.style.width = r.width + "px"; canvas.style.height = r.height + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildSamples(); redraw(); updateProgress();
  }

  function buildSamples() {
    const r = wrap.getBoundingClientRect(), w = r.width, h = r.height;
    // Samples over the printed red number 1 beside the instruction.
    numberHits = [];
    for (let i=0;i<=34;i++) numberHits.push({x:w*.218, y:h*(.174 + .027*i/34), hit:false});
    // Samples around the orange circle area on the dog with long fur.
    circleHits = [];
    const cx=w*.265, cy=h*.586, rx=w*.214, ry=h*.144;
    for (let i=0;i<80;i++) {
      const a = Math.PI*2*i/80;
      circleHits.push({x:cx+Math.cos(a)*rx, y:cy+Math.sin(a)*ry, hit:false});
    }
  }

  function relPoint(e) {
    const r=canvas.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }

  function markHits(p) {
    const r = wrap.getBoundingClientRect();
    if (mode === "number" && !numberDone) {
      const radius = Math.max(18, r.width*.035);
      numberHits.forEach(s => { if (!s.hit && Math.hypot(s.x-p.x,s.y-p.y) <= radius) s.hit = true; });
      const score = numberHits.filter(s=>s.hit).length / numberHits.length;
      if (score >= .55) finishNumber();
    } else if (mode === "dog" && !dogDone) {
      const radius = Math.max(30, r.width*.055);
      circleHits.forEach(s => { if (!s.hit && Math.hypot(s.x-p.x,s.y-p.y) <= radius) s.hit = true; });
      const score = circleHits.filter(s=>s.hit).length / circleHits.length;
      if (score >= .48) finishDog();
    }
    updateProgress();
  }

  function redraw() {
    const r = wrap.getBoundingClientRect();
    ctx.clearRect(0,0,r.width,r.height);
    ctx.save();
    if (!numberDone) drawNumberGuide();
    if (mode === "dog" && !dogDone) drawCircleGuide();
    if (points.length) {
      ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=Math.max(8,r.width*.012);
      ctx.strokeStyle = mode === "number" ? "rgba(242,75,94,.95)" : "rgba(31,150,255,.92)";
      ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y); points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
    }
    ctx.restore();
  }
  function drawNumberGuide() {
    if (!numberHits.length) return;
    const r = wrap.getBoundingClientRect(), first=numberHits[0], last=numberHits[numberHits.length-1];
    ctx.save(); ctx.setLineDash([6,7]); ctx.lineWidth=Math.max(5,r.width*.008); ctx.strokeStyle="rgba(242,75,94,.75)";
    ctx.beginPath(); ctx.moveTo(first.x,first.y); numberHits.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#15a85b"; ctx.beginPath(); ctx.arc(first.x,first.y,Math.max(5,r.width*.008),0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#f24b5e"; ctx.beginPath(); ctx.arc(last.x,last.y,Math.max(5,r.width*.008),0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  function drawCircleGuide() {
    if (!circleHits.length) return;
    const r = wrap.getBoundingClientRect(), cx=r.width*.265, cy=r.height*.586, rx=r.width*.214, ry=r.height*.144;
    ctx.save(); ctx.setLineDash([10,9]); ctx.lineWidth=Math.max(5,r.width*.008); ctx.strokeStyle="rgba(255,154,86,.9)";
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#15a85b"; ctx.beginPath(); ctx.arc(cx+rx,cy,Math.max(6,r.width*.009),0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#f24b5e"; ctx.beginPath(); ctx.arc(cx-rx,cy,Math.max(6,r.width*.009),0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function setStatus(text) { status.textContent = text; }
  function updateProgress() {
    const numScore = numberDone ? 50 : Math.round((numberHits.filter(s=>s.hit).length / Math.max(1,numberHits.length)) * 50);
    const dogScore = dogDone ? 50 : Math.round((circleHits.filter(s=>s.hit).length / Math.max(1,circleHits.length)) * 50);
    const total = Math.min(100, numScore + dogScore);
    progressFill.style.width = total + "%";
    progressPercent.textContent = total + "%";
    let starCount = total >= 100 ? 3 : total >= 60 ? 2 : total >= 25 ? 1 : 0;
    stars.textContent = starCount ? ("★ ".repeat(starCount) + "☆ ".repeat(3-starCount)).trim() : "☆ ☆ ☆";
    saveProgress(total, total >= 100);
  }
  function saveProgress(score, done) {
    try {
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = {
        pageId: PAGE_ID, file: "Bk2LA9_Long_Length_Dog_Long_Fur.html", level: "A", week: 2,
        type: "lesson", activityType: "tracing-circle", score, completed: done,
        skills: { listening:1, tracing:1, reading:1, vocabulary:1 },
        savedAt: new Date().toISOString(), ts: Date.now()
      };
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", "Bk2LA9_Long_Length_Dog_Long_Fur.html");
    } catch(e) {}
  }

  function finishNumber() {
    if (numberDone) return;
    numberDone = true;
    mode = "dog";
    numCard.classList.add("done");
    numGlow.classList.remove("show");
    dogGlow.classList.add("show");
    points = [];
    chime();
    setStatus("Great tracing! Now circle the dog with long fur.");
    speak("Great tracing! Now circle the dog with long fur.");
    redraw(); updateProgress();
  }
  function finishDog() {
    if (dogDone) return;
    dogDone = true; completed = true;
    dogCard.classList.add("done"); dogGlow.classList.remove("show"); dogGlow.classList.add("done");
    points = [];
    chime(); applause(); confetti();
    setStatus("Excellent! The dog has long fur. The cat has short fur.");
    speak("Excellent! The dog has long fur. The cat has short fur. You did a wonderful job!", () => {});
    redraw(); updateProgress();
  }

  function startDraw(e) {
    unlockAudio();
    if (completed) return;
    e.preventDefault();
    const firstPoint = relPoint(e);
    if (mode === "dog" && !dogDone && isInCatArea(firstPoint)) {
      setStatus("That is the cat. The cat has short fur. Please circle the dog with long fur.");
      beep(240,.12,.06);
      speak("That is the cat. The cat has short fur. Please circle the dog with long fur.");
      return;
    }
    drawing = true;
    points = [firstPoint];
    markHits(points[0]);
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    redraw(); tick();
  }
  function moveDraw(e) {
    if (!drawing || completed) return;
    e.preventDefault();
    const p = relPoint(e);
    points.push(p); markHits(p); redraw(); tick();
  }
  function stopDraw(e) {
    drawing = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
  }

  canvas.addEventListener("pointerdown", startDraw);
  canvas.addEventListener("pointermove", moveDraw);
  canvas.addEventListener("pointerup", stopDraw);
  canvas.addEventListener("pointercancel", stopDraw);

  function isInCatArea(p) {
    const r = wrap.getBoundingClientRect();
    return p.x > r.width*.49 && p.x < r.width*.90 && p.y > r.height*.44 && p.y < r.height*.73;
  }

  function clearAll() {
    points = []; numberDone = false; dogDone = false; completed = false; mode = "number";
    numCard.classList.remove("done"); dogCard.classList.remove("done"); dogGlow.classList.remove("done","show");
    numGlow.classList.add("show");
    buildSamples(); numberHits.forEach(s=>s.hit=false); circleHits.forEach(s=>s.hit=false);
    setStatus("Trace the red number 1 first. Then circle the dog with long fur.");
    redraw(); updateProgress();
  }

  $("readBtn").addEventListener("click", readInstructions);
  $("clearBtn").addEventListener("click", () => { if (window.speechSynthesis) speechSynthesis.cancel(); clearAll(); readInstructions(); });
  $("cheerBtn").addEventListener("click", () => { chime(); applause(); confetti(); speak("You can do it! Trace, circle, and learn long length!"); });
  $("prevBtn").addEventListener("click", () => { if (window.speechSynthesis) speechSynthesis.cancel(); window.location.href = prevHref; });
  $("nextBtn").addEventListener("click", () => { if (window.speechSynthesis) speechSynthesis.cancel(); window.location.href = nextHref; });
  document.addEventListener("pointerdown", unlockAudio, {once:true});
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = getVoice;
  window.addEventListener("resize", resizeCanvas);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
  window.addEventListener("load", () => {
    resizeCanvas(); clearAll();
    setTimeout(readInstructions, 650);
  }, {once:true});
})();
</script>
</body>
</html>
