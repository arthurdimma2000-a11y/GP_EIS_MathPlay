<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA13 - Numbers: Three Dogs</title>
<style>
:root{
  --ink:#2d2d2d;
  --paper:#fffaf2;
  --blue:#5d86c9;
  --pink:#f04d5f;
  --yellow:#f7dc6f;
  --green:#22b46b;
  --purple:#6c4bbf;
  --gold:#ffd24a;
  --shadow:0 14px 32px rgba(0,0,0,.12);
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{
  margin:0;width:100%;max-width:100%;overflow-x:hidden;
  background:var(--paper);color:var(--ink);
}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;
  background-image:linear-gradient(#ece2d3 1px,transparent 1px),
                   linear-gradient(90deg,#ece2d3 1px,transparent 1px);
  background-size:28px 28px;
}
.app{
  width:min(990px,100%);
  background:#fff;border-radius:22px;box-shadow:var(--shadow);
  padding:10px 10px 14px;
}
.poster-wrap{
  position:relative;width:min(920px,100%);margin:0 auto;
  border-radius:18px;overflow:hidden;background:#fff;touch-action:none;
}
.poster-img{
  display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.guide-layer,.draw-layer{
  position:absolute;inset:0;width:100%;height:100%;background:transparent;
}
.guide-layer{z-index:4;pointer-events:none;}
.draw-layer{z-index:5;touch-action:none;cursor:crosshair;}
.hotspot{
  position:absolute;z-index:6;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.25rem,4vw,2rem);font-weight:1000;color:#fff;
  background:rgba(34,180,107,.08);border:4px dashed rgba(34,180,107,.18);
  opacity:0;transform:scale(.96);transition:.16s ease;pointer-events:none;
}
.hotspot.show{opacity:1;transform:scale(1);box-shadow:0 0 0 7px rgba(255,210,74,.18),0 0 22px rgba(34,180,107,.25);}
.hotspot.done{opacity:1;background:rgba(34,180,107,.20);border-color:rgba(34,180,107,.70);}
.hotspot.wrong{opacity:1;background:rgba(240,77,95,.16);border-color:rgba(240,77,95,.75);animation:shake .26s linear 2;}
@keyframes shake{0%,100%{transform:translateX(0) scale(1);}25%{transform:translateX(-5px) scale(1);}75%{transform:translateX(5px) scale(1);}}
.dog1{left:28.5%;top:36.5%;width:21.5%;height:17.3%;}
.dog2{left:49.0%;top:41.5%;width:31.5%;height:14.0%;}
.dog3{left:31.2%;top:60.5%;width:42.0%;height:24.0%;}
.panel{
  width:min(920px,100%);margin:12px auto 0;
  background:linear-gradient(180deg,#fff,#fff7fb);
  border:3px solid rgba(93,134,201,.25);border-radius:18px;
  padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.06);
}
.progress-title{
  text-align:center;font-size:clamp(1rem,2.6vw,1.28rem);
  font-weight:1000;color:#3f5fa8;margin-bottom:8px;
}
.progress-bar{
  height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
}
.progress-fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#31b7ff,#83e79f);transition:width .12s ease-out;
}
.steps{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;
}
.step{
  background:#fff;border:2px solid #e7edf8;border-radius:12px;text-align:center;
  padding:7px 5px;font-weight:1000;font-size:.9rem;color:#444;
}
.step.done{border-color:#62d98c;background:#effff4;color:#126c36;}
.stars{
  text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;
  color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
}
.status{
  min-height:1.45em;text-align:center;margin-top:7px;
  font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);
}
.buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
.btn{
  border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;
  cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s ease,filter .1s ease;
}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
.btn.home{background:#25d17d;color:#fff;}
.btn.prev,.btn.next{background:var(--yellow);color:#8b5a00;}
.btn.read{background:var(--pink);color:#fff;}
.btn.clear{background:#dfeaff;color:#1f3b6b;}
.btn.cheer{background:#c9f2d6;color:#166c38;}
.note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;}
.confetti-piece{
  position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;
  pointer-events:none;animation:fall 1.8s linear forwards;
}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
@media(max-width:760px){
  body{padding:6px;}.app{padding:6px;border-radius:16px;}.panel{padding:10px;border-radius:14px;}
  .steps{grid-template-columns:1fr;}.btn{font-size:.85rem;padding:9px 12px;}
}
</style>
</head>

let activityStage = "traceNumber"; // traceNumber -> tapDogs -> circleAnswer -> complete
let drawing = false;
let stroke = [];
let guidePoints = [];
let hitPoints = [];
let traceScore = 0;
let countedDogs = new Set();
let completed = { trace:false, count:false, circle:false };
let audioCtx = null;
let lastTick = 0;

/* Poster-coordinate helpers based on the original poster: 967 x 1318. */
const POSTER_W = 967;
const POSTER_H = 1318;
function sx(x){ return x / POSTER_W * drawCanvas.clientWidth; }
function sy(y){ return y / POSTER_H * drawCanvas.clientHeight; }

function resizeCanvases(){
  const rect = posterWrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  [guideCanvas, drawCanvas].forEach(c => {
    c.width = Math.round(rect.width * dpr);
    c.height = Math.round(rect.height * dpr);
    c.style.width = rect.width + "px";
    c.style.height = rect.height + "px";
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
  });
  buildGuide();
  drawGuide();
  redrawStroke();
}

function audio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function beep(freq=650,dur=.045,vol=.035){
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function tick(){
  const now = performance.now();
  if(now - lastTick < 70) return;
  lastTick = now;
  beep(620,.045,.035);
}
function chime(){
  try{
    const a = chimeAudio.cloneNode(true);
    a.volume = .95;
    a.play().catch(()=>beep(880,.14,.06));
  }catch(e){ beep(880,.14,.06); }
}
function clap(){
  const a = audio(); if(!a) return;
  for(let i=0;i<12;i++){
    const start = a.currentTime + i*.055;
    const buffer = a.createBuffer(1, Math.floor(a.sampleRate*.065), a.sampleRate);
    const data = buffer.getChannelData(0);
    for(let n=0;n<data.length;n++) data[n] = (Math.random()*2-1)*Math.pow(1-n/data.length,2);
    const src = a.createBufferSource(), gain = a.createGain();
    src.buffer = buffer;
    gain.gain.setValueAtTime(.035, start);
    gain.gain.exponentialRampToValueAtTime(.001, start+.065);
    src.connect(gain); gain.connect(a.destination);
    src.start(start); src.stop(start+.065);
  }
}
function speak(text, done){
  if(!("speechSynthesis" in window)){ if(done) done(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .88; u.pitch = 1.15; u.volume = 1;
    const voices = speechSynthesis.getVoices() || [];
    const femaleNames = ["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"];
    const en = voices.filter(v => /^en/i.test(v.lang || ""));
    for(const name of femaleNames){
      const v = en.find(x => (x.name || "").toLowerCase().includes(name.toLowerCase()));
      if(v){ u.voice = v; break; }
    }
    if(!u.voice) u.voice = en.find(v => /us|united states/i.test((v.lang||"")+" "+(v.name||""))) || en[0] || voices[0] || null;
    if(done){ u.onend = done; u.onerror = done; }
    speechSynthesis.speak(u);
  }catch(e){ if(done) done(); }
}
function intro(){
  speak("Welcome to Numbers Week Two. Trace the red number one. Then tap each dog as you count. Finally, circle the correct answer. There are three dogs.");
}
function cheerful(text){
  statusEl.textContent = text;
  chime(); clap();
  speak(text);
}
function confetti(){
  const colors = ["#5d86c9","#f04d5f","#31b7ff","#83e79f","#ffd24a","#6c4bbf"];
  for(let i=0;i<44;i++){
    const p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = Math.random()*.35 + "s";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2200);
  }
}

function buildGuide(){
  const w = drawCanvas.clientWidth, h = drawCanvas.clientHeight;
  guidePoints = [];
  hitPoints = [];
  if(activityStage === "traceNumber"){
    /* Red number 1 beside the instruction. */
    const pts = [
      {x:sx(82), y:sy(150)}, {x:sx(82), y:sy(174)}
    ];
    for(let i=0;i<=40;i++){
      const t=i/40, a=pts[0], b=pts[1];
      guidePoints.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
    }
  } else if(activityStage === "circleAnswer"){
    /* Oval path around the correct answer word "three" at the bottom. */
    const cx = sx(596), cy = sy(1210), rx = sx(83)-sx(0), ry = sy(39)-sy(0);
    for(let i=0;i<=160;i++){
      const t = Math.PI*2*i/160;
      guidePoints.push({x:cx+Math.cos(t)*rx, y:cy+Math.sin(t)*ry});
    }
  } else {
    guidePoints = [];
  }
  hitPoints = guidePoints.map(p => ({...p, hit:false}));
}

function drawGuide(){
  const w = guideCanvas.clientWidth, h = guideCanvas.clientHeight;
  gctx.clearRect(0,0,w,h);
  gctx.save();
  if(activityStage === "traceNumber" || activityStage === "circleAnswer"){
    gctx.lineCap = "round"; gctx.lineJoin = "round";
    gctx.lineWidth = activityStage === "traceNumber" ? 10 : 6;
    gctx.strokeStyle = activityStage === "traceNumber" ? "rgba(240,77,95,.88)" : "rgba(240,77,95,.55)";
    gctx.setLineDash(activityStage === "traceNumber" ? [9,8] : [12,9]);
    gctx.beginPath();
    if(guidePoints.length){
      gctx.moveTo(guidePoints[0].x,guidePoints[0].y);
      guidePoints.slice(1).forEach(p => gctx.lineTo(p.x,p.y));
    }
    gctx.stroke();
    gctx.setLineDash([]);

    if(activityStage === "traceNumber"){
      gctx.fillStyle = "#22b46b";
      gctx.beginPath(); gctx.arc(guidePoints[0].x,guidePoints[0].y,8,0,Math.PI*2); gctx.fill();
      gctx.fillStyle = "#f04d5f";
      gctx.beginPath(); gctx.arc(guidePoints.at(-1).x,guidePoints.at(-1).y,8,0,Math.PI*2); gctx.fill();
      gctx.fillStyle = "rgba(255,255,255,.95)";
      gctx.strokeStyle = "#5d86c9";
      gctx.lineWidth = 3;
      roundRect(gctx, sx(110), sy(175), sx(245), sy(42), 18, true, true);
      gctx.fillStyle = "#2d2d2d";
      gctx.font = `900 ${Math.max(16, w*.024)}px Comic Sans MS, Segoe UI, sans-serif`;
      gctx.fillText("Trace the red number 1", sx(128), sy(202));
    } else {
      gctx.fillStyle = "rgba(255,255,255,.95)";
      gctx.strokeStyle = "#5d86c9";
      gctx.lineWidth = 3;
      roundRect(gctx, sx(318), sy(1130), sx(322), sy(42), 18, true, true);
      gctx.fillStyle = "#2d2d2d";
      gctx.font = `900 ${Math.max(16, w*.024)}px Comic Sans MS, Segoe UI, sans-serif`;
      gctx.fillText("Circle the correct answer: three", sx(334), sy(1157));
    }
  }
  if(activityStage === "tapDogs"){
    dogEls.forEach(el => el.classList.add("show"));
  } else {
    dogEls.forEach(el => { if(!el.classList.contains("done")) el.classList.remove("show"); });
  }
  gctx.restore();
}

function roundRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill) ctx.fill();
  if(stroke) ctx.stroke();
}

function redrawStroke(){
  const w = drawCanvas.clientWidth, h = drawCanvas.clientHeight;
  dctx.clearRect(0,0,w,h);
  if(!stroke.length) return;
  dctx.save();
  dctx.lineCap = "round"; dctx.lineJoin = "round";
  dctx.lineWidth = activityStage === "traceNumber" ? 12 : 8;
  dctx.strokeStyle = activityStage === "traceNumber" ? "rgba(93,134,201,.92)" : "rgba(240,77,95,.75)";
  dctx.beginPath();
  dctx.moveTo(stroke[0].x, stroke[0].y);
  stroke.slice(1).forEach(p => dctx.lineTo(p.x,p.y));
  dctx.stroke();
  dctx.restore();
}

function pointerPoint(e){
  const r = drawCanvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function markHits(p){
  const radius = activityStage === "traceNumber" ? Math.max(22, drawCanvas.clientWidth*.035) : Math.max(26, drawCanvas.clientWidth*.045);
  hitPoints.forEach(q => {
    if(!q.hit && Math.hypot(q.x-p.x, q.y-p.y) <= radius) q.hit = true;
  });
  traceScore = Math.round(hitPoints.filter(p=>p.hit).length / Math.max(1, hitPoints.length) * 100);
  if(traceScore >= (activityStage === "traceNumber" ? 70 : 62)){
    traceScore = 100;
    hitPoints.forEach(p=>p.hit=true);
    if(activityStage === "traceNumber") finishTraceNumber();
    else finishCircleAnswer();
  }
  updateProgress();
}
function clearDrawing(){
  stroke = [];
  if(activityStage === "traceNumber" || activityStage === "circleAnswer"){
    hitPoints.forEach(p=>p.hit=false);
    traceScore = 0;
  }
  redrawStroke();
  updateProgress();
}

drawCanvas.addEventListener("pointerdown", e => {
  audio();
  if(!(activityStage === "traceNumber" || activityStage === "circleAnswer")) return;
  e.preventDefault();
  drawing = true;
  stroke = [pointerPoint(e)];
  try{ drawCanvas.setPointerCapture(e.pointerId); }catch(err){}
  markHits(stroke[0]);
  redrawStroke(); tick();
});
drawCanvas.addEventListener("pointermove", e => {
  if(!drawing) return;
  e.preventDefault();
  const p = pointerPoint(e);
  stroke.push(p);
  markHits(p);
  redrawStroke(); tick();
});
function stopDraw(e){
  drawing = false;
  try{ drawCanvas.releasePointerCapture(e.pointerId); }catch(err){}
}
drawCanvas.addEventListener("pointerup", stopDraw);
drawCanvas.addEventListener("pointercancel", stopDraw);

dogEls.forEach((el, index) => {
  el.addEventListener("pointerdown", e => {
    if(activityStage !== "tapDogs") return;
    e.preventDefault();
    audio();
    countedDogs.add(index);
    el.classList.add("done","show");
    el.textContent = countedDogs.size;
    chime();
    speak(index === 0 ? "One dog." : index === 1 ? "Two dogs." : "Three dogs.");
    updateProgress();
    if(countedDogs.size === 3) finishDogCounting();
  });
  el.style.pointerEvents = "auto";
});

function finishTraceNumber(){
  if(completed.trace) return;
  completed.trace = true;
  $("stepTrace").classList.add("done");
  chime();
  statusEl.textContent = "Great tracing! Now tap all three dogs.";
  speak("Great tracing! Now tap all three dogs. Count them: one, two, three.", () => {
    activityStage = "tapDogs";
    stroke = [];
    traceScore = 0;
    dctx.clearRect(0,0,drawCanvas.clientWidth,drawCanvas.clientHeight);
    buildGuide(); drawGuide(); updateProgress();
  });
}
function finishDogCounting(){
  if(completed.count) return;
  completed.count = true;
  $("stepCount").classList.add("done");
  chime(); clap();
  statusEl.textContent = "Excellent counting! There are three dogs. Now circle three.";
  speak("Excellent counting! There are three dogs. Now circle the word three.", () => {
    activityStage = "circleAnswer";
    stroke = [];
    traceScore = 0;
    dogEls.forEach(el => el.classList.remove("show"));
    buildGuide(); drawGuide(); updateProgress();
  });
}
function finishCircleAnswer(){
  if(completed.circle) return;
  completed.circle = true;
  $("stepCircle").classList.add("done");
  activityStage = "complete";
  drawGuide();
  updateProgress();
  chime(); clap(); confetti();
  statusEl.textContent = "Fantastic! There are three dogs.";
  speak("Fantastic! The correct answer is three. There are three dogs. Great job!");
  saveResult();
}

function updateProgress(){
  let base = 0;
  if(completed.trace) base += 33; else if(activityStage === "traceNumber") base += Math.round(traceScore * .33);
  if(completed.count) base += 33; else if(activityStage === "tapDogs") base += Math.round((countedDogs.size/3) * 33);
  if(completed.circle) base += 34; else if(activityStage === "circleAnswer") base += Math.round(traceScore * .34);
  const pct = Math.min(100, base);
  progressText.textContent = pct + "%";
  progressFill.style.width = pct + "%";
  const starCount = pct >= 100 ? 3 : pct >= 66 ? 2 : pct >= 33 ? 1 : 0;
  starsEl.textContent = starCount ? "★ ".repeat(starCount).trim() + " " + "☆ ".repeat(3-starCount).trim() : "☆ ☆ ☆";
}

function saveResult(){
  try{
    const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
    store[PAGE_ID] = {
      pageId: PAGE_ID,
      file: "Bk2LA13_Numbers_Three_Dogs.html",
      level: "A",
      week: 2,
      type: "lesson",
      activityType: "circle-answer",
      score: 100,
      stars: 3,
      completed: true,
      skills: {listening:1, tracing:1, math:1, reading:1, fineMotor:1},
      savedAt: new Date().toISOString(),
      ts: Date.now()
    };
    localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
    localStorage.setItem("GP_EIS_LAST_FILE", "Bk2LA13_Numbers_Three_Dogs.html");
  }catch(e){}
}

function resetLesson(){
  activityStage = "traceNumber";
  drawing = false; stroke = []; traceScore = 0; countedDogs.clear();
  completed = { trace:false, count:false, circle:false };
  ["stepTrace","stepCount","stepCircle"].forEach(id => $(id).classList.remove("done"));
  dogEls.forEach((el,i) => { el.classList.remove("done","show","wrong"); el.textContent = i+1; });
  buildGuide(); drawGuide(); redrawStroke(); updateProgress();
  statusEl.textContent = "Start again. Trace the red number 1.";
  speak("Start again. Trace the red number one.");
}

$("homeBtn").addEventListener("click", () => location.href = HOME_PAGE);
$("prevBtn").addEventListener("click", () => location.href = PREVIOUS_PAGE);
$("nextBtn").addEventListener("click", () => location.href = NEXT_PAGE);
$("readBtn").addEventListener("click", () => {
  audio();
  if(activityStage === "traceNumber") speak("Trace the red number one beside the instruction.");
  else if(activityStage === "tapDogs") speak("Tap each dog. Count one, two, three.");
  else if(activityStage === "circleAnswer") speak("Circle the correct answer. The correct answer is three.");
  else speak("Well done. There are three dogs.");
});
$("clearBtn").addEventListener("click", () => {
  if(activityStage === "tapDogs") resetLesson();
  else clearDrawing();
});
$("cheerBtn").addEventListener("click", () => {
  audio(); chime(); clap(); confetti();
  speak("You can do it! Keep going, superstar!");
});

window.addEventListener("resize", resizeCanvases);
document.addEventListener("pointerdown", () => audio(), {once:true});
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
window.addEventListener("load", () => {
  resizeCanvases();
  setTimeout(intro, 600);
}, {once:true});

})();
</script>
