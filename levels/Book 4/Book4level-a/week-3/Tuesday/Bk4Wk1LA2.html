<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LA14 - Different Lengths: Is It Raining?</title>
<style>
:root{
  --green:#32b548; --green-dark:#22943b; --red:#f04354; --ink:#28242c;
  --paper:#fff8f2; --card:#ffffff; --soft:#edfbea; --blue:#dfeaff;
  --yellow:#f6da7b; --purple:#6c4bbf; --gold:#ffd24a;
  --shadow:0 14px 34px rgba(0,0,0,.12);
  font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;background-image:linear-gradient(#f1e4d9 1px,transparent 1px),linear-gradient(90deg,#f1e4d9 1px,transparent 1px);background-size:26px 26px}
.app{width:min(990px,100%);background:#fff;border:7px solid var(--green);border-radius:28px;box-shadow:var(--shadow);padding:12px;position:relative;overflow:hidden}
.week-badge{position:absolute;right:16px;top:12px;background:#fff;border:4px solid var(--green);border-radius:14px;padding:6px 14px;font-size:clamp(.95rem,2.4vw,1.25rem);font-weight:1000;color:#1f6f2d;z-index:8}
.top-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.badge{background:#f3fff2;border:3px solid #bdeebf;border-radius:999px;padding:8px 14px;font-weight:1000;color:#1c8432;box-shadow:0 6px 13px rgba(0,0,0,.06)}
.nav-buttons,.control-buttons{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .1s ease,filter .1s ease;text-decoration:none}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.home{background:#25d17d;color:#fff} .btn.prev,.btn.next{background:var(--yellow);color:#8a5700} .btn.read{background:#ff8b60;color:#fff} .btn.clear{background:#dfeaff;color:#1f3b6b} .btn.cheer{background:#c9f2d6;color:#166c38}
.title{margin:0 110px 10px 0;text-align:center;font-size:clamp(2.4rem,8vw,5.4rem);line-height:.95;color:#fff;font-weight:1000;-webkit-text-stroke:8px var(--green);paint-order:stroke fill;text-shadow:0 5px 0 rgba(50,181,72,.23)}
.poster-wrap{position:relative;width:min(880px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#b7dfb2;box-shadow:0 9px 22px rgba(0,0,0,.11);touch-action:none}
.poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.focus-zone{position:absolute;pointer-events:none;z-index:7;border-radius:999px;opacity:0;transform:scale(.96);transition:opacity .18s ease,transform .18s ease}
.focus-zone.show{opacity:1;transform:scale(1);outline:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 7px rgba(255,215,0,.30),0 0 20px rgba(50,181,72,.48)}
.focus-zone.sparkle{opacity:1;transform:scale(1.03);background:rgba(255,238,120,.18);outline:5px solid rgba(255,214,0,.90);box-shadow:0 0 15px rgba(255,214,0,.95),0 0 30px rgba(50,181,72,.60);animation:sparklePulse .95s ease-in-out infinite}
@keyframes sparklePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.focus-question{left:28%;top:16.4%;width:46%;height:9.5%}
.focus-yes{left:14.8%;top:55.6%;width:22.5%;height:8.1%}
.focus-rain{left:67.5%;top:58.7%;width:25.5%;height:10.6%}
.focus-cat{left:33.2%;top:60.5%;width:18.5%;height:18.6%;border-radius:28px}
.focus-dog{left:48.0%;top:60.0%;width:21.0%;height:23.5%;border-radius:32px}
.focus-sentence{left:16.5%;top:85.7%;width:69%;height:10.1%;border-radius:26px}
.poster-mic{position:absolute;z-index:12;width:clamp(38px,7vw,62px);height:clamp(50px,9vw,76px);background:rgba(255,255,255,.88);border:3px solid #fff;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 7px 15px rgba(0,0,0,.18);transition:transform .12s ease,filter .12s ease}
.poster-mic:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.05)}
.poster-mic:active{transform:translateY(2px)}
.poster-mic img{width:82%;height:82%;object-fit:contain;pointer-events:none}
.poster-mic.done{background:#e9ffed;border-color:#4bd66c}
.mic-question{left:72%;top:17.2%} .mic-yes{left:9.4%;top:56.4%} .mic-rain{left:91.5%;top:60.6%} .mic-sentence{left:83.5%;top:86.8%}
.lesson-panel{width:min(880px,100%);margin:12px auto 0;background:linear-gradient(180deg,#fff,#f7fff5);border:3px solid rgba(50,181,72,.26);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.06);display:grid;gap:10px}
.progress-title{text-align:center;font-size:clamp(1rem,2.5vw,1.22rem);font-weight:1000;color:#238b3a}
.progress-bar{height:18px;background:#e6f3e8;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16)}
.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#49c7ff,#83e79f);transition:width .18s ease}
.step-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.step{background:#fff;border:2px solid #d6efd7;border-radius:12px;text-align:center;padding:7px 5px;font-weight:1000;font-size:.86rem;color:#455}
.step.done{border-color:#56d878;background:#f0fff2;color:#126c36}
.conversation-card{background:#fff;border:3px dashed #bdeebf;border-radius:18px;padding:10px;display:grid;gap:8px}
.say-line{display:flex;gap:9px;align-items:center;justify-content:space-between;background:#fff;border:2px solid #e6f4e6;border-radius:16px;padding:8px 10px;font-weight:1000}
.say-line.active{border-color:#ffd24a;background:#fffdf0;box-shadow:0 0 0 4px rgba(255,210,74,.18)}
.say-line.done{background:#f1fff3;border-color:#57d879}
.say-text{font-size:clamp(1rem,2.3vw,1.22rem)}
.mic-icon-btn{width:54px;height:54px;border:none;border-radius:999px;background:transparent;padding:0;cursor:pointer;filter:drop-shadow(0 5px 9px rgba(0,0,0,.18));transition:transform .12s ease}
.mic-icon-btn:hover{transform:scale(1.05)} .mic-icon-btn:active{transform:translateY(2px)} .mic-icon-btn img{width:100%;height:100%;object-fit:contain}
.status{min-height:1.45em;text-align:center;font-size:clamp(1rem,2.5vw,1.18rem);font-weight:1000;color:var(--purple)}
.recording{min-height:1.2em;text-align:center;font-size:.95rem;font-weight:900;color:#555}
.record-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f44336;margin-right:6px;animation:pulse 1s infinite;vertical-align:middle}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.stars{text-align:center;min-height:1.2em;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.26)}
.note{text-align:center;font-weight:900;color:#666;font-size:.9rem}
.confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.08}}
@media(max-width:780px){.title{-webkit-text-stroke:5px var(--green);margin-right:0}.week-badge{position:static;display:inline-block;margin-bottom:8px}.step-grid{grid-template-columns:repeat(2,1fr)}.poster-mic{border-width:2px}}
@media(max-width:520px){body{padding:6px}.app{padding:8px;border-width:5px;border-radius:20px}.top-nav{justify-content:center}.step-grid{grid-template-columns:1fr}.say-line{align-items:flex-start}.mic-rain{left:84%;top:60.6%}.mic-sentence{left:79%;top:86.8%}}
</style>
</head>

<script>
(() => {
'use strict';
const PAGE_ID='LA14_Different_Lengths_Is_It_Raining';
const HOME_PAGE='../../../../../index.html';
const PREVIOUS_PAGE='Bk2LA13_Numbers_Circle_Three_Dogs.html';
const NEXT_PAGE='Bk2LA15.html';
const steps=[
  {label:'Question', text:'Is it raining?', voice:'Is it raining?', focus:'focusQuestion', cue:'Look at the rain outside the window. Say: Is it raining?'},
  {label:'Answer', text:'Yes, it is.', voice:'Yes, it is.', focus:'focusYes', cue:'The cat answers. Say: Yes, it is.'},
  {label:'Funny saying', text:"It's raining cats and dogs.", voice:"It's raining cats and dogs.", focus:'focusRain', cue:'The dog uses a funny weather saying. Say: It is raining cats and dogs.'},
  {label:'Lengths', text:'The cat has a short tail. The dog has a long tail.', voice:'The cat has a short tail. The dog has a long tail.', focus:'focusSentence', cue:'Now say the length sentence. The cat has a short tail. The dog has a long tail.'}
];
const $=id=>document.getElementById(id);
const chimeAudio=$('chimeAudio'), status=$('status'), recordingStatus=$('recordingStatus'), progressText=$('progressText'), progressFill=$('progressFill'), stars=$('stars'), conversationCard=$('conversationCard'), stepGrid=$('stepGrid');
let done=new Array(steps.length).fill(false), activeStep=0, audioCtx=null, recognition=null, isListening=false;
function femaleVoice(){
  if(!('speechSynthesis' in window)) return null;
  const all=speechSynthesis.getVoices()||[];
  const en=all.filter(v=>/^en/i.test(v.lang||''));
  for(const n of ['Jenny','Aria','Samantha','Victoria','Zira','Susan','Karen','Google US English','Microsoft Zira']){
    const v=en.find(x=>(x.name||'').toLowerCase().includes(n.toLowerCase())); if(v) return v;
  }
  return en.find(v=>/us|united states/i.test((v.lang||'')+' '+(v.name||'')))||en[0]||all[0]||null;
}
function speak(text, doneFn){
  if(!('speechSynthesis' in window)){ if(doneFn) doneFn(); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.88; u.pitch=1.15; u.volume=1;
    const v=femaleVoice(); if(v) u.voice=v;
    if(doneFn){u.onend=doneFn; u.onerror=doneFn;}
    speechSynthesis.speak(u);
  }catch(e){ if(doneFn) doneFn(); }
}
function audio(){
  if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} }
  if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function beep(f=640,d=.055,v=.05){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.frequency.value=f; o.type='sine';
  g.gain.setValueAtTime(v,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d);
}
function chime(){
  try{ const a=chimeAudio.cloneNode(true); a.volume=.9; a.play().catch(()=>beep(880,.13,.06)); }catch(e){beep(880,.13,.06);}
}
function clap(){
  const a=audio(); if(!a) return;
  for(let i=0;i<12;i++){
    const s=a.currentTime+i*.055;
    const b=a.createBuffer(1,Math.floor(a.sampleRate*.06),a.sampleRate), d=b.getChannelData(0);
    for(let n=0;n<d.length;n++) d[n]=(Math.random()*2-1)*Math.pow(1-n/d.length,2);
    const src=a.createBufferSource(), g=a.createGain(); src.buffer=b;
    g.gain.setValueAtTime(.035,s); g.gain.exponentialRampToValueAtTime(.001,s+.06);
    src.connect(g); g.connect(a.destination); src.start(s); src.stop(s+.06);
  }
}
function confetti(){
  const colors=['#32b548','#f04354','#58b9ef','#ffd24a','#7049c6','#ff9918'];
  for(let i=0;i<42;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw'; p.style.background=colors[Math.floor(Math.random()*colors.length)]; p.style.animationDelay=Math.random()*.28+'s';
    document.body.appendChild(p); setTimeout(()=>p.remove(),2200);
  }
}
function normalize(s){return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function scoreMatch(expected, said){
  const e=normalize(expected).split(' ').filter(Boolean), s=new Set(normalize(said).split(' ').filter(Boolean));
  if(!e.length) return 0;
  return e.filter(w=>s.has(w)).length/e.length;
}
function update(){
  const count=done.filter(Boolean).length, pct=Math.round(count/steps.length*100);
  progressText.textContent=pct+'%'; progressFill.style.width=pct+'%';
  const starCount=pct>=100?3:pct>=50?2:pct>=25?1:0;
  stars.textContent=starCount?('★ '.repeat(starCount)+'☆ '.repeat(3-starCount)).trim():'☆ ☆ ☆';
  document.querySelectorAll('.step').forEach((el,i)=>el.classList.toggle('done',done[i]));
  document.querySelectorAll('.say-line').forEach((el,i)=>{el.classList.toggle('done',done[i]); el.classList.toggle('active',i===activeStep);});
  document.querySelectorAll('.poster-mic').forEach((el,i)=>el.classList.toggle('done',done[i]));
  save(pct,starCount,pct===100);
}
function save(score,starCount,complete){
  try{
    const store=JSON.parse(localStorage.getItem('GP_EIS_ACTIVITY_RESULTS')||'{}');
    store[PAGE_ID]={pageId:PAGE_ID,file:'LA14_Different_Lengths_Is_It_Raining.html',level:'A',week:2,type:'lesson',activityType:'speaking',score,stars:starCount,completed:complete,skills:{reading:1,listening:1,speaking:1,vocabulary:1},savedAt:new Date().toISOString(),ts:Date.now()};
    localStorage.setItem('GP_EIS_ACTIVITY_RESULTS',JSON.stringify(store));
    localStorage.setItem('GP_EIS_LAST_FILE','LA14_Different_Lengths_Is_It_Raining.html');
  }catch(e){}
}
function highlight(index, kind='show'){
  document.querySelectorAll('.focus-zone').forEach(z=>{z.classList.remove('show','sparkle')});
  const focus=$(steps[index].focus); if(focus) focus.classList.add(kind);
}
function activate(index){
  activeStep=index; update(); highlight(index,'show');
  status.textContent='Listen first. Then repeat: '+steps[index].voice;
  speak(steps[index].cue+' Repeat after me: '+steps[index].voice, ()=>setTimeout(()=>startListening(index),250));
}
function startListening(index){
  audio(); beep(720,.08,.05);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    recordingStatus.innerHTML='Voice checking is not supported in this browser. Say it out loud, then tap the mic again to complete this line.';
    status.textContent='Great speaking practice! Tap the same microphone again after saying it.';
    return;
  }
  if(isListening && recognition){try{recognition.stop();}catch(e){}}
  recognition=new SR(); recognition.lang='en-US'; recognition.continuous=false; recognition.interimResults=false; recognition.maxAlternatives=1;
  isListening=true;
  recordingStatus.innerHTML='<span class="record-dot"></span>Listening... say it clearly.';
  recognition.onresult=(ev)=>{
    const said=ev.results?.[0]?.[0]?.transcript||'';
    const score=scoreMatch(steps[index].voice, said);
    if(score>=.45) markDone(index, 'Wonderful! I heard: '+said);
    else { status.textContent='Good try. Say it one more time: '+steps[index].voice; recordingStatus.textContent='I heard: '+said; speak('Good try. Say it one more time.'); }
  };
  recognition.onerror=()=>{recordingStatus.textContent='Microphone could not hear you. Tap the mic and try again.'; isListening=false;};
  recognition.onend=()=>{isListening=false; if(recordingStatus.innerHTML.includes('Listening')) recordingStatus.textContent='Tap the mic if you want to try again.';};
  try{recognition.start();}catch(e){isListening=false; recordingStatus.textContent='Tap the mic and try again.';}
}
function markDone(index, message){
  if(done[index]){
    activeStep=Math.min(index+1,steps.length-1); update();
    if(done.every(Boolean)) complete();
    return;
  }
  done[index]=true; activeStep=Math.min(index+1,steps.length-1); update(); highlight(index,'sparkle'); chime(); clap(); confetti();
  status.textContent=message;
  recordingStatus.textContent='Great job!';
  speak('Excellent! '+steps[index].voice, ()=>{
    if(done.every(Boolean)) complete(); else setTimeout(()=>{status.textContent='Now tap the next microphone.';},450);
  });
}
function complete(){
  status.textContent='Fantastic! You finished the Different Lengths speaking lesson.';
  recordingStatus.textContent='You practiced: short tail, long tail, cats, dogs, and rain.';
  chime(); clap(); confetti();
  speak('Fantastic! You finished the lesson. The cat has a short tail. The dog has a long tail. Great speaking!');
}
function reset(){
  done=new Array(steps.length).fill(false); activeStep=0; update();
  document.querySelectorAll('.focus-zone').forEach(z=>z.classList.remove('show','sparkle'));
  status.textContent='Tap a microphone on the poster. Listen, then repeat the sentence.';
  recordingStatus.textContent='';
  speak('The lesson is ready again. Tap a microphone on the poster.');
