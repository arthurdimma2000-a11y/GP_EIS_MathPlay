<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA19 - Numbers - Seven Pets</title>
<style>
  :root {
    --ink:#2d2d2d;
    --paper:#fffaf2;
    --green:#35ad46;
    --pink:#f04d5f;
    --yellow:#f7df8a;
    --purple:#6c4bbf;
    --gold:#ffd24a;
    --blue:#5d86c9;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#ece2d3 1px,transparent 1px),linear-gradient(90deg,#ece2d3 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{width:min(995px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 14px;}
  .topbar{
    width:min(920px,100%);
    margin:0 auto 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
  }
  .badge{
    background:#effff4;
    border:3px solid rgba(53,173,70,.32);
    border-radius:999px;
    padding:8px 14px;
    font-weight:1000;
    color:#248b34;
    box-shadow:0 7px 15px rgba(0,0,0,.06);
  }
  .navs,.buttons{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;}
  .btn{
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
    font-family:inherit;
  }
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5f;color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .poster-wrap{
    position:relative;
    width:min(920px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
  }
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .guide-layer,.trace-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:transparent;
  }
  .guide-layer{z-index:4;pointer-events:none;}
  .trace-layer{z-index:5;touch-action:none;cursor:crosshair;}
  .trace-layer.off{pointer-events:none;cursor:default;}
  .pet-zone{
    position:absolute;
    z-index:7;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,.001);
    border:0;
    padding:0;
    cursor:pointer;
    pointer-events:none;
  }
  .pet-zone.on{pointer-events:auto;}
  .pet-zone:focus-visible{outline:4px solid rgba(53,173,70,.65);}
  .pet-zone.found{
    background:rgba(53,173,70,.08);
    outline:5px solid rgba(53,173,70,.72);
    box-shadow:0 0 0 8px rgba(255,255,255,.7),0 0 18px rgba(53,173,70,.5);
  }
  .pet-zone.found::after{
    content:attr(data-count);
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:42px;
    height:42px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#25d17d;
    color:#fff;
    border:4px solid #fff;
    font-size:1.25rem;
    font-weight:1000;
    box-shadow:0 6px 14px rgba(0,0,0,.18);
  }
  .wrong-word{
    position:absolute;
    z-index:8;
    background:rgba(255,255,255,.001);
    border:0;
    cursor:pointer;
    border-radius:999px;
    display:none;
  }
  .wrong-word.on{display:block;}
  .wrong-word:focus-visible{outline:4px solid rgba(240,77,95,.55);}
  .panel{
    width:min(920px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff7fb);
    border:3px solid rgba(53,173,70,.28);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }
  .progress-title{text-align:center;font-size:clamp(1rem,2.6vw,1.28rem);font-weight:1000;color:#2a8d38;margin-bottom:8px;}
  .progress-row{display:flex;align-items:center;gap:9px;}
  .progress-bar{flex:1;height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#35ad46,#83e79f);transition:width .10s ease-out;}
  .percent{min-width:60px;text-align:right;color:#175ca8;font-size:1.05rem;font-weight:1000;}
  .mini-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin-top:9px;}
  .mini{background:#fff;border:2px solid #e7edf8;border-radius:12px;text-align:center;padding:6px 4px;font-weight:1000;font-size:.82rem;color:#444;}
  .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .mini.active{border-color:#f7df8a;background:#fff8cf;color:#8b5a00;box-shadow:0 0 0 3px rgba(247,223,138,.28);}
  .stars{text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{min-height:1.45em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;line-height:1.45;}
  .sparkle{animation:sparklePulse .72s ease-in-out 2;}
  @keyframes sparklePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .topbar{justify-content:center;}
    .panel{padding:10px;border-radius:14px;}
    .mini-grid{grid-template-columns:repeat(3,1fr);}
    .btn{font-size:.85rem;padding:9px 12px;}
  }
</style>
</head>

  const progressFill = document.getElementById("progressFill");
  const progressPercent = document.getElementById("progressPercent");
  const status = document.getElementById("status");
  const stars = document.getElementById("stars");
  const chimeAudio = document.getElementById("chimeAudio");
  const petButtons = Array.from(document.querySelectorAll(".pet-zone"));
  const wrongNine = document.getElementById("wrongNine");

  const petWords = ["one","two","three","four","five","six","seven"];
  const state = {
    stage:"trace1",
    drawing:false,
    activeIndex:0,
    digitDone:false,
    sevenDone:false,
    petsFound:new Set(),
    traceScore:0,
    lastTick:0,
    audioCtx:null
  };

  const targets = [
    {
      id:"trace1",
      label:"Trace the red number one beside the instruction.",
      mini:"miniTrace1",
      kind:"line",
      color:"#f04d5f",
      points: makeLine(82,146,82,173,50)
    },
    {
      id:"seven",
      label:"Circle the correct answer, seven.",
      mini:"miniSeven",
      kind:"ellipse",
      color:"#f04d5f",
      points: makeEllipse(485,1192,80,34,150)
    }
  ];

  function makeLine(x1,y1,x2,y2,n){
    const pts=[];
    for(let i=0;i<n;i++){
      const t=i/(n-1);
      pts.push({x:x1+(x2-x1)*t,y:y1+(y2-y1)*t,hit:false});
    }
    return pts;
  }

  function makeEllipse(cx,cy,rx,ry,n){
    const pts=[];
    for(let i=0;i<n;i++){
      const a=(Math.PI*2*i)/(n-1);
      pts.push({x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,hit:false});
    }
    return pts;
  }

  function cloneTargetPoints(target){
    return target.points.map(p => ({x:p.x,y:p.y,hit:false}));
  }

  targets.forEach(t => t.livePoints = cloneTargetPoints(t));
  let stroke = [];

  function femaleVoice(){
    if(!("speechSynthesis" in window)) return null;
    const all = speechSynthesis.getVoices() || [];
    const en = all.filter(v => /^en/i.test(v.lang || ""));
    const preferred = ["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"];
    for(const name of preferred){
      const found = en.find(v => (v.name || "").toLowerCase().includes(name.toLowerCase()));
      if(found) return found;
    }
    return en.find(v => /us|united states/i.test((v.lang || "") + " " + (v.name || ""))) || en[0] || all[0] || null;
  }

  function speak(text, done){
    if(!("speechSynthesis" in window)){
      if(done) done();
      return;
    }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.88;
      u.pitch = 1.16;
      u.volume = 1;
      const voice = femaleVoice();
      if(voice) u.voice = voice;
      if(done){
        u.onend = done;
        u.onerror = done;
      }
      speechSynthesis.speak(u);
    }catch(e){ if(done) done(); }
  }

  function audioCtx(){
    if(!state.audioCtx){
      try{ state.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
    }
    if(state.audioCtx.state === "suspended") state.audioCtx.resume().catch(() => {});
    return state.audioCtx;
  }

  function beep(freq=620,duration=0.045,volume=0.04){
    const a = audioCtx();
    if(!a) return;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + duration);
    osc.connect(gain);
    gain.connect(a.destination);
    osc.start();
    osc.stop(a.currentTime + duration);
  }

  function tick(){
    const now = performance.now();
    if(now - state.lastTick < 70) return;
    state.lastTick = now;
    beep(620,0.04,0.035);
  }

  function playChime(){
    try{
      const a = chimeAudio.cloneNode(true);
      a.currentTime = 0;
      a.volume = 0.8;
      a.play().catch(() => beep(880,0.16,0.055));
    }catch(e){ beep(880,0.16,0.055); }
  }

  function clap(){
    const a = audioCtx();
    if(!a) return;
    for(let i=0;i<10;i++){
      const start = a.currentTime + i*0.055;
      const buffer = a.createBuffer(1, Math.floor(a.sampleRate*0.065), a.sampleRate);
      const data = buffer.getChannelData(0);
      for(let n=0;n<data.length;n++) data[n] = (Math.random()*2-1) * Math.pow(1-n/data.length,2);
      const src = a.createBufferSource();
      const gain = a.createGain();
      src.buffer = buffer;
      gain.gain.setValueAtTime(0.035,start);
      gain.gain.exponentialRampToValueAtTime(0.001,start+0.065);
      src.connect(gain);
      gain.connect(a.destination);
      src.start(start);
      src.stop(start+0.065);
    }
  }

  function confetti(){
    const colors = ["#35ad46","#f04d5f","#36a8df","#f7df8a","#ffd24a","#7049c6"];
    for(let i=0;i<40;i++){
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left = Math.random()*100 + "vw";
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = Math.random()*0.28 + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2200);
    }
  }

  function resizeCanvases(){
    const rect = posterWrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    for(const c of [guideLayer, traceLayer]){
      c.width = Math.round(rect.width*dpr);
      c.height = Math.round(rect.height*dpr);
      const ctx = c.getContext("2d");
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    drawGuide();
    drawTrace();
  }

  function mapNaturalToScreen(p){
    const rect = posterWrap.getBoundingClientRect();
    return {x:p.x/NATURAL_W*rect.width, y:p.y/NATURAL_H*rect.height};
  }

  function mapScreenToNatural(clientX,clientY){
    const rect = posterWrap.getBoundingClientRect();
    return {x:(clientX-rect.left)/rect.width*NATURAL_W, y:(clientY-rect.top)/rect.height*NATURAL_H};
  }

  function drawGuide(){
    const rect = posterWrap.getBoundingClientRect();
    gctx.clearRect(0,0,rect.width,rect.height);
    if(state.stage !== "trace1" && state.stage !== "circleSeven") return;
    const target = state.stage === "trace1" ? targets[0] : targets[1];
    const points = target.livePoints;
    gctx.save();
    gctx.lineCap = "round";
    gctx.lineJoin = "round";
    gctx.lineWidth = state.stage === "trace1" ? 8 : 6;
    gctx.strokeStyle = "rgba(240,77,95,.92)";
    gctx.setLineDash([10,10]);
    gctx.beginPath();
    points.forEach((p,i) => {
      const sp = mapNaturalToScreen(p);
      if(i===0) gctx.moveTo(sp.x,sp.y);
      else gctx.lineTo(sp.x,sp.y);
    });
    gctx.stroke();
    gctx.setLineDash([]);
    const start = mapNaturalToScreen(points[0]);
    const end = mapNaturalToScreen(points[points.length-1]);
    gctx.fillStyle = "#18a85c";
    gctx.beginPath(); gctx.arc(start.x,start.y,9,0,Math.PI*2); gctx.fill();
    gctx.fillStyle = "#f04d5f";
    gctx.beginPath(); gctx.arc(end.x,end.y,9,0,Math.PI*2); gctx.fill();
    gctx.restore();
  }

  function drawTrace(){
    const rect = posterWrap.getBoundingClientRect();
    tctx.clearRect(0,0,rect.width,rect.height);
    if(!stroke.length) return;
    tctx.save();
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    tctx.lineWidth = state.stage === "trace1" ? 13 : 10;
    tctx.strokeStyle = "rgba(28,168,92,.92)";
    tctx.beginPath();
    stroke.forEach((p,i) => {
      const sp = mapNaturalToScreen(p);
      if(i===0) tctx.moveTo(sp.x,sp.y);
      else tctx.lineTo(sp.x,sp.y);
    });
    tctx.stroke();
    tctx.restore();
  }

  function currentTarget(){
    return state.stage === "trace1" ? targets[0] : targets[1];
  }

  function hitTest(p){
    const target = currentTarget();
    const scale = posterWrap.getBoundingClientRect().width / NATURAL_W;
    const radius = HIT_RADIUS / Math.max(scale,0.7);
    target.livePoints.forEach(pt => {
      if(!pt.hit && Math.hypot(pt.x-p.x, pt.y-p.y) <= radius) pt.hit = true;
    });
    const hit = target.livePoints.filter(pt => pt.hit).length;
    state.traceScore = Math.round(hit / target.livePoints.length * 100);
    updateProgress();
    if(hit / target.livePoints.length >= COMPLETE_RATIO && stroke.length > 8){
      completeTrace(target);
    }
  }

  function pointerDown(e){
    if(state.stage !== "trace1" && state.stage !== "circleSeven") return;
    e.preventDefault();
    audioCtx();
    const p = mapScreenToNatural(e.clientX,e.clientY);
    const target = currentTarget();
    const d = Math.hypot(p.x-target.livePoints[0].x, p.y-target.livePoints[0].y);
    if(d > START_RADIUS && stroke.length === 0){
      setStatus("Start from the green dot, then follow the dotted line.");
      speak("Start from the green dot.");
      return;
    }
    state.drawing = true;
    stroke = [p];
    try{ traceLayer.setPointerCapture(e.pointerId); }catch(_e){}
    hitTest(p);
    drawTrace();
    tick();
  }

  function pointerMove(e){
    if(!state.drawing || (state.stage !== "trace1" && state.stage !== "circleSeven")) return;
    e.preventDefault();
    const p = mapScreenToNatural(e.clientX,e.clientY);
    stroke.push(p);
    hitTest(p);
    drawTrace();
    tick();
  }

  function pointerUp(e){
    state.drawing = false;
    try{ traceLayer.releasePointerCapture(e.pointerId); }catch(_e){}
  }

  function completeTrace(target){
    state.drawing = false;
    target.livePoints.forEach(pt => pt.hit = true);
    state.traceScore = 100;
    if(target.id === "trace1"){
      state.digitDone = true;
      document.getElementById("miniTrace1").classList.add("done");
      playChime();
      setStatus("Great! Now tap each pet you can see.");
      speak("Great tracing! Now tap each pet you can see. Count them one by one.");
      state.stage = "countPets";
      traceLayer.classList.add("off");
      stroke = [];
      targets[1].livePoints = cloneTargetPoints(targets[1]);
      drawGuide();
      drawTrace();
      enablePets(true);
    } else {
      state.sevenDone = true;
      document.getElementById("miniSeven").classList.add("done");
      playChime();
      clap();
      confetti();
      setStatus("Excellent! There are seven pets.");
      speak("Excellent! There are seven pets. You completed the lesson.");
      state.stage = "done";
      traceLayer.classList.add("off");
      wrongNine.classList.remove("on");
      saveProgress(100,3,true);
    }
    updateProgress();
  }

  function enablePets(on){
    petButtons.forEach(btn => btn.classList.toggle("on", on && !btn.classList.contains("found")));
  }

  function petClick(btn){
    if(state.stage !== "countPets" || btn.classList.contains("found")) return;
    audioCtx();
    const next = state.petsFound.size + 1;
    btn.classList.add("found");
    btn.dataset.count = next;
    state.petsFound.add(btn.id);
    document.getElementById("miniPet" + next).classList.add("done");
    beep(760 + next*24,0.07,0.045);
    const word = petWords[next-1];
    setStatus(word.charAt(0).toUpperCase()+word.slice(1)+" pet!");
    speak(word + " pet" + (next > 1 ? "s" : "") + ".");
    if(next === 7){
      playChime();
      setTimeout(() => {
        setStatus("Wonderful counting! Now circle seven, the correct answer.");
        speak("Wonderful counting! There are seven pets. Now circle the word seven.");
        state.stage = "circleSeven";
        state.traceScore = 0;
        stroke = [];
        targets[1].livePoints = cloneTargetPoints(targets[1]);
        enablePets(false);
        wrongNine.classList.add("on");
        traceLayer.classList.remove("off");
        drawGuide();
        drawTrace();
        updateProgress();
      }, 650);
    }
    updateProgress();
  }

  function wrongNineClick(){
    if(state.stage !== "circleSeven") return;
    beep(190,0.14,0.045);
    setStatus("Good try! Count again. There are seven pets, not nine.");
    speak("Good try. Count again. There are seven pets, not nine.");
  }

  function progressValue(){
    const trace1 = state.digitDone ? 25 : (state.stage === "trace1" ? state.traceScore * 0.25 : 0);
    const pets = state.petsFound.size * 5;
    const circle = state.sevenDone ? 40 : (state.stage === "circleSeven" ? state.traceScore * 0.40 : 0);
    return Math.max(0, Math.min(100, Math.round(trace1 + pets + circle)));
  }

  function updateProgress(){
    const pct = progressValue();
    progressText.textContent = pct + "%";
    progressPercent.textContent = pct + "%";
    progressFill.style.width = pct + "%";
    const starCount = pct >= 100 ? 3 : pct >= 70 ? 2 : pct >= 35 ? 1 : 0;
    stars.textContent = starCount ? "★ ".repeat(starCount).trim() + " " + "☆ ".repeat(3-starCount).trim() : "☆ ☆ ☆";
    document.querySelectorAll(".mini").forEach(m => m.classList.remove("active"));
    if(state.stage === "trace1") document.getElementById("miniTrace1").classList.add("active");
    if(state.stage === "countPets") {
      const next = Math.min(7, state.petsFound.size + 1);
      document.getElementById("miniPet" + next).classList.add("active");
    }
    if(state.stage === "circleSeven") document.getElementById("miniSeven").classList.add("active");
    saveProgress(pct,starCount,pct>=100);
  }

  function setStatus(text){
    status.textContent = text;
  }

  function readInstructions(){
    audioCtx();
    const text = "Welcome to Numbers Week Three. First, trace the red number one beside the instruction. Next, tap each pet on the poster and count them. Last, circle the correct answer, seven. Remember, there are seven pets.";
    setStatus("Listen carefully, then start tracing number one.");
    speak(text);
  }

  function clearAll(){
    state.stage = "trace1";
    state.drawing = false;
    state.digitDone = false;
    state.sevenDone = false;
    state.petsFound.clear();
    state.traceScore = 0;
    stroke = [];
    targets.forEach(t => t.livePoints = cloneTargetPoints(t));
    petButtons.forEach(btn => {
      btn.classList.remove("found","on");
      delete btn.dataset.count;
    });
    wrongNine.classList.remove("on");
    document.querySelectorAll(".mini").forEach(m => m.classList.remove("done","active"));
    traceLayer.classList.remove("off");
    drawGuide();
    drawTrace();
    updateProgress();
    setStatus("Start again. Trace number one beside the instruction.");
  }

  function cheer(){
    audioCtx();
    playChime();
    clap();
    confetti();
    setStatus("You can do it! Great counting!");
    speak("You can do it! Great counting!");
  }

  function saveProgress(score,starCount,completed){
    try{
      const payload = {
        pageId: PAGE_ID,
        file: "Bk2LA19_Numbers_Seven_Pets.html",
        title: "Numbers Week 3 - Seven Pets",
        level: "A",
        week: 3,
        type: "lesson",
        activityType: "trace-count-circle",
        score,
        stars: starCount,
        completed,
        skills: {reading:1, listening:1, counting:1, tracing:1, speaking:1},
        savedAt: new Date().toISOString(),
        ts: Date.now()
      };
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
      if(window.GPTrack && typeof window.GPTrack.finish === "function" && completed) window.GPTrack.finish(payload).catch(() => {});
      if(typeof window.finishAndSave === "function" && completed) window.finishAndSave(payload).catch(() => {});
    }catch(_e){}
  }

  petButtons.forEach(btn => btn.addEventListener("click", () => petClick(btn)));
  wrongNine.addEventListener("click", wrongNineClick);
  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);

  document.getElementById("readBtn").addEventListener("click", readInstructions);
  document.getElementById("clearBtn").addEventListener("click", () => {
    clearAll();
    speak("Cleared. Start tracing again.");
  });
  document.getElementById("cheerBtn").addEventListener("click", cheer);
  document.getElementById("homeBtn").addEventListener("click", () => { window.location.href = HOME_PAGE; });
  document.getElementById("prevBtn").addEventListener("click", () => { window.location.href = PREVIOUS_PAGE; });
  document.getElementById("nextBtn").addEventListener("click", () => { window.location.href = NEXT_PAGE; });

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  document.addEventListener("pointerdown", () => audioCtx(), {once:true});
  window.addEventListener("beforeunload", () => { try{ speechSynthesis.cancel(); }catch(_e){} });

  posterImg.addEventListener("load", () => {
    resizeCanvases();
    clearAll();
  }, {once:true});

  window.addEventListener("load", () => {
    resizeCanvases();
    clearAll();
    setTimeout(readInstructions, 700);
  }, {once:true});
})();
</script>
</body>
</html>
