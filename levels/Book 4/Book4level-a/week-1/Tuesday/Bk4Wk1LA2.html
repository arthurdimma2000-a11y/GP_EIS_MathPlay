<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Short Lengths - Pet Groomer</title>
  <style>
    :root {
      --red: #ef4655;
      --soft-red: #fff1f2;
      --blue: #0b86a5;
      --yellow: #f6bf00;
      --green: #16a34a;
      --dark: #111827;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
      background:
        linear-gradient(90deg, rgba(244, 145, 93, 0.12) 1px, transparent 1px),
        linear-gradient(rgba(244, 145, 93, 0.12) 1px, transparent 1px),
        #fffaf6;
      background-size: 26px 26px;
      color: var(--dark);
      overflow-x: hidden;
    }

    .top-bar {
      width: min(980px, 96vw);
      margin: 14px auto 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-left, .nav-right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-btn, .main-btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 900;
      font-size: 15px;
      color: white;
      background: var(--red);
      box-shadow: 0 5px 0 #c12f3a;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-btn:active, .main-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c12f3a;
    }

    .main-btn.secondary {
      background: #0b86a5;
      box-shadow: 0 5px 0 #07586c;
    }

    .main-btn.green {
      background: var(--green);
      box-shadow: 0 5px 0 #0f7a35;
    }

    .lesson-title {
      margin: 0;
      color: var(--red);
      text-shadow: 0 2px 0 white;
      font-size: clamp(22px, 4vw, 38px);
      font-weight: 900;
      letter-spacing: .5px;
      text-align: center;
    }

    .app-wrap {
      width: min(980px, 96vw);
      margin: 0 auto 22px;
    }

    .instruction-card {
      border: 4px solid var(--red);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 10px 28px rgba(239, 70, 85, .18);
      display: grid;
      gap: 10px;
    }

    .instruction-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .instruction-text {
      margin: 0;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 800;
      line-height: 1.35;
      flex: 1 1 300px;
    }

    .progress-wrap {
      width: 100%;
      height: 24px;
      border: 3px solid var(--red);
      border-radius: 999px;
      overflow: hidden;
      background: #ffe1e5;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffbf00, #16a34a);
      transition: width .45s ease;
    }

    .progress-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 13px;
      color: #111827;
    }

    .poster-stage {
      position: relative;
      width: min(979px, 100%);
      margin: 0 auto;
      border-radius: 18px;
      overflow: visible;
      user-select: none;
      touch-action: manipulation;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 14px 28px rgba(50, 20, 30, .14);
      background: #f8b6c2;
    }

    .mic-btn {
      position: absolute;
      width: clamp(44px, 7.5vw, 72px);
      height: clamp(44px, 7.5vw, 72px);
      border: 4px solid white;
      border-radius: 50%;
      background: #fff;
      padding: 6px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 7px 0 rgba(0,0,0,.20), 0 0 0 5px rgba(239, 70, 85, .22);
      transition: transform .15s ease, box-shadow .15s ease;
      z-index: 5;
    }

    .mic-btn img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
    }

    .mic-btn:hover {
      transform: translateY(-2px) scale(1.04);
    }

    .mic-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,.18), 0 0 0 5px rgba(239, 70, 85, .22);
    }

    .mic-btn.done {
      box-shadow: 0 7px 0 rgba(0,0,0,.20), 0 0 0 6px rgba(22, 163, 74, .58);
      background: #ecfdf5;
    }

    .mic-btn.listening {
      animation: pulse 1s infinite;
      box-shadow: 0 7px 0 rgba(0,0,0,.20), 0 0 0 8px rgba(11, 134, 165, .42);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .mic-yes {
      left: 56%;
      top: 32.3%;
    }

    .mic-groom {
      left: 70.3%;
      top: 43.4%;
    }

    .mic-sentence {
      right: 6.3%;
      top: 82.7%;
    }

    .tail-target {
      position: absolute;
      left: 58.5%;
      top: 67.4%;
      width: 10.5%;
      height: 12%;
      border-radius: 50%;
      border: 5px dashed transparent;
      background: transparent;
      cursor: pointer;
      z-index: 4;
    }

    .tail-target.active {
      border-color: var(--yellow);
      background: rgba(255, 218, 89, .18);
      animation: tailGlow .9s infinite alternate;
    }

    .tail-target.done {
      border-color: var(--green);
      background: rgba(22, 163, 74, .18);
      animation: none;
    }

    @keyframes tailGlow {
      from { box-shadow: 0 0 0 0 rgba(246, 191, 0, .20); }
      to { box-shadow: 0 0 0 12px rgba(246, 191, 0, .10); }
    }

    .status-box {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(760px, calc(100vw - 24px));
      background: rgba(17, 24, 39, .92);
      color: white;
      border: 3px solid white;
      border-radius: 18px;
      padding: 12px 16px;
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 800;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,.2);
      z-index: 20;
    }

    .hidden {
      display: none !important;
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 12px;
      height: 18px;
      border-radius: 4px;
      opacity: .95;
      z-index: 30;
      animation: fall 1.9s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(540deg);
        opacity: .15;
      }
    }

    @media (max-width: 620px) {
      .top-bar {
        justify-content: center;
      }

      .nav-left, .nav-right {
        justify-content: center;
      }

      .instruction-row {
        justify-content: center;
        text-align: center;
      }

      .mic-btn {
        width: 48px;
        height: 48px;
        padding: 4px;
      }
    }
  </style>
</head>

    const steps = {
      yes: "Tap the microphone near the groomer. Listen and say: Yes, I am.",
      groom: "Tap the microphone near the boy. Listen and say: Please groom my cat.",
      sentence: "Tap the microphone near the sentence. Listen and say: The cat has a short tail.",
      tail: "Great speaking! Now tap the cat's short tail."
    };

    function goPage(page) {
      if (!page || page === "#") {
        speak("This page is not connected yet. Please add your page link in the navigation constants.");
        return;
      }
      window.location.href = page;
    }

    function loadVoices() {
      voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      preferredVoice =
        voices.find(v => /en-US/i.test(v.lang) && /female|samantha|jenny|aria|zira|google us english/i.test(v.name)) ||
        voices.find(v => /en-US/i.test(v.lang)) ||
        voices.find(v => /en/i.test(v.lang)) ||
        null;
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speak(text, onEnd) {
      if (!("speechSynthesis" in window)) {
        showStatus(text);
        if (typeof onEnd === "function") setTimeout(onEnd, 700);
        return;
      }

      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 0.88;
      utterance.pitch = 1.12;
      utterance.volume = 1;
      if (preferredVoice) utterance.voice = preferredVoice;
      utterance.onend = () => {
        if (typeof onEnd === "function") onEnd();
      };
      speechSynthesis.speak(utterance);
      showStatus(text);
    }

    function cheerful(text) {
      playChime();
      speak(text);
    }

    function playChime() {
      try {
        chimeSound.currentTime = 0;
        const playPromise = chimeSound.play();
        if (playPromise) playPromise.catch(() => {});
      } catch (e) {}
    }

    function showStatus(text) {
      statusBox.textContent = text;
      statusBox.classList.remove("hidden");
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => statusBox.classList.add("hidden"), 5200);
    }

    function updateInstruction(text) {
      instructionText.textContent = text;
      showStatus(text);
    }

    function updateProgress() {
      const percent = Math.round((completed.size / 4) * 100);
      progressFill.style.width = percent + "%";
      progressLabel.textContent = percent + "% Complete";

      if (percent === 100) {
        playChime();
        launchConfetti();
        setTimeout(() => speak("Excellent work! You completed the Short Lengths lesson. The cat has a short tail."), 250);
      }
    }

    function markDone(key) {
      if (completed.has(key)) return;
      completed.add(key);

      const button = document.querySelector(`[data-key="${key}"]`);
      if (button) button.classList.add("done");

      updateProgress();

      if (key === "sentence") {
        tailTarget.classList.add("active");
        updateInstruction(steps.tail);
        setTimeout(() => speak(steps.tail), 300);
      }
    }

    function normalizeWords(text) {
      return (text || "")
        .toLowerCase()
        .replace(/[^a-z\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean);
    }

    function isGoodMatch(spoken, expected) {
      const spokenWords = new Set(normalizeWords(spoken));
      const targetWords = normalizeWords(expected);
      if (!spokenWords.size) return false;

      let matches = 0;
      targetWords.forEach(word => {
        if (spokenWords.has(word)) matches++;
      });

      return matches / targetWords.length >= 0.55;
    }

    function setupRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      return rec;
    }

    function startSpeechCheck(button, key, line) {
      if (isListening) return;
      recognition = setupRecognition();

      if (!recognition) {
        button.classList.add("done");
        markDone(key);
        cheerful("Good job! Tap the next microphone.");
        return;
      }

      isListening = true;
      button.classList.add("listening");
      updateInstruction("I am listening. Say: " + line);

      recognition.onresult = event => {
        const transcript = event.results[0][0].transcript || "";
        isListening = false;
        button.classList.remove("listening");

        if (isGoodMatch(transcript, line)) {
          markDone(key);
          cheerful("Great speaking! You said: " + line);
        } else {
          speak("Good try. Let's say it again slowly. " + line, () => {
            showStatus("Tap the same microphone and try again.");
          });
        }
      };

      recognition.onerror = () => {
        isListening = false;
        button.classList.remove("listening");
        showStatus("Microphone permission was not allowed. Tap again after repeating the line.");
        button.classList.add("done");
        markDone(key);
        cheerful("Good effort! Keep going.");
      };

      recognition.onend = () => {
        isListening = false;
        button.classList.remove("listening");
      };

      try {
        recognition.start();
      } catch (e) {
        isListening = false;
        button.classList.remove("listening");
        button.classList.add("done");
        markDone(key);
      }
    }

    function handleMicClick(button) {
      const key = button.dataset.key;
      const line = button.dataset.line;

      playChime();
      updateInstruction("Listen carefully. Repeat after me: " + line);

      speak("Repeat after me. " + line, () => {
        setTimeout(() => startSpeechCheck(button, key, line), 350);
      });
    }

    micButtons.forEach(button => {
      button.addEventListener("click", () => handleMicClick(button));
      button.addEventListener("touchstart", e => {
        e.preventDefault();
        handleMicClick(button);
      }, { passive: false });
    });

    tailTarget.addEventListener("click", () => {
      if (!completed.has("sentence")) {
        speak("First, tap the microphones and repeat the poster words.");
        return;
      }

      tailTarget.classList.remove("active");
      tailTarget.classList.add("done");
      markDone("tail");
      cheerful("Wonderful! You found the short tail.");
    });

    startBtn.addEventListener("click", () => {
      playChime();
      updateInstruction("Lesson started. Tap the microphones on the poster.");
      speak(lessonIntro);
    });

    repeatBtn.addEventListener("click", () => {
      playChime();
      speak(lessonIntro);
    });

    function launchConfetti() {
      const colors = ["#ef4655", "#f6bf00", "#16a34a", "#0b86a5", "#9333ea"];
      for (let i = 0; i < 38; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = (Math.random() * .55) + "s";
        confetti.style.transform = "rotate(" + (Math.random() * 180) + "deg)";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2600);
      }
    }

    window.addEventListener("load", () => {
      updateProgress();
      setTimeout(() => {
        speak("Tap Start Lesson to begin Short Lengths.");
      }, 700);
    });
  </script>
</body>
</html>
