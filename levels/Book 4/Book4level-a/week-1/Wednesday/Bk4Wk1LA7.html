<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA7 - Numbers - Circle Four Cats</title>
<style>
  :root{
    --ink:#2d2d2d;
    --paper:#fffaf2;
    --pink:#f04d5f;
    --blue:#2377c7;
    --green:#19a85b;
    --gold:#ffd24a;
    --purple:#6c4bbf;
    --shadow:0 14px 32px rgba(0,0,0,.13);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#ece2d3 1px,transparent 1px),linear-gradient(90deg,#ece2d3 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{width:min(990px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 14px;}
  .poster-wrap{position:relative;width:min(920px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;touch-action:none;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .guide-layer,.trace-layer{position:absolute;inset:0;width:100%;height:100%;background:transparent;}
  .guide-layer{z-index:4;pointer-events:none;}
  .trace-layer{z-index:5;touch-action:none;cursor:crosshair;}
  .speech-btn{
    position:absolute;z-index:7;border:3px solid #fff;background:#ffe36d;color:#073b68;
    border-radius:999px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;box-shadow:0 5px 14px rgba(0,0,0,.18);cursor:pointer;
  }
  .speech-btn:active{transform:scale(.96);}
  .speech-a{left:41.5%;top:17.4%;}
  .speech-b{left:76.8%;top:19.5%;}
  .panel{width:min(920px,100%);margin:12px auto 0;background:linear-gradient(180deg,#fff,#fff7fb);border:3px solid rgba(93,134,201,.25);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.06);}
  .progress-title{text-align:center;font-size:clamp(1rem,2.8vw,1.35rem);font-weight:1000;color:#3f5fa8;margin-bottom:8px;}
  .progress-row{display:flex;gap:10px;align-items:center;}
  .progress-bar{flex:1;height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#31b7ff,#83e79f);transition:width .12s ease-out;}
  .percent{min-width:58px;text-align:right;font-weight:1000;color:#175ca8;font-size:1.1rem;}
  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;}
  .mini{background:#fff;border:2px solid #e7edf8;border-radius:12px;text-align:center;padding:7px 5px;font-weight:1000;font-size:.9rem;color:#444;}
  .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .stars{text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{min-height:1.45em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);}
  .buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s ease,filter .1s ease;text-decoration:none;}
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;} .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5f;color:#fff;} .btn.clear{background:#dfeaff;color:#1f3b6b;} .btn.cheer{background:#c9f2d6;color:#166c38;}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .mini-grid{grid-template-columns:1fr;}
    .btn{font-size:.85rem;padding:9px 12px;}
    .speech-btn{width:34px;height:34px;font-size:1rem;border-width:2px;}
  }
</style>
</head>

  const overallText = document.getElementById("overallText");
  const miniGrid = document.getElementById("miniGrid");
  const starsEl = document.getElementById("stars");
  const statusEl = document.getElementById("status");
  const chimeSound = document.getElementById("chimeSound");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const lineA = document.getElementById("lineA");
  const lineB = document.getElementById("lineB");

  let audioCtx = null;
  let drawing = false;
  let last = null;
  let currentTarget = null;
  let completed = false;
  let lastTick = 0;

  function makeLineSamples(x1,y1,x2,y2,count){
    const out=[];
    for(let i=0;i<count;i++){
      const p=i/(count-1);
      out.push({x:x1+(x2-x1)*p,y:y1+(y2-y1)*p,hit:false});
    }
    return out;
  }
  function makeEllipseSamples(cx,cy,rx,ry,count){
    const out=[];
    for(let i=0;i<count;i++){
      const a=(Math.PI*2*i)/count;
      out.push({x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,hit:false});
    }
    return out;
  }

  const targets = [
    {id:"one", label:"Trace number 1", weight:30, required:REQUIRED_ONE, samples:makeLineSamples(82,151,82,179,28), complete:false, percent:0},
    {id:"cats", label:"Tap 4 cats", weight:30, complete:false, percent:0, count:0, cats:[
      {x:322,y:606,r:78,hit:false,name:"orange cat on the table"},
      {x:617,y:628,r:78,hit:false,name:"gray cat on the table"},
      {x:180,y:996,r:76,hit:false,name:"yellow cat under the table"},
      {x:667,y:992,r:86,hit:false,name:"black cat under the table"}
    ]},
    {id:"four", label:"Circle four", weight:40, required:REQUIRED_OVAL, samples:makeEllipseSamples(484,1207,74,39,90), complete:false, percent:0}
  ];

  const wrongAreas = [
    {id:"two", label:"two", x:585, y:1166, w:145, h:90}
  ];

  function cssScale(){
    const rect = posterWrap.getBoundingClientRect();
    return {sx:rect.width/NATURAL_W, sy:rect.height/NATURAL_H, rect};
  }
  function toNatural(evt){
    const rect = posterWrap.getBoundingClientRect();
    return {x:(evt.clientX-rect.left)/rect.width*NATURAL_W, y:(evt.clientY-rect.top)/rect.height*NATURAL_H};
  }
  function resizeCanvases(){
    const rect = posterWrap.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    for(const canvas of [guideLayer, traceLayer]){
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.width = Math.round(rect.width*dpr);
      canvas.height = Math.round(rect.height*dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr*rect.width/NATURAL_W,0,0,dpr*rect.height/NATURAL_H,0,0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }
    redrawGuide();
  }

  function redrawGuide(){
    gctx.clearRect(0,0,NATURAL_W,NATURAL_H);
    // Friendly highlight around the first activity without changing poster artwork.
    gctx.save();
    gctx.lineWidth = 3;
    gctx.strokeStyle = "rgba(240,77,95,.34)";
    gctx.setLineDash([7,9]);
    roundedRect(gctx,61,139,48,55,16); gctx.stroke();
    if(!targets[2].complete){
      gctx.beginPath();
      gctx.ellipse(484,1207,86,46,0,0,Math.PI*2);
      gctx.strokeStyle = "rgba(240,77,95,.27)";
      gctx.stroke();
    }
    // Small sparkle markers on cats to show counting targets.
    for(const cat of targets[1].cats){
      if(cat.hit) continue;
      gctx.beginPath();
      gctx.arc(cat.x,cat.y,16,0,Math.PI*2);
      gctx.fillStyle = "rgba(255,226,85,.62)";
      gctx.fill();
      gctx.lineWidth = 2;
      gctx.strokeStyle = "rgba(255,162,0,.7)";
      gctx.stroke();
    }
    gctx.restore();
  }
  function roundedRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  }

  function getAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tick(){
    const now = Date.now();
    if(now - lastTick < 45) return;
    lastTick = now;
    try{
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle"; osc.frequency.value = 650;
      gain.gain.setValueAtTime(0.035, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.055);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.06);
    }catch(_){}
  }
  function ding(){
    try{ chimeSound.currentTime = 0; chimeSound.play().catch(()=>{}); }catch(_){}
  }
  function clap(){
    try{
      const ctx = getAudioCtx();
      for(let i=0;i<5;i++){
        const buffer = ctx.createBuffer(1, ctx.sampleRate*0.10, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1) * Math.pow(1-j/data.length, 2);
        const source = ctx.createBufferSource(); source.buffer = buffer;
        const gain = ctx.createGain(); gain.gain.value = 0.055;
        source.connect(gain).connect(ctx.destination);
        source.start(ctx.currentTime + i*0.09);
      }
    }catch(_){}
  }
  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices();
    return voices.find(v => /female|woman|samantha|victoria|zira|aria|jenny|karen|joanna|susan/i.test(v.name) && /en-US|en_/i.test(v.lang || "")) ||
           voices.find(v => /en-US/i.test(v.lang || "")) || voices.find(v => /^en/i.test(v.lang || "")) || null;
  }
  function speak(text, opts={}){
    if(!("speechSynthesis" in window)) return;
    try{ speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = opts.rate || 0.88;
    u.pitch = opts.pitch || 1.18;
    u.volume = opts.volume || 1;
    const v = pickVoice(); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }
  function readInstructions(){
    speak("Welcome to Numbers, week one. Count the cats on the poster. Trace the red number one beside the instruction. Tap each cat as you count. Then circle the correct answer, four. There are four cats.");
    setStatus("Trace 1, tap the 4 cats, then circle four.");
  }
  function setStatus(text){ statusEl.textContent = text; }

  function buildMini(){
    miniGrid.innerHTML = "";
    targets.forEach(t=>{
      const el = document.createElement("div");
      el.className = "mini";
      el.id = "mini-" + t.id;
      el.textContent = t.id === "cats" ? "Tap cats: 0/4" : t.label + ": 0%";
      miniGrid.appendChild(el);
      t.boxEl = el;
    });
  }
  function nearestTarget(p){
    let best=null, dist=Infinity;
    for(const t of targets){
      if(t.id === "cats") continue;
      if(t.complete) continue;
      for(const s of t.samples){
        const d = Math.hypot(p.x-s.x,p.y-s.y);
        if(d < dist){dist=d; best=t;}
      }
    }
    return dist <= 60 ? best : null;
  }
  function updateTraceTarget(t,p){
    if(!t || !t.samples) return;
    const r = t.id === "one" ? HIT_RADIUS : 42;
    let changed=false;
    for(const s of t.samples){
      if(!s.hit && Math.hypot(p.x-s.x,p.y-s.y) <= r){ s.hit=true; changed=true; }
    }
    const hit = t.samples.filter(s=>s.hit).length;
    t.percent = hit / t.samples.length;
    if(t.boxEl) t.boxEl.textContent = t.label + ": " + Math.round(t.percent*100) + "%";
    if(!t.complete && t.percent >= t.required){
      t.complete = true;
      if(t.boxEl) t.boxEl.classList.add("done");
      ding();
      if(t.id === "one"){ speak("Great tracing! You traced number one."); setStatus("Good. Now tap the four cats."); }
      if(t.id === "four"){ speak("Correct! Four is the right answer."); setStatus("Correct answer! There are four cats."); }
    }
    if(changed) tick();
  }

  function pointerDown(e){
    e.preventDefault();
    traceLayer.setPointerCapture(e.pointerId);
    getAudioCtx();
    const p = toNatural(e);
    checkWrong(p);
    checkCats(p);
    currentTarget = nearestTarget(p) || currentTarget;
    drawing = true;
    last = p;
    tctx.beginPath();
    tctx.moveTo(p.x,p.y);
    updateTraceTarget(currentTarget,p);
    updateProgress();
  }
  function pointerMove(e){
    if(!drawing) return;
    e.preventDefault();
    const p = toNatural(e);
    if(!currentTarget) currentTarget = nearestTarget(p);
    tctx.save();
    tctx.lineWidth = currentTarget && currentTarget.id === "four" ? 9 : 8;
    tctx.strokeStyle = currentTarget && currentTarget.id === "four" ? "rgba(240,77,95,.82)" : "rgba(35,119,199,.86)";
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    tctx.beginPath();
    tctx.moveTo(last.x,last.y);
    tctx.lineTo(p.x,p.y);
    tctx.stroke();
    tctx.restore();
    markAlongLine(last,p);
    last = p;
    updateProgress();
  }
  function pointerUp(e){
    if(!drawing) return;
    e.preventDefault();
    drawing = false;
    last = null;
    currentTarget = null;
    updateProgress();
  }
  function markAlongLine(a,b){
    const steps = Math.max(2, Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/8));
    for(let i=0;i<=steps;i++){
      const p = {x:a.x+(b.x-a.x)*i/steps, y:a.y+(b.y-a.y)*i/steps};
      updateTraceTarget(currentTarget,p);
      checkCats(p, true);
    }
  }
  function checkCats(p, silent=false){
    const t = targets[1];
    for(const cat of t.cats){
      if(cat.hit) continue;
      if(Math.hypot(p.x-cat.x,p.y-cat.y) <= cat.r){
        cat.hit = true;
        t.count += 1;
        t.percent = t.count / t.cats.length;
        if(t.boxEl) t.boxEl.textContent = "Tap cats: " + t.count + "/4";
        ding();
        if(!silent) speak(t.count === 4 ? "Four cats! Great counting!" : "Cat " + t.count + ". Keep counting.");
        setStatus(t.count === 4 ? "Great! Now circle the word four." : "Good counting. Tap all four cats.");
        drawCatCheck(cat);
        if(t.count >= t.cats.length){ t.complete = true; if(t.boxEl) t.boxEl.classList.add("done"); }
        redrawGuide();
        break;
      }
    }
  }
  function drawCatCheck(cat){
    tctx.save();
    tctx.lineWidth = 7;
    tctx.strokeStyle = "rgba(25,168,91,.85)";
    tctx.beginPath();
    tctx.moveTo(cat.x-22,cat.y-4); tctx.lineTo(cat.x-5,cat.y+18); tctx.lineTo(cat.x+34,cat.y-28); tctx.stroke();
    tctx.restore();
  }
  function checkWrong(p){
    for(const a of wrongAreas){
      if(p.x >= a.x && p.x <= a.x+a.w && p.y >= a.y && p.y <= a.y+a.h){
        setStatus("Try again. Count the cats carefully. The correct answer is four.");
        speak("Try again. Count the cats carefully. The correct answer is four.");
        return true;
      }
    }
    return false;
  }
  function overallScore(){
    let score = 0;
    for(const t of targets){ score += Math.min(1,t.percent || 0) * t.weight; }
    return Math.max(0, Math.min(100, score));
  }
  function updateProgress(){
    const score = overallScore();
    overallFill.style.width = score.toFixed(0) + "%";
    overallText.textContent = Math.round(score) + "%";
    if(score >= 95) starsEl.textContent = "⭐⭐⭐";
    else if(score >= 70) starsEl.textContent = "⭐⭐";
    else if(score >= 35) starsEl.textContent = "⭐";
    else starsEl.textContent = "";
    if(score >= 95 && !completed){
      completed = true;
      ding(); setTimeout(clap,250); confetti();
      setStatus("Excellent! You counted and circled four cats!");
      speak("Excellent! You counted and circled four cats. Great job!");
      saveProgress(score,true);
    } else {
      saveProgress(score,false);
    }
  }
  function confetti(){
    const colors = ["#f04d5f","#31b7ff","#ffd24a","#83e79f","#c66bff"];
    for(let i=0;i<34;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = (Math.random()*0.55) + "s";
      piece.style.transform = "rotate(" + (Math.random()*180) + "deg)";
      document.body.appendChild(piece);
      setTimeout(()=>piece.remove(),2300);
    }
  }
  function clearAll(){
    tctx.clearRect(0,0,NATURAL_W,NATURAL_H);
    targets.forEach(t=>{
      t.complete=false; t.percent=0;
      if(t.samples) t.samples.forEach(s=>s.hit=false);
      if(t.id === "cats"){ t.count=0; t.cats.forEach(c=>c.hit=false); }
      if(t.boxEl){ t.boxEl.classList.remove("done"); t.boxEl.textContent = t.id === "cats" ? "Tap cats: 0/4" : t.label + ": 0%"; }
    });
    currentTarget=null; completed=false; starsEl.textContent="";
    overallFill.style.width="0%"; overallText.textContent="0%";
    setStatus("Trace the red number 1, tap the four cats, then circle the word four.");
    redrawGuide(); saveProgress(0,false);
  }
  function saveProgress(score, done){
    const payload = {pageId, file:pageId + ".html", level:"A", week:1, type:"numbers", activityType:"lesson", score:Math.round(score), tracing:Math.round(score), completed:!!done, stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0, skills:{reading:1,writing:score >= 95 ? 3 : score > 0 ? 1 : 0,listening:1,speaking:0,math:score >= 95 ? 3 : score > 0 ? 1 : 0}, savedAt:new Date().toISOString(), ts:Date.now()};
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(()=>{});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(()=>{});
    }catch(_){}
  }

  buildMini();
  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", () => { clearAll(); speak("Cleared. Start again."); });
  cheerBtn.addEventListener("click", () => { getAudioCtx(); ding(); clap(); confetti(); speak("You can do it! Count the cats and circle four."); });
  homeBtn.addEventListener("click", () => { window.location.href = homeHref; });
  prevBtn.addEventListener("click", () => { window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { window.location.href = nextHref; });
  lineA.addEventListener("click", () => { getAudioCtx(); ding(); speak("I groomed cats."); });
  lineB.addEventListener("click", () => { getAudioCtx(); ding(); speak("They look pretty."); });
  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);
  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try{ speechSynthesis.cancel(); }catch(_){} });
  posterImg.addEventListener("load", () => { resizeCanvases(); clearAll(); }, {once:true});
  window.addEventListener("load", () => { resizeCanvases(); clearAll(); setTimeout(readInstructions, 700); }, {once:true});
})();
</script>
</body>
