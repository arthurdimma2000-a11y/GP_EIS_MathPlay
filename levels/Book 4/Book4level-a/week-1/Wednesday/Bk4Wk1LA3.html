<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA3 - Short Length</title>
<style>
  :root{
    --ink:#282828;
    --paper:#fffaf3;
    --panel:#ffffff;
    --red:#f14859;
    --pink:#f49aa6;
    --blue:#149bdd;
    --green:#19a85f;
    --gold:#ffd25a;
    --purple:#6648d8;
    --shadow:0 16px 36px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);}
  body{display:flex;justify-content:center;align-items:flex-start;padding:8px;overflow-x:hidden;}
  .lesson-card{
    width:min(1010px,100%);
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:8px 8px 14px;
  }
  .poster-wrap{
    position:relative;
    width:min(966px,100%);
    margin:0 auto;
    overflow:visible;
    background:#fffaf3;
    border-radius:12px;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  /* Transparent activity zones placed over the original poster. */
  .trace-zone{
    position:absolute;
    z-index:6;
    touch-action:none;
    cursor:crosshair;
    background:rgba(255,255,255,0.001);
    border-radius:14px;
  }
  .trace-zone canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }
  .trace-zone.is-active{outline:4px solid rgba(20,155,221,.25);}
  .trace-zone.done{outline:4px solid rgba(25,168,95,.26);}

  /* Red (1) beside the sentence "Circle the short tail." */
  .zone-number-one{left:26.45%;top:15.55%;width:4.95%;height:4.05%;}

  /* The original pink circle/short-tail area on the cat. */
  .zone-cat-tail{left:31.20%;top:61.00%;width:17.70%;height:16.05%;}

  /* A gentle warning area over the long dog tail. */
  .zone-dog-tail{
    position:absolute;
    left:81.10%;
    top:31.60%;
    width:8.20%;
    height:30.00%;
    z-index:5;
    background:rgba(255,255,255,0.001);
    border-radius:28px;
    touch-action:none;
  }

  .controls-panel{
    width:min(966px,100%);
    margin:10px auto 0;
    padding:12px;
    border:3px solid rgba(241,72,89,.22);
    border-radius:18px;
    background:linear-gradient(180deg,#fff,#fff7f8);
    box-shadow:0 8px 20px rgba(0,0,0,.08);
  }
  .progress-title{
    text-align:center;
    font-size:clamp(1.02rem,2.6vw,1.35rem);
    font-weight:1000;
    color:#ec4254;
    margin-bottom:8px;
  }
  .progress-row{display:flex;gap:10px;align-items:center;}
  .progress-bar{
    flex:1;
    height:20px;
    background:#ffe0e5;
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.16);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22b7ff,#7cf0a8);
    border-radius:999px;
    transition:width .12s linear;
  }
  .progress-percent{
    min-width:62px;
    text-align:right;
    font-weight:1000;
    color:#1276b4;
  }
  .mini-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:10px;
  }
  .mini-progress{
    background:#fff;
    border:2px solid #ffd1d8;
    border-radius:14px;
    padding:8px 10px;
    text-align:center;
    font-weight:1000;
  }
  .mini-progress span{color:#149bdd;}
  .status{
    min-height:1.5em;
    text-align:center;
    color:#6648d8;
    font-size:clamp(.96rem,2.4vw,1.15rem);
    font-weight:1000;
    margin-top:8px;
  }
  .button-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  button,.btn-home{
    border:none;
    border-radius:999px;
    padding:10px 16px;
    font-size:.96rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
    text-decoration:none;
  }
  button:hover,.btn-home:hover{filter:brightness(1.04);}
  button:active,.btn-home:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.13);}
  .btn-read{background:#ffd966;color:#7a4b00;}
  .btn-clear{background:#e8f1ff;color:#17457b;}
  .btn-prev,.btn-next{background:#ff8a5b;color:#fff;}
  .btn-home{background:#fff0f4;color:#4c78c1;border:2px solid #dbe7ff;display:inline-flex;}
  .footer-note{
    margin-top:8px;
    text-align:center;
    color:#5d5d5d;
    font-weight:800;
    font-size:.9rem;
  }
  .home-float{
    position:fixed;
    right:14px;
    top:14px;
    z-index:50;
    background:#fff;
    color:#e83e51;
    border:3px solid #ffb9c2;
    border-radius:999px;
    padding:9px 14px;
    font-weight:1000;
    text-decoration:none;
    box-shadow:0 8px 20px rgba(0,0,0,.14);
    animation:homeSwing 3s ease-in-out infinite;
    transform-origin:top center;
  }
  @keyframes homeSwing{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(6deg);}
    75%{transform:rotate(-6deg);}
  }
  @media(max-width:620px){
    body{padding:4px;}
    .lesson-card{padding:4px 4px 12px;border-radius:16px;}
    .controls-panel{padding:9px;border-radius:14px;}
    .mini-grid{grid-template-columns:1fr;}
    button,.btn-home{font-size:.84rem;padding:9px 12px;}
    .home-float{font-size:.82rem;padding:8px 10px;right:8px;top:8px;}
  }
</style>
</head>

  let voicesReady = false;

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (_) {}
    try {
      chimeAudio.volume = 0.75;
      chimeAudio.play().then(() => {
        chimeAudio.pause();
        chimeAudio.currentTime = 0;
      }).catch(() => {});
    } catch (_) {}
  }

  function playTraceTick() {
    try {
      unlockAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(740, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1040, audioCtx.currentTime + 0.07);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.085, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.095);
    } catch (_) {}
  }

  function playChime() {
    try {
      unlockAudio();
      chimeAudio.pause();
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 0.9;
      chimeAudio.play().catch(() => {});
    } catch (_) {}
  }

  function stopSpeaking() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  }

  function pickAmericanFemaleVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    const preferredNames = [
      "Microsoft Jenny", "Microsoft Aria", "Microsoft Zira",
      "Google US English", "Samantha", "Victoria", "Karen"
    ];
    for (const name of preferredNames) {
      const v = voices.find(voice => voice.name && voice.name.toLowerCase().includes(name.toLowerCase()));
      if (v) return v;
    }
    return voices.find(v => /en[-_]US/i.test(v.lang || "") && /female|woman|girl|jenny|aria|zira|samantha|victoria/i.test(v.name || "")) ||
           voices.find(v => /en[-_]US/i.test(v.lang || "")) ||
           voices.find(v => /^en/i.test(v.lang || "")) ||
           null;
  }

  function speak(text, options) {
    if (!("speechSynthesis" in window)) return;
    stopSpeaking();
    const utterance = new SpeechSynthesisUtterance(text);
    const voice = pickAmericanFemaleVoice();
    if (voice) utterance.voice = voice;
    utterance.lang = "en-US";
    utterance.rate = options && options.rate ? options.rate : 0.88;
    utterance.pitch = options && options.pitch ? options.pitch : 1.12;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
  }

  function cheerful(text) {
    playChime();
    setTimeout(() => speak(text, {rate:0.92, pitch:1.18}), 250);
  }

  function distanceToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    if (dx === 0 && dy === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    const x = x1 + t * dx;
    const y = y1 + t * dy;
    return Math.hypot(px - x, py - y);
  }

  function makeNumberOneSamples(w, h) {
    const pts = [];
    const path = [
      {x:w*0.38, y:h*0.22},
      {x:w*0.55, y:h*0.12},
      {x:w*0.55, y:h*0.84}
    ];
    for (let p=0; p<path.length-1; p++) {
      const a = path[p], b = path[p+1];
      const steps = 28;
      for (let i=0;i<=steps;i++) {
        const t = i / steps;
        pts.push({x:a.x + (b.x-a.x)*t, y:a.y + (b.y-a.y)*t});
      }
    }
    return pts;
  }

  function makeCircleSamples(w, h) {
    const pts = [];
    const cx = w * 0.50;
    const cy = h * 0.51;
    const rx = w * 0.39;
    const ry = h * 0.42;
    const count = 110;
    for (let i=0; i<count; i++) {
      const t = (Math.PI * 2 * i) / count;
      pts.push({x:cx + Math.cos(t) * rx, y:cy + Math.sin(t) * ry});
    }
    return pts;
  }

  function createTracePad(zone) {
    const canvas = zone.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const index = Number(zone.dataset.index);
    const kind = zone.dataset.kind;
    let samples = [];
    let covered = [];
    let drawing = false;
    let last = null;
    let lastSoundAt = 0;

    function resize() {
      const rect = zone.getBoundingClientRect();
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = kind === "circle" ? Math.max(8, Math.min(16, width * 0.075)) : Math.max(7, Math.min(13, width * 0.17));
      ctx.strokeStyle = kind === "circle" ? "rgba(255, 104, 74, 0.95)" : "rgba(25, 168, 95, 0.95)";
      samples = kind === "circle" ? makeCircleSamples(width, height) : makeNumberOneSamples(width, height);
      covered = samples.map(() => false);
      reset(false);
    }

    function pointFromEvent(e) {
      const rect = zone.getBoundingClientRect();
      return {x:e.clientX - rect.left, y:e.clientY - rect.top};
    }

    function coverageThreshold() {
      const rect = zone.getBoundingClientRect();
      if (kind === "circle") return Math.max(16, Math.min(28, rect.width * 0.16));
      return Math.max(9, Math.min(18, rect.width * 0.28));
    }

    function markCoverage(a, b) {
      const threshold = coverageThreshold();
      for (let i=0; i<samples.length; i++) {
        const sp = samples[i];
        const d = b ? distanceToSegment(sp.x, sp.y, a.x, a.y, b.x, b.y) : Math.hypot(sp.x-a.x, sp.y-a.y);
        if (d <= threshold) covered[i] = true;
      }
      const hit = covered.filter(Boolean).length;
      const pct = Math.min(100, Math.round((hit / Math.max(1, covered.length)) * 100));
      if (pct > taskPercents[index]) {
        taskPercents[index] = pct;
        document.getElementById("taskPct" + index).textContent = pct + "%";
        updateOverall();

        if (pct - lastSoundAt >= 7) {
          playTraceTick();
          lastSoundAt = pct;
        }

        if (pct >= 92 && !taskDone[index]) {
          taskDone[index] = true;
          zone.classList.add("done");
          if (kind === "number1") {
            cheerful("Nice tracing! Now circle the cat's short tail.");
            setStatus("Great! Now circle the cat's short tail.");
          } else {
            cheerful("Excellent! The cat has a short tail. The dog has a long tail.");
            setStatus("Excellent! You circled the cat's short tail.");
          }
          updateOverall();
        }
      }
    }

    function begin(p) {
      unlockAudio();
      drawing = true;
      last = p;
      zone.classList.add("is-active");
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      markCoverage(p, null);
    }

    function draw(p) {
      if (!drawing || !last) return;
      const dist = Math.hypot(p.x - last.x, p.y - last.y);
      if (dist < 0.2) return;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      markCoverage(last, p);
      last = p;
    }

    function end(e) {
      if (e && typeof zone.releasePointerCapture === "function") {
        try { zone.releasePointerCapture(e.pointerId); } catch(_) {}
      }
      drawing = false;
      last = null;
      zone.classList.remove("is-active");
    }

    function reset(update=true) {
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const width = canvas.width / ratio;
      const height = canvas.height / ratio;
      ctx.clearRect(0,0,width,height);
      covered = samples.map(() => false);
      drawing = false;
      last = null;
      lastSoundAt = 0;
      taskPercents[index] = 0;
      taskDone[index] = false;
      zone.classList.remove("done", "is-active");
      const el = document.getElementById("taskPct" + index);
      if (el) el.textContent = "0%";
      if (update) updateOverall();
    }

    zone.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (typeof zone.setPointerCapture === "function") {
        try { zone.setPointerCapture(e.pointerId); } catch(_) {}
      }
      begin(pointFromEvent(e));
    }, {passive:false});

    zone.addEventListener("pointermove", e => {
      if (!drawing) return;
      e.preventDefault();
      draw(pointFromEvent(e));
    }, {passive:false});

    zone.addEventListener("pointerup", end);
    zone.addEventListener("pointercancel", end);
    zone.addEventListener("pointerleave", end);

    resize();
    return {resize, reset};
  }

  function updateOverall() {
    const overall = Math.round(taskPercents[0] * weights[0] + taskPercents[1] * weights[1]);
    progressPercent.textContent = overall + "%";
    progressFill.style.width = overall + "%";

    if (overall >= 95 && !finalCelebrated) {
      finalCelebrated = true;
      setStatus("Wonderful work! You finished the short length lesson.");
      setTimeout(() => cheerful("Hooray! Wonderful work! You found the short tail."), 600);
      try {
        localStorage.setItem("Bk2LA3_ShortLength_progress", JSON.stringify({
          percent: 100,
          completed: true,
          updatedAt: new Date().toISOString()
        }));
      } catch (_) {}
    } else {
      try {
        localStorage.setItem("Bk2LA3_ShortLength_progress", JSON.stringify({
          percent: overall,
          completed: overall >= 95,
          updatedAt: new Date().toISOString()
        }));
      } catch (_) {}
    }
  }

  const pads = Array.from(document.querySelectorAll(".trace-zone")).map(createTracePad);

  function readInstructions() {
    unlockAudio();
    setStatus("Trace the red number 1. Then circle the cat's short tail.");
    speak("Short Length. Week one. First, trace the number one beside the instruction. Then circle the cat's short tail. The cat has a short tail. The dog has a long tail. Circle only the short tail.", {rate:0.86, pitch:1.14});
  }

  function clearAll() {
    stopSpeaking();
    pads.forEach(p => p.reset(false));
    taskPercents[0] = 0;
    taskPercents[1] = 0;
    taskDone[0] = false;
    taskDone[1] = false;
    finalCelebrated = false;
    document.getElementById("taskPct0").textContent = "0%";
    document.getElementById("taskPct1").textContent = "0%";
    progressPercent.textContent = "0%";
    progressFill.style.width = "0%";
    setStatus("Listen, trace the number 1, then circle the cat's short tail.");
    try {
      localStorage.setItem("Bk2LA3_ShortLength_progress", JSON.stringify({
        percent: 0,
        completed: false,
        updatedAt: new Date().toISOString()
      }));
    } catch (_) {}
  }

  function warnLongTail(e) {
    e.preventDefault();
    unlockAudio();
    setStatus("That is the dog with the long tail. Find the cat's short tail.");
    playTraceTick();
    speak("Oops! That is the long tail. Please circle the cat's short tail.", {rate:0.9, pitch:1.12});
  }

  dogTailWarning.addEventListener("pointerdown", warnLongTail, {passive:false});

  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", clearAll);
  prevBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = PREVIOUS_PAGE; });
  nextBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = NEXT_PAGE; });

  window.addEventListener("resize", () => pads.forEach(p => p.resize()));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", () => pads.forEach(p => p.resize()));

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
  }

  window.addEventListener("load", () => {
    clearAll();
    setTimeout(readInstructions, 700);
  }, {once:true});

  document.addEventListener("pointerdown", unlockAudio, {once:true, passive:true});
})();
</script>
</body>
</html>
