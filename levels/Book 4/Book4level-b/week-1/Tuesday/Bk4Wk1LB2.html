<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Lengths - Non-Standard Units</title>
<style>
  :root{
    --ink:#242126;
    --paper:#fff8f2;
    --card:#ffffff;
    --red:#f04a59;
    --pink:#f8ccd6;
    --green:#35ad59;
    --gold:#ffd34e;
    --blue:#5f8ccf;
    --deep:#14395a;
    --good:#218c53;
    --bad:#c62828;
    --shadow:0 12px 28px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Trebuchet MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink)}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;background-image:linear-gradient(#f2e4d7 1px,transparent 1px),linear-gradient(90deg,#f2e4d7 1px,transparent 1px);background-size:26px 26px}
  .app{position:relative;width:min(980px,100%);background:rgba(255,255,255,.96);border-radius:24px;box-shadow:var(--shadow);padding:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .home-btn{text-decoration:none;border:0;background:#fff;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.12);font-size:1.45rem;font-weight:1000;color:var(--red);width:56px;height:56px;display:inline-flex;align-items:center;justify-content:center}
  .page-title{flex:1;text-align:center;margin:0;font-size:clamp(1.45rem,4vw,2.6rem);font-weight:1000;color:var(--red);text-shadow:0 3px 0 #fff}
  .poster-card{position:relative;width:min(904px,100%);margin:0 auto;border-radius:22px;overflow:hidden;background:#f7ccd7;box-shadow:0 9px 22px rgba(0,0,0,.12);touch-action:manipulation}
  .poster-image{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .focus-zone{position:absolute;z-index:4;border-radius:28px;pointer-events:none;opacity:0;transform:scale(.96);transition:opacity .2s ease, transform .2s ease;box-shadow:0 0 0 0 transparent}
  .focus-zone.show{opacity:1;transform:scale(1);outline:5px solid rgba(255,255,255,.95);box-shadow:0 0 0 7px rgba(255,211,78,.50),0 0 22px rgba(240,74,89,.38)}
  .focus-zone.done{opacity:1;transform:scale(1);outline:5px solid rgba(40,174,86,.92);box-shadow:0 0 0 7px rgba(91,215,125,.28)}
  .focus-kid{left:9.8%;top:34.5%;width:27.8%;height:12.2%;border-radius:999px}
  .focus-farmer{left:40.0%;top:38.7%;width:29.0%;height:8.2%;border-radius:999px}
  .focus-sentence{left:7.0%;top:84.6%;width:84.5%;height:8.5%;border-radius:22px}
  .poster-mic{position:absolute;z-index:8;width:56px;height:56px;border:4px solid #fff;border-radius:999px;background:linear-gradient(180deg,#fff,#e8f8ff);padding:3px;box-shadow:0 6px 0 rgba(0,0,0,.16),0 0 14px rgba(255,211,78,.55);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .13s ease, filter .13s ease}
  .poster-mic img,.big-mic img{width:100%;height:100%;object-fit:contain;display:block}
  .poster-mic:hover,.big-mic:hover,.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
  .poster-mic:active,.big-mic:active,.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
  .poster-mic.done{background:#dfffe9;border-color:#21a957}
  .poster-mic.active{animation:pulseMic 1s ease-in-out infinite;border-color:var(--gold)}
  @keyframes pulseMic{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .mic-kid{left:28.2%;top:44.2%}
  .mic-farmer{left:66.0%;top:43.5%}
  .mic-sentence{left:47.2%;top:92.5%;width:52px;height:52px}
  .lesson-panel{width:min(904px,100%);margin:12px auto 0;border:4px solid rgba(240,74,89,.22);border-radius:20px;background:linear-gradient(180deg,#fff,#fff7fb);padding:12px;display:grid;gap:10px}
  .progress-wrap{display:grid;gap:6px;justify-items:center}
  .progress-label{font-size:clamp(.95rem,2vw,1.1rem);font-weight:1000;color:#9b3140;text-align:center}
  .progress-bar{width:min(540px,94%);height:16px;border-radius:999px;background:#fde3e9;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);overflow:hidden}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ff7282,#ffd34e,#55d47a);transition:width .2s ease-out}
  .prompt-card{border-radius:18px;background:#fff;border:3px dashed rgba(95,140,207,.30);padding:12px;display:grid;gap:8px}
  .current-line{font-size:clamp(1.15rem,3vw,1.75rem);font-weight:1000;text-align:center;color:#222}
  .status{min-height:1.4em;text-align:center;font-weight:1000;color:#5f4bb0;font-size:clamp(.95rem,2.2vw,1.1rem)}
  .heard{min-height:1.25em;text-align:center;font-weight:900;color:var(--good);font-size:clamp(.95rem,2.2vw,1.08rem)}
  .controls{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}
  .btn,.big-mic{border:0;border-radius:999px;cursor:pointer;font-weight:1000;box-shadow:0 5px 0 rgba(0,0,0,.14);transition:transform .13s ease,filter .13s ease}
  .btn{padding:11px 16px;font-size:.98rem}
  .btn.read{background:#ff8a5b;color:white}
  .btn.start{background:#ffd34e;color:#8b5a00}
  .btn.clear{background:#dcecff;color:#244b7d}
  .btn.cheer{background:#dfffe9;color:#166c38}
  .btn.nav{background:#f6edf0;color:#9b3140}
  .big-mic{width:68px;height:68px;background:radial-gradient(circle at 30% 25%,#fff,#dff3ff);padding:6px;display:inline-flex;align-items:center;justify-content:center}
  .big-mic.busy,.poster-mic.busy{opacity:.65;pointer-events:none}
  .stars{text-align:center;min-height:1.2em;color:var(--gold);font-size:clamp(1.25rem,3.4vw,2rem);text-shadow:0 2px 0 #a87200,0 5px 10px rgba(0,0,0,.22);letter-spacing:3px}
  .small-note{text-align:center;color:#6c6268;font-size:.92rem}
  .confetti-piece{position:fixed;top:-24px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.75s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1}}
  @media (max-width:600px){body{padding:6px}.app{border-radius:16px;padding:8px}.home-btn{width:48px;height:48px}.poster-mic{width:44px;height:44px;border-width:3px}.mic-sentence{width:42px;height:42px}.lesson-panel{padding:10px}}
</style>
</head>

    focus:[document.getElementById("focus0"), document.getElementById("focus1"), document.getElementById("focus2")],
    posterMics:Array.from(document.querySelectorAll(".poster-mic"))
  };

  let current = 0;
  let busy = false;
  let attempts = [0,0,0];
  let done = [false,false,false];
  let audioPrimed = false;

  function setStatus(text, color){
    els.status.textContent = text;
    els.status.style.color = color || "#5f4bb0";
  }

  function primeAudio(){
    if(audioPrimed) return;
    audioPrimed = true;
    try{
      const a = new Audio(CHIME_SRC);
      a.volume = 0.01;
      a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
    }catch(_e){}
  }

  function playChime(){
    try{
      const a = new Audio(CHIME_SRC);
      a.volume = 0.65;
      a.play().catch(() => {});
    }catch(_e){}
  }

  function chooseVoice(){
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    const preferredNames = /Jenny|Aria|Samantha|Ava|Salli|Zira|Female|Google US English/i;
    return voices.find(v => /en-US/i.test(v.lang) && preferredNames.test(v.name)) ||
           voices.find(v => /en-US/i.test(v.lang)) ||
           voices.find(v => /^en/i.test(v.lang)) || null;
  }

  function speak(text, opts={}){
    return new Promise(resolve => {
      if(!("speechSynthesis" in window)){ resolve(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = opts.rate || 0.86;
      u.pitch = opts.pitch || 1.12;
      u.volume = 1;
      const voice = chooseVoice();
      if(voice) u.voice = voice;
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.speak(u);
      setTimeout(resolve, Math.max(2200, text.length * 85));
    });
  }

  function stopSpeaking(){
    try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(_e){}
  }

  function normalWords(text){
    return String(text || "")
      .toLowerCase()
      .replace(/[’']/g, "")
      .replace(/[^a-z0-9]+/g, " ")
      .trim()
      .split(/\s+/)
      .filter(Boolean);
  }

  function matchPercent(expected, heard){
    const exp = normalWords(expected);
    const got = normalWords(heard);
    if(!exp.length || !got.length) return 0;
    let hits = 0;
    const used = new Array(got.length).fill(false);
    for(const word of exp){
      const idx = got.findIndex((g,i) => !used[i] && (g === word || g.includes(word) || word.includes(g)));
      if(idx >= 0){ used[idx] = true; hits++; }
    }
    return Math.round((hits / exp.length) * 100);
  }

  function listenOnce(timeoutMs=7500){
    return new Promise(resolve => {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!Rec){ resolve({supported:false, transcript:""}); return; }
      const rec = new Rec();
      let finished = false;
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      const timer = setTimeout(() => {
        if(finished) return;
        finished = true;
        try{rec.stop();}catch(_e){}
        resolve({supported:true, transcript:""});
      }, timeoutMs);
      rec.onresult = e => {
        let transcript = "";
        try{ transcript = Array.from(e.results).map(r => r[0].transcript).join(" "); }catch(_e){}
        if(finished) return;
        finished = true;
        clearTimeout(timer);
        resolve({supported:true, transcript});
      };
      rec.onerror = () => {
        if(finished) return;
        finished = true;
        clearTimeout(timer);
        resolve({supported:true, transcript:""});
      };
      rec.onend = () => {
        if(finished) return;
        finished = true;
        clearTimeout(timer);
        resolve({supported:true, transcript:""});
      };
      try{ rec.start(); }catch(_e){
        clearTimeout(timer);
        resolve({supported:true, transcript:""});
      }
    });
  }

  function updateFocus(index){
    els.focus.forEach((z,i) => {
      z.classList.toggle("show", i === index && !done[i]);
      z.classList.toggle("done", done[i]);
    });
    els.posterMics.forEach((btn,i) => {
      btn.classList.toggle("active", i === index && !done[i]);
      btn.classList.toggle("done", done[i]);
    });
  }

  function updateProgress(){
    const pct = Math.round((done.filter(Boolean).length / LINES.length) * 100);
    els.progressLabel.textContent = `Speaking Progress: ${pct}%`;
    els.progressFill.style.width = pct + "%";
    const stars = done.map(v => v ? "★" : "☆").join(" ");
    els.stars.textContent = stars;
    saveProgress();
  }

  function setCurrent(index){
    current = Math.max(0, Math.min(LINES.length - 1, index));
    const line = LINES[current];
    els.currentLine.textContent = `${line.role}: “${line.text}”`;
    els.heard.textContent = "";
    updateFocus(current);
    updateProgress();
  }

  function nextNotDone(fromIndex=0){
    for(let i=fromIndex; i<done.length; i++) if(!done[i]) return i;
    for(let i=0; i<done.length; i++) if(!done[i]) return i;
    return -1;
  }

  async function readInstructions(){
    primeAudio();
    stopSpeaking();
    setCurrent(current);
    setStatus("Listen to the American voice instruction.");
    await speak("Welcome to Lengths, Non-standard Units. Look at the poster. The child says, How is the weather today? The farmer says, It's sunny today. Then say, I plant seeds in the pots. Tap each microphone on the poster. Listen first, then repeat clearly.");
    setStatus("Tap the first microphone near the green air bubble.");
  }

  async function practice(index){
    if(busy) return;
    primeAudio();
    busy = true;
    els.bigMic.classList.add("busy");
    els.posterMics.forEach(b => b.classList.add("busy"));
    stopSpeaking();
    setCurrent(index);
    const line = LINES[index];
    try{
      attempts[index] += 1;
      setStatus(`Listen. ${line.role} says: ${line.text}`);
      await speak(line.text);
      setStatus("Now repeat it. I am listening...");
      const heard = await listenOnce(7800);
      if(!heard.supported){
        els.heard.textContent = "Microphone checking is not supported here. Please use Chrome or Edge, or repeat aloud after the voice.";
        els.heard.style.color = "#b06a00";
        setStatus("Listen and repeat aloud. Tap Start Conversation to continue.", "#b06a00");
        return;
      }
      const transcript = (heard.transcript || "").trim();
      const pct = matchPercent(line.text, transcript);
      els.heard.textContent = transcript ? `I heard: “${transcript}”  • Match: ${pct}%` : "I did not hear you clearly.";
      const specialSunny = index === 1 && /sunny/i.test(transcript || "");
      const ok = pct >= 50 || specialSunny;
      if(ok){
        done[index] = true;
        playChime();
        els.heard.style.color = "#218c53";
        setStatus("Great job! That air bubble is complete.", "#218c53");
        await speak("Great job!");
        updateProgress();
        const next = nextNotDone(index + 1);
        if(next >= 0){
          setCurrent(next);
          setStatus("Tap the next microphone.");
        } else {
          finishLesson();
        }
      } else {
        els.heard.style.color = "#c62828";
        if(attempts[index] >= 3){
          setStatus("Nice try. Listen again and move to the next line when you are ready.", "#b06a00");
          await speak("Nice try. Listen again and try once more later.");
        } else {
          setStatus(`Sorry, try again. Tap the microphone again. Try ${attempts[index]} of 3.`, "#c62828");
          await speak("Sorry, try again.");
        }
      }
    } finally {
      busy = false;
      els.bigMic.classList.remove("busy");
      els.posterMics.forEach(b => b.classList.remove("busy"));
      updateFocus(current);
      saveProgress();
    }
  }

  async function startConversation(){
    primeAudio();
    const next = nextNotDone(0);
    if(next < 0){ finishLesson(); return; }
    await practice(next);
  }

  function finishLesson(){
    updateProgress();
    els.currentLine.textContent = "Wonderful! You finished the farmer conversation.";
    setStatus("Excellent! You practiced all the poster sentences.", "#218c53");
    playChime();
    confetti();
    speak("Excellent! You practiced all the poster sentences. I plant seeds in the pots.");
  }

  function cheer(){
    primeAudio();
    playChime();
    confetti();
    setStatus("You can do it! Happy learning!", "#218c53");
    speak("You can do it! Happy learning!");
  }

  function resetLesson(){
    stopSpeaking();
    attempts = [0,0,0];
    done = [false,false,false];
    current = 0;
    els.heard.textContent = "";
    setCurrent(0);
    setStatus("Reset complete. Tap the first microphone near the green air bubble.");
    updateProgress();
  }

  function confetti(){
    const colors = ["#ff4b5c","#ffd34e","#42d77d","#63a8ff","#f48ad3"];
    for(let i=0;i<42;i++){
      const piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*0.25) + "s";
      piece.style.transform = `rotate(${Math.random()*180}deg)`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2100);
    }
  }

  function saveProgress(){
    try{
      const score = Math.round((done.filter(Boolean).length / LINES.length) * 100);
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = {
        pageId: PAGE_ID,
        file: "LA8.html",
        title: "Lengths - Non-Standard Units",
        level: "A",
        type: "lesson",
        activityType: "speaking",
        score,
        speaking: score,
        completed: score >= 100,
        stars: score >= 100 ? 3 : score >= 67 ? 2 : score >= 34 ? 1 : 0,
        savedAt: new Date().toISOString(),
        ts: Date.now()
      };
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", "LA8.html");
    }catch(_e){}
  }

  els.posterMics.forEach(btn => btn.addEventListener("click", () => practice(Number(btn.dataset.step)), {passive:true}));
  els.bigMic.addEventListener("click", () => practice(current), {passive:true});
  els.startBtn.addEventListener("click", startConversation);
  els.readBtn.addEventListener("click", readInstructions);
  els.soundBtn.addEventListener("click", readInstructions);
  els.cheerBtn.addEventListener("click", cheer);
  els.resetBtn.addEventListener("click", resetLesson);
  els.prevBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = PREVIOUS_PAGE; });
  els.nextBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = NEXT_PAGE; });
  els.homeBtn.addEventListener("click", stopSpeaking);
  window.addEventListener("beforeunload", stopSpeaking);
  if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

  setCurrent(0);
  window.addEventListener("load", () => setTimeout(readInstructions, 650), {once:true});
})();
</script>
</body>
