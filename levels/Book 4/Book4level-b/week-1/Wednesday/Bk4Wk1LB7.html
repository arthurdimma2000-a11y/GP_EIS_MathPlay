<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA7 - Numbers: Add by One</title>
<style>
  :root{
    --ink:#2d2d2d;
    --paper:#fffaf2;
    --blue:#5d86c9;
    --pink:#f04d5f;
    --yellow:#f7df8a;
    --green:#19a85b;
    --purple:#6c4bbf;
    --gold:#ffd24a;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#ece2d3 1px,transparent 1px),linear-gradient(90deg,#ece2d3 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{width:min(1000px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 14px;}
  .poster-wrap{
    position:relative;
    width:min(966px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
  }
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .trace-svg,.trace-canvas{position:absolute;inset:0;width:100%;height:100%;background:transparent;}
  .trace-svg{z-index:4;pointer-events:none;}
  .trace-canvas{z-index:5;touch-action:none;cursor:crosshair;}
  .guide-path{fill:none;stroke:rgba(0,166,255,.33);stroke-width:18;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.5 31;}
  .guide-path.active{stroke:rgba(255,210,74,.72);stroke-width:24;filter:drop-shadow(0 0 6px rgba(255,180,0,.7));}
  .guide-path.done{stroke:rgba(25,168,91,.35);}
  .panel{
    width:min(966px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff7fb);
    border:3px solid rgba(93,134,201,.25);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }
  .progress-title{text-align:center;font-size:clamp(1rem,2.6vw,1.3rem);font-weight:1000;color:#3f5fa8;margin-bottom:8px;}
  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-bar{height:18px;flex:1;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#31b7ff,#83e79f);transition:width .12s ease-out;}
  .progress-number{min-width:58px;text-align:right;font-weight:1000;color:#175ca8;font-size:1.05rem;}
  .mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;margin-top:9px;}
  .mini{background:#fff;border:2px solid #e7edf8;border-radius:12px;text-align:center;padding:6px 4px;font-weight:1000;font-size:.84rem;color:#444;}
  .mini span{color:#f04d5f;}
  .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .stars{text-align:center;min-height:1.25em;margin-top:6px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{min-height:1.45em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);}
  .buttons{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s ease,filter .1s ease;}
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:#f04d5f;color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .btn{font-size:.85rem;padding:9px 12px;}
  }
</style>
</head>

  const overallFill = document.getElementById("overallFill");
  const statusEl = document.getElementById("status");
  const starsEl = document.getElementById("stars");
  const chimeAudio = document.getElementById("chimeAudio");
  const homeBtn = document.getElementById("homeBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const readBtn = document.getElementById("readBtn");
  const clearBtn = document.getElementById("clearBtn");
  const cheerBtn = document.getElementById("cheerBtn");

  const targets = [
    {id:"left1-row1", label:"Row 1: trace 1", type:"1", box:{x:360,y:352,w:50,h:92}},
    {id:"answer6", label:"Answer: trace 6", type:"6", box:{x:720,y:350,w:80,h:115}},
    {id:"left1-row2", label:"Row 2: trace 1", type:"1", box:{x:360,y:548,w:50,h:100}},
    {id:"answer7", label:"Answer: trace 7", type:"7", box:{x:720,y:545,w:85,h:105}},
    {id:"left1-row3", label:"Row 3: trace 1", type:"1", box:{x:360,y:746,w:50,h:100}},
    {id:"answer8", label:"Answer: trace 8", type:"8", box:{x:720,y:740,w:85,h:110}},
    {id:"left1-row4", label:"Row 4: trace 1", type:"1", box:{x:360,y:943,w:50,h:102}},
    {id:"answer9", label:"Answer: trace 9", type:"9", box:{x:720,y:936,w:85,h:110}},
    {id:"left1-row5", label:"Row 5: trace 1", type:"1", box:{x:360,y:1139,w:50,h:100}},
    {id:"answer10-1", label:"Answer 10: trace 1", type:"1", box:{x:700,y:1129,w:55,h:103}},
    {id:"answer10-0", label:"Answer 10: trace 0", type:"0", box:{x:762,y:1124,w:73,h:110}}
  ];

  let dpr = 1;
  let drawing = false;
  let lastPoint = null;
  let lastRawPoint = null;
  let finalCelebrated = false;
  let audioCtx = null;
  let lastTick = 0;
  const strokes = [];
  let currentStroke = null;

  function pathData(type, b){
    const x=b.x, y=b.y, w=b.w, h=b.h;
    if(type === "1"){
      return `M ${x+w*.35} ${y+h*.26} L ${x+w*.56} ${y+h*.12} L ${x+w*.56} ${y+h*.86}`;
    }
    if(type === "6"){
      return `M ${x+w*.72} ${y+h*.08} C ${x+w*.36} ${y+h*.08}, ${x+w*.18} ${y+h*.34}, ${x+w*.22} ${y+h*.58} C ${x+w*.28} ${y+h*.92}, ${x+w*.68} ${y+h*.95}, ${x+w*.82} ${y+h*.73} C ${x+w*.95} ${y+h*.51}, ${x+w*.67} ${y+h*.39}, ${x+w*.45} ${y+h*.52} C ${x+w*.25} ${y+h*.64}, ${x+w*.34} ${y+h*.86}, ${x+w*.58} ${y+h*.87}`;
    }
    if(type === "7"){
      return `M ${x+w*.22} ${y+h*.12} L ${x+w*.84} ${y+h*.12} L ${x+w*.47} ${y+h*.88}`;
    }
    if(type === "8"){
      const cx=x+w*.52;
      return `M ${cx} ${y+h*.11} C ${x+w*.24} ${y+h*.12}, ${x+w*.22} ${y+h*.43}, ${cx} ${y+h*.49} C ${x+w*.82} ${y+h*.43}, ${x+w*.80} ${y+h*.12}, ${cx} ${y+h*.11} M ${cx} ${y+h*.49} C ${x+w*.19} ${y+h*.56}, ${x+w*.20} ${y+h*.91}, ${cx} ${y+h*.90} C ${x+w*.84} ${y+h*.91}, ${x+w*.83} ${y+h*.56}, ${cx} ${y+h*.49}`;
    }
    if(type === "9"){
      return `M ${x+w*.55} ${y+h*.88} L ${x+w*.58} ${y+h*.48} C ${x+w*.82} ${y+h*.43}, ${x+w*.82} ${y+h*.12}, ${x+w*.53} ${y+h*.11} C ${x+w*.24} ${y+h*.12}, ${x+w*.22} ${y+h*.43}, ${x+w*.51} ${y+h*.49} C ${x+w*.72} ${y+h*.54}, ${x+w*.82} ${y+h*.37}, ${x+w*.65} ${y+h*.20}`;
    }
    if(type === "0"){
      const cx=x+w*.52;
      return `M ${cx} ${y+h*.10} C ${x+w*.20} ${y+h*.10}, ${x+w*.18} ${y+h*.90}, ${cx} ${y+h*.90} C ${x+w*.84} ${y+h*.90}, ${x+w*.84} ${y+h*.10}, ${cx} ${y+h*.10}`;
    }
    return "";
  }

  function setStatus(text){ statusEl.textContent = text || ""; }

  function makeTargetPaths(){
    guideGroup.innerHTML = "";
    targets.forEach((t, index) => {
      t.d = pathData(t.type, t.box);
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", t.d);
      path.setAttribute("class", "guide-path" + (index === 0 ? " active" : ""));
      path.dataset.id = t.id;
      guideGroup.appendChild(path);
      t.pathEl = path;
      let total = 1;
      try { total = Math.max(1, path.getTotalLength()); } catch(_) {}
      const count = Math.max(12, Math.ceil(total / 11));
      t.samples = [];
      for(let i=0;i<count;i++){
        const len = (i/(count-1)) * total;
        let p = {x:t.box.x+t.box.w*.5, y:t.box.y+t.box.h*.5};
        try { p = path.getPointAtLength(len); } catch(_) {}
        t.samples.push({x:p.x, y:p.y, hit:false});
      }
      t.percent = 0;
      t.complete = false;
      const mini = document.createElement("div");
      mini.className = "mini";
      mini.innerHTML = `${t.label}<br><span>0%</span>`;
      miniGrid.appendChild(mini);
      t.miniEl = mini;
      t.pctEl = mini.querySelector("span");
    });
  }

  function resizeCanvas(){
    const rect = posterWrap.getBoundingClientRect();
    dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    traceCanvas.width = Math.max(1, Math.round(rect.width * dpr));
    traceCanvas.height = Math.max(1, Math.round(rect.height * dpr));
    traceCanvas.style.width = rect.width + "px";
    traceCanvas.style.height = rect.height + "px";
    tctx.setTransform((rect.width*dpr)/NATURAL_W,0,0,(rect.height*dpr)/NATURAL_H,0,0);
    redrawStrokes();
  }

  function canvasPoint(evt){
    const rect = posterWrap.getBoundingClientRect();
    return {
      x: ((evt.clientX - rect.left) / rect.width) * NATURAL_W,
      y: ((evt.clientY - rect.top) / rect.height) * NATURAL_H
    };
  }

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function nearestDistance(p){
    let best = Infinity;
    for(const t of targets){
      for(const s of t.samples){
        const d = Math.hypot(p.x-s.x,p.y-s.y);
        if(d < best) best = d;
      }
    }
    return best;
  }

  function markSamplesAround(p){
    let marked = false;
    for(const t of targets){
      let newHits = 0;
      for(const s of t.samples){
        if(!s.hit && Math.hypot(p.x-s.x,p.y-s.y) <= HIT_RADIUS){
          s.hit = true;
          marked = true;
          newHits++;
        }
      }
      if(newHits) updateTarget(t);
    }
    return marked;
  }

  function traceSegment(a,b){
    const d = dist(a,b);
    const steps = Math.max(1, Math.ceil(d / 8));
    let near = false;
    for(let i=0;i<=steps;i++){
      const p = {x:a.x+(b.x-a.x)*i/steps, y:a.y+(b.y-a.y)*i/steps};
      if(nearestDistance(p) <= HIT_RADIUS) near = true;
      markSamplesAround(p);
    }
    return near;
  }

  function drawTraceLine(a,b){
    tctx.save();
    tctx.lineWidth = 16;
    tctx.lineCap = "round";
    tctx.lineJoin = "round";
    tctx.strokeStyle = "rgba(244, 77, 95, .92)";
    tctx.shadowColor = "rgba(255,255,255,.96)";
    tctx.shadowBlur = 3;
    tctx.beginPath();
    tctx.moveTo(a.x,a.y);
    tctx.lineTo(b.x,b.y);
    tctx.stroke();
    tctx.restore();
  }

  function redrawStrokes(){
    tctx.clearRect(0,0,NATURAL_W,NATURAL_H);
    for(const stroke of strokes){
      for(let i=1;i<stroke.length;i++) drawTraceLine(stroke[i-1], stroke[i]);
    }
    if(currentStroke){
      for(let i=1;i<currentStroke.length;i++) drawTraceLine(currentStroke[i-1], currentStroke[i]);
    }
  }

  function updateTarget(t){
    const hit = t.samples.filter(s => s.hit).length;
    const pct = Math.round((hit / t.samples.length) * 100);
    t.percent = pct;
    if(t.pctEl) t.pctEl.textContent = pct + "%";
    if(!t.complete && hit / t.samples.length >= COMPLETE_RATIO){
      t.complete = true;
      t.pathEl.classList.add("done");
      if(t.miniEl) t.miniEl.classList.add("done");
      playChime();
      cheerFor(t.type);
    }
    updateOverall();
  }

  function updateOverall(){
    const all = targets.reduce((sum,t)=>sum+t.samples.length,0);
    const hit = targets.reduce((sum,t)=>sum+t.samples.filter(s=>s.hit).length,0);
    const pct = Math.min(100, Math.round((hit/all)*100));
    overallText.textContent = pct + "%";
    overallFill.style.width = pct + "%";
    const stars = pct >= 95 ? "⭐⭐⭐" : pct >= 70 ? "⭐⭐" : pct >= 35 ? "⭐" : "";
    starsEl.textContent = stars;
    saveProgress(pct, pct >= 95);
    updateActiveGuide();
    if(pct >= 95 && !finalCelebrated){
      finalCelebrated = true;
      setStatus("Excellent! You traced all the numbers and added by one!");
      playChime();
      clap();
      confetti();
      speak("Excellent work! You traced all the numbers. You counted the vegetables and added by one.");
    } else if(pct > 0 && pct < 95){
      setStatus("Good tracing! Keep following the dotted numbers.");
    }
  }

  function updateActiveGuide(){
    let firstOpen = targets.find(t => !t.complete) || targets[targets.length-1];
    targets.forEach(t => t.pathEl.classList.toggle("active", t === firstOpen));
  }

  function getAudioCtx(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function tick(){
    const now = performance.now();
    if(now - lastTick < 90) return;
    lastTick = now;
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.055, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.07);
  }

  function clap(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    for(let burst=0; burst<3; burst++){
      const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.12), ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2.2);
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass"; filter.frequency.value = 1500; filter.Q.value = 1.2;
      gain.gain.value = 0.17;
      src.buffer = buffer;
      src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      src.start(ctx.currentTime + burst*0.13);
    }
  }

  function playChime(){
    try{
      chimeAudio.currentTime = 0;
      const p = chimeAudio.play();
      if(p && typeof p.catch === "function") p.catch(()=>{});
    }catch(_){}
  }

  function confetti(){
    const colors = ["#ff4d6d","#ffd24a","#31b7ff","#83e79f","#b86bff","#ff9f1c"];
    for(let i=0;i<45;i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*.35) + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2300);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang || "") && /jenny|aria|ava|allison|ellie|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name || ""))
      || voices.find(v => /^en[-_]us/i.test(v.lang || "") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name || ""))
      || voices.find(v => /^en/i.test(v.lang || ""))
      || voices[0]
      || null;
  }

  function speak(text){
    if(!text || !("speechSynthesis" in window)) return;
    try{ window.speechSynthesis.cancel(); }catch(_){}
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = .88;
    u.pitch = 1.16;
    u.volume = 1;
    const voice = pickVoice();
    if(voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function cheerFor(type){
    const word = type === "0" ? "zero" : type;
    const cheers = [
      `Great job tracing number ${word}!`,
      `Wonderful! You traced number ${word} carefully!`,
      `Nice work! Keep tracing the dotted numbers!`
    ];
    const msg = cheers[Math.floor(Math.random()*cheers.length)];
    setStatus(msg);
    speak(msg);
  }

  function readInstructions(){
    getAudioCtx();
    setStatus("Count the vegetables, add one, then trace every dotted number.");
    speak("Hello! Let us count the vegetables. Add one more vegetable, then trace every dotted number on the poster. Start with the number one in each row. Then trace the answer numbers six, seven, eight, nine, and ten. Follow the dots slowly and carefully. Your tracing percentage will go up as you trace.");
  }

  function clearAll(){
    finalCelebrated = false;
    drawing = false;
    lastPoint = null;
    lastRawPoint = null;
    strokes.length = 0;
    currentStroke = null;
    targets.forEach(t => {
      t.samples.forEach(s => s.hit = false);
      t.percent = 0;
      t.complete = false;
      if(t.pctEl) t.pctEl.textContent = "0%";
      if(t.miniEl) t.miniEl.classList.remove("done");
      if(t.pathEl) t.pathEl.classList.remove("done");
    });
    updateActiveGuide();
    overallText.textContent = "0%";
    overallFill.style.width = "0%";
    starsEl.textContent = "";
    setStatus("Trace each dotted number carefully.");
    redrawStrokes();
    saveProgress(0,false);
  }

  function saveProgress(score, completed){
    const payload = {
      pageId,
      file: pageId + ".html",
      level:"A",
      week:1,
      type:"tracing",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0,
      skills:{reading:1, writing:score >= 95 ? 3 : score > 0 ? 1 : 0, listening:1, speaking:0},
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    }catch(_){}
    try{
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(() => {});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(() => {});
    }catch(_){}
  }

  function pointerDown(evt){
    evt.preventDefault();
    getAudioCtx();
    drawing = true;
    lastPoint = null;
    lastRawPoint = canvasPoint(evt);
    currentStroke = [];
    try{ traceCanvas.setPointerCapture(evt.pointerId); }catch(_){}
  }

  function pointerMove(evt){
    if(!drawing) return;
    evt.preventDefault();
    const p = canvasPoint(evt);
    if(lastRawPoint && dist(lastRawPoint,p) < MIN_MOVE) return;
    let near = false;
    if(lastRawPoint) near = traceSegment(lastRawPoint,p);
    else near = nearestDistance(p) <= HIT_RADIUS;
    if(near){
      tick();
      if(lastPoint) drawTraceLine(lastPoint,p);
      if(!lastPoint || dist(lastPoint,p) > 3) currentStroke.push(p);
      lastPoint = p;
    } else {
      lastPoint = null;
    }
    lastRawPoint = p;
  }

  function pointerUp(evt){
    if(!drawing) return;
    evt.preventDefault();
    drawing = false;
    if(currentStroke && currentStroke.length > 1) strokes.push(currentStroke);
    currentStroke = null;
    lastPoint = null;
    lastRawPoint = null;
    try{ traceCanvas.releasePointerCapture(evt.pointerId); }catch(_){}
  }

  makeTargetPaths();
  resizeCanvas();
  clearAll();

  traceCanvas.addEventListener("pointerdown", pointerDown, {passive:false});
  traceCanvas.addEventListener("pointermove", pointerMove, {passive:false});
  traceCanvas.addEventListener("pointerup", pointerUp, {passive:false});
  traceCanvas.addEventListener("pointercancel", pointerUp, {passive:false});
  traceCanvas.addEventListener("pointerleave", pointerUp, {passive:false});
  readBtn.addEventListener("click", readInstructions);
  clearBtn.addEventListener("click", () => { clearAll(); speak("Cleared. Start tracing again."); });
  cheerBtn.addEventListener("click", () => { getAudioCtx(); playChime(); clap(); confetti(); setStatus("You can do it! Great tracing!"); speak("You can do it! Great tracing!"); });
  homeBtn.addEventListener("click", () => { window.location.href = homeHref; });
  prevBtn.addEventListener("click", () => { window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { window.location.href = nextHref; });
  window.addEventListener("resize", resizeCanvas);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try{ window.speechSynthesis.cancel(); }catch(_){} });
  posterImg.addEventListener("load", () => { resizeCanvas(); }, {once:true});
  window.addEventListener("load", () => { resizeCanvas(); setTimeout(readInstructions, 650); }, {once:true});
})();
</script>
</body>
