<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA3 - Using Carrots as Units</title>
<style>
  :root{
    --ink:#2b2b31;
    --paper:#fff9f2;
    --card:#ffffff;
    --red:#f34a59;
    --pink:#f7a2ad;
    --blue:#179eea;
    --green:#18a957;
    --gold:#ffd34f;
    --purple:#6d53c6;
    --shadow:0 18px 40px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    overflow-x:hidden;
    background-image:
      linear-gradient(#eee2d6 1px,transparent 1px),
      linear-gradient(90deg,#eee2d6 1px,transparent 1px);
    background-size:26px 26px;
  }
  .lesson-shell{width:min(990px,100%);background:rgba(255,255,255,.96);border-radius:24px;box-shadow:var(--shadow);padding:10px 10px 16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 8px;width:min(949px,100%);}
  .activity-title{margin:0;font-size:clamp(1.05rem,3.2vw,1.75rem);font-weight:1000;color:#f04455;text-shadow:0 2px 0 #fff;}
  .home-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:#fff;color:#315d9f;border:3px solid #dbe8ff;border-radius:999px;padding:8px 13px;font-weight:1000;box-shadow:0 4px 0 rgba(0,0,0,.13);}
  .poster-wrap{position:relative;width:min(949px,100%);margin:0 auto;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.10);touch-action:none;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .trace-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:8;touch-action:none;cursor:crosshair;background:transparent;}
  .focus-zone{position:absolute;z-index:6;pointer-events:none;border-radius:20px;opacity:.88;border:4px solid rgba(255,210,74,.88);box-shadow:0 0 0 6px rgba(255,255,255,.55),0 0 22px rgba(255,134,62,.45);animation:pulse 1.4s ease-in-out infinite;}
  .focus-zone.done{border-color:rgba(24,169,87,.55);box-shadow:0 0 0 5px rgba(255,255,255,.35);animation:none;opacity:.18;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  .controls-panel{width:min(949px,100%);margin:12px auto 0;border:3px solid rgba(243,74,89,.23);border-radius:20px;padding:12px;background:linear-gradient(180deg,#fff,#fff7fb);box-shadow:0 8px 20px rgba(0,0,0,.08);}
  .progress-title{font-weight:1000;text-align:center;color:#e23a4c;font-size:clamp(1rem,2.5vw,1.28rem);margin-bottom:8px;}
  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-bar{flex:1;height:18px;background:#e9f1ff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.17);}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#28a5ff,#8ef0a8,#ffd34f);transition:width .08s linear;}
  .progress-percent{min-width:60px;text-align:right;font-weight:1000;color:#1765ad;font-size:1.05rem;}
  .task-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .task-card{border:2px solid #dbe7ff;background:#fff;border-radius:15px;padding:8px 10px;text-align:center;font-weight:1000;color:#454857;}
  .task-card.active{border-color:#ffd34f;background:#fff8d9;}
  .task-card.done{border-color:#b8efca;background:#effff4;color:#1e7f45;}
  .task-card span{display:block;color:#f04455;}
  .status{min-height:1.45em;text-align:center;font-size:clamp(.95rem,2.5vw,1.12rem);font-weight:1000;color:var(--purple);margin-top:9px;}
  .button-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  button{border:none;border-radius:999px;padding:10px 16px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .1s ease,filter .1s ease;}
  button:hover{filter:brightness(1.04);}
  button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn-prev,.btn-next{background:#ff8a5b;color:#fff;}
  .btn-clear{background:#dfeaff;color:#1f3b6b;}
  .btn-read{background:#f6da7b;color:#8b5a00;}
  .btn-cheer{background:#d5f7df;color:#156d39;}
  .footer-note{margin-top:8px;text-align:center;color:#666;font-weight:800;font-size:.9rem;}
  .confetti{position:fixed;top:-18px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:680px){
    body{padding:5px;background-size:22px 22px;}
    .lesson-shell{border-radius:16px;padding:6px 6px 12px;}
    .topbar{margin-bottom:6px;}
    .activity-title{font-size:1rem;}
    .home-btn{padding:7px 10px;font-size:.88rem;}
    .poster-wrap{border-radius:14px;}
    .controls-panel{padding:10px;border-radius:15px;}
    .task-grid{grid-template-columns:1fr 1fr;}
    .button-row{gap:8px;}
    button{padding:9px 12px;font-size:.85rem;}
  }
</style>
</head>

      cheer:"Great! You traced the red number one.",
      threshold:20,
      bounds:{x:188,y:206,w:38,h:42},
      paths:[[[208,217],[208,242]]]
    },
    {
      name:"One carrot unit mark",
      short:"1 unit mark",
      cheer:"Nice work! One carrot is one unit.",
      threshold:27,
      bounds:{x:142,y:796,w:60,h:298},
      paths:[[[192,808],[154,810],[154,1059],[192,1059]], [[154,874],[154,960]]]
    },
    {
      name:"First carrot on the flower pot",
      short:"Carrot unit 1",
      cheer:"Super tracing! That is the first carrot unit.",
      threshold:38,
      bounds:{x:535,y:532,w:78,h:288},
      paths:[[[571,546],[576,610],[573,690],[564,805]], [[553,565],[572,546],[591,565]]]
    },
    {
      name:"Second carrot on the flower pot",
      short:"Carrot unit 2",
      cheer:"Excellent! That is the second carrot unit. The flower pot is two units.",
      threshold:38,
      bounds:{x:544,y:817,w:78,h:278},
      paths:[[[574,828],[581,900],[579,985],[570,1083]], [[553,846],[574,828],[598,848]]]
    }
  ];

  function samplePath(path, gap = 7) {
    const pts = [];
    for (let i=1;i<path.length;i++) {
      const a = path[i-1], b = path[i];
      const dx = b[0]-a[0], dy = b[1]-a[1];
      const len = Math.hypot(dx,dy);
      const steps = Math.max(1, Math.ceil(len/gap));
      for (let s=0;s<=steps;s++) {
        const t = s/steps;
        pts.push({x:a[0]+dx*t, y:a[1]+dy*t, covered:false});
      }
    }
    return pts;
  }

  tasks.forEach(task => {
    task.samples = [];
    task.paths.forEach(p => task.samples.push(...samplePath(p)));
    task.percent = 0;
    task.done = false;
  });

  function setStatus(text) { statusEl.textContent = text; }

  function setupCanvas() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = NAT_W * dpr;
    canvas.height = NAT_H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }

  function canvasPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * NAT_W / rect.width,
      y: (e.clientY - rect.top) * NAT_H / rect.height
    };
  }

  function distPointToSegment(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y;
    const wx = p.x - a.x, wy = p.y - a.y;
    const c1 = vx*wx + vy*wy;
    if (c1 <= 0) return Math.hypot(p.x-a.x, p.y-a.y);
    const c2 = vx*vx + vy*vy;
    if (c2 <= c1) return Math.hypot(p.x-b.x, p.y-b.y);
    const t = c1 / c2;
    return Math.hypot(p.x-(a.x+t*vx), p.y-(a.y+t*vy));
  }

  function markCovered(task, from, to) {
    let changed = false;
    for (const s of task.samples) {
      if (s.covered) continue;
      const d = distPointToSegment(s, from, to);
      if (d <= task.threshold) {
        s.covered = true;
        changed = true;
      }
    }
    if (changed) updateProgress();
  }

  function taskPercent(task) {
    const covered = task.samples.filter(p => p.covered).length;
    return Math.round((covered / Math.max(1, task.samples.length)) * 100);
  }

  function updateFocus() {
    const t = tasks[activeTask] || tasks[tasks.length-1];
    const b = t.bounds;
    focusZone.style.left = (b.x/NAT_W*100) + "%";
    focusZone.style.top = (b.y/NAT_H*100) + "%";
    focusZone.style.width = (b.w/NAT_W*100) + "%";
    focusZone.style.height = (b.h/NAT_H*100) + "%";
    focusZone.classList.toggle("done", !!t.done);
    tasks.forEach((task, i) => {
      const card = document.getElementById("task"+i);
      if (!card) return;
      card.classList.toggle("active", i === activeTask && !task.done);
      card.classList.toggle("done", task.done);
    });
  }

  function updateProgress() {
    let total = 0;
    tasks.forEach((task, i) => {
      task.percent = taskPercent(task);
      total += Math.min(100, task.percent);
      const card = document.getElementById("task"+i);
      if (card) card.querySelector("span").textContent = task.percent + "%";

      if (!task.done && task.percent >= PASS_PERCENT) {
        task.done = true;
        playChime();
        speak(task.cheer, true);
        sparkleTask(task);
        if (i === activeTask) {
          activeTask = Math.min(tasks.length - 1, activeTask + 1);
          setTimeout(() => {
            if (!allDone()) setStatus("Now trace " + tasks[activeTask].name + ".");
            updateFocus();
          }, 300);
        }
      }
    });

    const overall = Math.round(total / tasks.length);
    progressPercent.textContent = overall + "%";
    progressFill.style.width = overall + "%";
    saveProgress(overall, allDone());

    if (allDone() && !finalCelebrated) {
      finalCelebrated = true;
      setStatus("Fantastic! The flower pot is two carrot units tall!");
      setTimeout(() => { playChime(); playApplause(); confetti(); speak("Fantastic job! One carrot is one unit. The flower pot is two units tall.", true); }, 500);
    }
    updateFocus();
  }

  function allDone() { return tasks.every(t => t.done); }

  function drawLine(from, to) {
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "rgba(0,155,255,.78)";
    ctx.lineWidth = 17;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.72)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.restore();
  }

  function onPointerDown(e) {
    e.preventDefault();
    unlockAudio();
    stopSpeaking();
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(_) {} }
    drawing = true;
    lastPoint = canvasPointFromEvent(e);
    setStatus("Keep tracing slowly on the highlighted part.");
    playTick();
  }

  function onPointerMove(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = canvasPointFromEvent(e);
    drawLine(lastPoint, p);
    const task = tasks[activeTask];
    if (task && !task.done) markCovered(task, lastPoint, p);
    lastPoint = p;
    const now = performance.now();
    if (now - lastTick > 85) { playTick(); lastTick = now; }
  }

  function onPointerUp(e) {
    if (!drawing) return;
    if (canvas.releasePointerCapture) { try { canvas.releasePointerCapture(e.pointerId); } catch(_) {} }
    drawing = false;
    lastPoint = null;
    const task = tasks[activeTask];
    if (task && !task.done) setStatus("Good try! Continue tracing " + task.name + ".");
  }

  canvas.addEventListener("pointerdown", onPointerDown, {passive:false});
  canvas.addEventListener("pointermove", onPointerMove, {passive:false});
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);
  canvas.addEventListener("pointerleave", onPointerUp);

  function unlockAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  }

  function playTick() {
    try {
      unlockAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 660;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.07);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch(_) {}
  }

  function playChime() {
    try {
      chimeAudio.currentTime = 0;
      chimeAudio.volume = 0.75;
      chimeAudio.play().catch(()=>{});
    } catch(_) {}
  }

  function playApplause() {
    try {
      unlockAudio();
      for (let i=0;i<8;i++) {
        const t = audioCtx.currentTime + i*0.09;
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate*0.05, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let j=0;j<data.length;j++) data[j] = (Math.random()*2-1) * Math.pow(1-j/data.length, 2);
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
        src.buffer = buffer;
        src.connect(gain).connect(audioCtx.destination);
        src.start(t);
      }
    } catch(_) {}
  }

  function chooseVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices() || [];
    const preferred = ["Samantha","Google US English","Microsoft Jenny","Microsoft Aria","Microsoft Zira","Female"];
    return voices.find(v => /en-US/i.test(v.lang) && preferred.some(p => v.name.includes(p))) ||
           voices.find(v => /en-US/i.test(v.lang) && /female|woman|zira|jenny|aria|samantha/i.test(v.name)) ||
           voices.find(v => /en-US/i.test(v.lang)) || voices[0] || null;
  }

  function speak(text, cheerful=false) {
    if (!("speechSynthesis" in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    const voice = chooseVoice();
    if (voice) utter.voice = voice;
    utter.lang = "en-US";
    utter.rate = cheerful ? 1.02 : 0.94;
    utter.pitch = cheerful ? 1.18 : 1.05;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  }

  function stopSpeaking() { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); }

  function readInstructions() {
    stopSpeaking();
    setStatus("Trace the highlighted part. One carrot is one unit. The flower pot is two units.");
    speak("Hello farmer! Today we will measure length using carrots. One carrot is one unit. First, trace the red number one. Next, trace the one unit mark beside the carrot. Then trace the two carrots on the flower pot. Watch your tracing progress bar grow. Great job!", false);
  }

  function sparkleTask(task) {
    const b = task.bounds;
    const sparkle = document.createElement("div");
    sparkle.style.position = "absolute";
    sparkle.style.left = (b.x/NAT_W*100) + "%";
    sparkle.style.top = (b.y/NAT_H*100) + "%";
    sparkle.style.width = (b.w/NAT_W*100) + "%";
    sparkle.style.height = (b.h/NAT_H*100) + "%";
    sparkle.style.borderRadius = "18px";
    sparkle.style.pointerEvents = "none";
    sparkle.style.zIndex = "10";
    sparkle.style.boxShadow = "0 0 0 8px rgba(255,211,79,.55),0 0 30px rgba(255,120,120,.7)";
    sparkle.style.animation = "pulse .55s ease-in-out 2";
    posterWrap.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 1100);
  }

  function confetti() {
    const colors = ["#f34a59","#ffd34f","#28a5ff","#18a957","#ff8a5b","#d86cff"];
    for (let i=0;i<90;i++) {
      const piece = document.createElement("div");
      piece.className = "confetti";
      piece.style.left = Math.random()*100 + "vw";
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*0.35) + "s";
      piece.style.transform = "rotate(" + (Math.random()*180) + "deg)";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2300);
    }
  }

  function clearAll() {
    stopSpeaking();
    setupCanvas();
    tasks.forEach((task, i) => {
      task.samples.forEach(p => p.covered = false);
      task.percent = 0;
      task.done = false;
      const card = document.getElementById("task"+i);
      if (card) card.querySelector("span").textContent = "0%";
    });
    activeTask = 0;
    finalCelebrated = false;
    progressPercent.textContent = "0%";
    progressFill.style.width = "0%";
    setStatus("Trace the highlighted red number one to begin.");
    updateFocus();
    saveProgress(0, false);
  }

  function saveProgress(percent, completed) {
    try {
      localStorage.setItem(PAGE_ID + "_progress", JSON.stringify({level:LEVEL, percent, completed, updated:new Date().toISOString()}));
    } catch(_) {}
  }

  window.addEventListener("resize", () => { setupCanvas(); updateFocus(); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", () => { setupCanvas(); updateFocus(); });

  clearBtn.addEventListener("click", clearAll);
  readBtn.addEventListener("click", () => { unlockAudio(); readInstructions(); });
  cheerBtn.addEventListener("click", () => { unlockAudio(); playChime(); playApplause(); speak("You are doing great! Keep tracing the carrot units.", true); });
  prevBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = prevHref; });
  nextBtn.addEventListener("click", () => { stopSpeaking(); window.location.href = nextHref; });

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
  }

  window.addEventListener("load", () => {
    clearAll();
    setTimeout(readInstructions, 700);
  }, {once:true});
})();
</script>
</body>
</html>
