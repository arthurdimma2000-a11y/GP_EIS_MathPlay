<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA19 - Adding Up Mixed Groups</title>
<style>
  :root {
    --green:#35ad46;
    --green-dark:#238632;
    --pink:#f59aa7;
    --blue:#36a8df;
    --purple:#6c4bbf;
    --gold:#ffd24a;
    --ink:#2d2d2d;
    --paper:#fffaf2;
    --panel:#ffffff;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body {
    margin:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    background:var(--paper);
    color:var(--ink);
  }
  body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#ece2d3 1px,transparent 1px),linear-gradient(90deg,#ece2d3 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app {
    width:min(1000px,100%);
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:10px 10px 14px;
  }
  .topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .badge {
    background:#f0fff2;
    border:3px solid rgba(53,173,70,.35);
    color:var(--green-dark);
    border-radius:999px;
    padding:8px 14px;
    font-weight:1000;
    box-shadow:0 7px 14px rgba(0,0,0,.06);
  }
  .navs,.buttons {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
  }
  .btn {
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
    font-family:inherit;
  }
  .btn:hover { filter:brightness(1.04); transform:translateY(-1px); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14); }
  .btn.home { background:#25d17d; color:#fff; }
  .btn.prev,.btn.next { background:#f7dc6f; color:#8b5a00; }
  .btn.read { background:#f04d5f; color:#fff; }
  .btn.clear { background:#dfeaff; color:#1f3b6b; }
  .btn.cheer { background:#c9f2d6; color:#166c38; }
  .poster-wrap {
    position:relative;
    width:min(920px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
  }
  .poster-img {
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .guide-layer,.trace-layer {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:transparent;
  }
  .guide-layer { z-index:4; pointer-events:none; }
  .trace-layer { z-index:5; touch-action:none; cursor:crosshair; }
  .panel {
    width:min(920px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff9fb);
    border:3px solid rgba(53,173,70,.28);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }
  .lesson-title {
    text-align:center;
    font-size:clamp(1.05rem,2.8vw,1.45rem);
    font-weight:1000;
    color:var(--green-dark);
    margin-bottom:8px;
  }
  .progress-row { display:flex; align-items:center; gap:9px; }
  .bar {
    flex:1;
    height:18px;
    border-radius:999px;
    background:#e8eef8;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }
  .fill {
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#35ad46,#83e79f);
    transition:width .10s ease-out;
  }
  .percent { min-width:62px; text-align:right; color:#175ca8; font-weight:1000; }
  .mini-grid {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-top:9px;
  }
  .mini {
    background:#fff;
    border:2px solid #e7edf8;
    border-radius:12px;
    text-align:center;
    padding:6px 4px;
    font-weight:1000;
    font-size:.84rem;
    color:#444;
  }
  .mini span { display:block; margin-top:3px; color:#ef3f49; }
  .mini.done { border-color:#62d98c; background:#effff4; color:#126c36; }
  .mini.done span { color:#126c36; }
  .stars {
    text-align:center;
    min-height:1.25em;
    margin-top:7px;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
  }
  .status {
    min-height:1.55em;
    text-align:center;
    margin-top:7px;
    font-size:clamp(.98rem,2.5vw,1.25rem);
    font-weight:1000;
    color:var(--purple);
  }
  .note { text-align:center; font-weight:900; color:#666; font-size:.9rem; margin-top:8px; line-height:1.45; }
  .confetti-piece {
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.8s linear forwards;
  }
  @keyframes fall { to { transform:translateY(105vh) rotate(540deg); opacity:.1; } }
  @media(max-width:760px) {
    body { padding:6px; }
    .app { padding:6px; border-radius:16px; }
    .panel { padding:10px; border-radius:14px; }
    .mini-grid { grid-template-columns:repeat(2,1fr); }
    .btn { font-size:.85rem; padding:9px 12px; }
  }
</style>
</head>

    {row:3, equation:"2 + 3 = 5", plus:[330,744,87,110], equal:[605,774,73,58], digit:[716,725,90,142], digitType:"5", answer:"5"},
    {row:4, equation:"3 + 4 = 7", plus:[330,938,87,110], equal:[605,968,73,58], digit:[708,918,86,142], digitType:"7", answer:"7"},
    {row:5, equation:"4 + 5 = 9", plus:[330,1135,87,110], equal:[605,1168,73,58], digit:[716,1117,90,145], digitType:"9", answer:"9"}
  ];

  const targets = [];
  rows.forEach(r => {
    targets.push({id:`r${r.row}p`, row:r.row, label:`Row ${r.row}`, symbol:"+", type:"plus", box:r.plus, equation:r.equation});
    targets.push({id:`r${r.row}e`, row:r.row, label:`Row ${r.row}`, symbol:"=", type:"equals", box:r.equal, equation:r.equation});
    targets.push({id:`r${r.row}d`, row:r.row, label:`Row ${r.row}`, symbol:r.answer, type:r.digitType, box:r.digit, equation:r.equation});
  });

  const $ = id => document.getElementById(id);
  const posterImg = $("posterImg");
  const guideLayer = $("guideLayer");
  const traceLayer = $("traceLayer");
  const guideCtx = guideLayer.getContext("2d");
  const traceCtx = traceLayer.getContext("2d");
  const miniGrid = $("miniGrid");
  const overallFill = $("overallFill");
  const overallText = $("overallText");
  const stars = $("stars");
  const status = $("status");
  const chimeAudio = $("chimeAudio");

  let dpr = window.devicePixelRatio || 1;
  let drawing = false;
  let currentStroke = null;
  let strokes = [];
  let audioCtx = null;
  let lastTick = 0;
  let finalCelebrated = false;

  function cssSize(){ return {w:traceLayer.clientWidth, h:traceLayer.clientHeight}; }
  function sx(x){ return x / posterNatural.w * cssSize().w; }
  function sy(y){ return y / posterNatural.h * cssSize().h; }
  function bxy(box, px, py){ return {x:sx(box[0] + box[2]*px), y:sy(box[1] + box[3]*py)}; }

  function linePoints(a,b,n=32){
    const pts=[];
    for(let i=0;i<=n;i++){ const t=i/n; pts.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, hit:false}); }
    return pts;
  }
  function arcPoints(box,cx,cy,rx,ry,start,end,n=48){
    const pts=[];
    for(let i=0;i<=n;i++){
      const t=i/n;
      const a=start+(end-start)*t;
      pts.push(bxy(box,cx+rx*Math.cos(a),cy+ry*Math.sin(a)));
    }
    pts.forEach(p=>p.hit=false);
    return pts;
  }
  function polyPoints(points,nEach=22){
    let out=[];
    for(let i=0;i<points.length-1;i++) out = out.concat(linePoints(points[i],points[i+1],nEach));
    return out;
  }

  function makeSamples(t){
    const box = t.box;
    if(t.type === "plus") {
      return [
        ...linePoints(bxy(box,.52,.15), bxy(box,.52,.86), 32),
        ...linePoints(bxy(box,.18,.52), bxy(box,.86,.52), 32)
      ];
    }
    if(t.type === "equals") {
      return [
        ...linePoints(bxy(box,.12,.35), bxy(box,.88,.35), 28),
        ...linePoints(bxy(box,.12,.65), bxy(box,.88,.65), 28)
      ];
    }
    if(t.type === "1") {
      return [
        ...linePoints(bxy(box,.38,.25), bxy(box,.53,.14), 12),
        ...linePoints(bxy(box,.53,.14), bxy(box,.53,.86), 46)
      ];
    }
    if(t.type === "3") {
      return polyPoints([
        bxy(box,.25,.20), bxy(box,.70,.20), bxy(box,.78,.35), bxy(box,.62,.49),
        bxy(box,.33,.50), bxy(box,.66,.51), bxy(box,.80,.66), bxy(box,.68,.82), bxy(box,.24,.82)
      ], 13);
    }
    if(t.type === "5") {
      return polyPoints([
        bxy(box,.75,.18), bxy(box,.28,.18), bxy(box,.25,.44), bxy(box,.62,.44),
        bxy(box,.78,.58), bxy(box,.68,.82), bxy(box,.25,.82)
      ], 16);
    }
    if(t.type === "7") {
      return polyPoints([bxy(box,.25,.18), bxy(box,.78,.18), bxy(box,.52,.86)], 34);
    }
    if(t.type === "9") {
      return [
        ...arcPoints(box,.50,.34,.28,.22,-Math.PI*.10,Math.PI*1.88,70),
        ...polyPoints([bxy(box,.72,.35), bxy(box,.68,.58), bxy(box,.55,.85), bxy(box,.34,.83)], 18)
      ];
    }
    return [];
  }

  function resetTargetData(){
    targets.forEach(t => {
      t.samples = makeSamples(t);
      t.percent = 0;
      t.complete = false;
    });
  }

  function resizeCanvases(){
    const r = posterImg.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    [guideLayer, traceLayer].forEach(c => {
      c.width = Math.max(1, Math.round(r.width*dpr));
      c.height = Math.max(1, Math.round(r.height*dpr));
      c.style.width = r.width + "px";
      c.style.height = r.height + "px";
      const cx = c.getContext("2d");
      cx.setTransform(dpr,0,0,dpr,0,0);
    });
    resetTargetData();
    redrawAll();
    updateProgress();
  }

  function drawPath(ctx, samples){
    if(!samples || !samples.length) return;
    ctx.beginPath();
    ctx.moveTo(samples[0].x, samples[0].y);
    samples.slice(1).forEach(p => ctx.lineTo(p.x,p.y));
    ctx.stroke();
  }

  function drawGuides(){
    const s = cssSize();
    guideCtx.clearRect(0,0,s.w,s.h);
    guideCtx.save();
    targets.forEach(t => {
      const active = !t.complete;
      guideCtx.lineCap = "round";
      guideCtx.lineJoin = "round";
      guideCtx.lineWidth = active ? 5 : 4;
      guideCtx.setLineDash([2, 11]);
      guideCtx.strokeStyle = t.complete ? "rgba(40,170,88,.65)" : "rgba(60,120,210,.12)";
      drawPath(guideCtx, t.samples);
      guideCtx.setLineDash([]);
      if(!t.complete) {
        const first = t.samples[0], last = t.samples[t.samples.length-1];
        guideCtx.fillStyle = "rgba(40,170,88,.82)";
        guideCtx.beginPath(); guideCtx.arc(first.x, first.y, 5, 0, Math.PI*2); guideCtx.fill();
        guideCtx.fillStyle = "rgba(239,63,73,.82)";
        guideCtx.beginPath(); guideCtx.arc(last.x, last.y, 5, 0, Math.PI*2); guideCtx.fill();
      }
    });
    guideCtx.restore();
  }

  function redrawAll(){
    const s = cssSize();
    traceCtx.clearRect(0,0,s.w,s.h);
    drawGuides();
    traceCtx.save();
    traceCtx.lineCap = "round";
    traceCtx.lineJoin = "round";
    traceCtx.lineWidth = 13;
    traceCtx.strokeStyle = "rgba(240,77,95,.92)";
    strokes.forEach(st => drawPath(traceCtx, st.points));
    if(currentStroke) drawPath(traceCtx, currentStroke.points);
    traceCtx.restore();
  }

  function pointerPoint(e){
    const r = traceLayer.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top};
  }

  function getAudioCtx(){
    if(!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) { audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function beep(freq=640,duration=.045,volume=.04){
    const ac = getAudioCtx();
    if(!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(volume, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + duration);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + duration);
  }
  function tick(){
    const now = performance.now();
    if(now - lastTick < 65) return;
    lastTick = now;
    beep(620,.045,.035);
  }
  function playChime(){
    try {
      const a = chimeAudio.cloneNode(true);
      a.currentTime = 0;
      a.play().catch(()=>beep(880,.12,.07));
    } catch(_) { beep(880,.12,.07); }
  }
  function clap(){
    const ac = getAudioCtx();
    if(!ac) return;
    for(let i=0;i<10;i++) {
      const start = ac.currentTime + i*.055;
      const buffer = ac.createBuffer(1, Math.floor(ac.sampleRate*.06), ac.sampleRate);
      const data = buffer.getChannelData(0);
      for(let n=0;n<data.length;n++) data[n] = (Math.random()*2-1) * Math.pow(1-n/data.length,2);
      const src = ac.createBufferSource();
      const gain = ac.createGain();
      src.buffer = buffer;
      gain.gain.setValueAtTime(.035, start);
      gain.gain.exponentialRampToValueAtTime(.001, start+.06);
      src.connect(gain); gain.connect(ac.destination);
      src.start(start); src.stop(start+.06);
    }
  }
  function confetti(){
    const colors=["#35ad46","#f04d5f","#ffd24a","#31b7ff","#b86bff","#ff9f1c"];
    for(let i=0;i<42;i++){
      const p=document.createElement("div");
      p.className="confetti-piece";
      p.style.left=Math.random()*100+"vw";
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay=(Math.random()*.3)+"s";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),2200);
    }
  }

  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices() || [];
    return voices.find(v => /^en[-_]us/i.test(v.lang||"") && /jenny|aria|ava|allison|ellie|olivia|emma|ivy|samantha|female|girl|zira/i.test(v.name||""))
      || voices.find(v => /^en[-_]us/i.test(v.lang||"") && !/male|boy|david|guy|michael|james|thomas|mark|paul|brian|steve|kevin|eric/i.test(v.name||""))
      || voices.find(v => /^en/i.test(v.lang||""))
      || voices[0]
      || null;
  }
  function speak(text, done){
    if(!text || !("speechSynthesis" in window)) { if(done) done(); return; }
    try { speechSynthesis.cancel(); } catch(_) {}
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = .88;
    u.pitch = 1.16;
    u.volume = 1;
    const v = pickVoice();
    if(v) u.voice = v;
    if(done) { u.onend = done; u.onerror = done; }
    speechSynthesis.speak(u);
  }

  function setStatus(text){ status.textContent = text; }

  function markHits(p){
    let touched = false;
    const radius = Math.max(25, cssSize().w * .030);
    targets.forEach(t => {
      if(t.complete) return;
      t.samples.forEach(s => {
        if(!s.hit && Math.hypot(s.x-p.x, s.y-p.y) <= radius) {
          s.hit = true;
          touched = true;
        }
      });
      const hitCount = t.samples.filter(s => s.hit).length;
      t.percent = Math.round(hitCount / Math.max(1,t.samples.length) * 100);
      if(!t.complete && t.percent >= 72) {
        t.complete = true;
        t.percent = 100;
        t.samples.forEach(s => s.hit = true);
        playChime();
        setStatus(`Great! You traced ${t.label} ${t.symbol} for ${t.equation}.`);
        speak(`Great tracing! Row ${t.row || ""} ${t.symbol} is done.`);
      }
    });
    if(touched) tick();
    updateProgress();
  }

  function updateProgress(){
    miniGrid.innerHTML = "";
    targets.forEach(t => {
      const box = document.createElement("div");
      box.className = "mini" + (t.complete ? " done" : "");
      box.innerHTML = `${t.label}<span>${t.symbol} · ${t.percent||0}%</span>`;
      miniGrid.appendChild(box);
    });
    const score = Math.round(targets.reduce((sum,t)=>sum+(t.percent||0),0) / targets.length);
    overallText.textContent = score + "%";
    overallFill.style.width = score + "%";
    const starCount = score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0;
    stars.textContent = starCount ? "★ ".repeat(starCount).trim() + " " + "☆ ".repeat(3-starCount).trim() : "☆ ☆ ☆";
    saveProgress(score, score >= 95);
    if(score >= 95 && !finalCelebrated) {
      finalCelebrated = true;
      setTimeout(() => {
        playChime(); clap(); confetti();
        setStatus("Fantastic! You traced all the mixed group math marks.");
        speak("Fantastic! You traced every plus sign, equal sign, and answer number. You can add mixed groups!");
      }, 260);
    }
  }

  function clearAll(){
    finalCelebrated = false;
    strokes = [];
    currentStroke = null;
    drawing = false;
    resetTargetData();
    redrawAll();
    updateProgress();
    setStatus("Trace each visible dotted math mark carefully.");
    saveProgress(0,false);
  }

  function readInstructions(){
    getAudioCtx();
    setStatus("Trace the dotted plus signs, equal signs, and answer numbers.");
    speak("Welcome to Numbers Week Three. Count the groups on the poster. Trace every dotted plus sign, every equal sign, and each answer number. The answers are one, three, five, seven, and nine. Follow the dots carefully. Your progress bar will grow as you trace.");
  }

  function saveProgress(score, completed){
    const payload = {
      pageId,
      file:pageId + ".html",
      level:"A",
      week:3,
      type:"tracing",
      activityType:"lesson",
      score:Math.round(score),
      tracing:Math.round(score),
      completed:!!completed,
      stars:score >= 95 ? 3 : score >= 70 ? 2 : score >= 35 ? 1 : 0,
      skills:{reading:1,writing:score >= 95 ? 3 : score > 0 ? 1 : 0,listening:1,speaking:0,math:1},
      savedAt:new Date().toISOString(),
      ts:Date.now()
    };
    try {
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[payload.pageId] = payload;
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", payload.file);
      localStorage.setItem("gpLatestProgress", JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent("gp-progress-update", {detail:payload}));
    } catch(_) {}
    try {
      if(window.GPTrack && typeof window.GPTrack.finish === "function") window.GPTrack.finish(payload).catch(()=>{});
      if(typeof window.finishAndSave === "function") window.finishAndSave(payload).catch(()=>{});
    } catch(_) {}
  }

  function pointerDown(e){
    e.preventDefault();
    getAudioCtx();
    drawing = true;
    currentStroke = {points:[pointerPoint(e)]};
    try { traceLayer.setPointerCapture(e.pointerId); } catch(_) {}
    markHits(currentStroke.points[0]);
    redrawAll();
  }
  function pointerMove(e){
    if(!drawing || !currentStroke) return;
    e.preventDefault();
    const p = pointerPoint(e);
    currentStroke.points.push(p);
    markHits(p);
    redrawAll();
  }
  function pointerUp(e){
    if(currentStroke && currentStroke.points.length) strokes.push(currentStroke);
    currentStroke = null;
    drawing = false;
    try { traceLayer.releasePointerCapture(e.pointerId); } catch(_) {}
    redrawAll();
  }

  traceLayer.addEventListener("pointerdown", pointerDown);
  traceLayer.addEventListener("pointermove", pointerMove);
  traceLayer.addEventListener("pointerup", pointerUp);
  traceLayer.addEventListener("pointercancel", pointerUp);
  traceLayer.addEventListener("pointerleave", pointerUp);

  $("readBtn").addEventListener("click", readInstructions);
  $("clearBtn").addEventListener("click", () => { clearAll(); speak("Cleared. Start tracing again."); });
  $("cheerBtn").addEventListener("click", () => { getAudioCtx(); playChime(); clap(); confetti(); setStatus("You can do it! Keep tracing!"); speak("You can do it! Keep tracing!"); });
  $("homeBtn").addEventListener("click", () => { window.location.href = homeHref; });
  $("prevBtn").addEventListener("click", () => { window.location.href = prevHref; });
  $("nextBtn").addEventListener("click", () => { window.location.href = nextHref; });

  window.addEventListener("resize", resizeCanvases);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener("beforeunload", () => { try { speechSynthesis.cancel(); } catch(_) {} });

  posterImg.addEventListener("load", () => { resizeCanvases(); clearAll(); }, {once:true});
  window.addEventListener("load", () => { resizeCanvases(); clearAll(); setTimeout(readInstructions, 650); }, {once:true});
})();
</script>
</body>
</html>
