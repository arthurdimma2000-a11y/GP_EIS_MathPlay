<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA15 - Using Peanuts as Units</title>
<style>
  :root{
    --green:#37b34a;
    --greenDark:#138a35;
    --pink:#f59aa4;
    --red:#ef3347;
    --blue:#12a9e8;
    --ink:#27242b;
    --cream:#fff9f1;
    --panel:#ffffff;
    --gold:#ffd24a;
    --purple:#6f47c9;
    --shadow:0 16px 34px rgba(0,0,0,.14);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--cream);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:linear-gradient(#efe4d5 1px,transparent 1px),linear-gradient(90deg,#efe4d5 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{width:min(1040px,100%);background:#fff;border:8px solid var(--green);border-radius:30px;padding:14px;box-shadow:var(--shadow);position:relative;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{background:#eefced;border:3px solid #98e2a4;border-radius:999px;padding:8px 14px;font-weight:1000;color:var(--greenDark);box-shadow:0 8px 16px rgba(0,0,0,.08);}
  .navs,.buttons{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;}
  .btn{border:none;border-radius:999px;padding:10px 15px;font-size:.95rem;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);transition:transform .1s ease,filter .1s ease;font-family:inherit;}
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);} .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;} .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;} .btn.read{background:#f04d5f;color:#fff;} .btn.clear{background:#dfeaff;color:#1f3b6b;} .btn.cheer{background:#c9f2d6;color:#166c38;}
  .title{margin:0;text-align:center;font-size:clamp(1.75rem,4vw,3rem);font-weight:1000;color:#fff;-webkit-text-stroke:4px var(--green);paint-order:stroke fill;text-shadow:0 3px 0 rgba(55,179,74,.28);}
  .poster-wrap{position:relative;width:min(895px,100%);margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;touch-action:none;border:4px solid #d6f3d9;}
  .poster-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .trace-layer{position:absolute;inset:0;width:100%;height:100%;z-index:5;background:transparent;touch-action:none;cursor:crosshair;}
  .sparkle-ring{position:absolute;z-index:6;pointer-events:none;border:5px solid rgba(255,210,74,.95);border-radius:22px;box-shadow:0 0 16px rgba(255,210,74,.9),0 0 28px rgba(55,179,74,.45);animation:pulse 1.1s ease-in-out infinite;opacity:.95;}
  @keyframes pulse{0%,100%{transform:scale(.98);opacity:.78;}50%{transform:scale(1.02);opacity:1;}}
  .panel{width:min(895px,100%);margin:12px auto 0;background:linear-gradient(180deg,#fff,#fff9fb);border:3px solid rgba(55,179,74,.34);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.06);}
  .progress-title{text-align:center;font-size:clamp(1rem,2.7vw,1.3rem);font-weight:1000;color:var(--greenDark);margin-bottom:8px;}
  .progress-row{display:flex;align-items:center;gap:9px;}
  .bar{flex:1;height:18px;border-radius:999px;background:#e8eef8;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.16);} .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#31b7ff,#83e79f);transition:width .12s ease-out;}
  .percent{min-width:60px;text-align:right;color:#175ca8;font-size:1.05rem;font-weight:1000;}
  .mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .mini{background:#fff;border:2px solid #e7edf8;border-radius:14px;text-align:center;padding:9px 6px;font-weight:1000;font-size:.92rem;color:#444;}
  .mini span{display:block;margin-top:4px;color:#ef3f49;font-size:1rem;} .mini.active{border-color:#ffd24a;background:#fffbe5;box-shadow:0 0 0 4px rgba(255,210,74,.25);} .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;} .mini.done span{color:#126c36;}
  .number-practice{margin-top:12px;border:4px dashed #9add9e;border-radius:18px;background:linear-gradient(#d9f0ff 1px,transparent 1px),linear-gradient(90deg,#d9f0ff 1px,transparent 1px),#fff;background-size:24px 24px;min-height:190px;position:relative;touch-action:none;overflow:hidden;}
  .number-practice canvas{width:100%;height:190px;display:block;touch-action:none;cursor:crosshair;}
  .number-label{position:absolute;top:8px;left:10px;background:#fff;border:3px solid #d6f3d9;border-radius:999px;padding:5px 10px;font-weight:1000;color:var(--greenDark);pointer-events:none;}
  .stars{text-align:center;min-height:1.25em;margin-top:7px;font-size:2rem;letter-spacing:4px;color:var(--gold);text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);}
  .status{min-height:1.55em;text-align:center;margin-top:7px;font-size:clamp(.98rem,2.5vw,1.25rem);font-weight:1000;color:var(--purple);}
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;line-height:1.5;}
  .confetti-piece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:9999;pointer-events:none;animation:fall 1.8s linear forwards;} @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){body{padding:6px;}.app{padding:6px;border-width:5px;border-radius:18px;}.panel{padding:10px;border-radius:14px;}.mini-grid{grid-template-columns:repeat(2,1fr);}.btn{font-size:.85rem;padding:9px 12px;}.title{-webkit-text-stroke:2px var(--green);}}
  @media(max-width:480px){.mini-grid{grid-template-columns:1fr;}.progress-row{gap:6px;}.percent{min-width:52px;}}
</style>
</head>

<script>
(() => {
  "use strict";
  const PAGE_ID = "Bk2LA15_UsingPeanutsAsUnits";
  const HOME_PAGE = "../../../../../index.html";
  const PREVIOUS_PAGE = "Bk2LA14.html";
  const NEXT_PAGE = "Bk2LA16.html";

  const posterWrap = document.getElementById("posterWrap");
  const traceCanvas = document.getElementById("traceCanvas");
  const tctx = traceCanvas.getContext("2d");
  const numberCanvas = document.getElementById("numberCanvas");
  const nctx = numberCanvas.getContext("2d");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const percentText = document.getElementById("percentText");
  const miniGrid = document.getElementById("miniGrid");
  const status = document.getElementById("status");
  const stars = document.getElementById("stars");
  const sparkleRing = document.getElementById("sparkleRing");
  const chimeAudio = document.getElementById("chimeAudio");

  const tasks = [
    { id:"one", name:"One peanut unit", short:"One peanut", voice:"Trace the small bracket under one peanut. One peanut is one unit.", box:{x:.38,y:.49,w:.27,h:.06}, type:"poster", path:[
      [.387,.523],[.387,.505],[.392,.523],[.485,.523],[.575,.523],[.625,.523],[.625,.505]
    ]},
    { id:"line", name:"Stick length line", short:"Stick line", voice:"Trace the long measuring line under the stick from left to right.", box:{x:.095,y:.633,w:.80,h:.06}, type:"poster", path:[
      [.105,.657],[.105,.642],[.108,.657],[.225,.657],[.355,.657],[.485,.657],[.615,.657],[.748,.657],[.885,.657],[.885,.642]
    ]},
    { id:"marks", name:"Six peanut unit marks", short:"6 marks", voice:"Trace the six small peanut unit marks. Each space is one peanut unit.", box:{x:.10,y:.637,w:.79,h:.055}, type:"poster", multi:[
      [[.105,.646],[.105,.676]], [[.235,.646],[.235,.676]], [[.365,.646],[.365,.676]], [[.495,.646],[.495,.676]], [[.625,.646],[.625,.676]], [[.755,.646],[.755,.676]], [[.885,.646],[.885,.676]]
    ]},
    { id:"six", name:"Number 6", short:"Trace 6", voice:"Now trace number six. The stick is six units long.", type:"number" }
  ];

  let active = 0;
  let audioCtx = null;
  let isDrawing = false;
  let currentStroke = [];
  let taskSamples = [];
  let numberSamples = [];
  let numberStroke = [];
  let lastTick = 0;
  let totalScore = 0;

  function voice(){
    if(!("speechSynthesis" in window)) return null;
    const all = speechSynthesis.getVoices() || [];
    const en = all.filter(v => /^en/i.test(v.lang || ""));
    for(const n of ["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"]){
      const v = en.find(x => (x.name || "").toLowerCase().includes(n.toLowerCase()));
      if(v) return v;
    }
    return en.find(v => /us|united states/i.test((v.lang || "") + " " + (v.name || ""))) || en[0] || all[0] || null;
  }
  function speak(text, done){
    if(!("speechSynthesis" in window)){ if(done) done(); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = .9; u.pitch = 1.15; u.volume = 1;
      const v = voice(); if(v) u.voice = v;
      if(done){ u.onend = done; u.onerror = done; }
      speechSynthesis.speak(u);
    }catch(e){ if(done) done(); }
  }
  function audio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function beep(freq=640, dur=.045, vol=.045){
    const a = audio(); if(!a) return;
    const o = a.createOscillator(); const g = a.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function tick(){
    const now = performance.now(); if(now - lastTick < 70) return;
    lastTick = now; beep(620,.04,.035);
  }
  function chime(){
    try{ const a = chimeAudio.cloneNode(true); a.play().catch(()=>beep(880,.12,.07)); }catch(e){ beep(880,.12,.07); }
  }
  function clap(){
    const a = audio(); if(!a) return;
    for(let i=0;i<12;i++){
      const s = a.currentTime + i*.055;
      const b = a.createBuffer(1, Math.floor(a.sampleRate*.065), a.sampleRate);
      const d = b.getChannelData(0);
      for(let n=0;n<d.length;n++) d[n] = (Math.random()*2-1)*Math.pow(1-n/d.length,2);
      const src = a.createBufferSource(); const g = a.createGain();
      src.buffer = b; g.gain.setValueAtTime(.035, s); g.gain.exponentialRampToValueAtTime(.001, s+.065);
      src.connect(g); g.connect(a.destination); src.start(s); src.stop(s+.065);
    }
  }
  function confetti(){
    const colors = ["#37b34a","#ef3347","#31b7ff","#ffd24a","#7049c6","#f59aa4"];
    for(let i=0;i<42;i++){
      const p = document.createElement("div"); p.className = "confetti-piece";
      p.style.left = Math.random()*100 + "vw"; p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = Math.random()*.3 + "s"; document.body.appendChild(p);
      setTimeout(()=>p.remove(),2200);
    }
  }
  function normPoint(pt, w, h){ return {x:pt[0]*w, y:pt[1]*h}; }
  function samplePolyline(points, w, h){
    const raw = points.map(p => normPoint(p,w,h));
    const out = [];
    for(let i=0;i<raw.length-1;i++){
      const a=raw[i], b=raw[i+1];
      const dist = Math.hypot(b.x-a.x,b.y-a.y);
      const steps = Math.max(8, Math.ceil(dist/7));
      for(let j=0;j<=steps;j++){
        const t = j/steps;
        out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, hit:false});
      }
    }
    return out;
  }
  function numberPath(w,h){
    // Smooth number 6 practice path, drawn in a separate grid box.
    const pts = [];
    const cx = w*.50, cy = h*.58, rx = Math.min(w*.20, h*.26), ry = Math.min(w*.22, h*.26);
    for(let a=-35; a<=325; a+=5){
      const rad = a*Math.PI/180;
      pts.push({x:cx + rx*Math.cos(rad), y:cy + ry*Math.sin(rad)});
    }
    const tail = [
      {x:w*.60,y:h*.31},{x:w*.54,y:h*.27},{x:w*.46,y:h*.28},{x:w*.40,y:h*.34},{x:w*.37,y:h*.43},{x:w*.38,y:h*.55}
    ];
    return tail.concat(pts.map(p=>({x:p.x,y:p.y}))).map(p=>({x:p.x,y:p.y,hit:false}));
  }
  function drawGuidePath(ctx, points, opts={}){
    if(!points || !points.length) return;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = opts.width || 10;
    ctx.strokeStyle = opts.color || "rgba(55,179,74,.85)";
    if(opts.dash) ctx.setLineDash(opts.dash);
    ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
    for(const p of points.slice(1)) ctx.lineTo(p.x,p.y);
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  function resizeCanvases(){
    const r = posterWrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    traceCanvas.width = Math.round(r.width*dpr); traceCanvas.height = Math.round(r.height*dpr);
    tctx.setTransform(dpr,0,0,dpr,0,0);
    const nr = numberCanvas.getBoundingClientRect();
    numberCanvas.width = Math.round(nr.width*dpr); numberCanvas.height = Math.round(nr.height*dpr);
    nctx.setTransform(dpr,0,0,dpr,0,0);
    prepareActive(); drawAll(); updateSparkle();
  }
  function prepareActive(){
    const r = posterWrap.getBoundingClientRect();
    const task = tasks[active]; currentStroke = []; numberStroke = [];
    if(task && task.type === "poster"){
      if(task.multi){
        taskSamples = task.multi.flatMap(line => samplePolyline(line, r.width, r.height));
      }else taskSamples = samplePolyline(task.path, r.width, r.height);
    }else taskSamples = [];
    const nr = numberCanvas.getBoundingClientRect();
    numberSamples = numberPath(nr.width, nr.height);
  }
  function drawAll(){
    const r = posterWrap.getBoundingClientRect();
    tctx.clearRect(0,0,r.width,r.height);
    tasks.forEach((task, i) => {
      if(task.type !== "poster") return;
      const done = task.done;
      const activeNow = i === active;
      const color = done ? "rgba(25,168,91,.92)" : activeNow ? "rgba(239,51,71,.9)" : "rgba(90,90,90,.28)";
      const width = activeNow ? 11 : 8;
      const dash = done ? [] : [9,9];
      if(task.multi){
        for(const line of task.multi) drawGuidePath(tctx, samplePolyline(line,r.width,r.height), {color,width,dash});
      }else drawGuidePath(tctx, samplePolyline(task.path,r.width,r.height), {color,width,dash});
    });
    if(currentStroke.length) drawGuidePath(tctx, currentStroke, {color:"rgba(18,169,232,.96)",width:13});

    const nr = numberCanvas.getBoundingClientRect();
    nctx.clearRect(0,0,nr.width,nr.height);
    drawGuidePath(nctx, numberSamples, {color: tasks[3].done ? "rgba(25,168,91,.92)" : active===3 ? "rgba(239,51,71,.9)" : "rgba(80,80,80,.30)", width:15, dash: tasks[3].done ? [] : [11,10]});
    if(numberStroke.length) drawGuidePath(nctx, numberStroke, {color:"rgba(18,169,232,.96)",width:17});
    if(active===3 && !tasks[3].done){
      nctx.save(); nctx.fillStyle="#13a856"; nctx.beginPath(); nctx.arc(nr.width*.60,nr.height*.31,9,0,Math.PI*2); nctx.fill();
      nctx.fillStyle="#ef3347"; nctx.beginPath(); nctx.arc(nr.width*.66,nr.height*.50,9,0,Math.PI*2); nctx.fill(); nctx.restore();
    }
  }
  function updateSparkle(){
    const task = tasks[active];
    if(!task || task.type !== "poster" || !task.box){ sparkleRing.hidden = true; return; }
    sparkleRing.hidden = false;
    const r = posterWrap.getBoundingClientRect();
    sparkleRing.style.left = (task.box.x * r.width) + "px";
    sparkleRing.style.top = (task.box.y * r.height) + "px";
    sparkleRing.style.width = (task.box.w * r.width) + "px";
    sparkleRing.style.height = (task.box.h * r.height) + "px";
  }
  function pos(canvas, e){ const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  function hitSamples(samples, p, radius){
    for(const s of samples){ if(!s.hit && Math.hypot(s.x-p.x,s.y-p.y)<=radius) s.hit = true; }
    return Math.round(samples.filter(s=>s.hit).length / Math.max(1,samples.length) * 100);
  }
  function activeProgress(){
    const task = tasks[active]; if(!task) return 0;
    if(task.type === "poster") return Math.round(taskSamples.filter(s=>s.hit).length/Math.max(1,taskSamples.length)*100);
    return Math.round(numberSamples.filter(s=>s.hit).length/Math.max(1,numberSamples.length)*100);
  }
  function completeTask(){
    const task = tasks[active]; if(!task || task.done) return;
    task.done = true; chime(); clap();
    status.textContent = task.id === "six" ? "Fantastic! The stick is six peanut units long." : "Great tracing!";
    speak(task.id === "six" ? "Fantastic! The stick is six peanut units long." : "Great tracing. Keep going.", () => {
      if(active < tasks.length - 1){ active++; prepareActive(); updateUI(); drawAll(); updateSparkle(); setTimeout(()=>speak(tasks[active].voice), 250); }
      else finishAll();
    });
    updateUI(); drawAll();
  }
  function traceMove(canvas, e, strokeArr, samples, radius){
    const p = pos(canvas, e); strokeArr.push(p); hitSamples(samples,p,radius); tick(); drawAll();
    if(activeProgress() >= (tasks[active].id === "marks" ? 72 : 68)) completeTask();
  }
  traceCanvas.addEventListener("pointerdown", e => {
    if(!tasks[active] || tasks[active].type !== "poster" || tasks[active].done) return;
    e.preventDefault(); audio(); isDrawing = true; currentStroke = [pos(traceCanvas,e)];
    try{ traceCanvas.setPointerCapture(e.pointerId); }catch(err){}
    traceMove(traceCanvas,e,currentStroke,taskSamples,34);
  });
  traceCanvas.addEventListener("pointermove", e => { if(!isDrawing || tasks[active].type !== "poster") return; e.preventDefault(); traceMove(traceCanvas,e,currentStroke,taskSamples,34); });
  traceCanvas.addEventListener("pointerup", e => { isDrawing=false; try{traceCanvas.releasePointerCapture(e.pointerId);}catch(err){} });
  traceCanvas.addEventListener("pointercancel", () => { isDrawing=false; });
  numberCanvas.addEventListener("pointerdown", e => {
    if(active !== 3 || tasks[3].done) return;
    e.preventDefault(); audio(); isDrawing = true; numberStroke = [pos(numberCanvas,e)];
    try{ numberCanvas.setPointerCapture(e.pointerId); }catch(err){}
    traceMove(numberCanvas,e,numberStroke,numberSamples,38);
  });
  numberCanvas.addEventListener("pointermove", e => { if(!isDrawing || active !== 3) return; e.preventDefault(); traceMove(numberCanvas,e,numberStroke,numberSamples,38); });
  numberCanvas.addEventListener("pointerup", e => { isDrawing=false; try{numberCanvas.releasePointerCapture(e.pointerId);}catch(err){} });
  numberCanvas.addEventListener("pointercancel", () => { isDrawing=false; });

  function updateUI(){
    const done = tasks.filter(t=>t.done).length;
    const activePct = activeProgress();
    totalScore = Math.min(100, Math.round(((done / tasks.length) * 100) + (activePct / tasks.length)));
    if(done === tasks.length) totalScore = 100;
    progressText.textContent = totalScore + "%"; percentText.textContent = totalScore + "%"; progressFill.style.width = totalScore + "%";
    const starCount = totalScore >= 100 ? 3 : totalScore >= 66 ? 2 : totalScore >= 25 ? 1 : 0;
    stars.textContent = starCount ? ("★ ".repeat(starCount).trim() + " " + "☆ ".repeat(3-starCount).trim()) : "☆ ☆ ☆";
    miniGrid.innerHTML = tasks.map((t,i)=>`<div class="mini ${t.done ? "done" : i===active ? "active" : ""}">${i+1}. ${t.short}<span>${t.done ? "Done!" : i===active ? activePct + "%" : "Waiting"}</span></div>`).join("");
    save(starCount, done === tasks.length);
  }
  function save(starCount, complete){
    try{
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = {pageId:PAGE_ID,file:"Bk2LA15_Using_Peanuts_As_Units_Tracing.html",level:"A",week:3,type:"lesson",activityType:"tracing",score:totalScore,stars:starCount,completed:complete,skills:{math:1,tracing:1,listening:1,reading:1},savedAt:new Date().toISOString(),ts:Date.now()};
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", "Bk2LA15_Using_Peanuts_As_Units_Tracing.html");
    }catch(e){}
  }
  function finishAll(){
    status.textContent = "Super! You traced the peanut units and number 6.";
    sparkleRing.hidden = true; chime(); clap(); confetti();
    speak("Super! One peanut is one unit. The stick is six units. You did a wonderful job!");
  }
  function reset(){
    tasks.forEach(t => delete t.done); active = 0; currentStroke = []; numberStroke = []; prepareActive(); updateUI(); drawAll(); updateSparkle();
    status.textContent = "Start again. Trace the small bracket under one peanut.";
    speak("Let us start again. Trace the small bracket under one peanut.");
  }
  function readIntro(){
    speak("Welcome! Let us measure using peanuts. One peanut is one unit. Trace the small bracket, trace the stick line, trace the peanut unit marks, and trace number six.");
  }
  document.getElementById("homeBtn").addEventListener("click", () => { window.location.href = HOME_PAGE; });
  document.getElementById("prevBtn").addEventListener("click", () => { window.location.href = PREVIOUS_PAGE; });
  document.getElementById("nextBtn").addEventListener("click", () => { window.location.href = NEXT_PAGE; });
  document.getElementById("readBtn").addEventListener("click", readIntro);
  document.getElementById("resetBtn").addEventListener("click", reset);
  document.getElementById("cheerBtn").addEventListener("click", () => { audio(); chime(); clap(); confetti(); speak("Great job! You can do it. Keep tracing and learning!"); });
  document.addEventListener("pointerdown", () => audio(), {once:true});
  window.addEventListener("resize", resizeCanvases);
  if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = voice;
  window.addEventListener("load", () => {
    setTimeout(() => { resizeCanvases(); updateUI(); status.textContent = "Trace the small bracket under one peanut first."; }, 80);
    setTimeout(readIntro, 700);
  }, {once:true});
})();
</script>
