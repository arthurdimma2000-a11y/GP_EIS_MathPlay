<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bk2LA13 - Numbers Add By One Apples</title>
<style>
  :root{
    --ink:#292631;
    --paper:#fffaf2;
    --blue:#5d86c9;
    --blueDark:#3f65a4;
    --pink:#f04d5f;
    --yellow:#f7df8a;
    --green:#19a85b;
    --purple:#6c4bbf;
    --gold:#ffd24a;
    --shadow:0 14px 32px rgba(0,0,0,.12);
    font-family:"Comic Sans MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
    background-image:
      linear-gradient(#ece2d3 1px,transparent 1px),
      linear-gradient(90deg,#ece2d3 1px,transparent 1px);
    background-size:28px 28px;
  }
  .app{
    position:relative;
    width:min(990px,100%);
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:10px 10px 14px;
  }
  .top-nav{
    width:min(920px,100%);
    margin:0 auto 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .lesson-badge{
    background:#eef6ff;
    color:#2f5594;
    border:3px solid #cfe0fb;
    border-radius:999px;
    padding:8px 13px;
    font-weight:1000;
    box-shadow:0 6px 12px rgba(0,0,0,.07);
  }
  .nav-buttons,.buttons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    border-radius:999px;
    padding:10px 15px;
    font-size:.95rem;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.17);
    transition:transform .1s ease,filter .1s ease;
  }
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .btn.home{background:#25d17d;color:#fff;}
  .btn.prev,.btn.next{background:#f7dc6f;color:#8b5a00;}
  .btn.read{background:var(--pink);color:#fff;}
  .btn.clear{background:#dfeaff;color:#1f3b6b;}
  .btn.cheer{background:#c9f2d6;color:#166c38;}
  .poster-wrap{
    position:relative;
    width:min(920px,100%);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    touch-action:none;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .trace-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    touch-action:none;
    cursor:crosshair;
    background:transparent;
  }
  .active-glow{
    position:absolute;
    z-index:4;
    border:4px solid rgba(255,210,74,.75);
    border-radius:18px;
    background:rgba(255,238,140,.13);
    box-shadow:0 0 0 5px rgba(255,210,74,.20),0 0 20px rgba(93,134,201,.36);
    pointer-events:none;
    transition:all .18s ease;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.74;}50%{opacity:1;}}
  .panel{
    width:min(920px,100%);
    margin:12px auto 0;
    background:linear-gradient(180deg,#fff,#fff7fb);
    border:3px solid rgba(93,134,201,.25);
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.06);
  }
  .progress-title{
    text-align:center;
    font-size:clamp(1rem,2.6vw,1.28rem);
    font-weight:1000;
    color:#3f5fa8;
    margin-bottom:8px;
  }
  .progress-bar{
    height:18px;
    border-radius:999px;
    background:#e8eef8;
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.16);
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#31b7ff,#83e79f);
    transition:width .12s ease-out;
  }
  .mini-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-top:9px;
  }
  .mini{
    background:#fff;
    border:2px solid #e7edf8;
    border-radius:12px;
    text-align:center;
    padding:6px 4px;
    font-weight:1000;
    font-size:.86rem;
    color:#444;
  }
  .mini.active{border-color:#ffd24a;background:#fff8d9;color:#8a5700;}
  .mini.done{border-color:#62d98c;background:#effff4;color:#126c36;}
  .status{
    min-height:1.45em;
    text-align:center;
    margin-top:8px;
    font-size:clamp(.98rem,2.5vw,1.25rem);
    font-weight:1000;
    color:var(--purple);
  }
  .stars{
    text-align:center;
    min-height:1.25em;
    margin-top:6px;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    text-shadow:0 2px 0 #b87900,0 4px 0 #8a5a00,0 8px 14px rgba(0,0,0,.28);
  }
  .note{text-align:center;font-weight:900;color:#666;font-size:.9rem;margin-top:8px;}
  .confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:9999;
    pointer-events:none;
    animation:fall 1.8s linear forwards;
  }
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1;}}
  @media(max-width:760px){
    body{padding:6px;}
    .app{padding:6px;border-radius:16px;}
    .panel{padding:10px;border-radius:14px;}
    .mini-grid{grid-template-columns:repeat(2,1fr);}
    .btn{font-size:.85rem;padding:9px 12px;}
    .lesson-badge{font-size:.86rem;}
  }
</style>
</head>

<script>
(() => {
  "use strict";

  const PAGE_ID = "Bk2LA13_Numbers_Add_By_One_Apples_Tracing";
  const HOME_PAGE = "../../../../../index.html";
  const PREVIOUS_PAGE = "Bk2LA12.html";
  const NEXT_PAGE = "Bk2LA14.html";

  const IMAGE_W = 961;
  const IMAGE_H = 1306;

  const $ = id => document.getElementById(id);
  const posterWrap = $("posterWrap");
  const canvas = $("traceCanvas");
  const ctx = canvas.getContext("2d");
  const activeGlow = $("activeGlow");
  const progressFill = $("progressFill");
  const progressText = $("progressText");
  const miniGrid = $("miniGrid");
  const stars = $("stars");
  const status = $("status");
  const chimeAudio = $("chimeAudio");

  let dpr = window.devicePixelRatio || 1;
  let current = 0;
  let drawing = false;
  let currentStroke = [];
  let strokes = [];
  let audioCtx = null;
  let lastTick = 0;

  function makePath(digit, x, y, w, h) {
    const p = [];
    const add = (px, py) => p.push({x: x + px * w, y: y + py * h});
    const line = (a, b, n=28) => {
      for(let i=0;i<=n;i++){
        const t=i/n;
        add(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t);
      }
    };
    const quad = (a, c, b, n=42) => {
      for(let i=0;i<=n;i++){
        const t=i/n, u=1-t;
        add(u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]);
      }
    };

    if(digit === "1") {
      line([.45,.18],[.62,.08],10);
      line([.62,.08],[.62,.87],42);
      line([.42,.87],[.82,.87],14);
    }
    if(digit === "2") {
      quad([.23,.24],[.50,.02],[.76,.22],30);
      quad([.76,.22],[.84,.48],[.49,.61],28);
      line([.49,.61],[.23,.87],22);
      line([.23,.87],[.82,.87],24);
    }
    if(digit === "3") {
      quad([.24,.20],[.62,-.02],[.78,.25],26);
      quad([.78,.25],[.62,.49],[.40,.49],20);
      quad([.40,.49],[.83,.53],[.75,.76],26);
      quad([.75,.76],[.52,.99],[.23,.80],26);
    }
    if(digit === "4") {
      line([.74,.10],[.24,.61],32);
      line([.24,.61],[.82,.61],22);
      line([.74,.10],[.74,.91],42);
    }
    if(digit === "5") {
      line([.78,.14],[.25,.14],20);
      line([.25,.14],[.23,.47],20);
      line([.23,.47],[.64,.47],18);
      quad([.64,.47],[.90,.57],[.78,.78],28);
      quad([.78,.78],[.55,1.00],[.22,.80],30);
    }
    return p;
  }

  const rowY = [358, 550, 741, 932, 1123];
  const traces = [
    {label:"Row 1 · trace 1", digit:"1", path:makePath("1", 350, rowY[0], 55, 100), box:[335,326,84,171]},
    {label:"Row 1 · trace 5", digit:"5", path:makePath("5", 714, 350, 88, 108), box:[602,326,218,171]},

    {label:"Row 2 · trace 1", digit:"1", path:makePath("1", 350, rowY[1], 55, 100), box:[335,518,84,171]},
    {label:"Row 2 · trace 4", digit:"4", path:makePath("4", 714, 542, 88, 108), box:[602,518,218,171]},

    {label:"Row 3 · trace 1", digit:"1", path:makePath("1", 350, rowY[2], 55, 100), box:[335,710,84,171]},
    {label:"Row 3 · trace 3", digit:"3", path:makePath("3", 714, 733, 88, 108), box:[602,710,218,171]},

    {label:"Row 4 · trace 1", digit:"1", path:makePath("1", 350, rowY[3], 55, 100), box:[335,900,84,171]},
    {label:"Row 4 · trace 2", digit:"2", path:makePath("2", 714, 924, 88, 108), box:[602,900,218,171]},

    {label:"Row 5 · trace 1", digit:"1", path:makePath("1", 350, rowY[4], 55, 100), box:[335,1091,84,171]},
    {label:"Row 5 · trace 1 answer", digit:"1", path:makePath("1", 724, 1116, 66, 108), box:[602,1091,218,171]}
  ].map(t => ({...t, hit:new Array(t.path.length).fill(false), done:false, score:0}));

  function setupMiniGrid(){
    miniGrid.innerHTML = "";
    traces.forEach((t,i) => {
      const div = document.createElement("div");
      div.className = "mini";
      div.id = "mini" + i;
      div.textContent = (i+1) + ". " + t.digit;
      miniGrid.appendChild(div);
    });
  }

  function scaleX(x) { return x * canvas.clientWidth / IMAGE_W; }
  function scaleY(y) { return y * canvas.clientHeight / IMAGE_H; }
  function unscaleX(x) { return x * IMAGE_W / canvas.clientWidth; }
  function unscaleY(y) { return y * IMAGE_H / canvas.clientHeight; }

  function fitCanvas(){
    const r = posterWrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
    moveGlow();
  }

  function drawPath(points, style) {
    if(!points || !points.length) return;
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = style.width || 10;
    ctx.strokeStyle = style.color || "#f04d5f";
    ctx.setLineDash(style.dash || []);
    ctx.beginPath();
    ctx.moveTo(scaleX(points[0].x), scaleY(points[0].y));
    points.slice(1).forEach(p => ctx.lineTo(scaleX(p.x), scaleY(p.y)));
    ctx.stroke();
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

    // Completed number strokes stay visible as green marker lines.
    traces.forEach((t,i) => {
      if(t.done) drawPath(t.path, {color:"rgba(25,168,91,.85)", width:12});
    });

    // Active guide sits on top of the poster dots without replacing the poster.
    const t = traces[current];
    if(t && !t.done) {
      drawPath(t.path, {color:"rgba(255,210,74,.70)", width:8, dash:[10,10]});
      const start = t.path[0], end = t.path[t.path.length-1];
      ctx.save();
      ctx.fillStyle = "#10a75a";
      ctx.beginPath(); ctx.arc(scaleX(start.x), scaleY(start.y), 7, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#f13a52";
      ctx.beginPath(); ctx.arc(scaleX(end.x), scaleY(end.y), 7, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    currentStroke.forEach(s => drawPath(s, {color:"rgba(240,77,95,.95)", width:13}));
  }

  function moveGlow(){
    const t = traces[current];
    if(!t) { activeGlow.hidden = true; return; }
    const [x,y,w,h] = t.box;
    activeGlow.hidden = false;
    activeGlow.style.left = scaleX(x) + "px";
    activeGlow.style.top = scaleY(y) + "px";
    activeGlow.style.width = scaleX(w) + "px";
    activeGlow.style.height = scaleY(h) + "px";
  }

  function updateMini(){
    traces.forEach((t,i) => {
      const m = $("mini"+i);
      if(!m) return;
      m.classList.toggle("active", i === current && !t.done);
      m.classList.toggle("done", t.done);
      if(t.done) m.textContent = "✓ " + t.digit;
      else if(i === current) m.textContent = "👉 " + t.digit + " · " + t.score + "%";
      else m.textContent = (i+1) + ". " + t.digit;
    });
  }

  function updateProgress(){
    const doneCount = traces.filter(t => t.done).length;
    const activeScore = traces[current] && !traces[current].done ? traces[current].score : 0;
    const percent = Math.min(100, Math.round(((doneCount * 100) + activeScore) / traces.length));
    progressFill.style.width = percent + "%";
    progressText.textContent = percent + "%";
    const starCount = percent >= 100 ? 3 : percent >= 65 ? 2 : percent >= 25 ? 1 : 0;
    stars.textContent = starCount ? ("★ ".repeat(starCount) + "☆ ".repeat(3-starCount)).trim() : "☆ ☆ ☆";
    updateMini();
    save(percent, starCount, percent >= 100);
  }

  function save(score, starCount, completed){
    try {
      const store = JSON.parse(localStorage.getItem("GP_EIS_ACTIVITY_RESULTS") || "{}");
      store[PAGE_ID] = {
        pageId: PAGE_ID,
        file: "Bk2LA13_Numbers_Add_By_One_Apples_Tracing.html",
        level: "A",
        week: 2,
        type: "lesson",
        activityType: "tracing",
        score,
        stars: starCount,
        completed,
        skills: {math:1, tracing:1, listening:1, speaking:1},
        savedAt: new Date().toISOString(),
        ts: Date.now()
      };
      localStorage.setItem("GP_EIS_ACTIVITY_RESULTS", JSON.stringify(store));
      localStorage.setItem("GP_EIS_LAST_FILE", "Bk2LA13_Numbers_Add_By_One_Apples_Tracing.html");
    } catch(e) {}
  }

  function audio() {
    if(!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { return null; }
    }
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function beep(freq=650, dur=.045, vol=.04) {
    const a = audio();
    if(!a) return;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
    osc.connect(gain);
    gain.connect(a.destination);
    osc.start();
    osc.stop(a.currentTime + dur);
  }

  function tick(){
    const now = performance.now();
    if(now - lastTick < 70) return;
    lastTick = now;
    beep(650, .045, .035);
  }

  function chime(){
    try {
      chimeAudio.currentTime = 0;
      chimeAudio.play().catch(() => beep(880,.14,.07));
    } catch(e) { beep(880,.14,.07); }
  }

  function applause(){
    const a = audio();
    if(!a) return;
    for(let i=0;i<13;i++){
      const start = a.currentTime + i*.055;
      const buffer = a.createBuffer(1, Math.floor(a.sampleRate*.06), a.sampleRate);
      const data = buffer.getChannelData(0);
      for(let n=0;n<data.length;n++) data[n] = (Math.random()*2-1) * Math.pow(1-n/data.length,2);
      const src = a.createBufferSource();
      const g = a.createGain();
      src.buffer = buffer;
      g.gain.setValueAtTime(.035, start);
      g.gain.exponentialRampToValueAtTime(.001, start+.06);
      src.connect(g); g.connect(a.destination);
      src.start(start); src.stop(start+.06);
    }
  }

  function femaleVoice(){
    if(!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices() || [];
    const en = voices.filter(v => /^en/i.test(v.lang || ""));
    const names = ["Jenny","Aria","Samantha","Victoria","Zira","Susan","Karen","Google US English","Microsoft Zira"];
    for(const name of names){
      const v = en.find(x => (x.name || "").toLowerCase().includes(name.toLowerCase()));
      if(v) return v;
    }
    return en.find(v => /us|united states/i.test((v.lang || "") + " " + (v.name || ""))) || en[0] || voices[0] || null;
  }

  function speak(text, done){
    if(!("speechSynthesis" in window)) { if(done) done(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = .88;
      u.pitch = 1.15;
      u.volume = 1;
      const v = femaleVoice();
      if(v) u.voice = v;
      if(done) { u.onend = done; u.onerror = done; }
      speechSynthesis.speak(u);
    } catch(e) { if(done) done(); }
  }

  function confetti(){
    const colors = ["#5d86c9","#f04d5f","#ffd24a","#35b558","#70d6ff","#ff9f1c"];
    for(let i=0;i<44;i++){
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left = Math.random()*100 + "vw";
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = Math.random()*.32 + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2200);
    }
  }

  function pointer(e){
    const r = canvas.getBoundingClientRect();
    return {
      x: unscaleX(e.clientX - r.left),
      y: unscaleY(e.clientY - r.top)
    };
  }

  function markHits(p){
    const t = traces[current];
    if(!t || t.done) return;
    const radius = 32;
    t.path.forEach((pt,i) => {
      if(!t.hit[i] && Math.hypot(pt.x - p.x, pt.y - p.y) <= radius) t.hit[i] = true;
    });
    t.score = Math.round(t.hit.filter(Boolean).length / t.hit.length * 100);
    updateProgress();

    if(t.score >= 72){
      t.done = true;
      strokes.push(t.path);
      currentStroke = [];
      chime();
      status.textContent = "Great tracing! " + t.digit + " is complete.";
      speak("Great tracing! " + t.digit + " is complete.");
      current++;
      if(current >= traces.length){
        activeGlow.hidden = true;
        draw();
        updateProgress();
        confetti();
        applause();
        chime();
        status.textContent = "Fantastic! You traced all the numbers and added by one.";
        speak("Fantastic! You traced all the numbers. Count the apples and add by one. You did it!");
      } else {
        setTimeout(() => {
          status.textContent = "Now trace number " + traces[current].digit + ". Follow the yellow dots.";
          moveGlow();
          draw();
          updateProgress();
        }, 350);
      }
    }
  }

  canvas.addEventListener("pointerdown", e => {
    if(current >= traces.length) return;
    e.preventDefault();
    audio();
    drawing = true;
    const p = pointer(e);
    currentStroke = [[p]];
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    markHits(p);
    tick();
    draw();
  });

  canvas.addEventListener("pointermove", e => {
    if(!drawing || current >= traces.length) return;
    e.preventDefault();
    const p = pointer(e);
    if(!currentStroke.length) currentStroke = [[]];
    currentStroke[currentStroke.length-1].push(p);
    markHits(p);
    tick();
    draw();
  });

  function stop(e){
    if(!drawing) return;
    drawing = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
    if(current < traces.length && traces[current].score < 72){
      status.textContent = "Good start! Keep tracing number " + traces[current].digit + ".";
    }
  }
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);

  function reset(){
    traces.forEach(t => {
      t.hit = new Array(t.path.length).fill(false);
      t.done = false;
      t.score = 0;
    });
    current = 0;
    currentStroke = [];
    strokes = [];
    status.textContent = "Start again. Trace every dotted number from top to bottom.";
    moveGlow();
    draw();
    updateProgress();
    speak("Start again. Trace every dotted number from top to bottom. Count the apples and add by one.");
  }

  function intro(){
    const msg = "Welcome! Count the apples. Then add by one. Trace each dotted number beside the apples. Start at the top and follow the yellow dots.";
    status.textContent = "Trace the active dotted number. Start with the first little 1.";
    speak(msg);
  }

  $("readBtn").addEventListener("click", () => intro());
  $("clearBtn").addEventListener("click", reset);
  $("cheerBtn").addEventListener("click", () => {
    audio();
    chime();
    applause();
    confetti();
    speak("You can do it! Trace slowly and follow the dots. Great job!");
  });

  $("homeBtn").addEventListener("click", () => location.href = HOME_PAGE);
  $("prevBtn").addEventListener("click", () => location.href = PREVIOUS_PAGE);
  $("nextBtn").addEventListener("click", () => location.href = NEXT_PAGE);

  window.addEventListener("resize", fitCanvas);
  if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = femaleVoice;
  document.addEventListener("pointerdown", () => audio(), {once:true});

  setupMiniGrid();
  fitCanvas();
  updateProgress();
  window.addEventListener("load", () => setTimeout(intro, 650), {once:true});
})();
</script>
